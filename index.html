/* ============================================================ restore offer (W4 §1)
   {n} — filled sets: w OR r non-empty. Counts complete, incomplete and
   malformed; skips blank. Counts exercises Rule V1's tier HIDES, since they
   are still in the draft — a set he typed before the tier changed is a set,
   and a count that omits it understates what a discard would cost. One
   function, every caller, per W4 §0.3. */
function filledSets(d){
  let n=0;
  if(!d||typeof d!=="object") return 0;
  const es=d.entries||{};
  Object.keys(es).forEach(k=>{
    const ss=(es[k]&&es[k].sets)||[];
    ss.forEach(s=>{ if(!s) return;
      const w=s.w==null?"":String(s.w).trim(), r=s.r==null?"":String(s.r).trim();
      if(w!==""||r!=="") n++; });
  });
  return n;
}
const isDate=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v);
/* {date} — weekday + day + month while the draft is a week old or less, day +
   month after that. Anchored at local noon, like fmt(), so it is DST-safe. */
function fmtDay(ds,ageDays){
  const d=noon(ds);
  if(!d) return ds;
  const base=fmt(ds);                       /* PHAT.dayMon + year — never Intl */
  return (ageDays>=0&&ageDays<=6)?WDAY[d.getDay()]+", "+base:base;
}
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
/* {age} — W4 §0.4, exactly. Calendar day always beats elapsed minutes: a draft
   written at 23:50 and reopened at 00:10 says "saved yesterday", because the
   day is what decides which session those numbers belong to. */
function ageText(o){
  const a=o.ageDays;
  if(a===null||a===undefined||a<0) return "saved "+o.dateStr;
  if(a===1) return "saved yesterday";
  if(a>=2) return "saved "+a+" days ago";
  const ms=Date.now()-o.savedAt;
  if(!(o.savedAt>0)||ms<0) return "saved earlier today";
  const mins=Math.floor(ms/60000);
  if(mins<1) return "saved just now";
  if(mins<60) return "saved "+plural(mins,"minute")+" ago";
  const hrs=Math.floor(ms/3600000);
  if(hrs<24) return "saved "+plural(hrs,"hour")+" ago";
  return "saved earlier today";
}
/* Recomputed whenever the offer is painted, so {age} is right when he comes
   back from the Trend tab (W4 §1.1 State 1H). It never ticks on its own. */
function offerInfo(){
  const d=S.offer; if(!d) return null;
  const date=isDate(d.date)?d.date:PHAT.localDate();
  const ag=PHAT.draftAge(date,PHAT.localDate());
  const o={dayId:d.dayId, day:PROGRAM.find(x=>x.id===d.dayId)||null, date:date,
    ageDays:ag.ageDays, sameDay:ag.sameDay,
    savedAt:typeof d.savedAt==="number"?d.savedAt:0, n:filledSets(d)};
  o.dateStr=fmtDay(date,o.ageDays);
  o.age=ageText(o);
  return o;
}
/* Variant A. Present at first paint, so no aria-live — announcing a region
   that was never absent is noise. Focus order is Resume then Discard: safe
   first in DOM even though Discard is lowest on screen. */
function offerHtml(o){
  const known=!!o.day;
  let det;
  if(!known) det=plural(o.n,"set")+" logged. This app version cannot open it.";
  else if(!o.n) det="Nothing entered yet · "+o.age;
  else det=plural(o.n,"set")+" logged · "+o.age;
  return `<section class="sheet" aria-labelledby="dr-title">
    <p class="eyebrow">UNFINISHED SESSION</p>
    <h2 id="dr-title">${known?esc(o.day.name)+" · "+esc(o.dateStr):"Saved "+esc(o.dateStr)}</h2>
    <p class="det">${esc(det)}</p>
    ${(known&&!o.sameDay)?`<p class="rule"><span aria-hidden="true">! </span>It saves under ${esc(o.dateStr)}, not today.</p>`:""}
    <div class="btns">
      ${known?`<button class="primary" id="dr-resume">Resume</button>`:""}
      <button class="ghostbtn" id="dr-discard">Discard</button>
    </div></section>`;
}
function renderOffer(){
  const box=document.getElementById("dr-offer");
  const o=(S.tab==="train"&&!S.draft)?offerInfo():null;
  box.innerHTML=o?offerHtml(o):"";
  reserveDock();
}
/* Every fixed element contributes bottom padding to the scroll container, so
   ANY input can be scrolled fully clear of all of them (spec 0.6, B-36). The
   dock now holds the restore sheet, Rule R1's rest band and nav, so this is
   measured from the dock's real height and never from a magic offset. The
   toast rides just above it. Writes only when the height actually moved. */
function reserveDock(){
  const dock=document.getElementById("dock"), app=document.getElementById("app");
  if(!dock||!app) return;
  const h=dock.offsetHeight;
  if(reserveDock._h===h) return;
  reserveDock._h=h;
  app.style.paddingBottom=(h+27)+"px";
  const t=document.getElementById("toast");
  if(t) t.style.bottom=(h+12)+"px";
}

/* ---- Variant B: modal confirm sheet. Safe action lowest, in the slot the
   trigger occupied, so a stray second tap lands on it and not on the
   destructive one. Plus a 300 ms pointer-events guard on the destructive
   button — not disabled, no greyed-out state, it simply does not fire. ---- */
let sheetState=null;
function askSheet(cfg){
  sheetState=cfg;
  cfg.armAt=Date.now()+300;   // enforced in the handler as well as by CSS
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="scrim" data-sheet="cancel"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dr-confirm-title">
      <h2 id="dr-confirm-title" tabindex="-1">${esc(cfg.headline)}</h2>
      <p class="det">${esc(cfg.body)}</p>
      <div id="dr-sheet-err"></div>
      <div class="btns">
        <button class="ghostbtn danger" data-sheet="danger" style="pointer-events:none">${esc(cfg.danger)}</button>
        <button class="primary" data-sheet="safe">${esc(cfg.safe)}</button>
      </div></section>`;
  const head=m.querySelector("#dr-confirm-title"); if(head) head.focus();
  const dz=m.querySelector('[data-sheet="danger"]');
  setTimeout(()=>{ if(dz&&dz.isConnected) dz.style.pointerEvents=""; },300);
}
function closeSheet(){
  const back=sheetState&&sheetState.back;
  sheetState=null;
  document.getElementById("modal").innerHTML="";
  if(back){ const el=document.getElementById(back); if(el) el.focus(); }
}
function sheetErr(msg){
  const el=document.getElementById("dr-sheet-err");
  if(el) el.innerHTML=`<p class="rule">${esc(msg)}</p>`;
}
/* {n} phrasing for the destructive button and its headline, W4 §1.1 State 1F. */
const discardLabel=n=>n===0?"Discard this session":"Discard "+plural(n,"logged set");
const discardHead=n=>n===0?"Discard this session?":"Discard "+plural(n,"logged set")+"?";

/* Resume puts the stored strings on screen exactly as typed, malformed ones
   included, and leaves the draft on disk untouched.
   Rebuilt against the current PROGRAM, so a draft written by another build
   cannot throw inside vSession. Entries for an exercise this build does not
   know are dropped: they could never be rendered, reached or corrected, and an
   unreachable set that blocks a save is worse than no set. Cannot happen while
   PROGRAM and the draft writer ship in the same file. */
function hydrateDraft(stored){
  const d=PROGRAM.find(x=>x.id===stored.dayId);
  if(!d) return null;
  const src=stored.entries||{};
  const entries={};
  d.ex.forEach(e=>{
    const se=src[e.id]||{};
    const ss=Array.isArray(se.sets)?se.sets:null;
    /* THE STORED ROW COUNT IS AUTHORITATIVE, BOTH WAYS. A row he ADDED is
       kept - never truncate, never drop a typed number. A row he REMOVED
       stays removed, or C-12's confirmation would be silently undone by a
       reload and the number would come back from the dead. An entry the
       stored draft has never seen falls back to the prescription. Floor of
       one row: an exercise is skipped by leaving it blank, not by having no
       row at all. */
    const len=ss?Math.max(1,ss.length):e.s;
    entries[e.id]={
      sets:Array.from({length:len},(_,i)=>({
        w:ss&&ss[i]&&ss[i].w!=null?String(ss[i].w):"",
        r:ss&&ss[i]&&ss[i].r!=null?String(ss[i].r):""})),
      note:se.note==null?"":String(se.note)};
  });
  const ix=(typeof stored.exIx==="number"&&isFinite(stored.exIx)&&stored.exIx>=0)
    ? Math.floor(stored.exIx) : 0;
  return {date:isDate(stored.date)?stored.date:PHAT.localDate(),entries,exIx:ix};
}
function resumeDraft(withToast){
  const stored=S.offer;
  const hy=stored&&hydrateDraft(stored);
  if(!hy) return false;                       // unknown dayId: Resume is not offered
  S.dayId=stored.dayId; S.err=null; S.problems=[];
  S.exIx=hy.exIx; delete hy.exIx;          /* the index is S's, not the draft's */
  S.draft=hy;
  S.rest=null; S.undo=null; S.v1msg=""; S.v1added=null;
  S.offer=null;
  closeSheet(); render();
  if(withToast) toast("Resumed your unfinished session.");
  return true;
}
/* The only two places allowed to delete the draft are here and finish(). */
async function doDiscard(then){
  cancelDraftSave();
  const ok=await clearDraft();
  if(!ok){ sheetErr("Could not discard. Nothing changed. Try again."); return false; }
  S.offer=null; S.draftRead={status:"none"};
  S.draft=null; S.dayId=null; S.err=null; S.problems=[];
  S.exIx=0; S.rest=null; S.undo=null; S.v1msg=""; S.v1added=null;
  closeSheet(); toast("Discarded.");
  if(then) then(); else render();
  return true;
}

/* ============================================================ actions */
/* State 1F. Context comes from the offer when the draft is still on the Train
   tab, and from what is on screen once he has resumed it — so the count in the
   confirmation is always the count he can see. */
function draftLabel(){
  if(S.offer){ const o=offerInfo(); return {day:o.day?o.day.name:null,date:o.dateStr}; }
  if(S.draft){
    const d=PROGRAM.find(x=>x.id===S.dayId);
    const ag=PHAT.draftAge(S.draft.date,PHAT.localDate());
    return {day:d?d.name:null,date:fmtDay(S.draft.date,ag.ageDays)};
  }
  return {day:null,date:""};
}
function askDiscard(n,back,then){
  const c=draftLabel();
  const body=c.day
    ? c.day+", "+c.date+(n===0?". Nothing is logged in it yet.":". This cannot be undone.")
    : "Saved "+c.date+". This cannot be undone.";
  askSheet({headline:discardHead(n), body:body, danger:discardLabel(n), safe:"Keep it",
    back:back, onDanger:()=>doDiscard(then)});
}
/* State 1G Case 2 — he ignored the offer and tapped a different day. The safe
   button is "Open {day} instead", not "Cancel": after a mis-tap the useful
   place to land is the session he has work in, not the list he must re-read. */
function askConflict(newId){
  const nd=PROGRAM.find(x=>x.id===newId);
  const o=offerInfo();
  if(!o||!nd) return;
  /* Unknown dayId: there is no "{day} instead" to offer, so this falls back to
     the plain discard confirmation and starts the tapped day on confirm. */
  if(!o.day){ askDiscard(o.n,null,()=>startDay(newId)); return; }
  const body=o.n
    ? o.day.name+" from "+o.dateStr+" is unfinished — "+o.n+" logged sets. Starting a new day discards it."
    : o.day.name+" from "+o.dateStr+" is unfinished, with nothing logged in it. Starting a new day discards it.";
  askSheet({
    headline:"Start "+nd.name+"?", body:body,
    danger:"Discard "+plural(o.n,"set")+", start "+nd.name,
    safe:"Open "+o.day.name+" instead",
    onSafe:()=>resumeDraft(false),
    onDanger:()=>doDiscard(()=>startDay(newId))
  });
}
/* Fails closed. If the draft on disk could not be read, we do not know whether
   a session with real sets is sitting there, so we refuse to start a new day
   rather than overwrite it. Tapping again retries the read. */
async function startDay(id){
  if(S.draftRead.status==="error"){
    S.draftRead=await loadDraft();            // retry
    if(S.draftRead.status==="error"){
      S.err="Could not read your saved session. Close the app and reopen it before starting a new day.";
      render(); return;
    }
    S.err=null;
    if(S.draftRead.status==="ok"){ S.offer=S.draftRead.draft; render(); }
  }
  /* A readable draft is never silently overwritten. Tapping its own day is a
     Resume, not a conflict — he sees his numbers on the very next screen, so
     nothing is hidden and nothing is destroyed. Any other day asks first. */
  if(S.offer){
    if(S.offer.dayId===id&&PROGRAM.find(x=>x.id===id)){ resumeDraft(true); return; }
    askConflict(id); return;
  }
  const d=PROGRAM.find(x=>x.id===id);
  S.dayId=id; S.err=null; S.problems=[];
  S.exIx=0; S.rest=null; S.undo=null; S.v1msg=""; S.v1added=null;
  S.draft={date:PHAT.localDate(),entries:{}};
  d.ex.forEach(e=>{S.draft.entries[e.id]={sets:Array.from({length:e.s},()=>({w:"",r:""})),note:""};});
  render();
}
async function finish(){
  if(!S.draft) return;
  const v=PHAT.validateDraft(S.draft);
  if(!v.ok){
    /* Refuse. Nothing is written, S.draft is untouched, every typed value
       stays on screen exactly as typed (B-02, B-21). The render is needed
       here — a hidden card with a problem on it has to become reachable — but
       it keeps the scroll position and hands focus to the message, so he never
       loses his place (W4 §2.5, §2.9). */
    S.problems=v.problems;
    S.err=null;              // the two message shapes must never stack
    render(true); focusBlocked(); return;
  }
  S.problems=[];
  if(!v.setCount){ toast("Nothing logged yet."); return; }
  /* One builder, shared with the test harness, so the object that reaches
     save() is the object QA asserts on. It returns null rather than guessing:
     no dayId, no usable date, or a draft that does not validate. */
  /* planId AND plan. The plan document stamps each entry with the
     prescription it was logged under (schema 5, Rule PE1) - which is what
     makes prescriptionEpoch able to tell "he did 100x5 under 3x3-5" from "he
     did 100x5 under 3x8-12", and therefore what stops the session screen
     offering a ghost across a prescription change. Both arguments are
     optional and additive; without them every entry stamps no rx and the
     epoch check can never fire. */
  const sess=PHAT.buildSession(S.draft,S.dayId,S.draft.date,Date.now(),
    PHAT.PHAT_PLAN_ID,PHAT.PHAT_PLAN);
  if(!sess){
    /* Loud, and never save(LOG,null): a null session would overwrite the log
       with garbage, which is the failure this whole batch exists to prevent. */
    console.error("[phat] buildSession refused",{dayId:S.dayId,date:S.draft&&S.draft.date});
    S.err="Could not save. Your entries are still on screen — try again.";
    render(true); return;
  }
  /* Build the next log without mutating S.sessions: a failed save used to
     leave a phantom session in memory that a retry would duplicate. */
  /* Sorted on the way to disk: a draft started yesterday and saved today must
     land in date order, not at the end. sortSessions returns a new array and
     never touches S.sessions, so a failed save still leaves memory untouched. */
  const next=PHAT.sortSessions(S.sessions.concat([sess]));
  const ok=await save(LOG,Object.assign(logPayload(),{sessions:next}));
  /* Keep the scroll: the failure line renders where Save is, and throwing him
     to the top of a ten-exercise page to hide it would be its own bug. */
  if(!ok){ render(true); return; }   // draft still on disk, nothing committed
  S.sessions=next;
  cancelDraftSave();             // a queued autosave must not resurrect the draft
  await clearDraft();
  S.draft=null; S.dayId=null; S.err=null;
  S.exIx=0; S.rest=null; S.undo=null; S.v1msg=""; S.v1added=null;
  S.offer=null; S.draftRead={status:"none"};
  render(); toast("Session saved.");
}
/* EXPORT HAS TWO VISIBLE OUTCOMES AND THEY DO NOT LOOK ALIKE (B-16, §10.4).
   Success prints what left the device, counted — a receipt with no numbers in
   it is indistinguishable from a receipt for nothing. Failure wears the
   refusal shape and says the device is unchanged, which is the fact he needs.
   WHAT THIS DOES AND DOES NOT CATCH, stated plainly: a throw anywhere on the
   path is caught and reported. The other half of B-16 — a WebView where a
   synthetic a.click() silently does nothing and throws nothing — CANNOT be
   detected from here and is still open. It belongs with the clipboard/share
   fallback in WO-002. Do not let the success line grow a claim this function
   cannot stand behind. */
function exportAll(){
  const n=S.sessions.length, m=S.bw.length;
  let url=null;
  try{
    const payload=Object.assign({},S.logMeta,{schemaVersion:PHAT.SCHEMA_VERSION,dateBasis:"local",
      exportedAt:PHAT.localDate(),sessions:S.sessions,bodyweight:S.bw,includeCut:S.includeCut});
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    if(typeof a.download!=="string") throw new Error("no download attribute");
    url=URL.createObjectURL(blob);
    a.href=url; a.download="phat-log-"+PHAT.localDate()+".json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    S.exp={ok:true,n:n,m:m};
    announce("Exported "+n+" session"+(n===1?"":"s")+" and "+m+" weight"+(m===1?"":"s")+".");
  }catch(err){
    if(url){ try{ URL.revokeObjectURL(url); }catch(e2){} }
    console.warn("[phat] export failed",err);
    S.exp={ok:false,n:n,m:m};
    announce("Could not export. Nothing changed on this device.",true);
  }
  /* Rendering here is safe and B-19 does not apply: Settings holds no
     uncommitted input. There is no text field on this screen to lose. */
  if(S.sub==="settings") render(true);
}

/* ---- W13a. The rest-timer mode. Writes its OWN store and nothing else:
   phat:v1:log, phat:v1:bw and phat:v1:draft are byte-identical across this. */
async function setRestAuto(on){
  if(!!S.prefs.restAuto===!!on){ render(); return; }
  S.prefs.restAuto=!!on;
  /* On MANUAL a running rest is stopped as well as hidden: leaving a live
     timestamp behind would restart a countdown the moment he switched back. */
  if(!on) S.rest=null;
  const ok=await save(PREFS,prefsPayload());
  render();
  /* A failed preference write is said out loud, because the setting on screen
     now disagrees with the one on disk and the next boot will disagree with
     both. Nothing about the log changed either way. */
  announce(ok?("Rest timer "+(on?"auto-start.":"manual."))
             :"Could not save that setting. It applies until you reload.");
}

/* ---- W9. Onboarding's one commit. It writes ONE key and clears NOTHING.
   Rule 5 of §10.1: a failed flag write does not block — Home renders anyway
   and onboarding reappears next boot, which is a repeated question rather
   than a locked door. The bodyweight field is optional; empty writes nothing.
   The two writes are independent: a bodyweight that fails to save does not
   cost him the flag, and vice versa. */
async function finishOnboarding(){
  const inp=document.getElementById("bwin");
  const raw=inp?String(inp.value||"").trim():"";
  const v=raw===""?null:parseFloat(raw);
  let said="";
  if(v!==null&&v>30&&v<300){
    const dt=PHAT.localDate();
    S.bw=[...S.bw.filter(x=>x.date!==dt),{date:dt,kg:r1(v)}];
    said=(await save(BWK,bwPayload()))?" Weight logged.":" Could not save that weight.";
  }else if(raw!==""){
    /* A number he typed that cannot be a bodyweight is refused rather than
       rounded into range or silently dropped. He stays on this screen. */
    toast("Enter a weight between 30 and 300 kg."); return;
  }
  S.prefs.onboarded=true;
  await save(PREFS,prefsPayload());
  S.sub=""; render();
  announce("Ready."+said);
}

/* ---- W9. The deload answer (Rule D1). Every one of these is a PURE setter
   in logic.js returning a NEW state object; the only key any of them writes
   is `deload`. Sessions, notes and bodyweight come out byte-identical — W19's
   data-loss criterion. A null return is a refusal to guess and is never
   written over the store. */
async function answerDeload(what){
  const today=PHAT.localDate();
  let next=null;
  try{
    next = what==="start" ? PHAT.startDeload(S.logMeta,today,deloadTrigger())
         : what==="no"    ? PHAT.declineDeload(S.logMeta,today,S.sessions)
         :                  PHAT.endDeload(S.logMeta,today);
  }catch(err){ next=null; }
  if(!next){ toast("Could not record that. Nothing changed."); return; }
  S.logMeta=next;
  const ok=await save(LOG,logPayload());
  render();
  if(!ok) return;                       /* save() has already set S.err */
  /* `Noted. Asked again after the next session.` is D1_DECLINED, logic.js's
     own string, and it is the honest one: declining does not silence the
     check, it defers it until there is new evidence. */
  announce(what==="start"?"Deload week started."
          :what==="no"?"Noted. Asked again after the next session."
          :"Deload ended.");
}
/* Which trigger fired, recorded with the deload so the week can be attributed
   later. Recomputed rather than stashed on S: a value cached at paint time is
   a value that can be stale by the tap. */
function deloadTrigger(){
  try{
    const kl=keyLiftRows(), today=PHAT.localDate();
    let sr=null;
    try{ sr=PHAT.stallReport(S.sessions,today,kl,S.logMeta); }catch(err){}
    const d=PHAT.deloadCheck({sessions:S.sessions, todayStr:today, stallReport:sr,
      keyLifts:kl, state:S.logMeta, plan:PHAT.PHAT_PLAN});
    return d&&d.trigger?d.trigger:null;
  }catch(err){ return null; }
}

/* ============================================================ boot */
/* An unreadable store is not an empty store. If we treated it as empty the
   first save would overwrite whatever is really there, so keep a verbatim
   copy aside first; if even that fails, refuse to write to that key. */
async function preserveUnreadable(k,r){   // → the notice to show, if any
  const label=k===LOG?"log":"bodyweight";
  const bk=k.replace("phat:v1:","phat:v1:recover:")+":"+Date.now();
  const kept=r.raw!=null&&await save(bk,{key:k,savedAt:Date.now(),raw:r.raw});
  console.warn("[phat] unreadable store",k,"reason:",r.reason,kept?("copy kept at "+bk):"copy FAILED");
  if(kept) return "Your saved "+label+" could not be read. A copy has been kept aside and new entries will save normally.";
  S.blockWrites[k]=true;
  return "Your saved "+label+" could not be read and could not be copied aside. Nothing will be written to it. Reload before logging.";
}
(async()=>{
  /* The Train tab must not paint before the draft check resolves — a tab that
     appears and is then covered by a sheet is a layout jump under a thumb that
     is already moving. Under 600 ms show nothing; past that, say so. */
  const slow=setTimeout(()=>{
    document.getElementById("view").innerHTML='<p class="loading">Loading.</p>';
  },600);
  /* B-40: the worst fact wins. One slot, several possible truths, so rank them
     by what each one STOPS him doing and let the highest hold it:
       2  a store that could not be read and could not be copied aside — every
          write to it is blocked, and "close the app and reopen it" cannot help
          when storage is blocked at the browser level;
       1  the draft could not be read — startDay() fails closed, so this one
          blocks the next thing he will try to do;
       0  a store could not be read but a copy was kept — nothing is stopped.
     Ties go to the first setter, which is why the log is read before
     bodyweight: the log is the training history. */
  let notice=null, rank=-1;
  const setNotice=(msg,r)=>{ if(msg&&r>rank){ notice=msg; rank=r; } };
  const rl=await readRaw(LOG), rb=await readRaw(BWK);
  /* THE STATUS IS KEPT, NOT JUST THE VALUE. Onboarding gates on "absent" and
     must never gate on "the sessions array came back empty" — a store that
     failed to parse also yields an empty array, and showing a first-run
     screen over a log that is really there is how a real history gets treated
     as a fresh start (WO-001's readRaw distinction). */
  S.stores={log:rl.status, bw:rb.status};
  if(rl.status==="error") setNotice(await preserveUnreadable(LOG,rl),S.blockWrites[LOG]?2:0);
  if(rb.status==="error") setNotice(await preserveUnreadable(BWK,rb),S.blockWrites[BWK]?2:0);
  const rawLog=rl.value, rawBw=rb.value;
  /* Preferences. A missing store is the default prefs and is not an error:
     every install before tonight has no prefs key and must boot unchanged.
     A store that will not parse is treated as defaults too and is NOT given a
     notice of its own — losing a rest-timer preference costs nothing, and a
     third claimant on the notice slot would push a real one off it (B-40). */
  const rp=await readRaw(PREFS);
  if(rp.status==="ok"&&rp.value&&typeof rp.value==="object"){
    S.prefsMeta={};
    Object.keys(rp.value).forEach(k=>{ if(k!=="restAuto"&&k!=="onboarded") S.prefsMeta[k]=rp.value[k]; });
    S.prefs.restAuto = rp.value.restAuto===undefined ? true : !!rp.value.restAuto;
    S.prefs.onboarded = !!rp.value.onboarded;
  }else if(rp.status==="error"){
    console.warn("[phat] prefs unreadable:",rp.reason);
  }
  /* Non-destructive, idempotent, never throws. No date value is rewritten. */
  const m=PHAT.migrateStore(rawLog,rawBw);
  if(m.log&&typeof m.log==="object"){
    S.logMeta={}; Object.keys(m.log).forEach(k=>{ if(k!=="sessions"&&k!=="includeCut") S.logMeta[k]=m.log[k]; });
    S.sessions=Array.isArray(m.log.sessions)?m.log.sessions:[];
    S.includeCut=!!m.log.includeCut;
  }
  if(m.bw&&typeof m.bw==="object"){
    S.bwMeta={}; Object.keys(m.bw).forEach(k=>{ if(k!=="entries") S.bwMeta[k]=m.bw[k]; });
    S.bw=Array.isArray(m.bw.entries)?m.bw.entries:[];
  }
  /* Sorted once, here, after the migration and before the first render, and
     kept sorted by every save. lastFor and every week gate scan this array in
     order; an array in insertion order gives the wrong "last session" the
     first time a draft started yesterday is saved today (audit D-9). Sorting
     reorders references — it copies nothing, drops nothing, edits nothing. */
  S.sessions=PHAT.sortSessions(S.sessions);
  /* Only writes when the migration actually marked or added something. An
     empty store boots with zero writes; the version lands on the first real
     save. Sorting alone does not trigger a write — order is not data. */
  if(m.logChanged) await save(LOG,logPayload());
  if(m.bwChanged) await save(BWK,bwPayload());
  if(m.notes&&m.notes.length) console.info("[phat] migration:",m.notes);
  /* Read the draft here, before the first render and before any day can be
     tapped, so startDay() knows whether one exists. W5 turns "ok" into the
     restore offer; "error" already makes startDay() fail closed. */
  S.draftRead=await loadDraft();
  if(S.draftRead.status==="error"){
    setNotice("Could not read your saved session. Close the app and reopen it before starting a new day.",1);
    console.warn("[phat] draft unreadable:",S.draftRead.reason);
  }
  /* "ok" becomes the restore offer. "error" keeps State 1I's notice and
     startDay()'s fail-closed retry — the offer must not paper over it. */
  if(S.draftRead.status==="ok") S.offer=S.draftRead.draft;
  if(notice) S.err=notice;   // set last: a successful save() clears S.err
  /* ---- W9. FIRST RUN (spec §10.1 rule 1). Four conditions, and each one is
     a way the screen could otherwise lie:
       both stores read "absent"   not "the arrays are empty". A read that
         FAILED is not a first run, and the two must not look the same.
       no notice                   with storage blocked the STORE NOTICE WINS
         and onboarding does not render (B-40's ordering rule). Offering to
         "start with an empty log" on a device whose log could not be read is
         the app inviting him to walk past his own history.
       not already onboarded       the flag, so answering it once is enough.
       no draft on disk            an unfinished session is evidence of use
         whatever the log store says; restoring it outranks introducing the
         app. */
  if(S.stores.log==="absent" && S.stores.bw==="absent" &&
     !notice && !S.prefs.onboarded && !S.offer) S.sub="onboard";
  clearTimeout(slow);
  render();
})();
})();
</script>
</body>
