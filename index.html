     a false safety claim is worse than no claim. This line is replaced by the
     design's — and an IMPORT control appears beside EXPORT — when WO-002
     lands. Not before. */
  h+=`<p class="tiny">Your log lives on this device. Export writes a copy you can keep.
      This version cannot read one back in yet.</p></div>`;
  return h;
}

/* ============================================================ W7: session
   ONE EXERCISE PER SCREEN. Everything the screen needs, computed once per
   paint. Fails OPEN (spec §0.7): if Rule V1 throws, the whole day renders,
   because a partial day is worse than a full one and a card that is not on
   screen is a set he cannot log. */
function sessionCtx(){
  const day=PROGRAM.find(x=>x.id===S.dayId);
  const today=PHAT.localDate();
  const all=day?day.ex.map(e=>e.id):[];
  let tier=null;
  try{
    tier=PHAT.volumeTier({dayId:S.dayId, program:PROGRAM, sessions:S.sessions,
      state:S.logMeta, todayStr:today, draft:S.draft, plan:PHAT.PHAT_PLAN});
  }catch(err){ tier=null; }
  let ids=(tier&&Array.isArray(tier.exerciseIds)&&tier.exerciseIds.length)
    ? tier.exerciseIds.slice() : all.slice();
  /* THE `S.includeCut` READ IS GONE WITH THE CHECKBOX (C-1, B-23, Decision 6).
     Rule V1 owns which exercises are in, for every day, with no override —
     the offer to add one back is made on the session screen, one at a time,
     which is the only shape the brief's ramp actually has. The stored key is
     still written back untouched so no existing store loses a field; NOTHING
     READS IT. Do not reintroduce a read here. */
  /* Spec §2.3 rule 6: a row a refusal points at must be reachable even when
     the tier hides it. A refusal pointing at an unreachable row is the worst
     state in the spec. */
  S.problems.forEach(pr=>{ if(pr.exId&&ids.indexOf(pr.exId)<0) ids.push(pr.exId); });
  const list=day?day.ex.filter(e=>ids.indexOf(e.id)>=0):[];
  let dl={active:false,day:null};
  try{ dl=PHAT.deloadStatus(S.logMeta,today); }catch(err){}
  return {day:day, today:today, tier:tier, list:list, deload:dl};
}
/* SP1's source lift's CURRENT name, so B-28's rename reaches the fallback copy
   without touching logic.js (WO-003 Decision 5). */
function speedSrcName(exId){
  const src=PHAT.SPEED_SRC&&PHAT.SPEED_SRC[exId];
  if(!src) return null;
  let nm=null;
  PROGRAM.forEach(d=>d.ex.forEach(x=>{ if(x.id===src) nm=x.n; }));
  return nm;
}
/* C-12 rule 2: `- REMOVE` targets the last BLANK row by preference, not the
   last row. The common case - a row added by mistake - never touches data. */
const blankSet=s=>String((s&&s.w)==null?"":s.w).trim()===""&&String((s&&s.r)==null?"":s.r).trim()==="";
function removeTarget(sets){
  for(let k=sets.length-1;k>=0;k--) if(blankSet(sets[k])) return k;
  return sets.length-1;
}

/* The ghost hint for one row. GHOST, NOT PREFILL (spec §4.4, ruled): the row
   starts empty and last session's numbers sit under it, so a number he did not
   choose can never reach the log. ACROSS A PRESCRIPTION CHANGE the per-row
   hint is DELETED, not captioned - prescriptionEpoch reports prefill:false and
   seed:false, and the provenance line renders in its place. */
function ghostText(e,prev,k,changed){
  if(changed) return "";
  const pv=prev&&prev.sets&&prev.sets[k];
  if(!pv) return "No prior set.";
  const pw=PHAT.parseWeight(pv.w), pr=PHAT.parseReps(pv.r);
  if(!pw.ok||!pr.ok) return "No prior set.";
  /* Rule Z2: a rack chin reads `Last bodyweight x 10`. No rule and no view in
     this app produces the string `0 kg`. */
  const w=pw.value>0?String(r1(pw.value)):PHAT.loadWord(0,e.implement);
  return "Last "+w+" × "+pr.value;
}

function vSession(){
  const C=sessionCtx(), list=C.list, n=list.length;
  if(!n) return `<div class="todo"><h1>Nothing to log</h1>
    <p>This day has no exercises in it. Your draft is untouched.</p></div>`;
  if(!(S.exIx>=0)) S.exIx=0;
  if(S.exIx>n-1) S.exIx=n-1;
  const i=S.exIx, e=list[i];
  const st=S.draft.entries[e.id]||{sets:[{w:"",r:""}],note:""};
  if(!st.sets.length) st.sets.push({w:"",r:""});
  /* The prescription that governs. deloadEx is idempotent and returns `ex`
     itself when no deload is active, so this is the same object on a normal
     week. A deload reduces the PRESCRIPTION, never the log. */
  const rx=PHAT.deloadEx(e,C.deload.active===true);
  const prev=PHAT.lastFor(S.sessions,e.id);
  let ep=null;
  try{ ep=PHAT.prescriptionEpoch({ex:e,prev:prev,plan:PHAT.PHAT_PLAN,exId:e.id}); }catch(err){ ep=null; }
  const changed=!!(ep&&ep.changed);
  let xs={flags:[],count:0,line:"",idle:false};
  try{ const r=PHAT.extraSets(st.sets,rx); if(r) xs=r; }catch(err){}
  let sl=null;
  if(e.k==="speed"){
    try{ sl=PHAT.speedLoad(S.sessions,e.id,C.today,speedSrcName(e.id),PHAT.PHAT_PLAN); }
    catch(err){ sl=null; }
  }
  const ag=PHAT.draftAge(S.draft.date,C.today);

  /* ---- header + pips. No destructive control: the header is information,
     not a control (§4.2, §4.12, B-34 / C-13). The pip strip is aria-hidden
     redundant graphics; pipStrip() carries `Exercise {i} of {n}` as the
     accessible carrier (B-59, §0.5). */
  let h=`<div class="sesshead"><p class="kick">${esc(C.day.name)} &middot; ${i+1} of ${n}</p>`;
  if(!ag.sameDay) h+=`<p class="sub">It saves under ${esc(fmtDay(S.draft.date,ag.ageDays))}, not today.</p>`;
  h+=`</div>${pipStrip(i,n)}`;

  /* ---- the fix bar (§2.3 rule 3). It renders at FIRST PAINT of the screen he
     was sent to, so it is a navigation and not an appearance; it is fixed
     height and never disappears while a refusal stands. The full message lives
     once, at the save point, on the last screen. */
  const showMsg=(i===n-1);
  if(S.problems.length&&!showMsg)
    h+=`<div class="fixbar"><p id="fixtxt">${esc(fixText())}</p>
      <button id="backsave">Back to save</button></div>`;

  /* ---- Rule V1's reintroduction offer. First exercise screen only: the
     decision is about this session and the moment to make it is before he has
     lifted anything (§4.11). */
  if(i===0) h+=vOffer(C);

  /* ---- name, target, prescription. §0.1 #9: the target never wraps, never
     truncates, never shrinks - the NAME is what gives way. ` . per DB` is
     required for implement:"db" and the prototype omits it (B-22). */
  const unit=(e.implement==="db")?" · per DB":"";
  const tgt=(rx.lo===rx.hi?rx.s+" × "+rx.lo:rx.s+" × "+rx.lo+"–"+rx.hi)+unit;
  h+=`<div class="exname"><div class="row"><h3>${esc(e.n)}</h3>
    <span class="target">${esc(tgt)}</span></div></div>`;
  /* Speed cards print SP1's computed load, never the prototype's static
     "65-70% of your power-day top set" (B-12). Everything else prints the
     provenance line, and ONLY across a prescription change - on an unchanged
     prescription the per-row ghosts already say it, once per row. */
  const rxline=(e.k==="speed")?(sl?sl.text:""):(changed?ep.line:"");
  if(rxline) h+=`<p class="rx">${esc(rxline)}</p>`;
  if(C.tier&&Array.isArray(C.tier.kept)&&C.tier.kept.indexOf(e.id)>=0)
    h+=`<p class="rx">Not in today's volume. It has numbers in it.</p>`;
  if(S.v1added===e.id) h+=`<p class="rx">Back in from this session.</p>`;

  /* ---- movement & cue. Neither figure nor cue -> the disclosure is NOT
     rendered at all. An empty frame in the gym is worse than no frame. */
  if(hasFig(e.id)||cueFor(e.id))
    h+=`<button class="showfig" data-fig="${esc(e.id)}" aria-expanded="false"
      aria-controls="fig-${esc(e.id)}"><span class="chv" aria-hidden="true">&rsaquo;</span> movement &amp; cue</button>
      <div class="fig" id="fig-${esc(e.id)}" data-figbox="${esc(e.id)}"></div>`;

  /* ---- THE INPUTS. Built BEFORE and OUTSIDE every try block above, so no
     advice rule can prevent a set row painting (§0.7). */
  h+=`<div class="card" id="excard" data-ex="${esc(e.id)}"><div class="sets">`;
  for(let k=0;k<st.sets.length;k++){
    const g=ghostText(e,prev,k,changed);
    const at=` ${esc(e.n)} set ${k+1}`;
    h+=`<div class="setrow" data-i="${k}">
      <span class="idx" aria-hidden="true">${k+1}</span>
      <span class="grp"><span class="unit" aria-hidden="true">kg</span>
        <span class="stepper"><button data-act="-" data-f="w" aria-label="Weight down 2.5,${at}">&minus;</button>
        <input class="w" data-f="w" inputmode="decimal" placeholder="0"
          aria-label="Weight in kg,${at}" value="${esc(st.sets[k].w)}">
        <button data-act="+" data-f="w" aria-label="Weight up 2.5,${at}">+</button></span></span>
      <span class="grp"><span class="unit" aria-hidden="true">reps</span>
        <span class="stepper"><button data-act="-" data-f="r" aria-label="Reps down 1,${at}">&minus;</button>
        <input class="r" data-f="r" inputmode="numeric" placeholder="&ndash;"
          aria-label="Reps,${at}" value="${esc(st.sets[k].r)}">
        <button data-act="+" data-f="r" aria-label="Reps up 1,${at}">+</button></span></span>
      <span class="ghost"><span class="gtxt" data-ghost="${esc(g)}">${esc(g)}</span>
        <span class="xtra" data-xtra="${k}">${xs.flags[k]?"EXTRA":""}</span></span></div>`;
  }
  h+=`</div>`;

  /* ---- add / remove. CONTROLS, not inputs, so they sit BELOW every set input
     and ABOVE the note field: they change the number of rows above them, which
     is exactly why they must not sit above one (§4.1). The remove control
     NAMES ITS TARGET so he can see what he is about to lose before he taps
     (C-12 rule 1). */
  const tk=removeTarget(st.sets);
  h+=`<div class="ctlrow"><button id="addset">+ Add set ${st.sets.length+1}</button>`;
  h+=(st.sets.length>1)
    ? `<button id="rmset" data-k="${tk}">&minus; Remove set ${tk+1}</button>`
    : `<span class="spacer" aria-hidden="true"></span>`;
  h+=`</div>`;

  /* ---- THE NOTE FIELD - C-15, restored. Rule S1's ONLY input, and the LAST
     input on the card: the whole bottom-stack safety rule is defined relative
     to it. It grows downward on focus, which is allowed because everything
     below it is a control. */
  h+=`<div class="notewrap"><label class="lbl" for="exnote" style="margin-bottom:5px">Note</label>
    <input class="note" id="exnote" placeholder="Note &mdash; RIR, form, pain, anything"
      aria-label="Note for ${esc(e.n)} &mdash; RIR, form, pain, anything"
      value="${esc(st.note)}"></div></div>`;

  /* ---- THE BOTTOM STACK. Every slot here is BELOW the last input, so nothing
     in it can move an input by appearing or resizing (§0.1 #1). Order is
     normative: extras -> deload -> pain -> speed flag -> verdict. Filled by
     paintAdvice() on commit; the verdict slot is never empty and never
     collapses. */
  h+=`<div class="stack">
    <div id="slot-extra"></div>
    <div id="slot-deload"></div>
    <div id="slot-pain"></div>
    <div id="slot-speed"></div>
    <div id="slot-verdict"></div>`;
  /* C-12 rule 5. The toast is the immediate reach and it fades; the undo does
     not. While one stands it is a control in the bottom stack of the exercise
     it belongs to - below every input, reachable for the whole session, and
     never a bar floating over the next four screens. */
  if(S.undo&&S.undo.exId===e.id)
    h+=`<button class="ghostbtn mb12" id="undoset">Undo &mdash; put set ${S.undo.i+1} back</button>`;
  if(S.err) h+=`<div class="warn hi mb12" role="alert">
    <p style="color:var(--bone);font-size:.8125rem;line-height:1.5">${esc(S.err)}</p></div>`;
  if(showMsg) h+=`<div id="bs-slot"></div>`;

  /* ---- prev / next, then DISCARD SESSION as the last element in the scroll. */
  h+=`</div><div class="navrow">
    <button class="prev" id="navprev"${i===0?" disabled aria-disabled=\"true\"":""}
      aria-label="Previous exercise">&larr;</button>`;   /* U+2190 is outside the
      inlined Archivo subset and falls back per-glyph, checked on screen and
      kept: it is one arrow at one size and it reads, where the chevron
      alternative reads as "previous PAGE". If the subset is ever regenerated,
      add U+2190. */
  h+=(i===n-1)
    ? `<button class="next" id="finish">Save session</button>`
    : `<button class="next" id="navnext">Next &mdash; ${esc(list[i+1].n)}</button>`;
  h+=`</div><div class="pad mt24"><button id="discard">DISCARD SESSION</button></div>`;
  return h;
}

/* Rule V1's offer block. `Not yet` is the LOWEST and therefore the cheapest
   tap; ignoring it is not declining it - scrolling past or saving with it
   unanswered stamps nothing and re-offers next session (§4.11). */
function vOffer(C){
  if(S.v1msg) return `<div class="offer" id="v1"><p>${esc(S.v1msg)}</p></div>`;
  const t=C.tier;
  if(!t) return "";
  if(t.blocked==="pain"&&t.blockedLine)
    return `<div class="offer" id="v1"><p>${esc(t.blockedLine)}</p></div>`;
  if(!t.offer||!t.offerLine) return "";
  return `<div class="offer" id="v1"><p>${esc(t.offerLine)}</p>
    <div class="btns"><button class="ghostbtn" id="v1-add">Add it</button>
    <button class="ghostbtn" id="v1-no">Not yet</button></div></div>`;
}
const fixText=()=>{const n=badRows().length;
  return n?(n===1?"1 set left to fix.":n+" sets left to fix."):"Nothing left to fix.";};

function vTrend(){
  /* Series are keyed by SLOT ID, never by name. A name is display data now
     that it is read from the plan at paint time; an id is the identity
     (WO-004 C-6), and two lifts could legitimately share a label. */
  const rows=S.sessions.map(s=>{const r={date:fmt(s.date)};
    KEY_LIFTS.forEach(l=>{const e=s.entries[l.id]; if(e) r[l.id]=PHAT.topSet(e.sets);}); return r;})
    .filter(r=>KEY_LIFTS.some(l=>r[l.id]));
  let stalled=[];
  if(weeksIn()>=6) KEY_LIFTS.forEach(l=>{
    const hits=S.sessions.filter(s=>s.entries[l.id]).map(s=>PHAT.topSet(s.entries[l.id].sets));
    /* The PLAN NAME in full, not the legend abbreviation: coach addendum
       §9.2 fixes this sentence to `Bent-over row`, never `Row`. */
    if(hits.length>=3&&Math.max(...hits)<=hits[0]) stalled.push(l.n);});

  let h=`<div class="pad" style="padding-top:26px;padding-bottom:16px">
    <h1>Top sets</h1><p class="sub">The heaviest set on the four lifts that decide whether this is working.</p></div>`;
  if(stalled.length) h+=`<div class="pad mb12"><div class="warn">
    <p style="color:var(--red);font-size:.875rem;font-weight:600">Week ${weeksIn()} and no progress on ${esc(stalled.join(", "))}.</p>
    <p style="color:var(--dim);font-size:.8125rem;margin-top:5px;line-height:1.5">This is the check we agreed on.
    The split isn't the problem and neither is the diet. Either the sets aren't close enough to failure,
    or you aren't eating enough. Fix one, not both, and give it three weeks.</p></div></div>`;

  const svg=linechart(rows,KEY_LIFTS.map(l=>({n:l.id,c:l.c})),230);
  if(!svg) h+=`<div class="pad"><div class="panel" style="text-align:center;padding:34px 16px">
      <p style="color:var(--dim);font-size:.875rem">Log two power sessions and the line appears here.</p></div></div>`;
  else{
    h+=`<div style="padding:0 8px">${svg}</div><div class="pad legend">`;
    KEY_LIFTS.forEach(l=>h+=`<span><span class="swatch" style="background:${l.c}"></span>${esc(l.lbl)}</span>`);
    h+=`</div>`;
  }
  h+=`<div class="pad mt24"><h2>Recent sessions</h2>`;
  const rec=S.sessions.slice().reverse().slice(0,12);
  if(!rec.length) h+=`<p class="tiny">Nothing yet.</p>`;
  rec.forEach(s=>{const d=PROGRAM.find(x=>x.id===s.dayId);
    const n=Object.keys(s.entries).length;
    const v=Object.values(s.entries).reduce((a,e)=>a+PHAT.vol(e.sets),0);
    h+=`<div class="sess"><div><div style="font-size:.90625rem">${esc(d?d.name:"Session")}</div>
      <div style="color:var(--faint);font-size:.78125rem;margin-top:2px">${fmt(s.date)} · ${plural(n,"exercise")}</div></div>
      <div style="color:var(--dim);font-family:var(--mono);font-size:.8125rem">${sep(v)} kg</div></div>`;});
  h+=`</div>`;
  return h;
}

/* ============================================================ W11: weight
   B-06 and C-9, closed. EVERY NUMBER AND EVERY SENTENCE ON THIS SCREEN COMES
   OUT OF logic.js — PHAT.bwWindows for the average, PHAT.calorieAdvice for
   the decision — and not one of them is assembled here. That is the whole
   point of the item, because the version this replaces assembled both and got
   both wrong:

     - it averaged the last 7 ENTRIES (`b.slice(-7)`), so eight weigh-ins
       spread over 24 days printed a confident "kg per week" that spanned most
       of a month, and it fired from TWO entries;
     - its bands were `>=.2 && <=.35` on target, `<.2` add, else cut — the
       exact bands coach-audit §2 struck down. It cut 200 kcal at +0.36 where
       the brief says do nothing below +0.5, and it printed "Gaining too
       slowly" while he was LOSING weight;
     - and it printed "Target: 0.2–0.3 kg per week" directly under logic that
       treated 0.34 as on target.

   The engine's eleven states, its insufficient-data gates and its sub-line
   now render verbatim, trailing "Recheck in 7 days." included. If you find
   yourself building a sentence in this function, that is the bug.

   NOTHING ON THIS TAB WRITES TO STORAGE ON RENDER (spec §3.1 rule 7). */
function vWeight(){
  const today=PHAT.localDate();
  const b=S.bw.slice().sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  const mine=b.find(e=>e.date===today);
  /* FAIL SILENT ON ADVICE (spec §3.6). The average is arithmetic over one
     window and may still show if it is computable; a partial or guessed
     calorie instruction may never appear. Two try blocks, not one, so a throw
     in the band ladder cannot also take the average down with it. */
  let W=null, adv=null;
  try{ W=PHAT.bwWindows(S.bw,today); }catch(err){ W=null; }
  try{ adv=PHAT.calorieAdvice(S.bw,today,S.logMeta&&S.logMeta.calChangedAt); }catch(err){ adv=null; }
  const n=b.length;

  let h=`<div class="hd"><span class="kick">Bodyweight</span>
    <span class="kick">${n?(n===1?"1 entry":n+" entries"):"No entries"}</span></div>`;

  /* ---- the average, and its sample size. The count is NEVER omitted, not
     even at 7 of 7 (spec §3.4): a label that only admits its sample size when
     the sample is thin is a label he learns to stop reading. */
  /* ONE decimal on the average, TWO on the rate, deliberately. The scale is
     0.1 kg (CLAUDE.md §3.5) so 86.42 kg is precision he cannot weigh; the
     rate's bands are compared in hundredths, so +0.50 and +0.5049 are
     different instructions and it must print what it banded. The two numbers
     cannot be checked against each other in any case — window A's mean is
     never on screen, which is why logic.js rounds the rate once from the
     unrounded means. */
  if(W&&W.bCount>=PHAT.BW_WINDOW_MIN&&W.meanB!==null){
    h+=`<div class="bwavg"><span class="lbl">7-day average (${W.bCount} of 7 days)</span>
      <p class="bwbig">${r1(W.meanB).toFixed(1)}<span class="u"> kg</span></p>`;
    /* Rule W1 rule 1: the rate is null unless BOTH windows hold 5 dated
       entries, so this row cannot render off a month of scattered weigh-ins.
       Uncoloured, always — see the CSS block comment. */
    if(W.rate!==null)
      h+=`<div class="row bwchg"><span>Change vs last week</span>
        <span class="v">${W.rate<0?"-":"+"}${Math.abs(W.rate).toFixed(2)} kg</span></div>`;
    h+=`</div>`;
  }

  /* ---- the calorie decision. Verbatim, and the ONLY place a kg-per-week
     instruction may appear. In the four not-enough-data states adv.subline is
     "" and adv.tone is "none", so no sub-line and no acknowledgement control
     render without a further test here — the engine already decided. */
  if(adv&&adv.state!=="empty"){
    h+=`<div class="pad mt16"><div class="advice">
      <span class="kick">Calorie decision</span>
      <p class="lead">${esc(adv.text)}</p>`;
    if(adv.subline) h+=`<p>${esc(adv.subline)}</p>`;
    /* tone === "act" is EXACTLY the three states that instruct a change, so
       the view never re-derives that list (logic.js says so in as many
       words). Acknowledging "I changed my intake" under "Change nothing."
       would mean nothing, and a control that is always present is a control
       that gets tapped absently. */
    if(adv.tone==="act")
      h+=`<button class="ghostbtn" id="calset">I changed my calories today</button>`;
    /* The way back out. One tap, no confirmation: clearing RESTORES advice,
       so the cheap direction is the safe direction (spec §0.1 rule 8). */
    if(adv.state==="cooldown")
      h+=`<button class="ghostbtn" id="calclear">I did not change anything</button>`;
    h+=`</div></div>`;
  }
  /* State D, the true empty state (spec §3.3): the entry control and this
     sentence. No panel, no zeroes, no placeholder chart. It earns its place
     because it says what to do. */
  else if(adv&&adv.state==="empty"){
    h+=`<p class="sub pad mt16">Same time, same conditions, every morning.
      The daily number is noise. The weekly average is the signal.</p>`;
  }

  /* ---- entry. 0.1 kg steps (CLAUDE.md §3.5). Logging twice on one local
     calendar date UPDATES one row and never creates two — that guarantee is
     in the handler, which keys off PHAT.localDate() and never a UTC slice
     (B-03). `value` is re-rendered from the store, so it is escaped like any
     other interpolated string even though it should be a number. */
  h+=`<div class="pad mt16">
    <label class="lbl" for="bwin">Today's weight</label>
    <div class="bwentry">
      <span class="stepper"><button data-bwact="-" aria-label="Bodyweight down 0.1 kg">&minus;</button>
        <input id="bwin" inputmode="decimal" placeholder="0" value="${mine?esc(mine.kg):""}">
        <button data-bwact="+" aria-label="Bodyweight up 0.1 kg">+</button></span>
      <button class="primary" id="logbw">${mine?"Update today":"Log today"}</button>
    </div>`;
  if(mine) h+=`<p class="tiny mt12">Logged as today's entry. Weigh daily &mdash; the trend is what the app reads.</p>`;
  /* Refusal, not advice: the four-sided enclosure, so a failed write can
     never be mistaken for a sentence about his diet (spec §2.1, §2.5). The
     number stays on screen. It must never both fail and look fine. */
  if(S.err) h+=`<div class="refuse mt12" role="alert"><p>${esc(S.err)}</p></div>`;
  h+=`</div>`;

  /* ---- the last 7, newest first. Raw entries, not window B: this is the
     receipt for what he typed, so a row the engine ignores is still shown
     rather than silently dropped. */
  if(n){
    h+=`<div class="pad mt24"><span class="lbl secrule">Last 7 entries</span>`;
    b.slice(-7).reverse().forEach(e=>{
      /* fmt() hands back the raw string when PHAT.dayMon cannot parse it, so
         a malformed stored date reaches innerHTML verbatim unless it is
         escaped here. Nothing interpolated skips esc(), including a date. */
      h+=`<div class="bwrow"><span class="d">${e.date===today?"Today":esc(fmt(e.date))}</span>
        <span class="k">${r1(+e.kg||0).toFixed(1)} kg</span></div>`;});
    h+=`</div>`;
  }
  return h;
}

/* ---- Screens the shell routes to that no milestone has built yet ---------
   W6 is the frame, not the rooms. A tab that leads nowhere is worse than a
   tab that says it leads nowhere, and prototype copy pasted in as filler is
   worse than both — it reads as a promise. So the placeholder names itself,
   says it is empty on purpose, and states the one fact that matters in a
   gym: nothing here can touch the log. Copy is NEW and flagged for
   `ux-designer` review. */
function vTodo(kick,name,line){
  return `<div class="hd"><span class="kick">${esc(kick)}</span>
    <span class="kick">Not built</span></div>
    <div class="todo"><h1>${esc(name)}</h1>
    <p>${esc(line)}</p>
    <p>Nothing on this screen reads or writes your log.</p></div>`;
}
const vDiet=()=>vTodo("Diet","Not built yet",
  "The calorie and protein targets land here. Until then the numbers you need are in the handoff brief, not in this app.");
const vPlan=()=>vTodo("Plan","Not built yet",
  "The plan list and the editor land here. The programme you are logging against is unchanged and is still the one on the Train tab.");

/* ---- The progress strip, built once here so no screen can re-invent it ----
   B-59, spec §0.5. Three states, three FORMS, and the meaning is carried by
   the text this returns beside them — not by opacity, which is what made the
   old strip 1.7:1 and unfixable by an alpha bump. The strip itself is
   redundant graphics and says so. W7 is the first caller. */
function pipStrip(i,n){
  if(!(n>0)) return "";
  let g="";
  for(let k=0;k<n;k++) g+=`<span class="pip ${k<i?"done":k===i?"now":"next"}"></span>`;
  return `<p class="sr-only">Exercise ${i+1} of ${n}</p>
    <div class="pips" aria-hidden="true">${g}</div>`;
}

/* ============================================================ render */
/* keepScroll: the blocked-save path must not throw him to the top of a
   ten-exercise page — he tapped Save at the bottom and the answer is there
   (W4 §2.5). Every other caller passes nothing and scrolls as before. */
function render(keepScroll){
  const v=document.getElementById("view");
  /* An open draft still wins the Train tab over Home, Settings and onboarding:
     the session he is in the middle of is never something he has to navigate
     back to. Settings is reached from Home, and Home is what a saved or
     discarded session returns to. */
  v.innerHTML = S.tab==="train"  ? (S.draft?vSession():vTrain())
              : S.tab==="trend"  ? vTrend()
              : S.tab==="weight" ? vWeight()
              : S.tab==="diet"   ? vDiet()
              : S.tab==="plan"   ? vPlan()
              : vTrain();
  document.querySelectorAll("nav button").forEach(b=>{
    const on=b.dataset.tab===S.tab;
    b.classList.toggle("on",on);
    /* The amber and the bar are two of three signals; this is the third, and
       the only one a screen reader gets. */
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  if(S.draft){ paintAdvice(false); paintProblems(); }
  renderRest();
  renderOffer();
  if(!keepScroll) window.scrollTo(0,0);
}
/* THE ONLY CALLER OF THE ADVICE ENGINES. Every sentence on this screen comes
   out of logic.js. Nothing is assembled here: the design supplies the slot,
   never the sentence (C-4). The prototype's verdict() is gone entirely.

   IT RUNS ON COMMIT ONLY - a stepper tap, a field or the note leaving focus, a
   cleared set, and first paint. NEVER on `input`. Typing `12` into a reps
   field passes through `1`, and `1` on a 3-5 exercise used to print `Below the
   range. Drop to 95 kg.` mid-number; typing `painting` passes through `pain`
   and would trip Rule S1 on a word that is not the keyword (spec 1.2 rule 5,
   2.2 rule 3).

   SIX INDEPENDENT CATCHES (spec 0.7). A rule that throws costs its own slot
   and nothing else: the set rows are already painted, the note is untouched,
   the draft write path does not run in here, and Save still works. */
function paintAdvice(speak){
  const card=document.getElementById("excard");
  if(!card||!S.draft) return;
  const id=card.dataset.ex;
  const day=PROGRAM.find(d=>d.id===S.dayId); if(!day) return;
  const e=day.ex.find(x=>x.id===id); if(!e) return;
  const st=S.draft.entries[id]; if(!st) return;
  const today=PHAT.localDate();
  let dl={active:false};
  try{ dl=PHAT.deloadStatus(S.logMeta,today); }catch(err){}
  const rx=PHAT.deloadEx(e,dl.active===true);
  /* Writes only when the slot's contents actually change, and returns whether
     it did, so nothing is announced that he has already read. */
  const put=(slot,html)=>{
    const el=document.getElementById(slot);
    if(!el||el.innerHTML===html) return false;
    el.innerHTML=html; return true;
  };

  /* 0. C-12 rule 1: THE CONTROL NAMES ITS TARGET, so he can see what he is
     about to lose before he taps - which means the name has to follow the
     target. The target moves the moment he types into the last blank row, and
     a label saying SET 3 over a control that would take SET 2 is worse than
     no label at all. Text only: the control's box is min-width 8rem and does
     not resize, so nothing below it moves. */
  const rmb=document.getElementById("rmset");
  if(rmb&&st.sets.length>1){
    const tk=removeTarget(st.sets);
    const lbl="− Remove set "+(tk+1);
    if(rmb.dataset.k!==String(tk)){ rmb.dataset.k=String(tk); rmb.textContent=lbl; }
  }

  /* 1. Rule X1 - the EXTRA badges and the line. THE BADGE KEYS OFF THE
     COMPLETED-SET ORDINAL AND THE COPY NAMES THE ROW NUMBER. They are two
     different rules pointing at the same physical row, and logic.js carries a
     DO NOT "FIX" EITHER ONE TO MATCH THE OTHER comment at both sites. Read it
     before touching either. The badge lives on the ghost row, on the same
     line, so a row becoming EXTRA changes no height and moves no input. */
  let xs={flags:[],count:0,line:""};
  try{ const r=PHAT.extraSets(st.sets,rx); if(r) xs=r; }catch(err){}
  card.querySelectorAll("[data-xtra]").forEach(sp=>{
    const t=xs.flags[+sp.dataset.xtra]?"EXTRA":"";
    if(sp.textContent!==t) sp.textContent=t;
  });
  put("slot-extra",xs.line?`<div class="advice"><p>${esc(xs.line)}</p></div>`:"");

  /* 2. A deload reduces the PRESCRIPTION, never the log. A value typed into a
     row above it still renders and still saves, and the app says which it is
     rather than hiding the row. */
  let dlline="";
  if(dl.active&&e.k!=="speed"){
    for(let k=rx.s;k<st.sets.length;k++) if(!blankSet(st.sets[k])){
      dlline="Deload week. This set is above the prescription."; break; }
  }
  put("slot-deload",dlline?`<div class="advice"><p>${esc(dlline)}</p></div>`:"");

  /* 3. Rule S1's pain notice. No dismiss, no shortening, no severity word, no
     substitute, no stretch. It may use the refusal treatment, because there
     the app really is declining to do something (spec 2.1 exception). */
  const pain=painHtml(id,st.note,today);
  if(put("slot-pain",pain)&&speak&&pain) announce(stripTags(pain));

  /* 4. Rule SP1's too-heavy flag. ADVICE, styled as advice: it never alters,
     blocks, marks or clears the logged weight - the field still reads 110, the
     draft on disk still holds 110, Save writes 110 - and the input gets NO
     aria-invalid and no aria-describedby pointing at it, because it is a valid
     value and telling a screen reader otherwise is a lie with consequences. */
  let flag="";
  try{
    if(e.k==="speed"){
      const sl=PHAT.speedLoad(S.sessions,id,today,speedSrcName(id),PHAT.PHAT_PLAN);
      if(sl&&sl.source&&sl.target>0){
        let worst=null;
        st.sets.forEach(s=>{
          if(!PHAT.speedTooHeavy(s.w,sl.source.w)) return;
          const v=PHAT.parseWeight(s.w);
          if(v.ok&&(worst===null||v.value>worst)) worst=v.value;
        });
        if(worst!==null) flag=PHAT.speedFlagText(worst,sl.target);
      }
    }
  }catch(err){ flag=""; }
  put("slot-speed",flag?`<div class="advice"><p>${esc(flag)}</p></div>`:"");

  /* 5. THE VERDICT SLOT. Occupied from first paint, for every ex.k, never
     removed and never collapsed: it holds the reminder when the rule returns
     null and the verdict when it does not, and .vslot reserves the height so
     the card cannot grow under his thumb when one replaces the other.

     THE GATE IS `completedSets >= ex.s` AGAINST THE PRESCRIPTION, always, and
     it lives inside PHAT.verdict where nothing in this file can loosen it. The
     design's `min(ex.s, sets.length)` fires a verdict on ONE completed set
     when two are removed - B-24 reopened through a new door (C-11 / B-50).
     Removing sets does not buy a verdict.

     READ `.absent`, NEVER TRUTHINESS. verdict() returns null (nothing to say),
     an ABSENT-shaped object (no verdict, and here is why), or a real verdict.
     The ABSENT object is TRUTHY and carries empty t/x/x2, so `if (v)` paints
     an empty advice block and `if (v.x)` collapses the slot. It renders as the
     REFUSAL it is - never as advice with an arrow and a rule name (0.1 #6). */
  let v=null;
  try{
    v=PHAT.verdict({ex:e, sets:st.sets, prev:PHAT.lastFor(S.sessions,id),
      note:st.note, deload:dl.active===true});
  }catch(err){ v=null; }
  let html="", say="";
  if(v&&v.absent===true){
    const lines=(v.absentLines&&v.absentLines.length?v.absentLines:[v.absentLine]).filter(Boolean);
    html=`<div class="refuse vslot">`+
      lines.map((l,ix)=>`<p>${ix?"":'<span aria-hidden="true">! </span>'}${esc(l)}</p>`).join("")+
      `</div>`;
    say=lines.join(" ");
  }else if(v){
    /* `t` is a direction token, not a word. It drives a redundant glyph beside
       the kicker, aria-hidden, and it is never the sole carrier - the sentence
       carries the status (B-13, 4.7 rule 6). */
    const dir=v.t==="up"?"&uarr;":v.t==="down"?"&darr;":"";
    /* x2 is Rule I2's second LINE and is never appended to x's sentence. */
    html=`<div class="advice vslot"><p class="kick">${dl.active?"Deload week":"Verdict"}`+
      (dir?`<span class="dir" aria-hidden="true">${dir}</span>`:"")+`</p>`+
      `<p>${esc(v.x)}</p>`+(v.x2?`<p>${esc(v.x2)}</p>`:"")+`</div>`;
    say=v.x+(v.x2?" "+v.x2:"");
  }else if(e.k==="speed"){
    /* There is ONE source for what to say on a speed card and it is
       speedLoad(): `text` for the load, `instruction` for how to move it. Both
       ungated, both permanent. verdict() returns null here by design. */
    let ins="";
    try{ const sl=PHAT.speedLoad(S.sessions,id,today,speedSrcName(id),PHAT.PHAT_PLAN);
         ins=sl?sl.instruction:""; }catch(err){ ins=""; }
    html=`<div class="advice vslot"><p class="kick">Speed work</p><p>${esc(ins)}</p></div>`;
  }else{
    /* Silence looks DELIBERATE and the slot says so in words. One constant
       line, identical on every card, that never changes while he fills the
       sets - so it is not something he re-reads. No countdown: a number that
       ticks down is a number he reads (0.1 #3, 4.7). */
    html=`<div class="advice vslot"><p class="kick">Waiting</p>`+
      `<p>Nothing to say until all ${rx.s} sets are in.</p></div>`;
  }
  /* B-13 asked for aria-live on the verdict; spec 2.6 allows exactly ONE live
     region. Both are satisfied by routing the sentence through #bs-live. Only
     the commit paths pass {speak}. */
  if(put("slot-verdict",html)&&speak&&say) announce(say);
}
const stripTags=h=>String(h).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();

/* Rule S1's notice - the pain notice, position 1 in the bottom stack, below
   the note field that triggers it and above the verdict it explains.

   TWO SOURCES, ONE ELEMENT: the current draft note on commit, and
   PHAT.painState over the history. The two S1 paragraphs are NOT exported from
   logic.js as a constant, so the current-note case gets them from painState
   itself by handing it today's entry - which is exactly what it is. The copy
   stays verbatim from the engine and no sentence lands in this file.
   `S1_LINES` is worth exporting; flagged for backend. */
function painHtml(exId,note,today){
  let cur=false;
  try{ cur=PHAT.painFlag(note); }catch(err){ cur=false; }
  let hist=null;
  try{ hist=PHAT.painState(S.sessions,exId,today); }catch(err){ hist=null; }
  let lines=[], prov="";
  if(cur){
    let now=null;
    try{ now=PHAT.painState([{date:today,entries:{[exId]:{sets:[],note:String(note==null?"":note)}}}],
      exId,today); }catch(err){ now=null; }
    /* Fails TOWARDS showing: if painState throws and the current note matches,
       the history's copy stands in rather than the slot going quiet. */
    lines=(now&&now.active)?now.lines:((hist&&hist.active)?hist.lines:[]);
  }else if(hist&&hist.active){
    lines=hist.lines;
    prov=hist.provenanceLine||"";       /* only when the source is history */
  }
  if(!lines.length) return "";
  return `<div class="refuse">`+
    lines.map((l,ix)=>`<p>${ix?"":'<span aria-hidden="true">! </span>'}${esc(l)}</p>`).join("")+
    (prov?`<p>${esc(prov)}</p>`:"")+`</div>`;
}

/* ============================================================ Rule R1 timer
   THE ABSOLUTE TIMESTAMP, AND THE ONE textContent CHANNEL.

   B-61: the design's timer calls setState every second, which in this app is
   innerHTML on the whole view once a second while a thumb is in a weight
   field - the caret dies every second (B-19). And it decrements a counter, so
   backgrounding the phone loses the count.

   Neither survives here. S.rest.at is ONE absolute millisecond timestamp;
   elapsed is recomputed from the wall clock on every tick and on
   visibilitychange, so three minutes in a pocket comes back as three minutes.
   The tick writes ONE cached TEXT NODE's nodeValue - a characterData
   mutation, not a childList one, inside #dock and outside #view - and calls
   render() from nowhere. Nothing here is persisted and nothing here is in the
   save path: it is a comfort feature and it may not cost a caret or a set. */
let restTick=null, restNode=null;
function restTextNode(){
  const p=document.getElementById("rest-txt");
  if(!p) return null;
  if(restNode&&restNode.parentNode===p) return restNode;
  if(!p.firstChild) p.appendChild(document.createTextNode(""));
  restNode=p.firstChild;
  return restNode;
}
function restLoop(on){
  if(on&&!restTick) restTick=setInterval(paintRest,1000);
  if(!on&&restTick){ clearInterval(restTick); restTick=null; }
}
/* Three transitions, announced once each per rest, through the persistent
   region: entering "Ready.", entering the past-the-window state, and the stop.
   The band itself is not a live region (spec 4.10 a11y). */
const REST_SAY={2:1,3:1,4:1,5:1};
function paintRest(){
  const node=restTextNode(); if(!node) return;
  const day=PROGRAM.find(x=>x.id===S.dayId);
  let ex=null;
  if(day){
    const card=document.getElementById("excard");
    const id=S.rest?S.rest.exId:(card?card.dataset.ex:null);
    ex=day.ex.find(x=>x.id===id)||null;
  }
  let r;
  /* Rule R1 renders its idle state rather than NaN:aN for every bad input
     there is, so a throw here can only cost the band. */
  try{ r=PHAT.restText(ex,S.rest?(Date.now()-S.rest.at)/1000:null); }
  catch(err){ r={text:"",state:0,stopped:false}; }
  if(node.nodeValue!==r.text) node.nodeValue=r.text;
  if(S.rest&&REST_SAY[r.state]&&!S.rest.said[r.state]){ S.rest.said[r.state]=1; announce(r.text); }
  reserveDock();
}
/* Rule R1 rule 2: starts on a REPS commit - a reps stepper tap, or focusout of
   a reps field holding a non-empty value. Never a weight field, never a
   keystroke: typing the `1` of `12` does not start it.
   Rule 3: a commit on the row that is already running it does not restart it.
   Rule 1: one timer for the whole app; a commit on another exercise restarts
   it with that exercise's thresholds. */
function restStart(exId,k){
  /* W13a. The gate is here, at the single entry point, rather than at each of
     the two call sites — so there is one place that decides and no route that
     can miss it. Both call sites are already COMMIT-only (a reps stepper tap,
     or focusout of a reps field): neither is reachable from `input`, so the
     setting changes whether a committed rep count starts a countdown and
     never changes what counts as a commit. Typing the 1 of 12 starts nothing
     in either mode. */
  if(!S.prefs.restAuto) return;
  const key=exId+"|"+k;
  if(S.rest&&S.rest.key===key) return;
  S.rest={key:key,exId:exId,at:Date.now(),said:{}};
  paintRest();
}
/* The band lives in #dock, so its height is reserved by the same measured
   padding-bottom that keeps an input clear of nav (B-36). It is created when a
   session opens and removed when it closes, and it survives every re-render
   because #dock is outside #view - which is also why the cached text node
   survives. */
function renderRest(){
  const box=document.getElementById("rest-box"); if(!box) return;
  /* THREE CONDITIONS, and the last two are fixes.
     S.draft        the band is a session thing.
     S.tab==="train"  FIXED HERE: the band used to render off the draft alone,
       so with a session open it printed `Rest timer starts when you log a
       set.` under the Trend, Weight, Diet and Plan tabs — session-specific
       copy on four screens that have no sets on them. Found during the B-66
       run.
     prefs.restAuto   on MANUAL nothing can start a countdown, so a permanent
       idle band would be dead chrome making a promise the setting has just
       switched off.
     S.rest IS NOT CLEARED WHEN THE BAND GOES AWAY unless the draft itself
     went. Rule R1 rule 4 keeps one absolute timestamp, so crossing to the
     Weight tab to log bodyweight and coming back reads the true elapsed —
     clearing it here would silently reset a running rest. */
  const want=!!S.draft && S.tab==="train" && !!S.prefs.restAuto;
  const have=!!document.getElementById("rest");
  if(want&&!have){ box.innerHTML=`<div id="rest"><p id="rest-txt"></p></div>`; restNode=null; }
  if(!want&&have){ box.innerHTML=""; restNode=null; }
  if(!S.draft) S.rest=null;
  restLoop(want);
  if(want) paintRest();
}

/* ============================================================ events */
document.querySelector("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]"); if(!b)return;
  /* Tapping Train is the second way out of Settings, and the one his thumb
     can already reach — the header's `‹ BACK` is a top corner and a top
     corner is the hardest place on the screen. Onboarding is NOT dismissed
     this way: it is a state of the app, not a page, and it ends by being
     answered. The export receipt is dropped on the way out; it is a receipt
     for a tap, not a fact about the log. */
  if(b.dataset.tab==="train"&&S.sub==="settings"){ S.sub=""; S.exp=null; }
  S.tab=b.dataset.tab; render();
});

document.getElementById("view").addEventListener("click",async e=>{
  /* W9. START SESSION and every day row take the SAME route, so the draft
     guarantee is stated once: startDay() never overwrites a readable draft —
     its own day resumes, any other day asks first, and an unreadable one
     fails closed. `#start-next` carries data-day, so it matches here. */
  const day=e.target.closest("[data-day]");
  if(day){ await startDay(day.dataset.day); return; }

  /* Explicit discard. Never one tap: it opens the same confirmation as the
     offer sheet, with the same count, taken from what is on screen right now. */
  if(e.target.id==="discard"){ askDiscard(filledSets(S.draft),"discard"); return; }
  if(e.target.id==="finish"){ await finish(); return; }
  if(e.target.id==="export"){ exportAll(); return; }

  /* ---- W9 / W13a. Navigation, the deload answer, onboarding and the rest
     mode. All delegated from #view like everything else — no per-node
     listeners to leak across a re-render. */
  if(e.target.closest("#settings-open")){ S.sub="settings"; S.exp=null; render(); return; }
  if(e.target.closest("#settings-back")){ S.sub=""; S.exp=null; render(); return; }
  if(e.target.closest("#rest-auto")){ await setRestAuto(true); return; }
  if(e.target.closest("#rest-manual")){ await setRestAuto(false); return; }
  if(e.target.closest("#ob-start")){ await finishOnboarding(); return; }
  if(e.target.closest("#dl-start")){ await answerDeload("start"); return; }
  if(e.target.closest("#dl-no")){ await answerDeload("no"); return; }
  if(e.target.closest("#dl-end")){ await answerDeload("end"); return; }

  const fb=e.target.closest("[data-fig]");
  if(fb){
    const box=document.querySelector(`[data-figbox="${fb.dataset.fig}"]`);
    const open=box.classList.toggle("on");
    if(open&&!box.innerHTML) box.innerHTML=figBody(fb.dataset.fig);
    /* aria-expanded drives the chevron rotation in CSS, so the glyph itself
       never changes and nothing here can reintroduce an out-of-subset one. */
    fb.setAttribute("aria-expanded",open?"true":"false");
    return;
  }

  /* W6: the one-tap route from the message to the row, and the way out of a
     row he does not want. Both live in the same delegated listener as
     everything else — no per-node handlers to leak across a re-render. */
  const go=e.target.closest("[data-goto]");
  if(go){ gotoProblem(go.dataset.goto); return; }
  const cl=e.target.closest("[data-clear]");
  if(cl){ clearSet(cl.dataset.clear); return; }

  /* ---- W7. One exercise per screen, so navigation is a control like any
     other and lives in the same delegated listener - no per-node handlers to
     leak across a re-render. */
  if(e.target.closest("#navprev")){ goEx(S.exIx-1); return; }
  if(e.target.closest("#navnext")){ goEx(S.exIx+1); return; }
  if(e.target.closest("#addset")){ addSet(); return; }
  const rm=e.target.closest("#rmset");
  if(rm){ askRemoveSet(+rm.dataset.k); return; }
  if(e.target.closest("#undoset")){ undoRemove(); return; }
  if(e.target.closest("#backsave")){ backToSave(); return; }
  if(e.target.closest("#v1-add")){ await v1Answer(true); return; }
  if(e.target.closest("#v1-no")){ await v1Answer(false); return; }

  const st=e.target.closest("[data-act]");
  if(st){
    const inp=st.parentElement.querySelector("input");
    const f=st.dataset.f;
    /* First tap on a malformed value normalises it and stops. A field that
       jumps 7.5.0 → 10 on one tap has silently changed a number, which is the
       whole class of bug this batch exists to kill (W4 §2.8). */
    const norm=normaliseNum(inp.value,f);
    let out;
    if(norm!==null){
      out=norm;
      if(out!=="") announce((f==="w"?"Weight":"Reps")+" now "+out+".");
    } else {
      /* THE SEEDING RULE (spec 4.4) buys back the whole ergonomic win of
         prefill for ONE tap, without prefill's cost. */
      const seed=seedValue(inp,f,st.dataset.act==="+"?1:-1);
      if(seed!==null){ out=seed; announce("Weight now "+out+"."); }
      else out=stepValue(inp.value,f,st.dataset.act==="+"?1:-1);
    }
    inp.value=out;
    commitField(inp,out);
    /* Rule R1 rule 2: a REPS stepper tap is a committed rep count and starts
       the rest. A weight tap never does, and no keystroke ever does. */
    if(f==="r"&&out!==""){
      const card=inp.closest(".card"), row=inp.closest(".setrow");
      if(card&&row) restStart(card.dataset.ex,+row.dataset.i);
    }
    flushDraft();          // a stepper tap is a committed number: write it now
    return;
  }
  const bw=e.target.closest("[data-bwact]");
  if(bw){
    const inp=document.getElementById("bwin");
    const base=parseFloat(inp.value)||0;
    inp.value=String(Math.max(0,r1(base+(bw.dataset.bwact==="+"?.1:-.1)))); return;
  }
  if(e.target.id==="logbw"){
    const v=parseFloat(document.getElementById("bwin").value);
    if(!(v>30&&v<300)){ toast("Enter a weight between 30 and 300 kg."); return; }
    /* B-03's guarantee, and the reason it holds at 23:59 and again at 00:01
       in any zone: the key is PHAT.localDate(), built from local date parts,
       never toISOString().slice(0,10). Every row carrying today's date is
       filtered out before the new one is appended, so a second entry on one
       calendar date UPDATES and can never create a second row. */
    const dt=PHAT.localDate();
    S.bw=[...S.bw.filter(x=>x.date!==dt),{date:dt,kg:r1(v)}];
    /* On a failed write the number stays on screen and S.err says it failed —
       it must never both fail and look fine. */
    const ok=await save(BWK,bwPayload());
    render(); if(ok) announceWeight("Weight logged."); return;
  }
  /* ---- W11: the calorie-change acknowledgement (spec §3.5). Two deliberate
     taps to SET, because a stamp silences calorie advice for seven days; one
     tap to CLEAR, because clearing restores it. Both delegated from #view
     like everything else. */
  if(e.target.id==="calset"){ askCalChanged(); return; }
  if(e.target.id==="calclear"){ await setCalStamp(false); return; }
});

/* The advice block changes without a navigation, so it is announced through
   the persistent region (#bs-live, outside #view) after every write on this
   tab — one sentence, not two, because a second announce() overwrites the
   first before a screen reader reaches it. The receipt goes to the toast
   {quiet}, since this has already said it. */
function announceWeight(receipt){
  let line="";
  try{
    const a=PHAT.calorieAdvice(S.bw,PHAT.localDate(),S.logMeta&&S.logMeta.calChangedAt);
    if(a&&a.text) line=" "+a.text;
  }catch(err){}
  announce(receipt+line);
  toast(receipt,true);
}
/* Variant B, the existing modal: scrim, 300 ms arm, safe action LOWEST and in
   the slot the trigger occupied. `Not yet` is the cheapest tap. */
function askCalChanged(){
  const until=PHAT.dateAdd(PHAT.localDate(),PHAT.CAL_COOLDOWN_DAYS);
  askSheet({headline:"Changed your calories today?",
    body:"This starts a 7-day hold. No new calorie advice until "+fmt(until)+".",
    danger:"Yes, changed today", safe:"Not yet", back:"calset",
    onDanger:()=>{ closeSheet(); setCalStamp(true); }});
}
/* setCalChanged / clearCalChanged return a NEW state object and never mutate;
   they return null on a non-object, and the caller MUST NOT write null over
   the store. S.logMeta carries every key of the log store this build does not
   own, so stamping through it cannot drop one. */
async function setCalStamp(on){
  const next=on?PHAT.setCalChanged(S.logMeta,PHAT.localDate()):PHAT.clearCalChanged(S.logMeta);
  if(!next) return;
  S.logMeta=next;
  const ok=await save(LOG,logPayload());
  render();
  if(ok) announceWeight(on?"Recorded.":"Hold cleared.");
}

document.getElementById("view").addEventListener("input",e=>{
  if(e.target.classList.contains("note")){
    const id=e.target.closest(".card").dataset.ex;
    S.draft.entries[id].note=e.target.value; scheduleDraftSave(); return;
  }
  /* inputType is what tells a keystroke from a paste. A keystroke that would
     make the value unreadable is rejected outright; a paste is kept exactly as
     pasted and blocks the save instead. Stripping a paste is what turns 7,5
     into 75 and 7.5.0 into 750 (W4 §2.1, WO-001 §W6). */
  if(e.target.dataset.f){ syncSet(e.target,e.inputType); scheduleDraftSave(); }
});
/* blur does not bubble; focusout does. Leaving a field commits it immediately,
   so the only thing a hard kill can cost is the keystroke still in the buffer.
   A commit is also the only moment advice may change: the verdict and Rule
   S1's pain flag are evaluated here and on a stepper tap, never per keystroke
   (UX spec §1.2 rule 5). */
document.getElementById("view").addEventListener("focusout",e=>{
  const t=e.target;
  const isNote=!!(t.classList&&t.classList.contains("note"));
  if(!isNote&&!(t.dataset&&t.dataset.f)) return;
  flushDraft();
  if(S.draft) paintAdvice(true);
  /* Rule R1 rule 2: a REPS field leaving focus with a non-empty value is a
     committed rep count and starts the rest. A weight field never does, and a
     keystroke never does. */
  if(!isNote&&t.dataset.f==="r"&&String(t.value||"").trim()!==""){
    const card=t.closest(".card"), row=t.closest(".setrow");
    if(card&&row) restStart(card.dataset.ex,+row.dataset.i);
  }
});

/* THE `change` LISTENER ON #view IS GONE with the full-volume checkbox — it
   was its only subscriber. It wrote the whole log store on a tick of a control
   no engine read (C-1, B-23). Nothing in the app now writes phat:v1:log from
   a settings-shaped action; preferences go to phat:v1:prefs and nowhere else.
   Do not re-add a blanket `change` handler: `input`, `focusout` and `click`
   are the three commit seams this app has, and a fourth is a fourth way for a
   number to move without a commit. */

/* Two more delegated roots, same pattern as #view and nav: one listener on a
   container that outlives every node inside it. No per-node listeners. */
/* The undo control lives outside #view, so it outlives every re-render - the
   same pattern as #dr-offer and #modal, and the reason neither leaks. */
document.getElementById("toast-act").addEventListener("click",()=>undoRemove());
document.getElementById("dr-offer").addEventListener("click",e=>{
  if(e.target.closest("#dr-resume")){ resumeDraft(false); return; }
  if(e.target.closest("#dr-discard")){
    const o=offerInfo(); if(o) askDiscard(o.n,"dr-discard");
  }
});
document.getElementById("modal").addEventListener("click",e=>{
  const b=e.target.closest("[data-sheet]"); if(!b||!sheetState) return;
  const a=b.dataset.sheet;
  if(a==="cancel"||a==="safe"){
    const safe=sheetState.onSafe;
    closeSheet(); if(a==="safe"&&safe) safe();
    return;
  }
  /* The 300 ms guard, enforced twice: CSS stops a real finger from hitting the
     button at all, and this stops anything that reaches the handler by another
     route. It does not disable the button and does not change its appearance. */
  if(a==="danger"){
    if(Date.now()<sheetState.armAt) return;
    if(sheetState.onDanger) sheetState.onDanger();
  }
});
/* Escape cancels; Tab is trapped inside the dialog. */
document.addEventListener("keydown",e=>{
  if(!sheetState) return;
  if(e.key==="Escape"){ e.preventDefault(); closeSheet(); return; }
  if(e.key!=="Tab") return;
  const m=document.getElementById("modal");
  const f=Array.prototype.slice.call(m.querySelectorAll("button"));
  if(!f.length) return;
  const first=f[0], last=f[f.length-1], cur=document.activeElement;
  if(e.shiftKey&&(cur===first||!m.contains(cur))){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&(cur===last||!m.contains(cur))){ e.preventDefault(); first.focus(); }
});

/* ============================================================ input (W6)
   syncSet used to do inp.value.replace(/[^\d.]/g,""), which is exactly the
   silent-rewrite bug: it turned a pasted "7,5" into "75" — a 10x error, with
   no way for him to know. Nothing strips a value any more. A keystroke that
   would make the field unreadable is refused before it lands; anything else,
   paste included, is stored verbatim and answered at Save time. */
function commitField(inp,val){
  const card=inp.closest(".card"), row=inp.closest(".setrow");
  if(!card||!row) return;
  const id=card.dataset.ex, i=+row.dataset.i, f=inp.dataset.f;
  const st=S.draft&&S.draft.entries[id]&&S.draft.entries[id].sets[i];
  if(!st) return;
  st[f]=val;
  paintAdvice(true);
  reviewRow(id,i);
}
function syncSet(inp,inputType){
  const card=inp.closest(".card"), row=inp.closest(".setrow");
  if(!card||!row) return;
  const id=card.dataset.ex, i=+row.dataset.i, f=inp.dataset.f;
  const st=S.draft&&S.draft.entries[id]&&S.draft.entries[id].sets[i];
  if(!st) return;
  const t=String(inputType||"");
  /* Kept verbatim: a paste, a drop, an autocomplete replacement, and any
     deletion. A deletion has to pass through untouched or he cannot backspace
     his way out of a value the sanitiser would refuse to re-accept. */
  const verbatim = t==="insertFromPaste"||t==="insertFromDrop"||
                   t==="insertReplacementText"||t.indexOf("delete")===0;
  let val=inp.value;
  if(!verbatim){
    const kept=PHAT.sanitizeNumericInput(st[f],val,f);
    if(kept!==val){
      /* Rejected. Put the field back and leave the caret where he left it —
         at the point the refused character would have gone. */
      const pos=inp.selectionStart, delta=val.length-kept.length;
      inp.value=kept;
      if(typeof pos==="number"){
        const at=Math.max(0,Math.min(kept.length,pos-delta));
        try{ inp.setSelectionRange(at,at); }catch(err){}
      }
      val=kept;
    }
  }
  st[f]=val;
  reviewRow(id,i);
}

/* Stepper arithmetic, W4 §2.6 Route B. `−` at the floor EMPTIES the field
   rather than resting on a value that blocks the save: stepping down to zero
   is how he undoes an entry, and after W2 a resting 0 in the reps field is a
   refusal. Weight 2.5 → 0 → "" keeps the 0 kg rack chin reachable (B-21) and
   makes it reversible. `+` from empty is 2.5 kg / 1 rep, as today. */
function stepValue(cur,f,dir){
  const s=String(cur==null?"":cur).trim();
  const step=f==="w"?2.5:1, floor=f==="w"?0:1;
  if(s==="") return dir<0?"":String(step);
  const n=Number(s);
  if(!isFinite(n)) return s;                 // unreachable: normaliseNum ran first
  if(dir>0) return String(r1(n+step));
  if(n<=floor) return "";                    // at or under the floor: empty it
  return String(Math.max(floor,r1(n-step)));
}
/* → the visibly normalised value for a field the parsers cannot read, or null
   when there is nothing to normalise. Prefix truncation only, so the result is
   never larger than what he typed: "7.5.0" → "7.5", "5.5" reps → "5". */
function normaliseNum(v,f){
  const s=String(v==null?"":v).trim();
  if(s==="") return null;
  const p=f==="w"?PHAT.parseWeight(s):PHAT.parseReps(s);
  if(p.ok||p.reason!=="malformed") return null;   // in range or out of it, but readable
  const m=(f==="w")?s.match(/^\d*(?:\.\d*)?/):s.match(/^\d*/);
  let out=m?m[0]:"";
  if(out===".") out="";
  return out;
}
/* {assertive} — a write that stopped landing interrupts; a running count waits
   its turn. The attribute is set BEFORE the text so the politeness in force is
   the one the mutation is announced under. */
function announce(msg,assertive){
  const el=document.getElementById("bs-live");
  if(!el) return;
  el.setAttribute("aria-live",assertive?"assertive":"polite");
  el.textContent=msg;
}

/* ============================================================ blocked save (W4 §2)
   Everything below paints from S.problems — the list validateDraft() handed
   back — and NEVER calls render(). Fixing or clearing a row while a keyboard
   is open must not rebuild the view under his thumb (B-19). The only nodes
   touched are the marks on a set row and the contents of #bs-slot.

   The copy reads p.value and p.status straight off the problem list rather
   than looking the value back up in S.draft. That is what makes "7.5.0"
   nameable: by the time the message renders, the draft may already have been
   edited, and a token that disagrees with the row is worse than no token. */
function tokenFor(p){
  if(!p) return "";
  if(p.reason==="empty") return p.field==="r"?"no reps":"no weight";
  if(p.reason==="range"){
    if(p.field==="w") return "over 500";
    return (+p.value>100)?"over 100":"0 reps";
  }
  const v=String(p.value==null?"":p.value);
  return v.length>12?v.slice(0,12)+"…":v;     // {raw}, truncated per W4 §0.3
}
/* One row per offending SET, in the order he will walk them — top to bottom
   through the session, not grouped by error type. A set can be wrong in both
   fields; the row carries one token, the worst thing wrong with it, because
   `malformed` beats `incomplete`: {w:"7.5.0", r:""} reads 7.5.0, not "no
   reps". Telling him to add reps to a broken number sends him the wrong way. */
function badRows(){
  const d=PROGRAM.find(x=>x.id===S.dayId);
  const order={}; if(d) d.ex.forEach((e,ix)=>{ order[e.id]=ix; });
  const map={}, out=[];
  S.problems.forEach(p=>{
    if(!p.exId||p.field==null||p.setIndex==null||p.setIndex<0) return;
    const k=p.exId+"|"+p.setIndex;
    if(!map[k]){
      const e=d&&d.ex.find(x=>x.id===p.exId);
      map[k]={exId:p.exId,i:p.setIndex,name:e?e.n:p.exId,ps:[],
              ord:order[p.exId]==null?999:order[p.exId]};
      out.push(map[k]);
    }
    map[k].ps.push(p);
  });
  out.sort((a,b)=>a.ord-b.ord||a.i-b.i);
  out.forEach(r=>{
    r.primary=r.ps.find(p=>p.reason!=="empty")||r.ps[0];
    r.token=tokenFor(r.primary);
  });
  return out;
}
/* A tappable list, not prose: he does not read a sentence, he sees `7.5.0` and
   knows it was the paste, or `no reps` and knows it was the set he abandoned.
   The token is also the non-colour carrier of the error. */
function bsMsgHtml(rows){
  if(!rows.length) return "";
  const p=rows.length;
  const head=p===1?"Not saved. 1 set needs a fix.":"Not saved. "+p+" sets need a fix.";
  let h=`<div id="bs-msg" role="group" aria-labelledby="bs-head">
    <h2 id="bs-head" tabindex="-1"><span aria-hidden="true">! </span>${esc(head)}</h2>
    <p class="bsre">Everything you typed is still here.</p>
    <div class="bslist">`;
  rows.slice(0,5).forEach(r=>{
    const label=r.name+", set "+(r.i+1)+", "+r.token+". Go to set.";
    h+=`<button class="bsrow" data-goto="${esc(r.exId+"|"+r.i)}" aria-label="${esc(label)}">
      <span class="bsex">${esc(r.name)} · set ${r.i+1}</span>
      <span class="bstok">${esc(r.token)}</span>
      <span class="bschev" aria-hidden="true">&rsaquo;</span></button>`;
  });
  /* Five 48px rows, a headline and Save already fill the thumb zone at
     400×800. A sixth would push Save off screen — the worst possible outcome
     of an error message. The rest are still marked in the cards. */
  h+=`</div>${rows.length>5?`<p class="bsmore">and ${rows.length-5} more.</p>`:""}</div>`;
  return h;
}
function findRow(exId,i){
  const cards=document.querySelectorAll("#view .card");
  for(let c=0;c<cards.length;c++){
    if(cards[c].dataset.ex!==exId) continue;
    const rows=cards[c].querySelectorAll(".setrow");
    for(let k=0;k<rows.length;k++) if(+rows[k].dataset.i===i) return rows[k];
  }
  return null;
}
function paintProblems(){
  const slot=document.getElementById("bs-slot");
  const view=document.getElementById("view");
  if(!view) return;
  /* Strip every mark first, then re-apply. Cheaper to reason about than
     diffing, and it never touches an input's value or the focused node. */
  view.querySelectorAll(".setrow.bad").forEach(row=>{
    row.classList.remove("bad");
    const g=row.querySelector(".gtxt");
    if(g) g.textContent=g.dataset.ghost||"";   // last session's numbers come back
    row.querySelectorAll(".stepper").forEach(s=>s.classList.remove("binv"));
    row.querySelectorAll("input[data-f]").forEach(inp=>{
      inp.removeAttribute("aria-invalid"); inp.removeAttribute("aria-describedby");
    });
  });
  view.querySelectorAll(".badtok,.clearstrip").forEach(b=>b.remove());

  const rows=badRows();
  rows.forEach(r=>{
    const row=findRow(r.exId,r.i);
    if(!row) return;                       // card not on screen: message still names it
    row.classList.add("bad");
    const tid="bs-t-"+r.exId+"-"+r.i;
    /* The ghost is displaced for exactly as long as the row is broken: when a
       row is wrong, "what is wrong right now" beats "what you did last time".
       Real text in a span, never CSS content — a pseudo-element is uncopyable
       and unreliable to assistive tech. */
    const g=row.querySelector(".gtxt");
    if(g) g.textContent="";
    const tl=document.createElement("p");
    tl.className="badtok";
    tl.innerHTML=`<span aria-hidden="true">!</span> <span id="${esc(tid)}">${esc(r.token)}</span>`;
    row.parentNode.insertBefore(tl,row.nextSibling);
    /* Border the fields that are actually wrong, so he can see WHICH of the
       two without reading the token. */
    r.ps.forEach(p=>{
      const inp=row.querySelector('input[data-f="'+(p.field==="r"?"r":"w")+'"]');
      if(!inp) return;
      inp.setAttribute("aria-invalid","true");
      inp.setAttribute("aria-describedby",tid);
      if(inp.parentElement) inp.parentElement.classList.add("binv");
    });
    const strip=document.createElement("button");
    strip.className="ghostbtn clearstrip";
    strip.dataset.clear=r.exId+"|"+r.i;
    strip.setAttribute("aria-label","Clear "+r.name+" set "+(r.i+1)+".");
    strip.textContent="Clear this set";
    row.parentNode.insertBefore(strip,tl.nextSibling);   // row, token, clear
  });

  /* The fix bar rides the exercise screen for as long as the refusal stands.
     Only its TEXT changes; the bar itself is fixed height and never
     disappears while a refusal is outstanding (spec 2.3 rule 3). Written
     here, never through render(), so fixing a row with the keyboard up does
     not rebuild the view under his thumb. */
  const fx=document.getElementById("fixtxt");
  if(fx){ const t=fixText(); if(fx.textContent!==t) fx.textContent=t; }

  if(slot){
    /* The fallback is for a problem no row can own — a draft whose shape is
       wrong. There is nothing to point at, so it says only what is true. */
    slot.innerHTML = rows.length ? bsMsgHtml(rows)
      : (S.problems.length ? `<div id="bs-msg" role="group" aria-labelledby="bs-head">
          <h2 id="bs-head" tabindex="-1"><span aria-hidden="true">! </span>Not saved. Everything you typed is still here.</h2>
          </div>` : "");
  }
}
/* One tap from the message to the row: put the row about a third down the
   viewport — clear of the software keyboard, still inside thumb reach — then
   focus the offending field and select it, so one keystroke replaces 7.5.0
   whole. Marks stay put; they clear when the row is valid, not when it is
   visited. */
function gotoProblem(key){
  const r=badRows().find(x=>x.exId+"|"+x.i===key);
  if(!r) return;
  /* Spec 2.3 rule 1, and it is the problem one-exercise-per-screen creates:
     the offending row may be four screens away, and a refusal pointing at
     something unreachable is the worst state in the spec. So a problem row
     NAVIGATES first - it switches the session to that exercise's screen -
     and only then scrolls, focuses and selects. render(true), never
     scrollTo(0,0). */
  const C=sessionCtx();
  const ix=C.list.findIndex(x=>x.id===r.exId);
  if(ix>=0&&ix!==S.exIx){ S.exIx=ix; render(true); }
  const row=findRow(r.exId,r.i);
  if(!row) return;
  const f=(r.primary&&r.primary.field==="r")?"r":"w";
  const inp=row.querySelector('input[data-f="'+f+'"]');
  const y=window.pageYOffset+row.getBoundingClientRect().top-window.innerHeight/3;
  try{ window.scrollTo({top:Math.max(0,y),behavior:"smooth"}); }
  catch(e){ window.scrollTo(0,Math.max(0,y)); }
  if(!inp) return;
  try{ inp.focus({preventScroll:true}); }catch(e){ inp.focus(); }
  try{ inp.select(); }catch(e){}
}
/* Clearing empties both fields, so the set becomes blank and is skipped on
   save. No confirmation: it is one abandoned set and retyping undoes it. */
function clearSet(key){
  const parts=String(key).split("|"), exId=parts[0], i=+parts[1];
  const st=S.draft&&S.draft.entries[exId]&&S.draft.entries[exId].sets[i];
  if(!st) return;
  st.w=""; st.r="";
  const row=findRow(exId,i);
  if(row){
    row.querySelectorAll("input[data-f]").forEach(inp=>{ inp.value=""; });
    paintAdvice(true);
  }
  const before=problemSig();
  const a=document.activeElement;
  const hadFocus=!!(a&&a.dataset&&a.dataset.clear===key);   // the strip is about to be removed
  S.problems=S.problems.filter(p=>!(p.exId===exId&&p.setIndex===i));
  flushDraft();
  if(problemSig()===before) return;
  paintProblems(); announceLeft();
  /* Focus cannot be left on a node that no longer exists, or the next Tab
     restarts at the top of the page. Land on whatever replaced it. */
  if(hadFocus){
    const nx=document.getElementById("bs-head")||document.getElementById("finish");
    if(nx){ try{ nx.focus({preventScroll:true}); }catch(e){ nx.focus(); } }
  }
}
/* ============================================================ W7 actions */
/* A navigation, so render() without keepScroll: the top of the new exercise's
   screen is where he wants to be. Every typed value is already in S.draft -
   the input handler writes each keystroke - so nothing uncommitted is lost. */
function goEx(ix){
  const C=sessionCtx();
  if(ix<0||ix>=C.list.length||ix===S.exIx) return;
  S.exIx=ix; flushDraft(); hideToast(); render();
}
/* Rule X1: a row beyond ex.s is marked EXTRA, counts in volume, and does NOT
   change the target line. */
function addSet(){
  const C=sessionCtx(), e=C.list[S.exIx]; if(!e) return;
  const st=S.draft&&S.draft.entries[e.id]; if(!st) return;
  st.sets.push({w:"",r:""});
  flushDraft(); render(true);
  announce("Set "+st.sets.length+" added.");
}
/* C-12, ruled. The prototype pops the last row unconditionally, including one
   holding a completed 120 x 5, with no confirmation and no undo - the same
   failure class as B-02 and B-21. Here:
     - the control NAMES ITS TARGET, so he sees what he is about to lose;
     - it prefers the last BLANK row, so the common case (a row added by
       mistake) never touches a number;
     - a blank row goes immediately, with an undo;
     - a row holding ANY typed value in either field gets a confirmation that
       NAMES THE NUMBERS, safe button lowest and in the trigger's slot, a
       300 ms arm, Escape and scrim cancel - WO-001 State 1F's guards;
     - undo restores the row byte-identically, both raw strings;
     - and the control is not rendered at all when one row remains: an
       exercise is skipped by leaving it blank, not by removing its last row. */
function askRemoveSet(k){
  const C=sessionCtx(), e=C.list[S.exIx]; if(!e) return;
  const st=S.draft&&S.draft.entries[e.id]; if(!st||st.sets.length<=1) return;
  if(!(k>=0&&k<st.sets.length)) k=removeTarget(st.sets);
  const s=st.sets[k];
  if(blankSet(s)){ doRemoveSet(e.id,k); return; }
  const w=String(s.w==null?"":s.w).trim()||"—";
  const r=String(s.r==null?"":s.r).trim()||"—";
  askSheet({headline:"Remove set "+(k+1)+"?", body:"It holds "+w+" × "+r+".",
    danger:"Remove set "+(k+1), safe:"Keep it", back:"rmset",
    onDanger:()=>{ closeSheet(); doRemoveSet(e.id,k); }});
}
function doRemoveSet(exId,k){
  const st=S.draft&&S.draft.entries[exId];
  if(!st||st.sets.length<=1) return;
  const gone=st.sets.splice(k,1)[0]||{w:"",r:""};
  S.undo={exId:exId,i:k,w:String(gone.w==null?"":gone.w),r:String(gone.r==null?"":gone.r)};
  /* Marks on the rows BELOW the removed one shift up with them, or a standing
     refusal would point at the wrong physical row. */
  S.problems=S.problems.filter(pr=>!(pr.exId===exId&&pr.setIndex===k))
    .map(pr=>(pr.exId===exId&&pr.setIndex>k)?Object.assign({},pr,{setIndex:pr.setIndex-1}):pr);
  flushDraft(); render(true);
  toastUndo("Set "+(k+1)+" removed.");
}
function undoRemove(){
  const u=S.undo; if(!u) return;
  const st=S.draft&&S.draft.entries[u.exId]; if(!st) return;
  st.sets.splice(u.i,0,{w:u.w,r:u.r});
  S.undo=null; hideToast();
  flushDraft(); render(true);
  toast("Set "+(u.i+1)+" restored.");
}
/* Spec 2.3 rule 4: BACK TO SAVE returns to the screen Save lives on, scrolled
   to the refusal block, with NO scroll to top. */
function backToSave(){
  const C=sessionCtx();
  if(!C.list.length) return;
  S.exIx=C.list.length-1; render(true); focusBlocked();
}
/* Rule V1's answer. Add it adds ONE accessory and stamps the day; Not yet
   stamps the 7-day cooldown and nothing else. IGNORING IT STAMPS NOTHING and
   it is re-offered next session (spec 4.11, train 0.1 #11). Both replace the
   block in place: the app does not scroll and does not navigate, which is
   what render(true) buys. */
async function v1Answer(add){
  const C=sessionCtx(), t=C.tier;
  if(!t||!t.offer) return;
  const name=t.offer.name, exId=t.offer.exId;
  const next=add?PHAT.acceptReintro(S.logMeta,S.dayId,C.today,t.dayCuts)
                :PHAT.declineReintro(S.logMeta,S.dayId,C.today);
  if(next){ S.logMeta=next; await save(LOG,logPayload()); }
  if(add){
    S.v1msg=name+" is back in. That is the only addition for 7 days.";
    S.v1added=exId;
    const ex=C.day&&C.day.ex.find(x=>x.id===exId);
    if(ex&&!S.draft.entries[exId]){
      S.draft.entries[exId]={sets:Array.from({length:ex.s},()=>({w:"",r:""})),note:""};
      flushDraft();
    }
  }else S.v1msg="Left out. Asked again next week.";
  render(true);
}
/* THE SEEDING RULE (spec 4.4). Rows start empty: a prefilled number he does
   not change is indistinguishable from one he chose, nine engines read that
   history confidently, and B-05 means he cannot correct it. Prefill also turns
   every SKIPPED exercise into a blocked save, because the prototype prefills
   the weight and leaves the reps empty - WO-001's incomplete classification
   exactly, with a no-reps token on a screen he never visited.

   So: the FIRST + on an EMPTY WEIGHT field adopts last session's weight for
   THAT SET INDEX, and the second + steps from it. The number is on screen
   because HE TAPPED FOR IT, so provenance is intact, and it reuses WO-001
   2.8's precedent - one tap, one state change. Reps are never seeded. Minus
   from empty stays empty, or minus would increase a value. And across a
   prescription change prescriptionEpoch reports seed:false, so there is
   nothing to adopt: the same fact as prefill:false, twice, because the view
   has two ways to put a number in the box and both are forbidden. */
function seedValue(inp,f,dir){
  if(f!=="w"||dir<0) return null;
  if(String(inp.value==null?"":inp.value).trim()!=="") return null;
  const card=inp.closest(".card"), row=inp.closest(".setrow");
  if(!card||!row) return null;
  const day=PROGRAM.find(d=>d.id===S.dayId); if(!day) return null;
  const e=day.ex.find(x=>x.id===card.dataset.ex); if(!e) return null;
  const prev=PHAT.lastFor(S.sessions,e.id);
  let ep=null;
  try{ ep=PHAT.prescriptionEpoch({ex:e,prev:prev,plan:PHAT.PHAT_PLAN,exId:e.id}); }
  catch(err){ return null; }
  if(!ep||ep.seed!==true) return null;
  const pv=prev&&prev.sets&&prev.sets[+row.dataset.i];
  if(!pv) return null;
  const pw=PHAT.parseWeight(pv.w);
  if(!pw.ok||!(pw.value>0)) return null;
  return String(r1(pw.value));
}
const problemSig=()=>S.problems.map(p=>[p.exId,p.setIndex,p.field,p.reason,p.value].join(":")).join(",");
/* Re-read one marked row after he changes it. Only rows that are already
   marked are re-read: marks appear on a blocked save and never mid-typing. */
function reviewRow(exId,i){
  if(!S.problems.length) return;
  if(!S.problems.some(p=>p.exId===exId&&p.setIndex===i)) return;
  const st=S.draft&&S.draft.entries[exId]&&S.draft.entries[exId].sets[i];
  if(!st) return;
  const before=problemSig();
  const d=PHAT.describeSet(st);
  const kept=S.problems.filter(p=>!(p.exId===exId&&p.setIndex===i));
  const add=(d.status==="blank"||d.status==="complete")?[]
    : d.problems.map(p=>({exId:exId,setIndex:i,field:p.field,reason:p.reason,
                          value:p.value,status:d.status}));
  S.problems=kept.concat(add);
  if(problemSig()===before) return;
  paintProblems(); announceLeft();
}
function announceLeft(){
  const n=badRows().length;
  announce(n?(n===1?"1 set left to fix.":n+" sets left to fix.")
            :"Nothing left to fix. Tap Save session.");
}
/* Move focus to the headline rather than firing an assertive live region: it
   announces the message once, and the next Tab lands on the first problem row,
   which is what makes the one-tap route work for keyboard and switch users.
   Focusing a heading does not raise the software keyboard. */
function focusBlocked(){
  const h=document.getElementById("bs-head");
  if(!h) return;
  try{ h.scrollIntoView({block:"center"}); }catch(e){ h.scrollIntoView(); }
  try{ h.focus({preventScroll:true}); }catch(e){ h.focus(); }
}

/* ============================================================ draft store */
/* B-39. A failed autosave has nowhere to paint: this path must never call
   render() (B-19), so S.err sat there unread until he tapped Save, and
   everything typed after the disk filled was one phone-death from gone.
   #bs-live and #toast both live OUTSIDE #view, so both carry the message
   without touching a single node inside the view — no re-render, no lost
   caret. This is NOT the autosave indicator W4 ruled out: nothing is said
   while writes land, only when they stop and when they resume.
   Keyed on the draft OBJECT so a failure state belongs to one session — a new
   or resumed draft announces again instead of inheriting an old silence. */
const DRAFT_STOPPED="Your session is not being saved. Tap Save to keep it.";
const DRAFT_RESUMED="Saving again.";
let draftFailFor=null;
function noteDraftWrite(ok,draft){
  if(!draft) return ok;
  if(!ok&&draftFailFor!==draft){
    draftFailFor=draft;
    announce(DRAFT_STOPPED,true); toast(DRAFT_STOPPED,true,4200);
  }else if(ok&&draftFailFor===draft){
    draftFailFor=null;         // released, so a discarded draft is not held
    announce(DRAFT_RESUMED); toast(DRAFT_RESUMED,true);
  }
  return ok;
}
/* phat:v1:draft, through save()/load() only — never localStorage directly and
   never both stores. Sets are kept as the RAW TYPED STRINGS, so a malformed
   "7.5.0" survives a reload and can be corrected instead of lost. */
async function saveDraft(draft,dayId){
  try{
    if(!draft) return false;
    const entries={};
    Object.keys(draft.entries||{}).forEach(k=>{
      const e=draft.entries[k]||{};
      entries[k]={
        sets:(e.sets||[]).map(s=>({w:s&&s.w!=null?String(s.w):"",r:s&&s.r!=null?String(s.r):""})),
        note:e.note==null?"":String(e.note)
      };
    });
    /* exIx rides the draft. Coming back on exercise 1 of 9 after a reload has
       lost his place, and finding it again means nine taps with chalky hands
       (W7 data criterion 1). */
    return noteDraftWrite(await save(DRAFT,{schemaVersion:PHAT.SCHEMA_VERSION,
      dayId:dayId!=null?dayId:S.dayId, date:draft.date, entries,
      exIx:(typeof S.exIx==="number"&&S.exIx>=0)?S.exIx:0, savedAt:Date.now()}),draft);
  }catch(e){
    S.err="Could not save your draft. Your entries are still on screen.";
    return noteDraftWrite(false,draft);   // never throws into the caller; the next write retries
  }
}
/* loadDraft() → {status:"none"|"ok"|"error", draft, reason}
   NOT a bare object-or-null. "The read failed" must be distinguishable from
   "there is no draft", otherwise a failed read shows no restore offer and the
   next startDay() overwrites a draft that was really there (W4 §1.1 State 1I).

   A thin wrapper on purpose (W6): every decision that can be made from the
   stored TEXT is made by PHAT.classifyDraftPayload, so the path that ships is
   byte-for-byte the path tests.html exercises. The only outcome left here is
   reason:"read" — the storage call itself threw — because that is the one
   thing a pure function cannot see.
   Deliberate delta from the old wrapper: a whitespace-only stored value now
   reads as "none" rather than "error"/"parse". Whitespace holds no data, and
   an "error" there would block startDay() for a draft that does not exist. */
async function loadDraft(){
  const r=await readRaw(DRAFT);
  if(r.status==="error"&&r.reason==="read") return {status:"error",draft:null,reason:"read"};
  return PHAT.classifyDraftPayload(r.raw);
}
/* Called on a successful finish() and on explicit Discard. On nothing else —
   a failed save must leave the draft on disk. */
async function clearDraft(){ return await del(DRAFT); }

/* ============================================================ autosave (W5)
   THE RULE: nothing on this path may call render(). The app re-renders a whole
   view with innerHTML, so a render between two keystrokes destroys the caret
   and the focused node (B-19). Autosave writes to storage and touches no DOM.

   Debounced 400 ms on input; immediate on stepper tap, blur, tab-hide and
   pagehide. Worst case on a hard kill is one in-flight keystroke, never a set. */
let draftTimer=null;
function cancelDraftSave(){ if(draftTimer){clearTimeout(draftTimer); draftTimer=null;} }
function flushDraft(){
  cancelDraftSave();
  if(!S.draft) return;
  saveDraft(S.draft,S.dayId);   // async, deliberately not awaited: no UI waits on it
}
function scheduleDraftSave(){
  if(!S.draft) return;
  cancelDraftSave();
  draftTimer=setTimeout(()=>{draftTimer=null; if(S.draft) saveDraft(S.draft,S.dayId);},400);
}
/* Hiding the tab is the last reliable moment before the OS may kill the page.
   pagehide is the belt to that braces; the bridge may not flush either, which
   is exactly why blur and stepper taps write immediately. */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){ flushDraft(); return; }
  /* Back from three minutes in a pocket: elapsed is recomputed from the wall
     clock, never from a tick count (Rule R1 rule 4, B-61). */
  paintRest();
});
window.addEventListener("pagehide",()=>flushDraft());
