            NOT a sixth tab - Settings and onboarding are Train, which is what
            keeps the dock's five tabs and nav's aria-current honest.
   stores   what the BOOT READ found for each store: "absent" | "ok" |
            "error". Onboarding gates on "absent", never on "the array is
            empty" - WO-001's readRaw distinction, and the whole reason a
            failed read and a first run must not look the same.
   prefs    the settings store. restAuto is Rule R1's auto-start; onboarded is
            the one key spec 10.1 permits onboarding to write.
   exp      the last export's outcome, so success and failure are both VISIBLE
            states on Settings and failure cannot look like success (B-16).
   sum      W8. True while the Summary screen is showing. IN MEMORY ONLY, and
            deliberately NOT written into the draft payload: reaching the
            summary must leave phat:v1:draft BYTE-IDENTICAL (W8 criterion 1),
            and every draft write stamps a fresh savedAt, so a write of
            "identical" content is not a byte-identical file. The cost is
            that a reload from the summary lands on the last exercise
            instead, one tap away, with every number intact. */
/* W12 adds:
   dietView the Diet tab's segment: null (show the day the plan derives) |
            "training" | "rest". IN MEMORY ONLY and deliberately not stored -
            a stored view would survive into tomorrow and answer "what am I
            eating today" with yesterday's tap. Every boot re-derives.
   prefs.proteinDate  the habit tick, stored as the local DATE it was ticked
            on, so it expires with the day. NO ENGINE READS IT (addendum 8.6,
            ruled) and it lives in phat:v1:prefs, never in the log. */
/* WO-006 W1 adds:
   plans    the phat:v1:plans store as read at boot: {plans:[...], activePlanId}
            plus plansMeta for every key this build does not own. The shipped
            PHAT plan is CODE and is never in `plans`; activePlanId "phat"
            names it.
   plan     the ACTIVE plan document. PHAT_PLAN when activePlanId is "phat",
            otherwise the stored document - and PHAT_PLAN again, with the row
            badged `Cannot open`, when the stored one fails validatePlan.
   sessPlan the plan THE OPEN SESSION runs on. Set by startDay (the active
            plan) and by resumeDraft (the plan the draft's own planId names -
            D9), read by everything session-shaped through sp(). Switching
            the active plan is refused while a session is open (D10), so the
            two agree in practice; the seam exists so a restore that brings
            down a different store cannot re-point a half-logged session.
   edits    the working copies, by planId: {plan, savedAt}. A planId not in
            the store is a plan built from empty and not yet saved.
   planView "" (the list) | "edit" (one plan's screen). pe is the editor's
            IN-MEMORY state: which days are open, the add form, the undo. */
const S={tab:"train",sub:"",sessions:[],includeCut:false,bw:[],draft:null,dayId:null,err:null,
         plans:{plans:[],activePlanId:PHAT.PHAT_PLAN_ID},plansMeta:{},plan:PHAT.PHAT_PLAN,sessPlan:null,
         planBroken:false,edits:{},planView:"",pe:null,plErr:null,
         problems:[],logMeta:{},bwMeta:{},blockWrites:{},draftRead:{status:"none"},offer:null,
         exIx:0,rest:null,undo:null,v1msg:"",v1added:null,sum:false,dietView:null,
         stores:{log:"absent",bw:"absent",plans:"absent"},prefs:{restAuto:true,onboarded:false,proteinDate:"",backup:null},
         prefsMeta:{},exp:null,
         /* E-3. The backup client's state, IN MEMORY. `mod` is whether sync.js
            loaded: "off" (never attempted - file://, or offline at boot),
            "loading", "ready", "failed". `user` is the signed-in account or
            null. `busy` mirrors the module. `last` is this session's most
            recent outcome so failure is a VISIBLE state that cannot look like
            success (B-16); the last SUCCESSFUL backup persists in
            prefs.backup so "Backed up 3 days ago" survives a relaunch.
            `pulled` holds a restore between the read and the confirmation. */
         sync:{mod:"off",user:null,busy:null,last:null,pulled:null}};
const logPayload=()=>Object.assign({},S.logMeta,
  {schemaVersion:PHAT.SCHEMA_VERSION,sessions:S.sessions,includeCut:S.includeCut});
const bwPayload=()=>Object.assign({},S.bwMeta,

const plansPayload=()=>Object.assign({},S.plansMeta,
  {schemaVersion:PHAT.SCHEMA_VERSION,plans:S.plans.plans,activePlanId:S.plans.activePlanId});
const editsPayload=()=>({schemaVersion:PHAT.SCHEMA_VERSION,edits:S.edits});

   the same contract logMeta/bwMeta hold: a write never drops a key it did not

const prefsPayload=()=>Object.assign({},S.prefsMeta,
  {schemaVersion:PHAT.SCHEMA_VERSION,restAuto:!!S.prefs.restAuto,onboarded:!!S.prefs.onboarded,
   proteinDate:String(S.prefs.proteinDate||"")},
  /* E-3. The last successful backup: {at, sig, user, n, m, x}. Device state,
     so it lives here and not in the log; absent until the first push lands. */

/* ============================================================ utils */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ---- ONE MONTH-NAME SOURCE (B-44, and the rest of B-35) -------------------
   There is exactly one table of month names in this product and it is
   PHAT.dayMon's, in logic.js. Intl is not used here at all — not with a
   pinned locale, not with formatToParts. en-GB short September is "Sept" on
   current ICU, the coach-signed copy says "Sep", and a string a test pins and
   a coach approved may not change when a browser ships new locale data.
   Everything with a date in it goes through fmt() or fmtDay(), both below,
   both built on PHAT.dayMon. If you find yourself typing "Intl" in this file,
   that is the bug.

   WEEKDAYS are the same problem one table down, so they get the same
   treatment: a fixed array, indexed by a Date built at local noon.
   B-14: the year is appended once the date is not in the current calendar
   year, so "7 Sep" cannot mean two different sessions twelve months apart. */
const WDAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const noon=ds=>{const t=new Date(String(ds)+"T12:00:00"); return isNaN(t.getTime())?null:t;};
const fmt=d=>{
  const s=PHAT.dayMon(d);
  if(!s) return String(d);
  const y=String(d).slice(0,4);
  return y===String(new Date().getFullYear())?s:s+" "+y;   /* B-14 */
};
const ago=d=>Math.round((Date.now()-new Date(d+"T12:00:00"))/86400000);
const r1=x=>Math.round(x*10)/10;
/* Thousands separator, fixed. Number#toLocaleString is the same class of bug
   as Intl month names: on a de-DE phone it renders 1.234 kg for one thousand
   two hundred and thirty-four. One app, one shape for a number. */
const sep=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,",");
/* The toast is the VISIBLE half only. There is one live region in this app
   (#bs-live) and the toast node is permanently aria-hidden, so a sentence is
   never read twice by two regions over one piece of content (spec §2.6).
   {quiet} — the caller has already announced this sentence itself (B-39), so
   do not announce it again. {ms} — a failure stays on screen longer than a
   receipt. */
function toast(m,quiet,ms){const t=document.getElementById("toast");
  t.querySelector(".msg").textContent=m;
  const act=document.getElementById("toast-act");
  if(act){ act.hidden=true; act.textContent=""; }
  if(!quiet) announce(m);
  t.classList.add("on");clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove("on"),ms||2100);}
/* An undo (spec 2.4, defined once): a control in the toast, >= 88 x 48, live
   for the WHOLE SESSION and not a 5-second timer - he is out of breath and
   reading something else. It restores the removed object byte-for-byte. A
   second destructive action replaces the pending undo and the toast says which
   one it now undoes. */
function toastUndo(m,fn){
  const t=document.getElementById("toast"), act=document.getElementById("toast-act");
  /* WO-006: the control undoes WHATEVER was last offered - a removed set on
     the session screen (undoRemove) or a deleted exercise in the Plan
     Editor. One toast, one control, the latest destructive action. */
  toastUndo.fn=typeof fn==="function"?fn:null;
  t.querySelector(".msg").textContent=m;
  announce(m);
  if(act){ act.hidden=false; act.textContent="Undo"; act.setAttribute("aria-label",m+" Undo."); }
  t.classList.add("on"); clearTimeout(toast._t);
  /* The toast is the IMMEDIATE reach. The undo itself does not expire with
     it: while S.undo stands, the exercise's bottom stack carries a persistent
     Undo control (vSession), so "live for the whole session" is honoured by a
     control that is always reachable rather than by a bar that floats over
     every screen for the rest of the workout.
     The button is REMOVED, not just faded: #toast hides by opacity, and an
     opacity-0 button is still focusable and still takes a tap. */
  toast._t=setTimeout(()=>{ t.classList.remove("on"); if(act) act.hidden=true; },6000);
}
function hideToast(){
  const t=document.getElementById("toast"), act=document.getElementById("toast-act");
  clearTimeout(toast._t); t.classList.remove("on");
  if(act){ act.hidden=true; act.textContent=""; }
}
function lastDay(id){for(let i=S.sessions.length-1;i>=0;i--)if(S.sessions[i].dayId===id)return S.sessions[i].date;return null;}

/* Stroke weights are in frame units, and every frame is 112 units tall
   rendered at ~84 CSS px, so 4.4 units is ~3.3 px and 3 units ~2.3 px - over
   11.4's 2.5 px floor for the solid pose. Ghost and solid differ by VALUE and
   by WEIGHT, never by hue, so the pair survives greyscale (11.4, 11.8 #1). */
function limb(p,col,sw,r){
  let g="";
  if(p.h) g+=`<circle cx="${p.h[0]}" cy="${p.h[1]}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"/>`;
  for(const k of ["sp","ar","ar2","lg","lg2"]) if(p[k])
    g+=`<polyline points="${p[k].map(a=>a.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(p.bar) g+=`<line x1="${p.bar[0]-p.bar[2]}" y1="${p.bar[1]}" x2="${p.bar[0]+p.bar[2]}" y2="${p.bar[1]}" stroke="${col}" stroke-width="${sw+1.4}" stroke-linecap="round"/>`;
  if(p.db) for(const d of p.db)
    g+=`<line x1="${d[0]-3.5}" y1="${d[1]}" x2="${d[0]+3.5}" y2="${d[1]}" stroke="${col}" stroke-width="${sw+3.6}" stroke-linecap="round"/>`;
  return g;
}

/* B-15: `ah_${pattern}` repeated the moment two diagrams of the same pattern
   were open at once — two elements with one id, and an arrowhead that points
   at whichever the browser resolved first. The counter makes every marker id
   unique per rendered instance, which is what SVG requires. */
let figSeq=0;
function diagram(id){
  const pat=PAT[id], P=POSES[pat];
  if(!P) return "";
  const mk="ah_"+pat+"_"+(++figSeq), W=P.vb[0], H=P.vb[1];
  /* The ground reference is scenery and may sit at the non-text floor (11.4).
     One rule or one simple form per pattern - the floor line, the bench slab,
     the block. Bench legs down to a floor were tried and removed: they cost
     half the frame's height and told the reader nothing. */
  const G=P.g.map(g=> g[0]==="floor"
      ? `<line x1="0" y1="${g[1]}" x2="${W}" y2="${g[1]}" stroke="var(--rule)" stroke-width="3.2"/>`
    : g[0]==="rect"
      ? `<rect x="${g[1]}" y="${g[2]}" width="${g[3]}" height="${g[4]}" fill="var(--rule)"/>`
      : `<line x1="${g[1]}" y1="${g[2]}" x2="${g[3]}" y2="${g[4]}" stroke="var(--rule)" stroke-width="4.2" stroke-linecap="round"/>`).join("");
  const A=P.ar, d=A.c
    ? `M${A.f[0]},${A.f[1]} Q${A.c[0]},${A.c[1]} ${A.t[0]},${A.t[1]}`
    : `M${A.f[0]},${A.f[1]} L${A.t[0]},${A.t[1]}`;
  /* aria-hidden: the cue sentence beside it is the accessible description,
     and a stick figure announced as a pile of polylines is noise. The cue is
     appended by figBody(), from the plan - never from this table. */
  return `<svg class="mv" viewBox="0 0 ${W} ${H}" aria-hidden="true"
    style="--fw:${Math.min(6*W/H,13).toFixed(2)}em;--ar:${(W/H).toFixed(3)}"
    xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="${mk}" markerWidth="4.2" markerHeight="4.2" refX="3.2" refY="2.1" orient="auto">
      <path d="M0,0 L4.2,2.1 L0,4.2 z" fill="var(--amber)"/></marker></defs>
    ${G}${limb(P.a,"var(--t45)",3,P.r)}${limb(P.b,"var(--bone)",4.4,P.r)}
    <path d="${d}" fill="none" stroke="var(--amber)" stroke-width="3.6" stroke-linecap="round"
      marker-end="url(#${mk})"/></svg>`;
}
/* Rule Q1's cue, from the PLAN DOCUMENT - 42 per-exercise strings signed off
   by strength-coach, not the 15 per-pattern ones the prototype carried. No
   rule reads a cue: it is a function of the exercise and of nothing else -
   never the week, the load or the verdict. A MISSING CUE IS A LEGAL STATE
   (normalise drops an empty string, so a blank cue is absent), and a
   user-created exercise may legitimately have none. */
function cueFor(id){
  try{
    if(!shippedName(id)) return "";        /* a renamed shipped slot: see below */
    const x=PHAT.resolveEx([sp()].concat(allPlans()),id);
    return (x&&typeof x.cue==="string"&&x.cue.trim()!=="")?x.cue.trim():"";
  }catch(err){ return ""; }
}
/* WO-006. PAT is keyed by the SHIPPED slot id and a copy keeps those ids, so
   a renamed slot would keep its figure whatever it was renamed to. B-64's
   rule is that a wrong figure is worse than none: the figure (and the cue,
   which describes the same movement) ship only while the slot still carries
   the shipped name. Rename "Bent-over row" to "Leg press" and both go; rename
   it back and both return. A user-created exercise has no shipped name, no
   figure, and only the cue he typed. */
function shippedName(id){
  const x=PHAT.exById(PHAT.PHAT_PLAN,id);
  if(!x) return true;                       /* not a shipped slot: nothing to lie about */
  const cur=PHAT.resolveEx(allPlans(),id);
  return !!(cur&&String(cur.n).trim()===String(x.n).trim());
}
const hasFig=id=>!!(PAT[id]&&POSES[PAT[id]]&&shippedName(id));
/* Spec 4.13. Figure and cue -> both. Cue but no figure -> the cue alone, with
   no empty box. Neither -> the disclosure control is not rendered at all (see
   vSession). No placeholder, no FIG 3 box, no "supply the illustrations"
   note: an empty frame in the gym is worse than no frame. */
function figBody(id){
  const c=cueFor(id);
  return (hasFig(id)?diagram(id):"")+(c?`<p class="figcue"><b>Cue.</b> ${esc(c)}</p>`:"");
}

/* ============================================================ chart */
/* THE COMBINED MULTI-LIFT CHART. NO CALLER TODAY, DELIBERATELY: W10 ships
   four per-lift sparklines and the combined chart is scoped out of it,
   pending Chady's answer on whether he wants both (WO-004 §Needs from
   Chady). It is kept rather than deleted because that answer is expected,
   and because its axis-label defect was found and fixed in the same pass —
   deleting it would have deleted the fix. If the answer comes back "four
   lines only", delete this function, KL_C, and the .legend / .swatch rules
   that only its legend used.
   B-11 (points spaced by index, not by date) is open here too, in X(). */
function linechart(rows,series,h){
  const W=500,H=h||230,P={t:12,r:12,b:24,l:38};
  const vals=[]; rows.forEach(r=>series.forEach(s=>{if(r[s.n]>0)vals.push(r[s.n])}));
  if(vals.length<2) return "";
  let mn=Math.min(...vals),mx=Math.max(...vals); const pad=(mx-mn)*.15||2; mn-=pad; mx+=pad;
  const X=i=>P.l+(rows.length<2?0:i*(W-P.l-P.r)/(rows.length-1));
  const Y=v=>P.t+(1-(v-mn)/(mx-mn))*(H-P.t-P.b);
  let g="";
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);
    g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`+
       `<text x="${P.l-6}" y="${y+4}" fill="var(--dim)" font-size="11" text-anchor="end">${Math.round(v)}</text>`;}
  series.forEach(s=>{
    const pts=rows.map((r,i)=>r[s.n]>0?[X(i),Y(r[s.n])]:null).filter(Boolean);
    if(pts.length<2) return;
    g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"
        points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${s.c}"/>`);
  });
  const step=Math.max(1,Math.ceil(rows.length/5));
  rows.forEach((r,i)=>{if(i%step===0||i===rows.length-1)
    /* THE LAST LABEL WAS HALF OFF THE VIEWBOX. It is centred on X = W - P.r
       = 488 of 500, so roughly half of "8 Sep" fell outside the drawing and
       was clipped — the most-read date on the axis, and visible at 400px.
       The ends anchor inward; everything between stays centred on its
       point. Same for the first: at X = P.l = 38 a long label ran past 0. */
    g+=`<text x="${X(i)}" y="${H-6}" fill="var(--dim)" font-size="11" text-anchor="${
      i===rows.length-1?"end":i===0?"start":"middle"}">${esc(r.date)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">${g}</svg>`;
}

/* ============================================================ views */
/* ==== W9: HOME, ONBOARDING · W13a: SETTINGS ==============================
   The Train tab is a router, not a screen. Four destinations and exactly one
   renders: the session (a draft is open), onboarding (first run), Settings,
   or Home.

   WHAT WENT AWAY HERE, AND WHY IT IS NOT SOMEWHERE ELSE:
     - The full-volume checkbox (C-1, B-23). An all-or-nothing toggle cannot
       express Rule V1's per-session ramp, and its own helper text described
       the ramp it could not perform. The tier's STATUS now lives on the cycle
       line and the OFFER lives on the session screen, which is where an
       accessory is actually added. Nothing reads it any more; the stored
       `includeCut` key is still WRITTEN BACK unchanged so no existing store
       loses a field it had.
     - The Export button and the storage sentence. Both moved to Settings,
       in the same pass, so there was never a build with no way to export.
     - The `Week {n}` h1. A CALENDAR week beside a TRAINING week is two
       numbers called "Week" on one screen (B-52). The header kicker is now
       `{n} sessions logged` and the week is the cycle line's alone (C-10). */
function vTrain(){
  if(S.sub==="onboard") return vOnboard();
  if(S.sub==="settings") return vSettings();
  return vHome();
}

/* Which day is offered next: the one gone longest without a session, with a
   never-logged day beating every logged one. Ties keep PLAN ORDER, because
   Array#sort is stable and PROGRAM is the plan document's own order - so on a
   fresh log the offer is day one, which is the day the cycle line also names. */
function nextDay(){
  const rows=PROGRAM.map((d,i)=>{
    const l=lastDay(d.id);
    return {d:d, i:i, ago:l===null?null:ago(l)};
  });
  rows.sort((a,b)=>{
    const av=a.ago===null?Infinity:a.ago, bv=b.ago===null?Infinity:b.ago;
    return bv===av?a.i-b.i:bv-av;
  });
  return rows[0]||null;
}
/* `{n} exercises · {n} sets` for a day AS PRESCRIBED THIS WEEK: volumeTier
   decides which exercises are in (never the deleted checkbox) and deloadEx
   decides how many sets each one is. Both are read, neither is recomputed —
   a meta line that disagrees with the session screen is the app lying about
   its own prescription. Fails open to the day's full list. */
function dayMeta(day){
  if(!day) return {ex:0,sets:0};
  const today=PHAT.localDate();
  let list=day.ex;
  try{
    const t=PHAT.volumeTier({dayId:day.id, program:PROGRAM, sessions:S.sessions,
      state:S.logMeta, todayStr:today, draft:null, plan:S.plan});
    if(t&&Array.isArray(t.exerciseIds)&&t.exerciseIds.length)
      list=day.ex.filter(e=>t.exerciseIds.indexOf(e.id)>=0);
  }catch(err){}
  let dl=false;
  try{ dl=PHAT.deloadStatus(S.logMeta,today).active===true; }catch(err){}
  let sets=0;
  list.forEach(e=>{ let rx=e; try{ rx=PHAT.deloadEx(e,dl)||e; }catch(err){ rx=e; }
    sets+=(typeof rx.s==="number"&&rx.s>0)?rx.s:0; });
  return {ex:list.length, sets:sets};
}
/* KEY_LIFTS joined to the week's PROGRAM, which is the shape deloadCheck and
   stallReport both ask for: {id, n, s, lo}. Joined to the PROGRAMME and never
   to the deloaded prescription — deloadCheck refuses to answer off a deloaded
   ladder and says so (`reason:"deloaded-lifts"`), and that refusal is a bug
   report about this function, not about his training. */
function keyLiftRows(){
  const out=[];
  keyLifts().forEach(l=>{
    let ex=null;
    PROGRAM.forEach(d=>d.ex.forEach(x=>{ if(x.id===l.id) ex=x; }));
    if(ex) out.push({id:l.id, n:l.n, s:ex.s, lo:ex.lo});
  });
  return out;
}
/* The D1 banner (Rule D1, spec 13.6). EVERY string is deloadCheck's, verbatim;
   nothing here assembles a sentence and `reason` is never rendered — it is a
   developer signal and has no honest reading (addendum §7.11).
   Below training week 6 deloadCheck returns trigger:null, so THE WORD
   "deload" CANNOT REACH THE DOM from here, which is this screen's half of
   W9's assertion across trainingWeeks 0–5. */
function deloadBanner(){
  let d=null;
  try{
    const today=PHAT.localDate(), kl=keyLiftRows();
    let sr=null;
    try{ sr=PHAT.stallReport(S.sessions,today,kl,S.logMeta); }catch(err){ sr=null; }
    d=PHAT.deloadCheck({sessions:S.sessions, todayStr:today, stallReport:sr,
      keyLifts:kl, state:S.logMeta, plan:S.plan});
  }catch(err){ return ""; }
  if(!d||!d.trigger||!d.text) return "";
  /* T2 pairs with Rule V1's rollback line as a SECOND PARAGRAPH, never joined
     to the first (addendum §7.1). rollbackReintro is PURE — it returns a new
     state and writes nothing — so calling it here previews the name of the
     exercise that would come out without stripping an accessory per paint. */
  let roll="";
  if(d.rollback){
    try{
      const nx=PHAT.rollbackReintro(S.logMeta,PROGRAM,PHAT.localDate(),S.sessions,S.plan);
      const nm=nx&&nx.lastRollback?nx.lastRollback.name:"";
      roll=nm?PHAT.rollbackLine(nm):"";
    }catch(err){ roll=""; }
  }
  /* Buttons ≥ 44 px, inside the banner so it is answerable where it stands,
     never in a top corner, and `Not now` LOWEST — the closer tap is the one
     that changes nothing. Ignoring is not declining: nothing here dismisses
     on a scroll, and declining does not re-ask until a session is saved
     (declineDeload snapshots the training-day count, not a date). */
  return `<section class="dbanner" aria-labelledby="dl-h">
    <p id="dl-h">${esc(d.text)}</p>
    ${d.x2?`<p>${esc(d.x2)}</p>`:""}
    ${roll?`<p>${esc(roll)}</p>`:""}
    <div class="btns">
      <button class="ghostbtn" id="dl-start">Start deload week</button>
      <button class="ghostbtn" id="dl-no">Not now</button>
    </div></section>`;
}

function vHome(){
  const n=S.sessions.length;
  /* THE HEADER. One top-corner control, and it is the one §0.4 permits:
     neither destructive nor frequent. The kicker is a count, not a week. */
  let h=`<div class="hd"><span class="kick">${n?(n===1?"1 session logged":n+" sessions logged"):"Nothing logged yet"}</span>
    <button class="topbtn" id="settings-open">Settings</button></div>`;

  /* §13.5 PRECEDENCE — the worst fact wins (B-40), and never two at once.
       1  storage blocked / read failed   the refusal notice
       2  the draft-restore offer         Variant A, in #dock (WO-001 Flow 1)
       3  the deload banner
     Implemented as: the notice takes the slot at the top of this view and the
     banner is suppressed; the banner is ALSO suppressed while a draft offer
     stands, because a recommendation about accumulated fatigue on top of an
     unfinished session is the app talking over itself.
     ONE DELIBERATE DEPARTURE, and it is a data decision: the draft offer is
     never suppressed by the notice. Hiding the only route back to an
     unfinished session in order to satisfy a layout rule would be a data-loss
     path, and no layout rule outranks CLAUDE.md §3.3. */
  if(S.err) h+=`<div class="pad mt12"><div class="warn hi" role="alert">
    <p style="color:var(--bone);font-size:.8125rem;line-height:1.5">${esc(S.err)}</p></div></div>`;
  else if(!S.offer) h+=deloadBanner();

  /* THE NEXT-SESSION BLOCK. The answer to the screen's question, above the
     fold, one tap. START SESSION routes through startDay(), so a day that
     already carries an unsaved draft OFFERS it and never overwrites it. */
  const nx=nextDay();
  if(nx){
    const m=dayMeta(nx.d);
    h+=`<section class="nextblk" aria-labelledby="nx-h">
      <span class="nk">${nx.ago===null?"Never logged &mdash; start here"
        :(nx.ago===0?"Logged today":nx.ago===1?"1 day since this day":nx.ago+" days since this day")}</span>
      <h2 id="nx-h">${esc(nx.d.name)}</h2>
      <p class="nm2">${m.ex} exercise${m.ex===1?"":"s"} &middot; ${m.sets} set${m.sets===1?"":"s"}</p>
      <button id="start-next" data-day="${esc(nx.d.id)}">
        <span>Start session</span><span aria-hidden="true">&rsaquo;</span></button>
    </section>`;
  }

  /* EXACTLY ONE PROGRAMME-STATE LINE (C-10 / B-52), and it is cycleLine's.
     `divergence` and `explain` belong to the SAME block — they answer the one
     line above them and are not a second claim about the week. The week-6
     countdown does NOT appear beside it; it lives on Trend (§6). */
  let cl=null;
  try{ cl=PHAT.cycleLine({sessions:S.sessions, todayStr:PHAT.localDate(),
    state:S.logMeta, program:PROGRAM, plan:S.plan}); }catch(err){ cl=null; }
  if(cl&&cl.text){
    h+=`<div class="cycle"><p>${esc(cl.text)}</p>`;
    if(cl.divergence) h+=`<p class="div">${esc(cl.divergence)}</p>`;
    if(cl.divergence&&cl.explain) h+=`<p class="exp">${esc(cl.explain)}</p>`;
    /* The way out of a deload, one tap and no confirmation: ending it
       RESTORES sets rather than removing them, so the cheap direction is the
       safe direction (spec §0.1 rule 8). */
    if(cl.deload&&cl.deload.active)
      h+=`<button class="ghostbtn" id="dl-end">End it early</button>`;
    h+=`</div>`;
  }
  /* The rollback line, when live. Under the cycle line, and it may coexist
     with anything — it is a receipt for something that already happened, not
     a claim on the top of the screen. */
  let rn=null;
  try{ rn=PHAT.rollbackNotice(S.logMeta,S.sessions,PHAT.localDate()); }catch(err){ rn=null; }
  if(rn&&rn.show&&rn.text) h+=`<div class="cycle"><p class="div">${esc(rn.text)}</p></div>`;

  /* THE DAY LIST. B-31: `{wd} · {day}`, the weekday from the plan document's
     own `wd`, which is what makes the rest day legible without renumbering a
     single stored id (C-5). This block must be reachable WITHOUT SCROLLING at
     393 × 852 — nothing above it may grow without re-measuring. */
  h+=`<div class="pad mt16"><span class="lbl secrule">Or pick any day</span>`;
  PROGRAM.forEach(d=>{
    const l=lastDay(d.id), a=l===null?null:ago(l), stale=a!==null&&a>=8;
    h+=`<button class="daybtn${stale?" stale":""}" data-day="${esc(d.id)}">
      <span><span class="wd">${esc(d.wd||"")}</span>
      <span class="nm">${esc(d.name)}</span>
      <span class="ago" style="display:block">${l===null?"Never logged"
        :a===0?"Done today":a===1?"1 day ago":a+" days ago"}</span></span>
      <span class="chev" aria-hidden="true">&rsaquo;</span></button>`;
  });
  h+=`</div>`;
  /* THE MACRO STRIP (spec §13.7, B-29). W9 left this out because the numbers
     did not exist in logic.js and four fabricated cells are worse than four
     missing ones. W12 landed them, so it goes in now, from the same source.

     TWO STRINGS, BOTH READ OFF THE ENGINE, NEITHER ASSEMBLED HERE:
     `dietTargets().label` and `.text.strip`. `strip` exists in logic.js FOR
     THIS ROW — "the Home row's joined form, exactly as the coach wrote it" —
     so that no screen can re-space or re-round a coach-approved figure, and
     `label` carries the engine's `claimsToday` decision rather than a guess
     made here.

     THIS IS THE LAST PLACE THE 700 kcal BUG COULD RE-ENTER. The design
     prototype hardcoded the home strip to `Today — high-carb training day` /
     3,200 / 300 g, so on a Wednesday or a Sunday — PHAT's two rest days — it
     claimed a 700 kcal and 240 g surplus under the word "Today", on the two
     days the low-carb floor exists to protect. So: no day type is assumed
     here, no number is typed here, no label is built here, and **no view
     argument is passed** — `S.dietView` is the Diet tab's segment and is a
     view of some other day; Home always speaks about today or not at all.

     SAME SOURCE AS THE DIET SCREEN (§13.7: "if the two ever disagree, one of
     them is lying"). One function, one call each, no second table.

     PLACEMENT: below the day list, which is where §13.1 puts it and also the
     only place that spends none of the day list's no-scroll budget. See the
     report for the re-measurement at 393 × 852.

     FAIL SILENT, NEVER FAIL CONFIDENT (§0.7): a throw costs the strip, never
     the day list, and there is no fallback set of macros in this file to fall
     back to — inventing one is the exact defect above.

     THE KEY LINE IS THE ONLY COPY THIS BLOCK OWNS. `strip` is four bare
     figures and is unreadable, by eye or by screen reader, without saying
     which is which; the Diet tab carries per-cell labels and this row cannot.
     It sits ABOVE the figures so the reading order is key-then-numbers in
     both. New copy — flagged for `ux-designer`. */
  let dt=null;
  try{ dt=PHAT.dietTargets(PHAT.localDate(),S.plan); }catch(err){ dt=null; }
  if(dt&&dt.label&&dt.text&&typeof dt.text.strip==="string"&&dt.text.strip){
    h+=`<div class="pad mt16"><span class="lbl secrule">Today's macros</span>
      <div class="mstrip">
        <p class="day">${esc(dt.label)}</p>
        <span class="lbl key">Calories &middot; protein &middot; carbs &middot; fat</span>
        <span class="v">${esc(dt.text.strip)}</span>
      </div></div>`;
  }
  return h;
}

/* ---- ONBOARDING (spec §10.1) --------------------------------------------
   IT WRITES EXACTLY ONE KEY (phat:v1:prefs.onboarded) AND CLEARS NOTHING.
   `START WITH AN EMPTY LOG` sets a flag. It is not an erase, it cannot become
   one, and there is no control on this screen or any other that empties the
   real log (spec §2.4 item 9).
   It renders only when BOTH stores read "absent" and neither read failed —
   see boot. An absent store and an unreadable one must never look the same.
   The design's `Height cm` field is deleted: no engine reads height, no screen
   shows it, and every field on first run is a tax paid before the first set. */
function vOnboard(){
  const plan=PHAT.PHAT_PLAN, nd=(plan&&Array.isArray(plan.days))?plan.days.length:0;
  return `<div class="pad" style="padding-top:26px">
    <span class="kick">First run</span>
    <h1 style="margin-top:10px">Nothing<br>logged yet</h1>
    <p class="sub">This app has one job: make logging a set faster than a spreadsheet.
      It has no streaks, no badges and no encouragement. It shows you last session's
      numbers and gets out of the way.</p></div>
  <div class="pad mt24"><span class="lbl">Your plan</span>
    <div class="obplan">
      <p class="pn">${esc(plan&&plan.name?plan.name:"PHAT")}${nd?" &mdash; "+nd+" days":""}</p>
      <p class="sub">Two power days, three hypertrophy days. Loaded at reduced volume
        for the first weeks.</p>
    </div></div>
  <div class="pad mt24">
    <label class="lbl" for="bwin">Today's weight</label>
    <div class="bwentry">
      <span class="stepper"><button data-bwact="-" aria-label="Bodyweight down 0.1 kg">&minus;</button>
        <input id="bwin" inputmode="decimal" placeholder="kg" value="">
        <button data-bwact="+" aria-label="Bodyweight up 0.1 kg">+</button></span>
    </div>
    <!-- NOT "Logged as today's entry." here. That sentence is the Weight tab's
         (vWeight, gated on its "mine" check) and it is TRUE there because
         something has been logged. On first run nothing has, so onboarding
         stating it is a false claim on the very first screen he sees - the same
         class as the hardcoded day type that cost 700 kcal: copy that was true
         where it was written and a lie where it was pasted. Found by looking at
         the rendered screen, not by an assertion.
         NO BACKTICKS IN THIS COMMENT. It sits inside a template literal, so a
         backtick here ends the string and the whole shell stops parsing. That
         is exactly how it broke the first time. -->
    <p class="tiny mt12">Weigh daily &mdash; the trend is what the app reads.
      Optional: leaving it empty writes nothing.</p></div>
  <div class="pad mt24" style="padding-bottom:var(--s6)">
    <button class="primary" id="ob-start">Start with an empty log</button></div>`;
}

/* ---- SETTINGS (spec §10.2–10.5) -----------------------------------------
   THREE SECTIONS. What is not here is the point, and it is not here in ANY
   state: no volume toggle (C-1, B-23), no weight-increment segment (C-3,
   B-58), no control that empties the real log (§2.4 item 9). The increment is
   the rule's and not a setting's; the tier's status is the cycle line's.
   The demo sandbox (W13b) is out of scope tonight and leaves NO dead control
   behind — there is no disabled button and no "coming soon" row. */
function vSettings(){
  const auto=!!S.prefs.restAuto;
  let h=`<div class="hd"><button class="topbtn back" id="settings-back">
      <span aria-hidden="true">&lsaquo;</span> Back</button>
    <span class="kick">Settings</span></div>`;
  /* The store notice outranks everything on this screen too (§10.5), and it
     is the reason export is refused below. */
  if(S.err) h+=`<div class="pad mt12"><div class="warn hi" role="alert">
    <p style="color:var(--bone);font-size:.8125rem;line-height:1.5">${esc(S.err)}</p></div></div>`;

  /* REST TIMER. aria-pressed is the accessible carrier; the inset bar is the
     non-colour one. The helper says what actually happens: Rule R1 rule 2
     fires on COMMIT — a reps stepper tap or a reps field leaving focus — and
     never on a keystroke. The design's "the moment reps are entered" would be
     a promise the code deliberately does not keep, because typing the 1 of 12
     must not start a countdown. */
  h+=`<div class="setsec"><span class="lbl secrule">Rest timer</span>
    <div class="seg" role="group" aria-label="Rest timer">
      <button id="rest-auto" aria-pressed="${auto?"true":"false"}">
        <span class="mk" aria-hidden="true"></span>Auto-start</button>
      <button id="rest-manual" aria-pressed="${auto?"false":"true"}">
        <span class="mk" aria-hidden="true"></span>Manual</button>
    </div>
    <p class="tiny">Auto-start begins the countdown when a set's reps are entered.
      On manual the countdown does not run.</p></div>`;

  /* EXPORT. Its two outcomes are both VISIBLE and they do not share a shape:
     success is the advice enclosure, failure is the four-sided refusal with a
     literal "!" (B-16, spec §2.1). A failure can never be mistaken for a
     receipt. Both are announced through #bs-live, which is outside #view. */
  h+=`<div class="setsec"><span class="lbl secrule">Export</span>
    <button class="ghostbtn" id="export">Export everything as JSON</button>`;
  if(S.exp&&S.exp.ok){
    h+=`<div class="advice"><span class="kick">Exported</span>
      <p>Exported ${S.exp.n} session${S.exp.n===1?"":"s"} and ${S.exp.m} weight${S.exp.m===1?"":"s"}.${
      (S.exp.bad&&S.exp.bad.length)?" The saved "+esc(S.exp.bad.join(" and "))+" on this device could not be read; the copy in memory was used.":""}</p></div>`;
  }else if(S.exp&&!S.exp.ok){
    h+=`<div class="refuse" role="alert"><p><span aria-hidden="true">! </span>Could not export.
      Nothing changed on this device.</p></div>`;
  }
  /* §10.4, RULED AND VERBATIM. The design's "Export monthly so nothing costs
     you the history" is a false safety claim while there is no importer, and
     a false safety claim is worse than no claim. This line is replaced by the
     design's — and an IMPORT control appears beside EXPORT — when WO-002
     lands. Not before. */
  h+=`<p class="tiny">Your log lives on this device. Export writes a copy you can keep.
      This version cannot read one back in yet.</p></div>`;
  /* E-3. BACKUP. Four states and the buttons exist in exactly one of them:
     the module could not load (a sentence, no control - a sync affordance
     that does not sync is a false durability promise), loading, signed out
     (the form), signed in (status + BACK UP NOW / RESTORE / SIGN OUT). */
  h+=vBackup();
  return h;
}

/* ============================================================ W7: session
   ONE EXERCISE PER SCREEN. Everything the screen needs, computed once per
   paint. Fails OPEN (spec §0.7): if Rule V1 throws, the whole day renders,
   because a partial day is worse than a full one and a card that is not on
   screen is a set he cannot log. */
function sessionCtx(){
  const day=sDays().find(x=>x.id===S.dayId);
  const today=PHAT.localDate();
  const all=day?day.ex.map(e=>e.id):[];
  let tier=null;
  try{
    tier=PHAT.volumeTier({dayId:S.dayId, program:sDays(), sessions:S.sessions,
      state:S.logMeta, todayStr:today, draft:S.draft, plan:sp()});
  }catch(err){ tier=null; }
  let ids=(tier&&Array.isArray(tier.exerciseIds)&&tier.exerciseIds.length)
    ? tier.exerciseIds.slice() : all.slice();
  /* THE `S.includeCut` READ IS GONE WITH THE CHECKBOX (C-1, B-23, Decision 6).
     Rule V1 owns which exercises are in, for every day, with no override —
     the offer to add one back is made on the session screen, one at a time,
     which is the only shape the brief's ramp actually has. The stored key is
     still written back untouched so no existing store loses a field; NOTHING
     READS IT. Do not reintroduce a read here. */
  /* Spec §2.3 rule 6: a row a refusal points at must be reachable even when
     the tier hides it. A refusal pointing at an unreachable row is the worst
     state in the spec. */
  S.problems.forEach(pr=>{ if(pr.exId&&ids.indexOf(pr.exId)<0) ids.push(pr.exId); });
  let list=day?day.ex.filter(e=>ids.indexOf(e.id)>=0):[];
  /* D8. AN ENTRY WHOSE EXERCISE IS NO LONGER IN THIS DAY IS STILL A SCREEN.
     The plan moved under the draft (an exercise removed by the editor, or a
     restore that brought down a different plan); the numbers he typed are
     in S.draft.entries and are shown, editable and saved like any other.
     Appended after the day's own list, in draft order, only when there is
     something in them - a blank orphan has nothing to lose and would be a
     screen about nothing. Resolved by name through every plan on the
     device, and flagged in words on the card (vSession). */
  const ents=(S.draft&&S.draft.entries)||{};
  Object.keys(ents).forEach(k=>{
    if(day&&day.ex.some(e=>e.id===k)) return;
    if(list.some(e=>e.id===k)) return;
    const st=ents[k]; if(!st) return;
    const kept=PHAT.completedSets(st.sets).length>0||String(st.note==null?"":st.note).trim()!==""
      ||(Array.isArray(st.sets)&&st.sets.some(x=>!blankSet(x)));
    if(kept) list=list.concat([exAnywhere(k)]);
  });
  let dl={active:false,day:null};
  try{ dl=PHAT.deloadStatus(S.logMeta,today); }catch(err){}
  return {day:day, today:today, tier:tier, list:list, deload:dl};
}
/* SP1's source lift's CURRENT name, so B-28's rename reaches the fallback copy
   without touching logic.js (WO-003 Decision 5). */
function speedSrcName(exId){
  let map={}; try{ map=PHAT.planSpeedSource(sp())||{}; }catch(err){ map={}; }
  const src=map[exId];
  if(!src) return null;
  let nm=null;
  sDays().forEach(d=>d.ex.forEach(x=>{ if(x.id===src) nm=x.n; }));
  return nm;
}
/* C-12 rule 2: `- REMOVE` targets the last BLANK row by preference, not the
   last row. The common case - a row added by mistake - never touches data. */
const blankSet=s=>String((s&&s.w)==null?"":s.w).trim()===""&&String((s&&s.r)==null?"":s.r).trim()==="";
function removeTarget(sets){
  for(let k=sets.length-1;k>=0;k--) if(blankSet(sets[k])) return k;
  return sets.length-1;
}

/* The ghost hint for one row. GHOST, NOT PREFILL (spec §4.4, ruled): the row
   starts empty and last session's numbers sit under it, so a number he did not
   choose can never reach the log. ACROSS A PRESCRIPTION CHANGE the per-row
   hint is DELETED, not captioned - prescriptionEpoch reports prefill:false and
   seed:false, and the provenance line renders in its place. */
function ghostText(e,prev,k,changed){
  if(changed) return "";
  const pv=prev&&prev.sets&&prev.sets[k];
  if(!pv) return "No prior set.";
  const pw=PHAT.parseWeight(pv.w), pr=PHAT.parseReps(pv.r);
  if(!pw.ok||!pr.ok) return "No prior set.";
  /* Rule Z2: a rack chin reads `Last bodyweight x 10`. No rule and no view in
     this app produces the string `0 kg`. */
  const w=pw.value>0?String(r1(pw.value)):PHAT.loadWord(0,e.implement);
  return "Last "+w+" × "+pr.value;
}

function vSession(){
  const C=sessionCtx(), list=C.list, n=list.length;
  if(!n) return `<div class="todo"><h1>Nothing to log</h1>
    <p>This day has no exercises in it. Your draft is untouched.</p></div>`;
  if(!(S.exIx>=0)) S.exIx=0;
  if(S.exIx>n-1) S.exIx=n-1;
  const i=S.exIx, e=list[i];
  const st=S.draft.entries[e.id]||{sets:[{w:"",r:""}],note:""};
  if(!st.sets.length) st.sets.push({w:"",r:""});
  /* The prescription that governs. deloadEx is idempotent and returns `ex`
     itself when no deload is active, so this is the same object on a normal
     week. A deload reduces the PRESCRIPTION, never the log. */
  const rx=PHAT.deloadEx(e,C.deload.active===true);
  const prev=PHAT.lastFor(S.sessions,e.id);
  let ep=null;
  try{ ep=PHAT.prescriptionEpoch({ex:e,prev:prev,plan:sp(),exId:e.id}); }catch(err){ ep=null; }
  const changed=!!(ep&&ep.changed);
  let xs={flags:[],count:0,line:"",idle:false};
  try{ const r=PHAT.extraSets(st.sets,rx); if(r) xs=r; }catch(err){}
  let sl=null;
  if(e.k==="speed"){
    try{ sl=PHAT.speedLoad(S.sessions,e.id,C.today,speedSrcName(e.id),sp()); }
    catch(err){ sl=null; }
  }
  const ag=PHAT.draftAge(S.draft.date,C.today);

  /* ---- header + pips. No destructive control: the header is information,
     not a control (§4.2, §4.12, B-34 / C-13). The pip strip is aria-hidden
     redundant graphics; pipStrip() carries `Exercise {i} of {n}` as the
     accessible carrier (B-59, §0.5). */
  let h=`<div class="sesshead"><p class="kick">${esc(C.day.name)} &middot; ${i+1} of ${n}</p>`;
  if(!ag.sameDay) h+=`<p class="sub">It saves under ${esc(fmtDay(S.draft.date,ag.ageDays))}, not today.</p>`;
  h+=`</div>${pipStrip(i,n)}`;

  /* ---- the fix bar (§2.3 rule 3). It renders at FIRST PAINT of the screen he
     was sent to, so it is a navigation and not an appearance; it is fixed
     height and never disappears while a refusal stands. The full message lives
     once, at the save point — and since W8 the save point is the SUMMARY, not
     the last exercise, so the bar now rides EVERY exercise screen and
     BACK TO SAVE is the only route to the message (§2.3 rule 4). */
  if(S.problems.length)
    h+=`<div class="fixbar"><p id="fixtxt">${esc(fixText())}</p>
      <button id="backsave">Back to save</button></div>`;

  /* ---- Rule V1's reintroduction offer. First exercise screen only: the
     decision is about this session and the moment to make it is before he has
     lifted anything (§4.11). */
  if(i===0) h+=vOffer(C);

  /* ---- name, target, prescription. §0.1 #9: the target never wraps, never
     truncates, never shrinks - the NAME is what gives way. ` . per DB` is
     required for implement:"db" and the prototype omits it (B-22). */
  const unit=(e.implement==="db")?" · per DB":"";
  const tgt=(rx.lo===rx.hi?rx.s+" × "+rx.lo:rx.s+" × "+rx.lo+"–"+rx.hi)+unit;
  /* An exercise no plan on the device carries (D5) has no prescription to
     print: the name is the coach's sentence and the target slot is empty. */
  h+=`<div class="exname"><div class="row"><h3>${esc(e.n)}</h3>
    ${e.gone?"":`<span class="target">${esc(tgt)}</span>`}</div></div>`;
  /* Speed cards print SP1's computed load, never the prototype's static
     "65-70% of your power-day top set" (B-12). Everything else prints the
     provenance line, and ONLY across a prescription change - on an unchanged
     prescription the per-row ghosts already say it, once per row. */
  /* WO-006 B4 / coach 8.4, as amended by the coach's W3 ruling (2026-09-11):
     SP1's EXPLANATION renders on the Plans screen and nowhere else, but the
     ADVICE - the 65-70% ceiling - belongs under the bar, so `text` prints
     for speed work unconditionally. On the absent branch speedLoad puts only
     the advice line in `text`; the explanation stays in absentLines. */
  const rxline=(e.k==="speed")?(sl?sl.text:""):(changed?ep.line:"");
  if(rxline) h+=`<p class="rx">${esc(rxline)}</p>`;
  if(C.tier&&Array.isArray(C.tier.kept)&&C.tier.kept.indexOf(e.id)>=0)
    h+=`<p class="rx">Not in today's volume. It has numbers in it.</p>`;
  /* D8. The plan no longer lists this exercise on this day. Said in words,
     under the name, and nothing else about the card changes: the sets are
     his, they save, and the rules that need a prescription stay quiet. */
  if(!inSessDay(e.id)) h+=`<p class="rx">Not in the plan any more. It still saves with this session.</p>`;
  if(S.v1added===e.id) h+=`<p class="rx">Back in from this session.</p>`;

  /* ---- movement & cue. Neither figure nor cue -> the disclosure is NOT
     rendered at all. An empty frame in the gym is worse than no frame. */
  if(hasFig(e.id)||cueFor(e.id))
    h+=`<button class="showfig" data-fig="${esc(e.id)}" aria-expanded="false"
      aria-controls="fig-${esc(e.id)}"><span class="chv" aria-hidden="true">&rsaquo;</span> movement &amp; cue</button>
      <div class="fig" id="fig-${esc(e.id)}" data-figbox="${esc(e.id)}"></div>`;

  /* ---- THE INPUTS. Built BEFORE and OUTSIDE every try block above, so no
     advice rule can prevent a set row painting (§0.7). */
  h+=`<div class="card" id="excard" data-ex="${esc(e.id)}"><div class="sets">`;
  for(let k=0;k<st.sets.length;k++){
    const g=ghostText(e,prev,k,changed);
    const at=` ${esc(e.n)} set ${k+1}`;
    h+=`<div class="setrow" data-i="${k}">
      <span class="idx" aria-hidden="true">${k+1}</span>
      <span class="grp"><span class="unit" aria-hidden="true">kg</span>
        <span class="stepper"><button data-act="-" data-f="w" aria-label="Weight down 2.5,${at}">&minus;</button>
        <input class="w" data-f="w" inputmode="decimal" placeholder="0"
          aria-label="Weight in kg,${at}" value="${esc(st.sets[k].w)}">
        <button data-act="+" data-f="w" aria-label="Weight up 2.5,${at}">+</button></span></span>
      <span class="grp"><span class="unit" aria-hidden="true">reps</span>
        <span class="stepper"><button data-act="-" data-f="r" aria-label="Reps down 1,${at}">&minus;</button>
        <input class="r" data-f="r" inputmode="numeric" placeholder="&ndash;"
          aria-label="Reps,${at}" value="${esc(st.sets[k].r)}">
        <button data-act="+" data-f="r" aria-label="Reps up 1,${at}">+</button></span></span>
      <span class="ghost"><span class="gtxt" data-ghost="${esc(g)}">${esc(g)}</span>
        <span class="xtra" data-xtra="${k}">${xs.flags[k]?"EXTRA":""}</span></span></div>`;
  }
  h+=`</div>`;

  /* ---- add / remove. CONTROLS, not inputs, so they sit BELOW every set input
     and ABOVE the note field: they change the number of rows above them, which
     is exactly why they must not sit above one (§4.1). The remove control
     NAMES ITS TARGET so he can see what he is about to lose before he taps
     (C-12 rule 1). */
  const tk=removeTarget(st.sets);
  h+=`<div class="ctlrow"><button id="addset">+ Add set ${st.sets.length+1}</button>`;
  h+=(st.sets.length>1)
    ? `<button id="rmset" data-k="${tk}">&minus; Remove set ${tk+1}</button>`
    : `<span class="spacer" aria-hidden="true"></span>`;
  h+=`</div>`;

  /* ---- THE NOTE FIELD - C-15, restored. Rule S1's ONLY input, and the LAST
     input on the card: the whole bottom-stack safety rule is defined relative
     to it. It grows downward on focus, which is allowed because everything
     below it is a control. */
  h+=`<div class="notewrap"><label class="lbl" for="exnote" style="margin-bottom:5px">Note</label>
    <input class="note" id="exnote" placeholder="Note &mdash; RIR, form, pain, anything"
      aria-label="Note for ${esc(e.n)} &mdash; RIR, form, pain, anything"
      value="${esc(st.note)}"></div></div>`;

  /* ---- THE BOTTOM STACK. Every slot here is BELOW the last input, so nothing
     in it can move an input by appearing or resizing (§0.1 #1). Order is
     normative: extras -> deload -> pain -> speed flag -> verdict. Filled by
     paintAdvice() on commit; the verdict slot is never empty and never
     collapses. */
  h+=`<div class="stack">
    <div id="slot-extra"></div>
    <div id="slot-deload"></div>
    <div id="slot-pain"></div>
    <div id="slot-speed"></div>
    <div id="slot-verdict"></div>`;
  /* C-12 rule 5. The toast is the immediate reach and it fades; the undo does
     not. While one stands it is a control in the bottom stack of the exercise
     it belongs to - below every input, reachable for the whole session, and
     never a bar floating over the next four screens. */
  if(S.undo&&S.undo.exId===e.id)
    h+=`<button class="ghostbtn mb12" id="undoset">Undo &mdash; put set ${S.undo.i+1} back</button>`;
  if(S.err) h+=`<div class="warn hi mb12" role="alert">
    <p style="color:var(--bone);font-size:.8125rem;line-height:1.5">${esc(S.err)}</p></div>`;
  /* `#bs-slot` IS GONE FROM THIS SCREEN and lives on the Summary (W8). One
     save point, one refusal message. Do not re-add a second one here — two
     copies of "Not saved. 3 sets need a fix." on two screens is two answers to
     one question, and paintProblems() writes whichever it finds first. */

  /* ---- prev / next, then DISCARD SESSION as the last element in the scroll. */
  h+=`</div><div class="navrow">
    <button class="prev" id="navprev"${i===0?" disabled aria-disabled=\"true\"":""}
      aria-label="Previous exercise">&larr;</button>`;   /* U+2190 is outside the
      inlined Archivo subset and falls back per-glyph, checked on screen and
      kept: it is one arrow at one size and it reads, where the chevron
      alternative reads as "previous PAGE". If the subset is ever regenerated,
      add U+2190. */
  /* W8: the last exercise no longer saves. It hands over to the Summary, which
     is the reviewed path to the one commit in the app. */
  h+=(i===n-1)
    ? `<button class="next" id="tosum">Finish session</button>`
    : `<button class="next" id="navnext">Next &mdash; ${esc(list[i+1].n)}</button>`;
  h+=`</div><div class="pad mt24"><button id="discard">DISCARD SESSION</button></div>`;
  return h;
}

/* Rule V1's offer block. `Not yet` is the LOWEST and therefore the cheapest
   tap; ignoring it is not declining it - scrolling past or saving with it
   unanswered stamps nothing and re-offers next session (§4.11). */
function vOffer(C){
  if(S.v1msg) return `<div class="offer" id="v1"><p>${esc(S.v1msg)}</p></div>`;
  const t=C.tier;
  if(!t) return "";
  if(t.blocked==="pain"&&t.blockedLine)
    return `<div class="offer" id="v1"><p>${esc(t.blockedLine)}</p></div>`;
  if(!t.offer||!t.offerLine) return "";
  return `<div class="offer" id="v1"><p>${esc(t.offerLine)}</p>
    <div class="btns"><button class="ghostbtn" id="v1-add">Add it</button>
    <button class="ghostbtn" id="v1-no">Not yet</button></div></div>`;
}
const fixText=()=>{const n=badRows().length;
  return n?(n===1?"1 set left to fix.":n+" sets left to fix."):"Nothing left to fix.";};

/* ==== W8: THE SUMMARY SCREEN ============================================
   THE SUMMARY IS A READ. Nothing in this function writes a storage key,
   mutates S.draft, or schedules a draft save — reaching this screen, leaving
   it and coming back leaves phat:v1:draft byte-identical, which is criterion 1
   and is asserted on the serialized string rather than on the screen. That is
   also why S.sum is in memory only: every draft write stamps a fresh savedAt,
   so there is no such thing as an "identical" rewrite.

   IT IS ALSO THE SINGLE COMMIT POINT. SAVE SESSION is the only control in the
   app that writes phat:v1:log, and it renders from the DRAFT, not from the
   rows below — built outside the try that builds them, so a rule that throws
   costs its row and never the ability to save (spec 0.7).

   NOTHING HERE IS RECOMPUTED. Every verdict is PHAT.verdict's, verbatim,
   through the same verdictHtml() the session card uses. An unlogged exercise
   reads SKIPPED, which is a STATE and is never dressed as a verdict.

   WHICH EXERCISES ARE LISTED is what the SAVE will contain, not what the
   session flow showed: validateDraft keeps every entry with a completed set
   OR a typed note, including one Rule V1's tier hides, so the summary lists
   those too. A screen that omits a set the save writes is a lie about the one
   thing it exists to answer. */
function sumRow(e,st,C){
  const done=PHAT.completedSets(st.sets);
  const note=String(st.note==null?"":st.note).trim();
  let h=`<div class="sumex"><div class="row"><span class="nm">${esc(e.n)}</span>`;
  /* spec 5.2: a state, not a verdict. No enclosure, no kicker, no arrow. */
  h+=done.length?"":`<span class="sumskip">Skipped</span>`;
  h+=`</div>`;
  if(!inSessDay(e.id)) h+=`<p class="sumnote">Not in the plan any more. It still saves with this session.</p>`;
  if(done.length){
    /* Rule Z2 holds on this screen too: a rack chin reads `bodyweight × 10`.
       No view in this app prints the string `0 kg` (B-32). */
    h+=`<p class="sumsets">${esc(done.map(s=>
      (s.w>0?String(r1(s.w)):PHAT.loadWord(0,e.implement))+" × "+s.r).join(" · "))}</p>`;
  }
  /* B-33: a typed note is data. It is counted separately, and it is SHOWN —
     hiding the only thing an exercise holds is how a note gets deleted by
     someone who could not see it. */
  if(note) h+=`<p class="sumnote">${esc(note)}</p>`;
  /* PER-ROW CATCH (spec 0.7). A thrown rule costs this row's verdict and
     nothing else — not the row, not the counters, not Save. An exercise no
     plan carries (D5) gets no verdict block at all: there is no prescription
     for a rule to read, and the role gate's refusal would be noise. */
  if(done.length&&!e.gone){
    let v=null, vh=null;
    const dl=C.deload.active===true;
    try{
      v=PHAT.verdict({ex:e, sets:st.sets, prev:PHAT.lastFor(S.sessions,e.id),
        note:st.note, deload:dl});
      vh=verdictHtml(v,dl,"");
    }catch(err){ vh=null; }
    if(vh) h+=vh.html;
    else if(e.k==="speed"){
      let ins="";
      try{ const sl=PHAT.speedLoad(S.sessions,e.id,C.today,speedSrcName(e.id),sp());
           ins=sl?sl.instruction:""; }catch(err){ ins=""; }
      if(ins) h+=`<div class="advice"><p class="kick">Speed work</p><p>${esc(ins)}</p></div>`;
    }else{
      /* Below the gate. The same sentence the card shows, because the gate is
         the same gate and a second phrasing for one fact is a second fact. */
      const rx=PHAT.deloadEx(e,C.deload.active===true);
      h+=`<div class="advice"><p class="kick">Waiting</p>`+
        `<p>Nothing to say until all ${rx.s} sets are in.</p></div>`;
    }
  }
  return h+`</div>`;
}
/* An exercise by id from ANY day of the plan, because a draft can legitimately
   hold an id today's day does not contain — a resumed draft is hydrated
   verbatim from disk and the plan may have moved under it. Falls back to a
   stub carrying the id as its name, so the row still renders and still names
   something: an entry the summary cannot describe is still an entry the save
   writes, and silently omitting it is the one thing this screen may not do. */
function exAnywhere(id){
  let out=null;
  try{ out=PHAT.resolveEx([sp()].concat(allPlans()),id); }catch(err){ out=null; }
  /* D5: NEVER the raw id. An id no plan on this device has ever carried
     prints the coach's sentence, and s/lo/hi of 0 keep every rule silent. */
  return out||{id:id,n:PHAT.EX_GONE,s:0,lo:0,hi:0,k:"",gone:true};
}
/* Is this exercise in the OPEN SESSION's day right now? An entry that is
   not - the plan moved under a draft (D8) - still renders, still saves, and
   is flagged in words. */
function inSessDay(id){
  const d=sDays().find(x=>x.id===S.dayId);
  return !!(d&&d.ex.some(e=>e.id===id));
}
function sumBody(C){
  const ents=S.draft.entries||{};
  const has=id=>{const st=ents[id]; if(!st) return false;
    return PHAT.completedSets(st.sets).length>0||String(st.note==null?"":st.note).trim()!==""; };
  /* Today's day, in plan order — every exercise the flow showed, plus any the
     tier hid that has numbers in it (those save, so they show). Then anything
     left in the draft that is not in this day at all, appended rather than
     dropped. */
  const rows=C.day.ex.filter(e=>C.list.some(x=>x.id===e.id)||has(e.id))
    .concat(Object.keys(ents).filter(k=>has(k)&&!C.day.ex.some(e=>e.id===k)).map(exAnywhere));

  /* THE COUNTERS READ EVERY DRAFT ENTRY, not just the listed rows, so the
     numbers can never describe less than the save writes. Volume INCLUDES
     extra sets; the target counts do not change (W8, Rule X1). */
  let nSets=0,nVol=0,nX=0,nEx=0,nNote=0;
  Object.keys(ents).forEach(k=>{
    const st=ents[k]||{};
    const done=PHAT.completedSets(st.sets);
    nSets+=done.length; nVol+=PHAT.vol(st.sets);
    /* Decision 7 / B-33: an exercise COUNTS when it has at least one completed
       set; a notes-only entry is named separately, never folded in, never
       hidden. The same two counters vTrend prints, in the same words. */
    if(done.length) nEx++;
    else if(String(st.note==null?"":st.note).trim()!=="") nNote++;
    const e=C.day.ex.find(x=>x.id===k)||exAnywhere(k);
    try{ const r=PHAT.extraSets(st.sets,PHAT.deloadEx(e,C.deload.active===true));
         if(r) nX+=r.count; }catch(err){}
  });

  const ag=PHAT.draftAge(S.draft.date,C.today);
  let h=`<div class="sumhead"><h3>${esc(C.day.name)}</h3>`;
  if(!ag.sameDay) h+=`<p class="sub">It saves under ${esc(fmtDay(S.draft.date,ag.ageDays))}, not today.</p>`;
  h+=`<div class="sumnums">
    <div><p class="lbl">Sets</p><p class="v">${esc(String(nSets))}</p></div>
    <div><p class="lbl">Volume kg</p><p class="v">${esc(sep(nVol))}</p></div>
    <div><p class="lbl">Extra sets</p><p class="v">${esc(String(nX))}</p></div></div>`;
  h+=`<p class="sumcount">${esc(plural(nEx,"exercise"))}${
    nNote?" &middot; "+esc(plural(nNote,"note")):""}</p></div>`;

  if(!nSets&&!nNote) return h+`<div class="pad mt16"><p class="sub">Nothing logged yet.</p></div>`;
  return h+`<section class="pad mt16" aria-labelledby="sum-h">
    <p class="lbl secrule" id="sum-h">Per exercise</p>
    ${rows.map(e=>sumRow(e,ents[e.id]||{sets:[],note:""},C)).join("")}</section>`;
}
function vSummary(){
  const C=sessionCtx();
  let body="";
  /* THE WHOLE-SCREEN CATCH (spec 0.7). If the summary cannot be built, the
     screen still says what is true and still offers the commit and the way
     back. The sets are in the draft either way; the summary never held them. */
  try{
    body=C.day?sumBody(C)
      :`<div class="pad mt16"><p class="sub">Nothing logged yet.</p></div>`;
  }catch(err){
    console.error("[phat] summary failed",err);
    body=`<div class="pad mt16"><div class="refuse">
      <p><span aria-hidden="true">! </span>Could not build the summary. Your sets are safe.</p>
      </div></div>`;
  }
  const back=(C.list.length&&C.list[C.list.length-1])?C.list[C.list.length-1].n:"the session";
  /* THE COMMIT BLOCK IS BUILT OUTSIDE THE TRY. #bs-slot is where a blocked
     save renders (spec 2.2) — directly above SAVE SESSION, filled by
     paintProblems(), which render() calls after this string is in the DOM.

     S.err IS THE OTHER REFUSAL AND IT HAS TO LAND HERE TOO (spec 2.5, B-54).
     A write that fails AFTER validation passed — the disk is full, the store
     is blocked — is reported where Save is, in the same shape the session
     screen uses for it, and the entries stay on screen. It is a different
     shape from the blocked-save message on purpose: no `!`, no rows, nothing
     to tap, because there is no set to point at. The two never stack —
     finish() clears S.err when it refuses on validation, and save() clears it
     on success. */
  return `<div class="hd"><p class="kick">Session complete</p>
    <p class="kick">${esc(fmt(S.draft.date))}</p></div>`
    +body
    +(S.err?`<div class="pad mt24"><div class="warn hi" role="alert">
      <p style="color:var(--bone);font-size:.8125rem;line-height:1.5">${esc(S.err)}</p></div></div>`:"")
    +`<div class="pad mt24"><div id="bs-slot"></div></div>
      <div class="navrow"><button class="prev" id="sumback"
        aria-label="Back to ${esc(back)}">&larr; Back</button>
      <button class="next" id="finish">Save session</button></div>
      <p class="tiny pad mt12">Nothing is judged here. The verdicts are arithmetic on your own numbers.</p>
      <div class="pad mt24"><button id="discard">DISCARD SESSION</button></div>`;
}

/* ==== W10: THE TREND SCREEN =============================================
   THE INLINE STALL BLOCK IS GONE, AND IT WAS B-07. What stood here scanned
   every session for a key lift, took PHAT.topSet of each, and printed
   `Week {n} and no progress on …` whenever the heaviest WEIGHT had not
   moved. Week 1 100x3/3/3 -> week 6 100x5/5/5 is six weeks of real
   progress and that block called it a stall, then blamed his effort or his
   diet for it. It also counted CALENDAR weeks (weeksIn), which is not the
   number any gated rule in this app uses.

   NOTHING ON THIS SCREEN IS RECOMPUTED HERE. PHAT.stallAdvice owns the
   sentence — it calls PHAT.stallReport itself, so the measurement and the
   diagnosis stay one answer — and this file prints its `lines` verbatim. If
   a sentence on this screen is wrong, it is wrong in logic.js, where it is
   testable from file:// with no DOM.

   READ-ONLY. Nothing below writes a storage key at any data volume. */

/* One lift's line, as a sparkline.

   The viewBox height EQUALS the rendered height and preserveAspectRatio is
   off, so y is 1:1 (a 10-unit tick is 10px tall, at any width) while x
   stretches to the column. Every stroke is non-scaling, so nothing is drawn
   at a distorted weight — which is also why there are no dots: a circle
   under a non-uniform scale is an ellipse.

   B-11 IS STILL OPEN AND IT LIVES IN X(), deliberately one line that takes
   the row as well as the index, so spacing by date is a change to this
   function and to nothing else. */
const SPK_W=1000, SPK_H=44, SPK_PAD=10;
function spark(pts){
  if(pts.length<2) return "";
  const vs=pts.map(p=>p.e);
  let mn=Math.min(...vs), mx=Math.max(...vs);
  /* A flat line sits in the MIDDLE of the box, never on the floor: a line
     along the bottom edge reads as a collapse. */
  if(mx-mn<1e-9){ mn-=1; mx+=1; }
  const X=(row,i)=>SPK_PAD+i*(SPK_W-2*SPK_PAD)/(pts.length-1);
  const Y=v=>6+(1-(v-mn)/(mx-mn))*(SPK_H-12);
  const xy=pts.map((p,i)=>[r1(X(p,i)),r1(Y(p.e))]);
  const l=xy[xy.length-1];
  /* aria-hidden: the row's own text carries the whole reading — name,
     latest value, dated endpoints and a signed delta — so the polyline is
     decoration to a screen reader, not a second telling of it. */
  return `<svg class="tlspark" viewBox="0 0 ${SPK_W} ${SPK_H}" preserveAspectRatio="none" aria-hidden="true">
    <polyline fill="none" stroke="var(--bone)" stroke-width="2" stroke-linejoin="round"
      stroke-linecap="round" vector-effect="non-scaling-stroke"
      points="${xy.map(p=>p.join(",")).join(" ")}"/>
    <line x1="${l[0]}" y1="${r1(l[1]-5)}" x2="${l[0]}" y2="${r1(l[1]+5)}" stroke="var(--bone)"
      stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`;
}

/* The points for one key lift, GROUPED BY `lift` AND NEVER BY NAME (C-6):
   PHAT.exIdsForLift is the plan's own grouping, so a rename moves the label
   and the line stays where it is, and two slots that are the same movement
   share one line.

   ONE JUDGEMENT CALL, recorded because the work order does not settle it:
   the group is narrowed to slots carrying the key lift's own `k`. d1a and
   d3a share `l_row` — that shared field is what SPEED_SRC reads — but d3a
   is prescribed at 65–70% of the 3–5RM, so plotting both on one line draws
   a 30% cliff every speed day and calls it a trend. The grouping is kept;
   the protocol is what is filtered. The lift's own slot is never filtered
   out, whatever the plan says about it.

   The metric is PHAT.e1rmByDate, the same estimate ST1 scores, so the chart
   and the week-6 card cannot disagree — which is exactly what the old
   weight-only chart did beside the old weight-only stall block. Merged by
   DATE across the group's ids, best wins, because two sessions on one day
   are one day of evidence (addendum 6c). */
function liftPoints(l){
  let ids=[];
  try{ ids=PHAT.exIdsForLift(S.plan,l.lift)||[]; }catch(err){ ids=[]; }
  if(ids.indexOf(l.id)<0) ids=ids.concat([l.id]);
  const by=Object.create(null);
  ids.forEach(id=>{
    if(id!==l.id){
      let ex=null;
      try{ ex=PHAT.exById(S.plan,id); }catch(err){ ex=null; }
      if(!ex||ex.k!==l.k) return;
    }
    let rows=[];
    try{ rows=PHAT.e1rmByDate(S.sessions,id)||[]; }catch(err){ rows=[]; }
    rows.forEach(p=>{ if(by[p.date]===undefined||p.e>by[p.date]) by[p.date]=p.e; });
  });
  return Object.keys(by).sort().map(d=>({date:d,e:by[d]}));
}

/* One row: label, signed delta, chart, dated endpoints.

   STACKED, not side by side, and that is the 200%-text answer: the label
   owns a full-width line, so there is no width for the chart to take from
   it. The chart is a fixed 44px tall in a 100%-wide box, so it yields at
   every text size and the name never truncates.

   THE DELTA CARRIES A SIGN (B-13). Greyscale this screen and +7.5 / −2.5
   still read; colour is a second channel, never the only one. */
function liftRow(l){
  const pts=liftPoints(l);
  const last=pts.length?pts[pts.length-1]:null;
  let head=`<span class="tlname">${esc(l.lbl)}</span>`;
  if(pts.length>=2){
    const d=r1(last.e-pts[0].e);
    const word=d>0?"Up":(d<0?"Down":"No change");
    const lab=word+(d?" "+Math.abs(d).toFixed(1)+" kg":"")+" since "+fmt(pts[0].date);
    head+=`<span class="tldelta ${d>0?"up":(d<0?"dn":"")}" aria-label="${esc(lab)}">${
      d>0?"+":d<0?"−":""}${Math.abs(d).toFixed(1)} kg</span>`;
  }
  let body;
  if(pts.length>=2){
    body=spark(pts)+`<div class="tlfoot"><span>${esc(fmt(pts[0].date))}</span><span>${
      r1(last.e).toFixed(1)} kg &middot; ${esc(fmt(last.date))}</span></div>`;
  }else if(pts.length===1){
    /* NEVER a flat line at zero and never an empty box (spec §6, states).
       One date is a reading, not a trend, so it is printed as a reading. */
    body=`<p class="tlnone">${r1(last.e).toFixed(1)} kg on ${esc(fmt(last.date))}.
      One date cannot make a line. Log it again.</p>`;
  }else{
    body=`<p class="tlnone">No data yet. This line reads sets at 8 reps or fewer.</p>`;
  }
  return `<div class="tl"><div class="tlhead">${head}</div>${body}</div>`;
}

/* The week-6 card, and every character of it is PHAT.stallAdvice's.

   PER-CARD CATCH (spec §0.7): a throw in here costs the card and the
   sparklines still render. `early` and `quiet` render NOTHING — no
   placeholder, no "on track" reassurance (audit 4), and no countdown line,
   because the countdown copy is the coach's (W1) and does not exist yet.
   The word "deload" cannot reach this screen: stallAdvice does not hold it
   in any of its five states. */
function stallCard(){
  let a=null;
  try{
    a=PHAT.stallAdvice({plan:S.plan, sessions:S.sessions,
      todayStr:PHAT.localDate(), state:S.logMeta, keyLifts:keyLiftRows()});
  }catch(err){ return ""; }
  if(!a) return "";
  /* WO-006 B4: the ABSENT line is the Plans screen's, once. Nothing here. */
  if(a.absent===true) return "";
  const lines=a.lines||[];
  if(!lines.length&&!a.disclosureLine) return "";
  /* The red rule is the SECOND channel. The first is the sentence itself:
     the stalled state opens `Week 6 and no progress on …` in the lead. */
  let h=`<div class="pad mt16"><div class="tcard${a.state==="stalled"?" stall":""}">
    <span class="kick">Week 6 test</span>`;
  lines.forEach((t,i)=>h+=`<p${i?"":' class="lead"'}>${esc(t)}</p>`);
  /* Addendum §9.9. Its own line, never joined to the finding: it is a
     disclosure about the CHECK, not a claim about a lift. */
  if(a.disclosureLine) h+=`<p>${esc(a.disclosureLine)}</p>`;
  return h+`</div></div>`;
}

/* The Trend rows. The plan's key lifts when it names any; otherwise EVERY
   lift group in the plan, because a plan built from empty has no editor for
   keyLifts yet and a Trend tab that can never show a line is a tab he stops
   opening. The sentence says which it is. ST1's ABSENT copy is NOT printed
   here - it renders on the Plans screen only (WO-006 B4). */
function trendRows(){
  const kl=keyLifts();
  if(kl.length) return kl.map(liftRow).join("");
  let lifts=[]; try{ lifts=PHAT.planLifts(S.plan)||[]; }catch(err){ lifts=[]; }
  if(!lifts.length) return `<p class="tlnone">This plan has no exercises yet.</p>`;
  const rows=lifts.map(l=>{
    const e=PHAT.exById(S.plan,l.exIds[0]);
    return {id:l.exIds[0], n:l.name, lbl:l.name, c:"var(--bone)", lift:l.lift, k:e?e.k:""};
  });
  return `<p class="tlnone">This plan names no key lifts, so every lift is shown.</p>`+rows.map(liftRow).join("");
}
function vTrend(){
  const n=S.sessions.length;
  /* A kicker pair, not an h1: at 200% text a 76px "Top sets" is wider than
     the column's min-content and puts the screen into horizontal scroll —
     the same measured defect W11 fixed on Bodyweight. */
  let h=`<div class="hd"><span class="kick">Trend</span>
    <span class="kick">${n?esc(plural(n,"session")):"No sessions"}</span></div>`;

  /* THE EMPTY STATE NAMES WHAT UNLOCKS IT. The design's LOAD SAMPLE DATA
     control is deliberately NOT here: the demo sandbox (W13b) is not built,
     and a control that does nothing is worse than no control. */
  if(!n) return h+`<div class="pad mt24"><h2>No sessions yet</h2>
    <p class="sub">Top sets appear here after the first logged session, and the week 6 test
    unlocks once there are two weeks to compare.</p></div>`;

  h+=stallCard();
  h+=`<section class="pad mt16" aria-labelledby="tl-h"><h2 id="tl-h">Key lifts</h2>
    <p class="tiny">Estimated one-rep max, from the best set at 8 reps or fewer. The same
    number the week 6 test reads.</p>
    ${trendRows()}</section>`;

  h+=`<section class="pad mt24"><h2>Recent sessions</h2>`;
  S.sessions.slice().reverse().slice(0,12).forEach(s=>{
    /* D5: the day name resolves through every plan on the device, the one
       the session names first, so a session logged under a copy the store no
       longer holds still reads "Upper power" - and one whose day is in no
       plan reads the coach's sentence, never an id and never blank. */
    let d=null;
    try{ d=PHAT.resolveDay([storedPlan(PHAT.planIdOf(s))].concat(allPlans()).filter(Boolean),s.dayId); }
    catch(err){ d=null; }
    /* B-33, ruled in WO-003 §Decision 7: an exercise COUNTS when it has at
       least one completed set. A notes-only entry is data and is kept, so
       it is named separately — never folded into the count, never hidden,
       never deleted. */
    const ents=Object.keys(s.entries||{}).map(k=>s.entries[k]);
    let nEx=0, nNote=0;
    ents.forEach(e=>{
      if(!e) return;
      if(PHAT.completedSets(e.sets).length) nEx++;
      else if(String(e.note||"").trim()!=="") nNote++;
    });
    const v=ents.reduce((a,e)=>a+(e?PHAT.vol(e.sets):0),0);
    /* fmt() returns its ARGUMENT UNCHANGED when PHAT.dayMon cannot parse it,
       and that argument is a date string off the disk — so this is stored
       data reaching innerHTML, and it is escaped like every other one. */
    h+=`<div class="sess"><div><div class="sn">${esc(d?d.name:PHAT.DAY_GONE)}</div>
      <div class="sd">${esc(fmt(s.date))} &middot; ${esc(plural(nEx,"exercise"))}${
        nNote?" &middot; "+esc(plural(nNote,"note")):""}</div></div>
      <div class="sv">${esc(sep(v))} kg</div></div>`;
  });
  return h+`</section>`;
}

/* ============================================================ W11: weight
   B-06 and C-9, closed. EVERY NUMBER AND EVERY SENTENCE ON THIS SCREEN COMES
   OUT OF logic.js — PHAT.bwWindows for the average, PHAT.calorieAdvice for
   the decision — and not one of them is assembled here. That is the whole
   point of the item, because the version this replaces assembled both and got
   both wrong:

     - it averaged the last 7 ENTRIES (`b.slice(-7)`), so eight weigh-ins
       spread over 24 days printed a confident "kg per week" that spanned most
       of a month, and it fired from TWO entries;
     - its bands were `>=.2 && <=.35` on target, `<.2` add, else cut — the
       exact bands coach-audit §2 struck down. It cut 200 kcal at +0.36 where
       the brief says do nothing below +0.5, and it printed "Gaining too
       slowly" while he was LOSING weight;
     - and it printed "Target: 0.2–0.3 kg per week" directly under logic that
       treated 0.34 as on target.

   The engine's eleven states, its insufficient-data gates and its sub-line
   now render verbatim, trailing "Recheck in 7 days." included. If you find
   yourself building a sentence in this function, that is the bug.

   NOTHING ON THIS TAB WRITES TO STORAGE ON RENDER (spec §3.1 rule 7). */
function vWeight(){
  const today=PHAT.localDate();
  const b=S.bw.slice().sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  const mine=b.find(e=>e.date===today);
  /* FAIL SILENT ON ADVICE (spec §3.6). The average is arithmetic over one
     window and may still show if it is computable; a partial or guessed
     calorie instruction may never appear. Two try blocks, not one, so a throw
     in the band ladder cannot also take the average down with it. */
  let W=null, adv=null;
  try{ W=PHAT.bwWindows(S.bw,today); }catch(err){ W=null; }
  try{ adv=PHAT.calorieAdvice(S.bw,today,S.logMeta&&S.logMeta.calChangedAt); }catch(err){ adv=null; }
  const n=b.length;

  let h=`<div class="hd"><span class="kick">Bodyweight</span>
    <span class="kick">${n?(n===1?"1 entry":n+" entries"):"No entries"}</span></div>`;

  /* ---- the average, and its sample size. The count is NEVER omitted, not
     even at 7 of 7 (spec §3.4): a label that only admits its sample size when
     the sample is thin is a label he learns to stop reading. */
  /* ONE decimal on the average, TWO on the rate, deliberately. The scale is
     0.1 kg (CLAUDE.md §3.5) so 86.42 kg is precision he cannot weigh; the
     rate's bands are compared in hundredths, so +0.50 and +0.5049 are
     different instructions and it must print what it banded. The two numbers
     cannot be checked against each other in any case — window A's mean is
     never on screen, which is why logic.js rounds the rate once from the
     unrounded means. */
  if(W&&W.bCount>=PHAT.BW_WINDOW_MIN&&W.meanB!==null){
    h+=`<div class="bwavg"><span class="lbl">7-day average (${W.bCount} of 7 days)</span>
      <p class="bwbig">${r1(W.meanB).toFixed(1)}<span class="u"> kg</span></p>`;
    /* Rule W1 rule 1: the rate is null unless BOTH windows hold 5 dated
       entries, so this row cannot render off a month of scattered weigh-ins.
       Uncoloured, always — see the CSS block comment. */
    if(W.rate!==null)
      h+=`<div class="row bwchg"><span>Change vs last week</span>
        <span class="v">${W.rate<0?"-":"+"}${Math.abs(W.rate).toFixed(2)} kg</span></div>`;
    h+=`</div>`;
  }

  /* ---- the calorie decision. Verbatim, and the ONLY place a kg-per-week
     instruction may appear. In the four not-enough-data states adv.subline is
     "" and adv.tone is "none", so no sub-line and no acknowledgement control
     render without a further test here — the engine already decided. */
  if(adv&&adv.state!=="empty"){
    h+=`<div class="pad mt16"><div class="advice">
      <span class="kick">Calorie decision</span>
      <p class="lead">${esc(adv.text)}</p>`;
    if(adv.subline) h+=`<p>${esc(adv.subline)}</p>`;
    /* RANK 4, the hold note (Rule W1h, addendum §14.2; spec §7.5.1). A hold
       is stamped in EVERY band, but the engine only turns it into state 7
       when the band itself instructs a change; in bands 2, 3 and 4 it stayed
       invisible while still suppressing the next add-or-cut instruction.
       That is the app lying by omission, and this line is the confession.

       IT IS A PLAIN <p> INSIDE THE EXISTING .advice ENCLOSURE, ON PURPOSE.
       `.advice p` is --dim at .8125rem, which is the sub-line's exact token,
       size and weight - never bolder, never --bone, no kicker of its own, no
       second card. A hold note that outranks the band sentence above it reads
       as a competing instruction, which is the failure the ruling exists to
       prevent. It is a footnote: true, needed, not the point.

       THE VIEW ASSEMBLES NO PART OF THIS SENTENCE. `{ago}` needs agoWord and
       `{date}` needs dayMon, and a second implementation of the clause state
       7 already prints is the B-06 failure class one layer up - two literals
       that agree today and disagree after the next edit. Print adv.holdNote
       or print nothing.

       EXACTLY ONE HOLD DISCLOSURE whenever holdUntil is set: in cooldown
       adv.text IS the disclosure and holdNote is ""; in a band this is it.
       Never both, never neither - the engine owns that XOR so it is testable
       from file:// instead of being read out of a template string. */
    if(adv.holdNote) h+=`<p id="calhold">${esc(adv.holdNote)}</p>`;
    /* tone === "act" is EXACTLY the three states that instruct a change, so
       the view never re-derives that list (logic.js says so in as many
       words). Acknowledging "I changed my intake" under "Change nothing."
       would mean nothing, and a control that is always present is a control
       that gets tapped absently. */
    if(adv.tone==="act")
      h+=`<button class="ghostbtn" id="calset">I changed my calories today</button>`;
    /* The way back out. One tap, no confirmation: clearing RESTORES advice,
       so the cheap direction is the safe direction (spec §0.1 rule 8).

       GATED ON THE FACT, NOT ON A RENDERED STATE (spec §7.5.1 ruling 1). The
       old test was `adv.state==="cooldown"` - a rendered state standing in
       for the thing the control acts upon - so a live hold in bands 2, 3 and
       4 was unclearable. holdUntil is the engine's own statement that a hold
       is on disk, and it is set in every band. `!=null` is loose on purpose:
       it also catches an engine that predates holdUntil, where `!==null`
       would offer a clear button with nothing behind it.

       aria-describedby points the control at the note rather than inventing a
       longer accessible name (spec §7.5.1 A11y): a reader hears "I did not
       change anything" then "You changed calories 3 days ago. Hold ends 15
       Sep." In cooldown there is no note and so no dangling reference -
       adv.text one rank above is already the context. */
    if(adv.holdUntil!=null)
      h+=`<button class="ghostbtn" id="calclear"${
        adv.holdNote?` aria-describedby="calhold"`:""}>I did not change anything</button>`;
    h+=`</div></div>`;
  }
  /* State D, the true empty state (spec §3.3): the entry control and this
