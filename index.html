<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PHAT Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ==== E-4: PWA ==========================================================
     The manifest is what makes this installable to the home screen instead of
     a bookmark; the apple-touch-icon is the same job on iOS, which does not
     read the manifest's icon list for the home-screen tile.
     BOTH ARE INERT ON file://. A manifest that cannot be fetched costs the
     install prompt and nothing else - it cannot stop a single line of this
     page rendering, which is why they are safe to sit above the stylesheet.
     The registration itself is at the FOOT of this file, after the app, and
     is a hard no-op on file://. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png">
<!-- THE ONE COLOUR LITERAL OUTSIDE :root, AND IT IS NOT A STYLE CHOICE.
     A meta attribute cannot read a custom property - the browser paints the
     status bar and the task-switcher card from this string before any CSS
     exists - so the token cannot be referenced here, only COPIED. It is
     --bg, byte for byte. IF --bg MOVES, MOVE THIS AND manifest.webmanifest's
     theme_color / background_color WITH IT; there is no mechanism that will
     tell you. (Some older docs give #14100E. That value appears nowhere in
     this codebase and is stale text, not a spec.) -->
<meta name="theme-color" content="#1c1b1a">

<!-- B-67/B-63. Archivo, the design face, as ONE @font-face with the woff2
     base64-inlined. No CDN and no @import: this app opens from file:// with
     the network off, so a fetch is not available to it. A separate file
     rather than another 47 KB inside this one, because sw.js precaches it
     and the browser caches it independently of the shell. If the file is
     missing the --sans stack below falls back and nothing waits on it. -->
<link rel="stylesheet" href="assets/archivo-inline.css">
<style>  /* == TOKENS ===============================================================
     Direction 2a - graphite & signal amber, from docs/design/PHAT App.dc.html.
     EVERY colour literal in this file is in this block. Nothing below may name
     a hex.

     Ratios are WCAG 2.x with translucent foregrounds composited over their own
     ground before measuring, and they are quoted PER GROUND, because the same
     alpha passes on --bg and fails on --surface. That is exactly how the
     prototype's .lbl at .50 (4.6:1 on --bg, 4.3:1 on --surface) passed an
     audit that only measured it against --bg (spec wo-004-screens 0.5).      */
  :root{
    --bg:#1c1b1a;                                /* relative luminance 0.0111 */
    --surface:#2a2827;                           /* relative luminance 0.0216 */
    --hi:#353231;      /* stepper key face. Its edge is the --line border, not
                          this fill, which is 1.35:1 and carries no meaning.  */
    --bone-rgb:240,238,234;
    --bone:rgb(var(--bone-rgb));                 /* 14.8:1 bg . 12.7:1 surface */
    /* The alpha steps, named. TEXT MAY NOT GO BELOW --t55 ON EITHER GROUND. */
    --t70:rgba(var(--bone-rgb),.70);             /*  7.8:1 bg .  7.0:1 surface */
    --t55:rgba(var(--bone-rgb),.55);             /*  5.3:1 bg .  4.9:1 surface */
    --t45:rgba(var(--bone-rgb),.45);             /*  4.0:1 bg .  3.8:1 surface */
    --t40:rgba(var(--bone-rgb),.40);             /*  3.4:1 bg .  3.2:1 surface */
    --dim:var(--t70);        /* secondary text  */
    --faint:var(--t55);      /* tertiary text - the floor, not below it       */
    --line:var(--t45);       /* control boundaries: 3.8:1, over the 3:1 floor */
    --rule:var(--t40);       /* section and row rules: 3.3:1                  */
    --amber:#f5b32b;         /*  9.3:1 bg . 7.9:1 surface . --bg on amber 9.3 */
    --green:#7CC05E;         /*  7.8:1 bg . 6.7:1 surface  (was 5.3 / 4.5)    */
    --red:#E3705C;           /*  5.5:1 bg . 4.7:1 surface  (was 2.9 / 2.5)    */
    --red-hi:var(--red);     /* W4 minted --red-hi because --red was 2.9:1 on
                                --surface. The 2a red clears 4.5:1 on both, so
                                the two names are one colour now; the alias
                                stays so no refusal code has to be touched.   */
    --scrim:rgba(28,27,26,.82);
    /* Archivo is the design's face and it SHIPS - assets/archivo-inline.css,
       linked above, is one variable woff2 (wght 100-900) inlined as base64.
       The DS pulls it from Google Fonts with an @import; that import does not
       ship, because this app opens from file:// with the network off. The
       fallbacks stay: if the asset is missing from a partial deploy the app
       renders in the platform grotesque instead of waiting on it.
       "Archivo Expanded" is kept ahead of system-ui only for a device that
       has that face installed; the inlined file is the standard width.
       ONE GLYPH THIS APP PRINTS IS OUTSIDE THE SUBSET: U+2190, the previous-
       exercise arrow, which falls back per-glyph and was checked on screen.
       Everything else is in range - U+00D7 x, U+2212 minus, U+203A rsaquo,
       U+2013 en dash, U+00B0 degree, U+2039 lsaquo. CHECK ANY NEW GLYPH
       against the unicode-range at the foot of archivo-inline.css.       */
    --sans:"Archivo","Archivo Expanded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"DejaVu Sans Mono",Menlo,monospace;
    --r:0;             /* the DS radius scale is 0px at every step            */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
    --tap:44px;        /* the floor. WIDTH as well as height - B-43 exists
                          because only the height was ever checked.           */
    --key:48px;        /* stepper key height: 44 is the floor, 48 is the size */
    /* -- THE COLUMN. ONE NUMBER, AND EVERY FIXED THING READS IT -----------
       The app is a centred column and does not stretch. Logging is a phone
       activity; desktop is where he REVIEWS. #dock used to be fixed with
       left:0/right:0, so at 1920px the RESUME button was 1870px wide, the
       five tabs were 384px each with 350px of gap, and the restore sheet
       covered four of the five day rows - while #view sat centred at 520.
       The chrome and the content column disagreed at every width above 520.
       #view, #dock, #toast and the modal's SHEET all read --col, so they
       cannot drift apart again. The modal SCRIM is deliberately NOT in that
       list: it still covers the whole viewport, because a modal that dims
       part of the screen is worse than one that dims all of it.
       WHY 520 AND NOT THE DESIGN'S 393: 393 would put gutters either side of
       a 400px phone, and every W6 measurement - the 44px floor, 200% text,
       no horizontal scroll - was taken in a 520 column. The phone does not
       regress to buy a desktop treatment.                                  */
    --col:520px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg); margin:0; font-family:var(--sans)}
  /* Focus has to be visible: the old sheet set input{outline:none} and put
     nothing back, which left a keyboard user with no feedback at all. */
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  /* overflow-wrap inherits, so this is the whole app's answer to the one way
     a fluid layout still scrolls sideways: a single word longer than the
     column. MEASURED — at 200% text "Bodyweight" as a 76px h1 is 432px of
     min-content in a 353px column, and that alone put 63px of horizontal
     scroll on the Weight tab. break-word, not anywhere: it breaks only when
     the word cannot fit, and it leaves flex min-content sizing alone. */
  #app{background:var(--bg); font-family:var(--sans); color:var(--bone);
    min-height:100vh; position:relative; padding-bottom:78px; overflow-wrap:break-word;
    max-width:var(--col); margin:0 auto}
  #view{max-width:var(--col); margin:0 auto}
  /* The column's edges, so a wide screen reads as a column standing on the
     app's own ground rather than as a broken full-width page. No bezel and no
     fake phone: two hairlines at --rule (3.3:1) down the full height.
     box-shadow, not border: it paints OUTSIDE the box, so it costs zero
     layout width, cannot disturb the 44px set-row arithmetic, adds no
     horizontal overflow, and falls off-screen by itself on a viewport
     narrower than the column - no media query, nothing about the phone
     changes.                                                              */
  #app,#dock{box-shadow:1px 0 0 var(--rule), -1px 0 0 var(--rule)}
  h1{font-size:2.375rem; font-weight:800; letter-spacing:-.025em; line-height:1.02; margin:0}
  h2{font-size:1.0625rem; font-weight:800; margin:0 0 var(--s2)}
  h3{font-size:1.5625rem; font-weight:800; letter-spacing:-.02em; margin:0; line-height:1.12}
  p{margin:0}
  button{font-family:var(--sans); border:none; background:transparent; cursor:pointer; color:inherit}
  input{font-family:var(--sans); color:inherit}
  .pad{padding:0 var(--s4)}
  .sub{color:var(--dim); font-size:.875rem; margin-top:5px; line-height:1.45}
  .tiny{color:var(--faint); font-size:.75rem; line-height:1.5}

  /* -- the design's flush-left label pair. .kick sits on --bg, .lbl inside a
     surface card - and on --surface the alpha floor is .55, not .50.       */
  .kick,.lbl{font-size:.6875rem; font-weight:800; letter-spacing:.12em;
    text-transform:uppercase; color:var(--faint); display:block}
  .hd{display:flex; justify-content:space-between; align-items:center; gap:var(--s3);
    padding:var(--s3) var(--s4); border-bottom:2px solid var(--rule)}
  .secrule{padding-bottom:var(--s2); border-bottom:2px solid var(--rule); margin-bottom:var(--s3)}

  .daybtn{width:100%; display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:15px var(--s4); margin-bottom:var(--s2); text-align:left; min-height:56px}
  .daybtn.stale{border-color:var(--red); border-left-width:3px}
  .daybtn .nm{color:var(--bone); font-size:1rem; font-weight:800}
  .daybtn .ago{font-size:.78125rem; margin-top:3px; color:var(--dim)}
  .daybtn.stale .ago{color:var(--red)}
  .chev{color:var(--amber); font-size:1.375rem}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:var(--s3)}
  .cardhead{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); padding:15px var(--s4) var(--s1)}
  /* MEASURED at 200% text: the target ("3 x 6-10") ran 6px past the viewport
     because a flex item's min-width defaults to min-content and the exercise
     name would not yield. session 0.1 #9 says the TARGET never wraps,
     truncates or shrinks - so the name is the one that gives way. */
  .cardhead h3{min-width:0; overflow-wrap:anywhere}
  .target{color:var(--amber); font-weight:800; font-size:.8125rem; white-space:nowrap; flex:none}
  .hint{color:var(--dim); font-size:.78125rem; padding:0 var(--s4) 2px}
  .sets{padding:var(--s2) var(--s4) 14px}

  /* -- THE SET ROW AND ITS REFLOW (spec 0.6) --------------------------------
     Arithmetic at 400px: a stepper that holds two 44px keys and a 3-character
     input is 136px minimum, so the row is index 14 + gap 8 + 136 + gap 8 +
     136 = 302px. That fits at 400px, and it does NOT fit at 200% text.
     So the row is flex-wrap with a min-width on each group expressed in rem:
     when the pair cannot both hold their keys on one line, reps drops to a
     full-width line UNDER weight and both keep their 44px keys. Nothing
     shrinks. The row grows downward, which is allowed - everything below a
     set row is a control, not an input (session 0.1 #1).
     The unit captions are load-bearing once the pair is stacked: two equal
     steppers one above the other are otherwise indistinguishable.          */
  .setrow{display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2); margin-bottom:9px}
  .idx{color:var(--faint); font-weight:800; font-size:.8125rem; width:14px; flex:none; align-self:center}
  .grp{flex:1 1 8.5rem; min-width:8.5rem; display:flex; flex-direction:column; gap:3px}
  .unit{font-size:.625rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
  /* B-37: the ghost has its OWN full-width row under the steppers, so the
     zero-width squeeze that made it invisible at 400px is structurally
     impossible. It shares the row with Rule X1's EXTRA badge, right-aligned,
     and the badge changes no height - so a row becoming EXTRA moves nothing. */
  .ghost{color:var(--faint); font-size:.78125rem; flex:1 1 100%;
    min-height:1.15rem; padding-left:22px; display:flex; align-items:baseline;
    justify-content:space-between; gap:var(--s2)}
  .gtxt{min-width:0}
  .xtra{color:var(--bone); font-size:.6875rem; font-weight:800; letter-spacing:.1em; flex:none}

  /* ---- WO-001 W6: a set row marked by a blocked save (W4 2.4) ----
     Nothing here depends on hue: the rule is a rule, the "!" is an "!", the
     token is words, and the marked stepper's border is thicker. Greyscale the
     screen and every one of them still reads. The extra border is cancelled
     by a -1px margin so the row's geometry does not move - a stepper that
     rewraps when you report an error is a worse bug than the error.        */
  .setrow.bad{border-left:3px solid var(--red-hi); padding-left:var(--s2); margin-left:-11px}
  .badtok{color:var(--bone); font-size:.78125rem; line-height:1.4; margin:-4px 0 7px; padding-left:22px}
  .stepper.binv{border-color:var(--red-hi); border-width:3px; margin:-1px}
  .clearstrip{min-height:var(--tap); margin:-1px 0 11px; font-size:.84375rem}

  .stepper{display:flex; border:2px solid var(--line); border-radius:var(--r); overflow:hidden}
  .stepper button{background:var(--hi); color:var(--bone); font-size:1.125rem; font-weight:800;
    line-height:1; min-height:var(--key); min-width:var(--tap); flex:none; padding:0}
  .stepper button:active{background:var(--amber); color:var(--bg)}
  .stepper input{background:var(--bg); color:var(--bone); font-weight:800; font-size:1.0625rem;
    letter-spacing:-.01em; border:none; text-align:center; padding:0;
    flex:1 1 auto; min-width:48px; width:100%; min-height:var(--key)}
  .stepper input::placeholder{color:var(--faint)}

  .note{width:100%; background:var(--bg); color:var(--bone); border:2px solid var(--line);
    border-radius:var(--r); padding:var(--s3); font-size:.8125rem; margin-top:var(--s1); min-height:var(--key)}
  .note::placeholder{color:var(--faint)}

  .showfig{color:var(--amber); font-size:.75rem; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; padding:0 var(--s4); display:flex; align-items:center;
    text-align:left; width:100%; min-height:var(--tap)}
  /* B-67. The open state used to be U+2304, which the inlined Archivo subset
     does not carry - so once the face shipped, closed drew in Archivo and
     open drew in the platform font, one glyph, mismatched size and baseline.
     Both states are now the SAME glyph (U+203A, in range) and the open state
     is a rotation. Do not put a literal arrow back: check any new glyph
     against the unicode-range in assets/archivo-inline.css first. */
  .showfig .chv{display:inline-block; width:1em; text-align:center; line-height:1}
  .showfig[aria-expanded="true"] .chv{transform:rotate(90deg)}
  /* -- THE FIGURE SITS BESIDE THE CUE, AND THE FRAME FOLLOWS THE SUBJECT ---
     Was: one 200x150 landscape viewBox for every pattern, rendered
     width:100% as a full-width banner. A standing human is about 1:3, so a
     figure that filled a 150-tall frame could only ever be ~50 of 200 wide -
     measured, the average pattern used 26% of the width and 63% of the
     height, and 'curl' was a 6% hairline floating in emptiness. The frame
     was the wrong shape for the subject, and no amount of redrawing fixes
     that. Now every pattern carries its OWN viewBox, fitted to its own
     content: upright patterns get an upright frame, prone ones a wide frame,
     and the drawing fills 84-90% of both axes in all fifteen.
     Sized off WIDTH, never height: with a fixed height a wide pattern would
     be letterboxed inside a box it does not fit, which is the same defect in
     a new place. In em units so it grows with 200% text (11.8 #6). --fw and --ar
     come from the viewBox, computed in diagram(). */
  .fig{display:none; padding:0 var(--s4) var(--s3); font-size:.875rem}
  .fig.on{display:flex; gap:var(--s3); align-items:center; flex-wrap:wrap}
  svg.mv{display:block; flex:none; width:min(var(--fw),100%); aspect-ratio:var(--ar); height:auto}
  .figcue{flex:1 1 13em; color:var(--dim); font-size:.78125rem; line-height:1.45; margin:0}
  .figcue b{color:var(--bone); font-weight:800}
  /* -- W7: ADVICE vs REFUSAL (spec 2.1) -------------------------------------
     2a has ONE accent, so the difference cannot be a second colour. It is
     carried by FORM, four ways at once, and all four survive greyscale:
       advice   3px rule on the LEFT EDGE only . no glyph . kicker names the
                block (WAITING / VERDICT / SPEED WORK / DELOAD WEEK) . text
       refusal  2px border on ALL FOUR sides . a literal "!" (aria-hidden) .
                a headline that refuses . tappable rows
     Status is never carried by colour: the sentence carries it, and the
     up/down glyph beside the kicker is redundant and aria-hidden (B-13). */
  .advice,.refuse{background:var(--bg); border-radius:var(--r); padding:9px var(--s3);
    margin-bottom:var(--s3)}
  .advice{border-left:3px solid var(--dim)}
  .refuse{border:2px solid var(--red-hi)}
  .advice p,.refuse p{font-size:.8125rem; line-height:1.45; color:var(--dim)}
  .refuse p{color:var(--bone)}
  .advice p+p,.refuse p+p{margin-top:6px}
  .advice .kick{margin-bottom:4px}
  .advice .kick .dir{margin-left:5px}
  /* THE VERDICT SLOT. Reserved height, from first paint, so the card cannot
     grow under his thumb when the verdict replaces the reminder (0.1 #2).
     7.75rem is MEASURED, not chosen: every verdict PHAT.verdict can return
     for all 42 slots, at every rep outcome, deloaded and not, was rendered
     into this box at a 400px viewport and the tallest was 124px - `Top of
     range on all 3 sets at zero load. Add 2.5 kg next session.` with Rule
     I2's second line under it. The reminder is 90px, so 34px of the slot is
     deliberately empty on most cards. That is the price of the card not
     moving, and it is paid below the last input, where it costs a scroll and
     never a mis-tap. rem, so 200% text scales the reservation too. */
  .vslot{min-height:7.75rem}

  /* -- PROGRESS PIPS (spec 0.5, B-59) ---------------------------------------
     The prototype painted three states in one form at three alphas, the
     lowest 1.7:1. Raising it to a passing 4.0:1 would make an upcoming pip
     look like a completed one and erase the only thing the strip is for. So
     the meaning moved: the accessible carrier is the TEXT `Exercise 3 of 7`,
     the strip is aria-hidden redundant graphics, and every painted pip
     distinguishes by FORM as well as value - filled bar (done), amber and
     double height (current), outline only (upcoming). Nothing meaningful is
     under 3:1 and "not done yet" still reads as empty. Greyscale-safe.     */
  .pips{display:flex; gap:3px; align-items:flex-end; padding:var(--s2) var(--s4) 0}
  .pip{flex:1; height:4px}
  .pip.done{background:var(--t45)}
  .pip.now{background:var(--amber); height:8px}
  .pip.next{background:none; border:1px solid var(--t45); height:4px}

  /* ==== W7: THE SESSION SCREEN ============================================
     ORDER IS NORMATIVE (spec 4.1): header, pips, fix bar, reintroduction
     offer, name + target, prescription, movement & cue, SET ROWS, add/remove,
     NOTE (the last input), then the bottom stack, then prev/next, then
     DISCARD SESSION, then the rest band in the dock. Nothing that appears or
     resizes sits above an input, which is the rule that makes this safe. */
  .sesshead{padding:20px var(--s4) 0}
  .sesshead .kick{color:var(--faint)}
  /* The fix bar (spec 2.3 rule 3). Rides the exercise screen he was sent to
     for as long as a refusal stands. FIXED height, never disappears while the
     refusal stands - only its text changes - and it renders at FIRST PAINT of
     that screen, so it is a navigation and not an appearance. */
  .fixbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:var(--s2); margin:var(--s3) var(--s4) 0; padding:0 0 0 var(--s3);
    border:2px solid var(--red-hi); border-radius:var(--r); min-height:var(--key)}
  .fixbar p{color:var(--bone); font-size:.8125rem; font-weight:800; line-height:1.3}
  .fixbar button{color:var(--amber); font-size:.6875rem; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; min-height:var(--key); min-width:6.5rem; padding:0 var(--s3); flex:none}
  /* Rule V1's reintroduction offer. First exercise screen only, answerable
     without scrolling from where it appears, "Not yet" lowest and therefore
     the cheapest tap. Inline, never an overlay, never a focus trap. */
  .offer{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    margin:var(--s3) var(--s4) 0; padding:14px var(--s4)}
  .offer p{color:var(--bone); font-size:.875rem; line-height:1.45}
  .offer .btns{margin-top:var(--s3)}
  .offer .btns button{width:100%}
  .offer .btns button+button{margin-top:var(--s2)}
  .exname{padding:var(--s4) var(--s4) 0}
  /* session 0.1 #9: the TARGET never wraps, truncates or shrinks. The name is
     what gives way, so it gets min-width:0 and the target gets flex:none. */
  .exname .row{align-items:baseline}
  .exname h3{min-width:0; overflow-wrap:anywhere}
  .rx{color:var(--dim); font-size:.8125rem; line-height:1.45; padding:6px var(--s4) 0}
  /* MEASURED at 200% text: two 8rem controls side by side are 552px inside a
     368px column and put 137px of horizontal scroll on the session screen.
     They wrap instead - nothing shrinks, the row grows downward, and
     downward is allowed because everything below these is a control. */
  .ctlrow{display:flex; flex-wrap:wrap; gap:var(--s2); padding:0 var(--s4) var(--s3)}
  .ctlrow button{flex:1 1 8rem; min-height:var(--key); min-width:8rem;
    border:2px solid var(--line); border-radius:var(--r); color:var(--bone);
    font-size:.75rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:0 var(--s2)}
  /* Removing the last remaining row is not offered (spec 4.5 rule 6). The
     SPACER keeps the row's height and width identical either way, so the note
     field below it never moves - an input may not be shifted by a control
     appearing or disappearing above it (0.1 #1). */
  .ctlrow .spacer{flex:1 1 8rem; min-width:8rem; min-height:var(--key)}
  .notewrap{padding:0 var(--s4) var(--s3)}
  .stack{padding:0 var(--s4)}
  .navrow{display:flex; flex-wrap:wrap; gap:var(--s2); padding:0 var(--s4)}
  .navrow button{min-height:52px; border:2px solid var(--line); border-radius:var(--r);
    color:var(--bone); font-size:.75rem; font-weight:800; letter-spacing:.05em;
    text-transform:uppercase; padding:0 var(--s3)}
  .navrow .prev{flex:none; min-width:56px}
  /* Exercise 1 has nothing behind it. The control still occupies its slot, so
     NEXT does not move between screen 1 and screen 2 and his thumb has one
     target, but it must not READ as tappable. */
  .navrow button[disabled]{color:var(--faint); border-color:var(--rule); cursor:default}
  .navrow .next{flex:1 1 auto; min-width:0; background:var(--amber); color:var(--bg);
    border-color:var(--amber); overflow-wrap:anywhere}
  /* -- THE REST BAND (Rule R1, spec 4.10) ----------------------------------
     It lives inside #dock, so the space it occupies is reserved by the same
     measured padding-bottom that keeps an input clear of the nav (B-36). It is
     PERMANENT from the moment the session opens, so it never appears and never
     covers the row he just committed. It absorbs taps and does nothing.
     Its text is written through ONE cached text node and render() is never
     called from the tick (B-61, B-19). */
  #rest{background:var(--surface); border-top:1px solid var(--line);
    padding:var(--s2) var(--s4); min-height:3.4rem; display:flex; align-items:center}
  #rest p{color:var(--bone); font-size:.8125rem; font-weight:800; line-height:1.35}
  .primary{width:100%; background:var(--amber); color:var(--bg); border-radius:var(--r);
    padding:var(--s4); font-size:.9375rem; font-weight:800; letter-spacing:.04em;
    text-transform:uppercase; min-height:56px}
  .ghostbtn{width:100%; background:transparent; color:var(--bone); border:2px solid var(--line);
    border-radius:var(--r); padding:var(--s3); font-size:.8125rem; font-weight:800;
    letter-spacing:.05em; min-height:var(--key)}
  .link{color:var(--bone); font-size:.8125rem; font-weight:800}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:var(--s4)}
  .row{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3)}
  .big{font-size:1.5rem; font-weight:800; letter-spacing:-.02em; color:var(--bone)}
  .warn{background:var(--surface); border-left:3px solid var(--red); border-radius:var(--r); padding:14px var(--s4)}

  .sess{display:flex; align-items:center; justify-content:space-between; gap:var(--s3);
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:var(--s3) var(--s4); margin-bottom:var(--s2)}
  .sess .sn{font-size:.90625rem}
  .sess .sd{color:var(--faint); font-size:.78125rem; margin-top:2px}
  .sess .sv{color:var(--dim); font-family:var(--mono); font-size:.8125rem; flex:none}

  /* ==== W8: THE SUMMARY SCREEN ===========================================
     A READ of the draft and nothing else. Every rule below is about not
     overflowing 400px, because the three things this screen prints - an
     exercise name, a list of sets and a verdict sentence - are all
     arbitrary-length strings the user and the engine own.
       - the counters WRAP rather than squeeze (three 6rem cells do not fit
         one 368px line at 200% text, so they become two lines and then
         three; nothing shrinks);
       - the set list is its OWN full-width line under the name, never beside
         it. Nine sets beside a long name is the B-37 squeeze in a new place;
       - the name and the note both get overflow-wrap:anywhere, because a
         plan editor (W15) can produce a name with no spaces in it.
     .vslot IS DELIBERATELY ABSENT from the verdict blocks here. That
     reservation exists so the session card cannot grow under a thumb while
     he types; nothing on this screen re-renders and nothing on it is an
     input, so reserving 7.75rem nine times would only push SAVE SESSION off
     the bottom of a phone. */
  .sumhead{padding:var(--s4) var(--s4) 0}
  .sumhead h3{overflow-wrap:anywhere}
  .sumnums{display:flex; flex-wrap:wrap; gap:var(--s3); margin-top:14px;
    border-top:2px solid var(--rule); padding-top:11px}
  .sumnums>div{flex:1 1 6rem; min-width:6rem}
  .sumnums .v{font-size:1.3125rem; font-weight:800; color:var(--bone);
    letter-spacing:-.01em; margin-top:3px}
  .sumcount{color:var(--dim); font-size:.8125rem; line-height:1.45; margin-top:10px}
  .sumex{border-bottom:1px solid var(--line); padding:var(--s3) 0}
  .sumex .nm{color:var(--bone); font-size:.9375rem; font-weight:800;
    min-width:0; overflow-wrap:anywhere}
  /* SKIPPED is a STATE, not a verdict, and it is never rendered as one: no
     enclosure, no kicker, no arrow, and --dim rather than the .45 the
     prototype used (spec 5.2, 0.5 - text may not go below --t55). */
  .sumskip{color:var(--dim); font-size:.6875rem; font-weight:800;
    letter-spacing:.12em; text-transform:uppercase; flex:none}
  .sumsets{color:var(--dim); font-family:var(--mono); font-size:.8125rem;
    line-height:1.5; margin-top:5px; overflow-wrap:anywhere}
  .sumnote{color:var(--dim); font-size:.8125rem; line-height:1.45;
    margin-top:6px; overflow-wrap:anywhere}
  .sumex .advice,.sumex .refuse{margin-top:9px}
  /* Spec 5.2 table: the commit is full width x 56. .navrow's 52 is the
     session screen's number; Save is the one control on this screen and it
     gets the larger one. */
  #finish{min-height:56px}

  /* ==== W10: THE TREND SCREEN ============================================
     The week-6 card and four per-lift rows. NO HUE CARRIES MEANING ON ITS
     OWN here either: the card's red rule sits beside a sentence that opens
     "no progress", and every delta carries + or − in front of the number,
     so the screen reads in greyscale (B-13, spec 3.1 rule 3).
     .tcard is NOT .warn: .warn is the app's refusal/alarm shape and three of
     stallAdvice's five states are not alarms. Same geometry, and only the
     stalled state takes the red rule. */
  .tcard{background:var(--surface); border-left:3px solid var(--dim);
    border-radius:var(--r); padding:14px var(--s4)}
  .tcard.stall{border-left-color:var(--red)}
  .tcard p{color:var(--dim); font-size:.8125rem; line-height:1.45; margin-top:6px}
  .tcard p.lead{color:var(--bone); font-size:.90625rem; font-weight:800; line-height:1.35}

  /* THE CHART YIELDS BEFORE THE LABEL DOES. The row is STACKED, so at any
     text size the name owns a full-width line and there is no width for the
     chart to take from it. The head wraps rather than squeezing: at 200%
     text the delta drops onto its own line and the name is still whole.
     min-width:0 lets the name shrink to wrapping instead of forcing the
     flex row wider than the column (the B-37 squeeze, one screen over). */
  .tl{border-top:1px solid var(--line); padding:var(--s3) 0}
  .tlhead{display:flex; flex-wrap:wrap; align-items:baseline;
    justify-content:space-between; gap:var(--s1) var(--s3)}
  .tlname{color:var(--bone); font-size:.9375rem; font-weight:800; min-width:0}
  .tldelta{font-family:var(--mono); font-size:.875rem; color:var(--dim); white-space:nowrap}
  .tldelta.up{color:var(--green)}
  .tldelta.dn{color:var(--red)}
  /* 44px tall, in px, so it does not grow with the text and crowd the
     label out. viewBox height matches, so y is 1:1 — see spark(). */
  .tlspark{display:block; width:100%; height:44px; margin-top:var(--s2)}
  .tlfoot{display:flex; flex-wrap:wrap; justify-content:space-between; gap:var(--s1) var(--s3);
    color:var(--faint); font-size:.75rem; margin-top:var(--s1)}
  .tlnone{color:var(--faint); font-size:.8125rem; line-height:1.45; margin-top:var(--s2)}

  /* ==== W11: THE WEIGHT SCREEN ============================================
     ORDER IS NORMATIVE (spec 7.1): average, change, calorie decision, entry,
     last 7. The AVERAGE is the biggest thing on the screen - it is the
     question this tab answers - so the screen title is a .hd kicker pair and
     not an h1. That also retires the one measured horizontal overflow on this
     tab: at 200% text the old `<h1>Bodyweight</h1>` was 432px of min-content
     in a 353px column.
     NOTHING HERE IS ENCODED IN HUE (spec 3.1 rule 3). The rate is --bone, in
     every band, good or bad; the sentence under it is the carrier. The old
     build coloured it green/red off a band that was itself wrong, so the
     colour and the advice could disagree - and the --red it used measured
     2.8:1 on --surface. Greyscale this screen and every state still reads. */
  .bwavg{padding:18px var(--s4) 0}
  /* 52px, over the 38px h1, so it is unambiguously the primary. Its own line:
     at 200% text a 104px number and a 32px unit on one baseline row is 6px of
     horizontal scroll, measured. */
  .bwbig{font-size:3.25rem; font-weight:800; letter-spacing:-.03em; line-height:.95;
    color:var(--bone); margin-top:var(--s1)}
  .bwbig .u{font-size:1.125rem; letter-spacing:0; margin-left:.1em}
  .bwchg{margin-top:10px}
  .bwchg span:first-child{color:var(--dim); font-size:.84375rem}
  /* --bone, never --green / --red. See the block comment above. */
  .bwchg .v{font-family:var(--mono); font-size:1.0625rem; color:var(--bone); flex:none}
  /* The calorie decision reuses W7's ADVICE enclosure (spec 2.1): 3px rule on
     the left edge only, a kicker that names the block, no glyph. One advice
     shape in the app, and it is not the refusal shape. The rule stays --dim
     in all eleven states - amber is the accent for "actionable", and the
     sentence that most often renders here says "Change nothing." */
  .advice .lead{color:var(--bone); font-size:.90625rem; line-height:1.45}
  .advice .ghostbtn{margin-top:var(--s3)}
  /* Entry. 48 x 48 keys here, not the session row's 44 x 48 (control
     inventory row 27) - there is only one stepper on this screen and no row
     arithmetic to satisfy. Wraps rather than shrinks at 200% text. */
  .bwentry{display:flex; gap:var(--s3); align-items:stretch; flex-wrap:wrap; margin-top:6px}
  .bwentry .stepper{flex:1 1 9rem; min-width:9rem}
  .bwentry .stepper button{min-width:var(--key)}
  .bwentry .primary{flex:1 1 8.25rem; width:auto; min-width:8.25rem; min-height:var(--key)}
  .bwrow{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
    border-bottom:1px solid var(--line); padding:10px 0}
  .bwrow .d{color:var(--dim); font-size:.78125rem}
  .bwrow .k{font-family:var(--mono); font-size:.84375rem; color:var(--bone); flex:none}

  /* -- THE DOCK -------------------------------------------------------------
     #dock is the bottom-anchored stack so the offer sheet sits above nav with
     no magic offset to keep in sync. fixed, not absolute: absolute pinned it
     to the bottom of the DOCUMENT and the Train tab is taller than a phone,
     so the sheet booted below the fold. #app's padding-bottom is set from
     this element's MEASURED height, so no input can hide under it (B-36).
     Five tabs at a 400px viewport are 80px each - over the 78px the control
     inventory asks for (spec 0.4 row 1) - and 52px tall, over the 44 floor. */
  /* left:0 + right:0 + auto margins is exactly the centring #view gets from
     margin:0 auto, resolved against the same width, so the two rects match to
     the pixel at every viewport width. Measured at 1920/1440/1024/768/400/320. */
  #dock{position:fixed; bottom:0; left:0; right:0; margin:0 auto;
    max-width:var(--col); z-index:40}
  nav{display:flex; background:var(--bg); border-top:2px solid var(--bone);
    padding-bottom:max(10px, env(safe-area-inset-bottom))}
  nav button{flex:1 1 0; min-width:0; min-height:52px; padding:var(--s3) 2px;
    font-size:.6875rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:var(--faint); overflow-wrap:anywhere; hyphens:auto}
  /* Selection is never colour alone: amber label + a 3px inset bar + 800 and
     aria-current="page". Greyscale it and the bar still says which. */
  nav button.on{color:var(--amber); box-shadow:inset 0 3px 0 var(--amber)}

  /* ---- W5: draft-restore sheets (W4 0.5-0.7) ----
     Variant A (offer) is non-modal and lives in #dock. Variant B (confirm) is
     modal and lives in #modal. Both share .sheet. */
  .sheet{background:var(--surface); border-top:2px solid var(--bone);
    border-radius:var(--r); padding:18px var(--s4) var(--s4)}
  .sheet .eyebrow{color:var(--bone); font-size:.6875rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase}
  .sheet h2{color:var(--bone); font-size:1.0625rem; font-weight:800; line-height:1.3; margin:6px 0 0}
  .sheet h2:focus{outline:none}
  .sheet .det{color:var(--dim); font-size:.875rem; font-weight:400; line-height:1.45; margin-top:6px}
  .sheet .rule{color:var(--bone); font-size:.8125rem; line-height:1.45; margin-top:var(--s3);
    border-left:3px solid var(--red-hi); padding-left:var(--s2)}
  .sheet .btns{margin-top:var(--s4)}
  .sheet .btns>button{display:block; width:100%}
  .sheet .btns>button+button{margin-top:var(--s3)}
  .sheet .primary{min-height:52px}
  .sheet .ghostbtn{min-height:var(--key)}
  /* Destructive: never colour alone - the label always names the count too. */
  .danger{border-color:var(--red-hi); color:var(--red-hi)}
  /* The scrim is the one fixed thing that is NOT column-width: it covers the
     viewport. Its contents are, and align to the column exactly. */
  #modal{position:fixed; left:0; right:0; top:0; bottom:0; z-index:60;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center}
  #modal:empty{display:none}
  #modal .scrim{position:absolute; left:0; right:0; top:0; bottom:0; background:var(--scrim)}
  #modal .sheet{position:relative; width:100%; max-width:var(--col)}
  .loading{color:var(--dim); font-size:.875rem; text-align:center; padding:44px var(--s4)}
  .warn.hi{border-left-color:var(--red-hi)}
  /* DISCARD SESSION is destructive and no longer lives in the header. A top
     corner may hold a control that is neither destructive nor frequent, and
     this is destructive and one tap from a whole session (0.4, 4.12,
     B-34 / C-13). It is now the last element in the session scroll. */
  #discard{min-height:var(--key); width:100%; padding:var(--s3);
    border:2px solid var(--line); color:var(--bone); border-radius:var(--r);
    font-size:.8125rem; font-weight:800; letter-spacing:.05em}

  /* fixed for the same reason as #dock: "Discarded." must be on screen.
     NOT a live region - #bs-live is the only one. See announce(). */
  #toast{position:fixed; bottom:92px; left:0; right:0; margin:0 auto; max-width:var(--col);
    z-index:70; display:flex; justify-content:center; align-items:stretch; gap:2px;
    padding:0 var(--s4); pointer-events:none; opacity:0; transition:opacity .18s}
  #toast.on{opacity:1}
  #toast .msg{background:var(--amber); color:var(--bg); padding:9px 17px; border-radius:var(--r);
    font-size:.8125rem; font-weight:800; display:flex; align-items:center; min-height:var(--key)}
  /* The undo control (spec 0.4 row 23, 2.4). It is the only part of the toast
     that takes a tap, and it does NOT expire on a timer: he is out of breath
     and reading something else, so it lives until he answers it, until another
     destructive action replaces it, or until the session ends. */
  #toast button{pointer-events:auto; background:var(--bg); color:var(--bone);
    border:2px solid var(--amber); border-radius:var(--r); min-width:88px; min-height:var(--key);
    font-size:.75rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:0 var(--s3)}
  #toast button[hidden]{display:none}

  /* ---- WO-001 W6: the blocked-save message (W4 2.2-2.3) ----
     Sits on --bg directly above Save session, where his thumb already is. */
  #bs-msg{border-left:3px solid var(--red-hi); padding-left:var(--s3); margin-bottom:14px}
  #bs-msg h2{color:var(--bone); font-size:.9375rem; font-weight:800; line-height:1.35; margin:0}
  #bs-msg h2:focus{outline:none}
  .bsre{color:var(--dim); font-size:.8125rem; line-height:1.45; margin-top:var(--s1)}
  .bslist{margin-top:10px; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
  .bsrow{display:flex; align-items:center; gap:10px; width:100%; min-height:var(--key);
    padding:9px var(--s3); background:var(--surface); text-align:left}
  .bsrow+.bsrow{border-top:1px solid var(--line)}
  .bsrow:active{background:var(--hi)}
  .bsex{color:var(--bone); font-size:.84375rem; line-height:1.3; flex:1}
  .bstok{color:var(--bone); font-size:.78125rem; font-weight:800; white-space:nowrap}
  .bschev{color:var(--amber); font-size:1.25rem; line-height:1}
  .bsmore{color:var(--dim); font-size:.8125rem; margin-top:var(--s2)}
  /* Announcements that must not be seen: the running count, the stepper
     normalisations, the verdict on commit, and a blocked draft write. */
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

  .legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:10px}
  .legend span{display:flex; align-items:center; gap:7px; color:var(--dim); font-size:.8125rem}
  .swatch{width:13px; height:3px; border-radius:var(--r)}
  label.check{display:flex; gap:var(--s3); align-items:flex-start; cursor:pointer; min-height:var(--tap)}
  /* 44x44, not 24x24. The wrapping label is already a 334x62 target, but a
     checkbox is independently focusable and tappable, so it carries the floor
     itself rather than borrowing its parent's (B-43). A native box at 44px
     paints as a bare white square on this ground, so it is drawn from the
     tokens instead: empty outline vs amber fill AND a tick — two signals, so
     it survives greyscale. */
  label.check input{-webkit-appearance:none; appearance:none; margin:0; flex:none;
    width:var(--tap); height:var(--tap); background:var(--bg); cursor:pointer;
    border:2px solid var(--line); border-radius:var(--r); display:grid; place-content:center}
  label.check input:checked{background:var(--amber); border-color:var(--amber)}
  label.check input:checked::after{content:""; width:17px; height:9px; display:block;
    border:3px solid var(--bg); border-top:0; border-right:0; transform:rotate(-45deg) translateY(-3px)}
  /* A screen W7 onward has not built yet. It says so; it does not pretend. */
  /* ==== W9: HOME, and W13a: SETTINGS =====================================
     ORDER ON HOME IS NORMATIVE (spec 13.1): header, then the ONE attention
     slot (storage notice / deload banner - the draft-restore offer is the
     third claimant and lives in #dock), then the next-session block, then the
     cycle line, then the rollback line, then the day list.
     THE BINDING MEASUREMENT: the day list must be reachable WITHOUT SCROLLING
     at 393 x 852. Measured on the real page - see the report. Nothing may be
     added above the day list without re-measuring it. */

  /* The one top-corner control the spec permits (0.4): non-destructive and
     infrequent. 88 x 44 of hit area, per control-inventory rows 7 and 43. The
     painted label is smaller than the box; the BOX is what takes the tap. */
  .topbtn{color:var(--amber); font-size:.6875rem; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; min-height:var(--tap); min-width:88px; flex:none;
    display:flex; align-items:center; justify-content:flex-end; padding:0}
  .topbtn.back{justify-content:flex-start; gap:var(--s1)}

  /* THE NEXT-SESSION BLOCK. The screen's question is "what do I train now",
     and this is the answer, so it is the only amber field in the app - amber
     means actionable and nothing on Home is more actionable than this. Text on
     it is --bg (9.3:1). START SESSION inverts back to amber-on-bg inside it so
     the button still reads as the accent and not as a hole in the panel.
     Full-bleed inside the column: the button spans the block's own padding, so
     it is the widest target on the screen. */
  .nextblk{background:var(--amber); color:var(--bg); padding:16px var(--s4) 0; margin-top:var(--s3)}
  .nextblk .nk{font-size:.6875rem; font-weight:800; letter-spacing:.12em;
    text-transform:uppercase; color:var(--bg); opacity:.8; display:block}
  .nextblk h2{font-size:2.125rem; font-weight:800; letter-spacing:-.025em; line-height:1.02;
    margin:7px 0 0; color:var(--bg); overflow-wrap:anywhere}
  .nextblk .nm2{font-size:.8125rem; margin-top:9px; padding-bottom:var(--s4); color:var(--bg)}
  #start-next{display:block; width:calc(100% + var(--s4) * 2); margin:0 calc(var(--s4) * -1);
    background:var(--bg); color:var(--amber); border-radius:var(--r);
    min-height:56px; padding:var(--s4); font-size:.9375rem; font-weight:800;
    letter-spacing:.04em; text-transform:uppercase; text-align:left;
    display:flex; align-items:center; justify-content:space-between; gap:var(--s3)}

  /* The cycle line (C-10). EXACTLY ONE of these renders, ever. `divergence`
     and `explain` are part of the SAME block and are not a second state line -
     they are indented under it by nothing but type size, so they cannot be
     mistaken for a second claim about the week. */
  .cycle{padding:var(--s4) var(--s4) 0}
  .cycle p{color:var(--bone); font-size:.875rem; line-height:1.45}
  .cycle .div{color:var(--dim); font-size:.8125rem; line-height:1.45; margin-top:6px}
  .cycle .exp{color:var(--faint); font-size:.75rem; line-height:1.5; margin-top:3px}
  .cycle .ghostbtn{margin-top:10px}

  /* The D1 banner. Advice, not refusal, so it takes the 3px left rule and no
     glyph (spec 2.1) - a deload is a recommendation and must not wear the
     shape the app uses to refuse a save. Answerable where it stands: both
     buttons are inside it, full width, 48px, and `Not now` is LOWEST and
     therefore the closer tap. Never in a top corner. */
  .dbanner{background:var(--surface); border-left:3px solid var(--dim);
    border-radius:var(--r); margin:var(--s3) var(--s4) 0; padding:14px var(--s4)}
  .dbanner p{color:var(--bone); font-size:.875rem; line-height:1.45}
  .dbanner p+p{margin-top:7px}
  .dbanner .btns{margin-top:var(--s3)}
  /* BOTH ANSWERS ARE GHOST BUTTONS, matching Rule V1's offer on the session
     screen (vOffer). Deliberately NOT an amber primary on either: amber means
     actionable, and painting `Not now` amber would make the app's loudest
     control point at doing nothing, while painting `Start deload week` amber
     would push a recommendation the spec says is recommended and never
     imposed. Two equal-weight answers, `Not now` lowest and therefore the
     closer tap. */
  .dbanner .btns button{width:100%; min-height:var(--key)}
  .dbanner .btns button+button{margin-top:var(--s3)}

  /* The day list. `{wd} . {day}` - B-31. The weekday is the label the brief
     fixes (Mon/Tue/Thu/Fri/Sat) and it is what makes the rest day legible
     without renumbering a single stored id (C-5). */
  .daybtn .wd{color:var(--faint); font-size:.6875rem; font-weight:800;
    letter-spacing:.12em; text-transform:uppercase; display:block; margin-bottom:3px}

  /* The Home macro strip (spec 13.7, B-29). It is NOT a control: the spec
     gives it as cells, the control inventory has no row for it, and the Diet
     tab is already one tap away in the dock. Nothing here is tappable, so it
     adds nothing to the 44px inventory.
     ONE LINE OF FIGURES, not the Diet tab's four cells, because the engine
     ships `text.strip` for exactly this row and a joined string cannot be
     re-spaced or re-rounded by a layout. The mono size is deliberately below
     the Diet tab's 1.375rem - this is a reminder, and the tab is the screen
     that owns the detail.
     MEASURED at 400px: the longer of the two strings (the training day,
     `3,200 · 170 g · 300 g · 145 g`) sets 271px inside a 334px content box -
     one line, 63px spare - and 271px inside 327px at 393px. At 200% text it
     wraps once, at its own separator, so no figure is split from its unit.
     overflow-wrap is `anywhere` as a floor and not a plan: it can only fire
     on a viewport narrower than a single figure. */
  .mstrip{background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); padding:13px var(--s4)}
  .mstrip .day{color:var(--bone); font-size:.875rem; font-weight:800; line-height:1.35}
  .mstrip .key{margin-top:10px}
  .mstrip .v{font-family:var(--mono); font-size:1.0625rem; color:var(--bone);
    line-height:1.3; margin-top:4px; display:block; overflow-wrap:anywhere}

  /* ---- SETTINGS ---------------------------------------------------------
     Three sections and nothing else. What is NOT here is the point: the
     volume toggle (C-1, B-23), the weight-increment segment (C-3, B-58) and
     the empty-log switch (spec 2.4 item 9) are DELETED, not moved and not
     resized. None of the three exists in this file in any state. */
  .seg{display:flex; flex-wrap:wrap; gap:var(--s2); margin-top:11px}
  .seg button{flex:1 1 7.5rem; min-width:7.5rem; min-height:var(--key);
    border:2px solid var(--line); border-radius:var(--r); color:var(--bone);
    font-size:.75rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    display:flex; align-items:center; justify-content:center; gap:var(--s2); padding:0 var(--s2)}
  /* Selection is never colour alone (B-13), and MEASURED ON SCREEN the amber
     border alone was not enough: at 400 px the 2px border reads as "this one
     is styled differently", not as "this one is on", and in greyscale the two
     borders are near-identical. So the carrier is a MARK WITH TWO FORMS -
     empty outline vs solid fill - the same pair label.check already uses for
     a checkbox, at identical size in both states so nothing reflows on a tap.
     aria-pressed is the accessible carrier; amber is the third signal and the
     only one that needs colour.
     A TICK GLYPH WAS CONSIDERED AND REJECTED: U+2713 is outside the inlined
     Archivo unicode-range, so it would fall back per-glyph at a different
     size and baseline - precisely the defect B-67 closed for U+2304. The mark
     is DRAWN, so there is no glyph to fall back. Check any new glyph against
     the range at the foot of archivo-inline.css. */
  .seg .mk{width:14px; height:14px; flex:none; border:2px solid var(--line);
    border-radius:var(--r); display:block}
  .seg button[aria-pressed="true"]{border-color:var(--amber); color:var(--amber)}
  .seg button[aria-pressed="true"] .mk{background:var(--amber); border-color:var(--amber)}
  .setsec{padding:20px var(--s4) 0}
  .setsec .ghostbtn{margin-top:11px}
  .setsec .tiny{margin-top:11px}
  /* Export's two outcomes, and they do not look alike (B-16, spec 10.4).
     Success is the advice enclosure; failure is the four-sided refusal. */
  .setsec .advice,.setsec .refuse{margin-top:11px}
  /* E-3. The backup form and the typed-confirmation field. Same box as .note:
     48px tall, 2px --line, --bg fill, so a text field looks like one thing
     everywhere in the app. The label is the --lbl kicker, block, above. */
  .bklbl{display:block; color:var(--dim); font-size:.6875rem; font-weight:800; letter-spacing:.12em;
    text-transform:uppercase; margin-top:var(--s3)}
  .bkin{width:100%; background:var(--bg); color:var(--bone); border:2px solid var(--line);
    border-radius:var(--r); padding:var(--s3); font-size:1rem; font-weight:800; margin-top:var(--s1);
    min-height:var(--key); font-family:var(--sans)}
  .setsec button[disabled]{opacity:.5; cursor:default}
  .sheet .bklbl{margin-top:var(--s3)}

  /* ---- W12: DIET (spec 8, coach addendum 8.6) ---------------------------
     EVERY NUMBER AND EVERY SENTENCE ON THIS SCREEN COMES OUT OF
     PHAT.dietTargets. Nothing here formats a figure and nothing here writes a
     macro word. If you find yourself typing 3,200 in this file, that is the
     bug (see vDiet's comment).
     The segment reuses .seg unchanged - 7.5rem = 120px min-width and 48px
     min-height is exactly control-inventory row 31, and its mark is the drawn
     outline/fill pair, not a glyph (B-67). */
  /* The grid. Two columns at 400px: four cells in one row would put the
     mono figures at 5rem of min-content each and scroll the column
     sideways. Labels are .lbl, which is --faint (.55) - the prototype's .50
     is 4.3:1 on --surface (spec 0.5). */
  /* MEASURED at 200% text: `1fr 1fr` with the default auto minimum let
     CARBOHYDRATE's min-content (252px at 22px + .12em) size the first track,
     which pushed the second column 41px past the viewport. minmax in REM
     collapses the grid to ONE column the moment half the column is narrower
     than a cell needs - no media query, and nothing about the phone changes -
     and min-width:0 stops a long label sizing a track ever again. */
  .macro{display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));
    gap:var(--s2); margin-top:var(--s3)}
  .macro .cell{background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); padding:var(--s3) var(--s4); min-width:0}
  .macro .v{font-family:var(--mono); font-size:1.375rem; color:var(--bone);
    line-height:1.15; margin-top:var(--s1); display:block}
  /* The day label. It is a CLAIM ("Today - ...") or it is not, and which one
     is the engine's decision - see dietTargets' claimsToday. */
  .dayline{color:var(--bone); font-size:1rem; font-weight:800; line-height:1.3; margin-top:var(--s3)}
  /* THE PROTEIN TICK IS A HABIT TICK, NOT DATA (addendum 8.6, ruled). It is
     styled as a control and never as a logged figure: no mono face, no
     number, no kg. Same two-form mark as .seg and label.check - outline vs
     amber fill - so it survives greyscale, and the LABEL TEXT changes too, so
     it survives both. The rules are repeated here rather than shared with
     .seg because .seg's are scoped to .seg buttons and this is not one. */
  #protein{width:100%; min-height:56px; display:flex; align-items:center; gap:var(--s3);
    background:var(--surface); border:2px solid var(--line); border-radius:var(--r);
    padding:10px var(--s4); text-align:left; margin-top:var(--s4)}
  #protein .mk{width:14px; height:14px; flex:none; border:2px solid var(--line);
    border-radius:var(--r); display:block}
  #protein[aria-pressed="true"]{border-color:var(--amber)}
  #protein[aria-pressed="true"] .mk{background:var(--amber); border-color:var(--amber)}
  #protein .t{font-size:.8125rem; font-weight:800; letter-spacing:.06em;
    text-transform:uppercase; color:var(--bone); display:block}
  #protein[aria-pressed="true"] .t{color:var(--amber)}
  #protein .s{color:var(--dim); font-size:.78125rem; line-height:1.4; margin-top:3px; display:block}
  .dietsec{padding:var(--s6) var(--s4) 0}
  .dietsec p{color:var(--dim); font-size:.8125rem; line-height:1.5}
  .dietsec p+p{margin-top:var(--s2)}

  /* ---- ONBOARDING (spec 10.1) -------------------------------------------
     Writes exactly one key and clears nothing. START WITH AN EMPTY LOG sets a
     flag; it is not an erase and cannot become one. */
  .obplan{background:var(--surface); border-left:3px solid var(--amber);
    border-radius:var(--r); padding:14px var(--s4); margin-top:var(--s2)}
  .obplan .pn{font-size:1rem; font-weight:800; color:var(--bone)}
  /* ==== W14/W15: PLANS AND THE PLAN EDITOR (WO-006, spec 9) ===============
     EVERY CONTROL IS >= 44 x 44 - the prototype's were 13-20 px and this is
     where the audit was worst. Arrows and the cross are DRAWN (inline SVG),
     never glyphs: U+2191/U+2193/U+2715 are outside the inlined Archivo
     subset and would fall back per-glyph (B-67). Selection and state are
     never colour alone: the active row carries the word ACTIVE, an open day
     carries aria-expanded, a cut accessory carries the word CUT.
     SAVE PLAN is at the bottom, full width, 56 px; DISCARD CHANGES is last
     in the scroll; the only top-corner control is ` Plans`, which is
     neither destructive nor frequent (spec 0.4). */
  .planrow{width:100%; display:flex; align-items:flex-start; justify-content:space-between;
    gap:var(--s3); background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:14px var(--s4); margin-bottom:var(--s2); text-align:left; min-height:64px}
  .planrow.on{border-color:var(--amber); border-left-width:3px}
  .planrow.build{background:transparent; border-style:dashed}
  .planrow.broken{border-color:var(--red)}
  .planrow .ptxt{min-width:0; flex:1 1 auto}
  .planrow .pn{color:var(--bone); font-size:.9375rem; font-weight:800; display:block; overflow-wrap:anywhere}
  .planrow .pm{color:var(--dim); font-size:.78125rem; margin-top:4px; display:block; line-height:1.4}
  .planrow .badge{color:var(--amber); font-size:.6875rem; font-weight:800; letter-spacing:.12em;
    text-transform:uppercase; flex:none; padding-top:3px; text-align:right; max-width:9rem}
  .planrow .badge.bad{color:var(--red)}
  .pename{width:100%; background:var(--bg); color:var(--bone); border:2px solid var(--line);
    border-radius:var(--r); padding:0 var(--s3); font-size:1.25rem; font-weight:800;
    letter-spacing:-.02em; min-height:var(--key); font-family:var(--sans); margin-top:var(--s1)}
  .pemeta{color:var(--dim); font-size:.8125rem; margin-top:8px; line-height:1.45}
  .peday{border-top:1px solid var(--line)}
  .pedayrow{display:flex; align-items:center; gap:var(--s2); padding:var(--s1) 0; min-height:52px}
  .pebtn{min-width:var(--tap); min-height:var(--tap); flex:none; display:flex; align-items:center;
    justify-content:center; border:2px solid var(--line); border-radius:var(--r); color:var(--bone);
    background:var(--hi); padding:0; font-size:1.125rem; font-weight:800; line-height:1}
  .pebtn:active{background:var(--amber); color:var(--bg)}
  .pebtn[disabled]{color:var(--faint); border-color:var(--rule); background:transparent; cursor:default}
  .pebtn svg{width:14px; height:14px; display:block}
  .pebtn.pex{color:var(--amber)}
  .pedayname{flex:1 1 auto; min-width:0; min-height:52px; text-align:left; display:flex;
    flex-direction:column; justify-content:center; padding:0 var(--s2); gap:2px}
  .pedayname .nm{color:var(--bone); font-size:1rem; font-weight:800; overflow-wrap:anywhere}
  .pedayname .meta{color:var(--faint); font-size:.75rem}
  button.pedayname[aria-expanded="true"] .nm{color:var(--amber)}
  .pebody{padding:0 0 var(--s3)}
  .pein{width:100%; background:var(--bg); color:var(--bone); border:2px solid var(--line);
    border-radius:var(--r); padding:0 var(--s3); font-size:1rem; font-weight:800;
    min-height:var(--key); font-family:var(--sans); margin-top:var(--s1)}
  .peex{border-top:1px solid var(--rule); padding:var(--s2) 0}
  .peex .pein{margin-top:0}
  .pectl{display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2); margin-top:var(--s2)}
  .penrow{display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2)}
  /* WO-007: the name field keeps 12rem or takes the line; a long tag (HYPERTROPHY at 200 %) wraps under it rather than squeezing it. */
  .penrow .pein{flex:1 1 12rem; width:auto; min-width:0}
  .penrow .cut,.rot .cut{color:var(--faint); font-size:.6875rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; flex:none}
  .petgt{min-height:var(--tap); min-width:5.5rem; padding:0 var(--s2); display:flex; align-items:center;
    justify-content:center; gap:6px; color:var(--amber); font-weight:800; font-size:.8125rem;
    white-space:nowrap; border:2px solid var(--line); border-radius:var(--r); background:transparent}
  .petgt[aria-expanded="true"]{border-color:var(--amber)}
  .perange{display:flex; flex-wrap:wrap; gap:var(--s3); padding:var(--s2) 0 0}
  .perange .grp{flex:1 1 8.5rem; min-width:8.5rem}
  .perange .pev{flex:1 1 auto; min-width:48px; min-height:var(--key); display:flex; align-items:center;
    justify-content:center; background:var(--bg); color:var(--bone); font-weight:800; font-size:1.0625rem}
  .peform{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:var(--s3) var(--s4) var(--s4); margin-top:var(--s3)}
  .peform .lbl{margin-top:var(--s3)}
  .peform .seg{margin-top:var(--s1)}
  .peform .tiny{margin-top:var(--s2)}
  .peform select.bkin{appearance:none; -webkit-appearance:none}
  .rorow{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
    padding:9px 0 9px var(--s2); border-top:1px solid var(--rule)}
  .rorow .ron{color:var(--dim); font-size:.875rem; min-width:0; overflow-wrap:anywhere}
  .rorow .rot{color:var(--dim); font-family:var(--mono); font-size:.8125rem; flex:none; white-space:nowrap}
  .pebottom{padding:var(--s4) var(--s4) var(--s8)}
  .pebottom .ghostbtn{margin-top:var(--s3)}
  .pebottom .primary[disabled]{background:var(--surface); color:var(--faint); cursor:default}
  /* ==== WO-007 W4: the re-split (spec 9.9) ===============================
     The cross-day move is a TEXT button on its own line under line 1 - the
     control line is already 348 px of 368 at 400 px, so a seventh glyph would
     wrap alone and read as a fault (9.9.1). Bordered like .petgt, never
     amber: amber is the live thing and this row is not it. */
  .pemv{margin-top:var(--s2)}
  .pemove{min-height:var(--tap); min-width:132px; padding:0 var(--s3); display:inline-flex;
    align-items:center; border:2px solid var(--line); border-radius:var(--r); color:var(--bone);
    background:transparent; font-size:.8125rem; font-weight:800; letter-spacing:.02em; text-align:left}
  .pemove:active{background:var(--amber); color:var(--bg)}
  /* The kind tag on a MIXED day (coach q2): same form as CUT, a word, never a
     colour. Absent on a day whose heading still governs. */
  .penrow .kind{color:var(--faint); font-size:.6875rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; flex:none}
  /* The move sheet's list variant (9.9.3). The list scrolls; Not now is
     pinned below it, so the safe tap is never below the fold. */
  .mvlist{margin-top:var(--s3); max-height:46vh; overflow-y:auto; border:1px solid var(--rule); border-radius:var(--r)}
  .mvrow{width:100%; min-height:48px; display:flex; align-items:center; justify-content:space-between;
    gap:var(--s3); padding:var(--s2) var(--s3); text-align:left; background:transparent; border-left:3px solid transparent}
  .mvrow+.mvrow{border-top:1px solid var(--rule)}
  .mvrow .nm{color:var(--bone); font-size:1rem; font-weight:800; min-width:0; overflow-wrap:anywhere}
  .mvrow .ct{color:var(--dim); font-size:.8125rem; flex:none}
  /* Armed after a warn-once (K2): the sentence names the day; the rule is redundant. */
  .mvrow[aria-pressed="true"]{border-left-color:var(--amber)}
  .sheet .btns .mvno{min-height:52px}
  .sheet .rule p+p{margin-top:6px}
  /* The Plans list's way in (9.9.7): PRIMARY while no plan of his exists,
     the same row as a ghost once one does. Build from empty stays dashed. */
  .planrow.dup{background:transparent; border:2px solid var(--line); min-height:56px}
  .planrow.dup.prim{background:var(--amber); border-color:var(--amber)}
  .planrow.dup.prim .pn,.planrow.dup.prim .pm{color:var(--bg)}
  .planrow.build{min-height:48px}
  .todo{padding:var(--s6) var(--s4)}
  .todo p{color:var(--dim); font-size:.875rem; line-height:1.55; margin-top:var(--s3); max-width:32em}
  .mb12{margin-bottom:var(--s3)} .mt12{margin-top:var(--s3)}
  .mt16{margin-top:var(--s4)} .mt24{margin-top:var(--s6)}
</style>
</head>
<body>

<div id="app">
  <div id="view"></div>
  <!-- The visible toast is decoration over the live region below: it carries
       no aria-live of its own, because two regions over one sentence are read
       twice. toast() routes its text through announce() instead. -->
  <!-- aria-hidden is on the MESSAGE, not on the container: the visible text is
       decoration over #bs-live, which has already said it, but the undo
       control is a real control and a focusable button inside an aria-hidden
       subtree is a control a screen-reader user can reach and cannot hear. -->
  <div id="toast"><span class="msg" aria-hidden="true"></span><button id="toast-act" hidden></button></div>
  <!-- WO-004 W6: THE ONE LIVE REGION. Blocked-save running count, stepper
       normalisations, the verdict on commit, a blocked draft write. Created
       once at boot and outside #view, so no re-render can destroy it — a live
       region that is recreated is a live region that is never announced. -->
  <p id="bs-live" role="status" aria-live="polite" class="sr-only"></p>
  <div id="dock">
    <!-- Draft-restore offer sheet (non-modal). Above nav, never covering it. -->
    <div id="dr-offer"></div>
    <!-- W7: Rule R1's rest band. Sticky above the tab dock by being IN the
         dock, so reserveDock() reserves its height along with nav's and no
         input can hide under it. Present from the moment a session opens, at
         constant size, so it never appears over the row he just committed. -->
    <div id="rest-box"></div>
    <!-- Five tabs. 400px / 5 = 80px each, over the 78px the control inventory
         asks for, and 52px tall. aria-current, not colour, says which. -->
    <nav aria-label="Screens">
      <button data-tab="train" class="on" aria-current="page">Train</button>
      <button data-tab="trend">Trend</button>
      <button data-tab="weight">Weight</button>
      <button data-tab="diet">Diet</button>
      <button data-tab="plan">Plan</button>
    </nav>
  </div>
  <!-- Modal confirmations. Empty = display:none, so it never eats a tap. -->
  <div id="modal"></div>
</div>

<!-- Pure logic: dates, validation, migration. Classic script, no module, so it
     works from file://. index.html cannot run without it. -->
<script src="logic.js"></script>
<script>
(function(){
"use strict";
/* logic.js missing (a partial deploy) used to mean a black screen. Say so. */
if(!window.PHAT){
  document.getElementById("view").innerHTML =
    '<div style="padding:26px 16px;color:var(--bone);font-family:var(--sans)">'+
    '<h1 style="font-size:1.25rem;margin:0 0 8px">logic.js did not load</h1>'+
    '<p style="color:var(--dim);font-size:.875rem;line-height:1.5">The app will not run without it, '+
    'and nothing has been read or written. Your saved log is untouched. Reload, or re-upload both '+
    'index.html and logic.js.</p></div>';
  return;
}
/* ============================================================ program
   B-66. THE PROGRAMME IS NOT DECLARED HERE, AND MUST NEVER BE AGAIN.

   This file used to carry its own 42-slot PROGRAM array. logic.js carries
   PHAT.PHAT_PLAN. The screens read the copy, the engines were handed the
   document, and they drifted. The worst case: slot d2e carried a two-in-one
   slash-name and implement:"bodyweight" here, while the plan had already
   resolved it to a single machine exercise under Rule A1 - so the screen
   showed a name for two movements, Rule Z2 printed the wrong load word, and
   Rule I2's increment line was switched off on a machine exercise. The copy
   also had no `cue` on any of its 42 slots, so all 43 signed-off cue strings
   were unreachable, and it had no `lift` (blocks Trend grouping) and no `wd`
   (blocks B-31).

   `PROGRAM` survives ONLY as the name the call sites already use. It is a
   DERIVED READ — the ACTIVE plan's own `days` array, never a copy — and
   since WO-006 it is reassigned in exactly ONE place, adoptPlans(), when the
   plan store is read at boot, when SAVE PLAN commits, and when the active
   plan is switched. Nothing may push, splice, sort or assign through it:
   PHAT_PLAN is deep-frozen, a stored plan is replaced whole by a pure editor,
   and this file is "use strict". Everything a screen needs is on the slot:
   n, s, lo, hi, k, implement, cut, lift, cue — and `wd` on the day.
   Enforces the 2026-09-10 ruling "no slot id survives in code outside the
   plan document". */
let PROGRAM = PHAT.PHAT_PLAN.days;
/* WO-006 W1. The active plan, resolved from the store. A stored plan that
   fails validatePlan is NOT repaired and NOT dropped (spec 0.7): it stays in
   the store, its row reads `Cannot open`, and the app runs PHAT until it is
   fixed by a restore or by hand. `broken` is what the Plans list reads. */
function activePlanOf(store){
  const id=String(store&&store.activePlanId||PHAT.PHAT_PLAN_ID);
  if(id===PHAT.PHAT_PLAN_ID) return {plan:PHAT.PHAT_PLAN,broken:false};
  const hit=(store&&Array.isArray(store.plans)?store.plans:[]).find(p=>p&&p.planId===id);
  if(!hit) return {plan:PHAT.PHAT_PLAN,broken:false};
  let ok=false; try{ ok=PHAT.validatePlan(hit).ok===true; }catch(err){ ok=false; }
  return ok?{plan:hit,broken:false}:{plan:PHAT.PHAT_PLAN,broken:true};
}
function adoptPlans(store){
  const st=(store&&typeof store==="object")?store:{};
  S.plansMeta={}; Object.keys(st).forEach(k=>{ if(k!=="plans"&&k!=="activePlanId") S.plansMeta[k]=st[k]; });
  S.plans={plans:Array.isArray(st.plans)?st.plans:[],
           activePlanId:typeof st.activePlanId==="string"&&st.activePlanId.trim()?st.activePlanId:PHAT.PHAT_PLAN_ID};
  const a=activePlanOf(S.plans);
  S.plan=a.plan; S.planBroken=a.broken;
  PROGRAM=S.plan.days;
}
/* The stored plan for an id, or PHAT for "phat", or null. */
function storedPlan(id){
  if(id===PHAT.PHAT_PLAN_ID) return PHAT.PHAT_PLAN;
  return S.plans.plans.find(p=>p&&p.planId===id)||null;
}
/* Every plan on the device, in RESOLUTION ORDER: the active one, the stored
   ones, the shipped one. Names for a session whose plan is gone resolve
   through this list (D5): ids are preserved across copies, so a set logged
   on d1a under a copy the store no longer holds still reads "Bent-over row". */
function allPlans(){
  const out=[S.plan];
  S.plans.plans.forEach(p=>{ if(p&&p!==S.plan) out.push(p); });
  if(out.indexOf(PHAT.PHAT_PLAN)<0) out.push(PHAT.PHAT_PLAN);
  return out;
}
/* THE SESSION'S PLAN (D9). Everything that renders or saves the open session
   reads the plan through here, never through S.plan directly. */
const sp=()=>S.sessPlan||S.plan;
const sDays=()=>sp().days;

/* B-27 + B-66. The four lifts ST1 tests, DERIVED from the plan document.
   `keyLifts` is ids-only on the plan and PHAT.KEY_LIFTS resolves the name
   from the slot at read time, so a rename can never leave a stale label
   behind — which is exactly what B-27 was ("the mapping is right, the labels
   lie": d1d is a flat DB press, not a bench; d2d is a stiff-leg deadlift,
   not a deadlift).

   Two things here are VIEW concerns and are deliberately not programme data,
   because a plan document has no business holding either:

   `c` — the chart colour. Four lifts, four --root tokens, keyed by id.

   `lbl` — the CHART-LEGEND ABBREVIATION, and only that. The legend sits
   under a 500-unit-wide SVG at 400 px and cannot carry `Stiff-leg deadlift`
   four times. It is NOT a name and no sentence may use it: coach addendum
   §9.2 fixes ST1's prose to the plan's full name (`No progress on Bent-over
   row, Squat` — never `Row, Squat`), so prose reads `.n` and the legend
   reads `.lbl`. Falls back to `.n` if an id is not in the table, so a plan
   with different key lifts labels itself honestly instead of blanking. */
const KL_C  ={d1a:"var(--amber)", d1d:"var(--green)", d2a:"var(--bone)", d2d:"var(--red)"};
const KL_LBL={d1a:"Row",          d1d:"DB press",     d2a:"Squat",       d2d:"SLDL"};
/* `lift` and `k` ride along for W10: `lift` is the TREND GROUPING (C-6), so
   the sparkline is grouped by movement and a rename cannot split a line;
   `k` is the protocol, which is how the speed-work slot that shares the
   same `lift` is kept off the power lift's line (see liftPoints). Both are
   read from the plan at paint time, like the name. */
/* A FUNCTION since WO-006, read off the ACTIVE plan at call time: a copy
   inherits PHAT's four, an edited copy keeps whichever survive its edits, and
   a plan built from empty names none - in which case this is [] and ST1/D1
   answer ABSENT (coach 8.4), on the Plans screen and nowhere else. */
function keyLifts(){
  let kl=[]; try{ kl=PHAT.planKeyLifts(S.plan)||[]; }catch(err){ kl=[]; }
  return kl.map(l=>({
    id:l.id, n:l.n, lbl:KL_LBL[l.id]||l.n, c:KL_C[l.id]||"var(--bone)",
    lift:l.lift, k:l.k}));
}

/* ============================================================ storage */
/* One seam. window.storage and localStorage are two separate stores — the
   adapter picks one at boot and NOTHING may write around it (CLAUDE.md §7). */
/* W13a. SETTINGS GET THEIR OWN STORE and never ride on the log. Two reasons,
   both data criteria: the onboarding flag must be writable on a first run
   where the log store is deliberately still absent (spec 10.1 rule 2 - "it
   writes exactly one key and clears nothing"), and W12's criterion that a
   preference write leaves phat:v1:log and phat:v1:bw BYTE-IDENTICAL is only
   provable if a preference never touches them. Absence-tolerant: a missing
   store is the default prefs, which is how every existing install boots. */
const LOG="phat:v1:log", BWK="phat:v1:bw", DRAFT="phat:v1:draft", PREFS="phat:v1:prefs";
/* E-3 / WO-006. The plan store's key. Read at boot, written only by the
   editor's SAVE PLAN and by USE THIS PLAN (the active-plan switch), through
   save() so the write schedules a backup push like the log does. */
const PLANS="phat:v1:plans";
/* WO-006 W1. THE EDITOR'S WORKING COPY. Every edit lands here first; the
   stored plan is written only by SAVE PLAN, atomically, from this copy. Its
   own key, like the draft, and for the same reason: a reload, a kill or a
   navigation away must come back to the edit in progress with the stored
   plan in its last saved state, never half-applied (spec 9.6). NOT in
   BACKED_UP (D11): only the committed phat:v1:plans goes over the wire. */
const EDITS="phat:v1:planedit";
/* E-3. Keys a save() to which schedules a backup push - AFTER the write has
   returned. The draft, the plan working copy, prefs and recover copies never
   do: the draft and the working copy are live editing and do not back up
   (README §5), prefs are device state. */
const BACKED_UP={[LOG]:1,[BWK]:1,[PLANS]:1};
/* B-73. The three stores S.stores reports a status for, by key. A successful
   save(k) marks the store "ok": a store that booted unreadable or absent and
   was then WRITTEN is a readable store, and a boot-time status that outlives
   a later write is a stale fact - restoreSteps was reading it and skipping
   the recover:plans copy of a plan built after the boot. */
const STORE_OF={[LOG]:"log",[BWK]:"bw",[PLANS]:"plans"};
const hasNative = typeof window.storage!=="undefined" && window.storage && window.storage.get;
/* readRaw distinguishes the three outcomes load() used to collapse into null:
   absent (nothing stored), ok (parsed), error (the read threw, or the stored
   text is not JSON). "Absent" and "unreadable" must never look the same —
   that is how a real draft gets silently overwritten. */
async function readRaw(k){
  let raw=null;
  try{
    if(hasNative){ const r=await window.storage.get(k); raw=(r&&r.value!=null)?r.value:null; }
    else raw=localStorage.getItem(k);
  }catch(e){ return {status:"error",value:null,reason:"read",raw:null}; }
  if(raw==null||raw==="") return {status:"absent",value:null,raw:null};
  try{
    const v=JSON.parse(raw);
    if(v===null) return {status:"absent",value:null,raw:raw};
    return {status:"ok",value:v,raw:raw};
  }catch(e){ return {status:"error",value:null,reason:"parse",raw:raw}; }
}
async function load(k){ const r=await readRaw(k); return r.status==="ok"?r.value:null; }
async function save(k,obj){
  if(S.blockWrites[k]){
    S.err="Not saved. The stored copy of this data could not be read and must not be overwritten. Export, then reload.";
    return false;
  }
  try{
    if(hasNative) await window.storage.set(k,JSON.stringify(obj));
    else localStorage.setItem(k,JSON.stringify(obj));
    S.err=null;
    /* B-73. The write landed, so the store on disk is what was just written:
       readable. Set for every store, not only plans - the truth is the same. */
    if(STORE_OF[k]) S.stores[STORE_OF[k]]="ok";
    /* E-3. The local write is DONE. Only now, and only for the three stores
       that back up, is a push scheduled - a timer, never an await, so nothing
       network-shaped sits between this return and the caller's toast. */
    if(BACKED_UP[k]) backupSoon(k);
    return true;
  }catch(e){ S.err="Could not save. Your entries are still on screen — try again."; return false; }
}
async function del(k){
  try{
    if(hasNative){
      const rm=window.storage.remove||window.storage.delete||window.storage.del;
      if(typeof rm==="function") await rm.call(window.storage,k);
      else await window.storage.set(k,"null");   // no delete on the bridge: blank it
    }
    else localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}

   version, utcDatedBefore, anything a future build adds) so a write never
   drops a key it didn't understand. */
/* S.offer is the draft as it sits ON DISK, offered back on the Train tab. It is
   never the same object as S.draft: S.draft is what is on screen. */
/* W7 adds: exIx (which exercise screen is on, PERSISTED in the draft - a
   reload that comes back on exercise 1 of 9 has lost his place), rest (Rule
   R1's one absolute timestamp, never persisted, never in the save path), undo
   (C-12's removed row, live for the whole session), and v1msg / v1added (Rule
   V1's answer, in place, for this session). */
