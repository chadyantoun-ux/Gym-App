   sheet's count, the recover copies and the pre-restore export are all made
   from the same disk read, and a store whose read fails refuses the restore
   before any pull result reaches disk. */
/* "3 sessions, 2 weights and 1 plan" - plans named only when there are any,
   because the shipped plan is code and is never a thing a restore moves. */
const restoreCounts=(n,m,p)=>p?plural(n,"session")+", "+plural(m,"weight")+" and "+plural(p,"plan")
                            :plural(n,"session")+" and "+plural(m,"weight");
async function restoreStart(){
  const Y=window.PHAT_SYNC; if(!signedIn()) return;
  /* The draft is read from DISK, like SAVE PLAN and USE THIS PLAN: a restore
     replaces the log and the plan store under whatever a second tab holds. */
  const why=PHAT.restoreRefusal({draft:await sessionOnDisk(),edits:S.edits});
  if(why){ S.sync.last={ok:false,phase:"restore",message:why}; paintBackup(); return; }
  S.sync.last={busy:"pull"}; paintBackup();
  const r=await Y.pull();
  if(!r.ok){ S.sync.last={ok:false,phase:"restore",reason:r.reason,message:"Could not read the backup. "+(r.message||"")}; paintBackup(); return; }
  const rp=PHAT.restorePayload(r.rows);
  if(!rp.ok){
    const n=rp.problems.length;
    S.sync.last={ok:false,phase:"restore",reason:"rejected",
      message:"Backup refused, nothing changed: "+rp.problems[0]+(n>1?" (and "+(n-1)+" more)":"")+"."};
    paintBackup(); return;
  }
  if(!rp.counts.sessions&&!rp.counts.bodyweight&&!rp.counts.plans){
    S.sync.last={ok:false,phase:"restore",reason:"empty",message:"The backup is empty. Nothing to restore."};
    paintBackup(); return;
  }
  /* B-74. The count the sheet prints and the empty-or-typed decision come
     from DISK, read now, after the pull: he types REPLACE on the strength of
     this number, and a second tab's saves are not in S. A store that cannot
     be read refuses here - the keep it would need cannot be promised. */
  const D=await storesOnDisk();
  if(D.bad.length){ S.sync.last={ok:false,phase:"restore",reason:"local",message:diskRefusal(D)}; paintBackup(); return; }
  S.sync.pulled=rp; S.sync.last=null; paintBackup();
  const n=rp.counts.sessions, m=rp.counts.bodyweight, pn=rp.counts.plans;
  const ln=D.n, lm=D.m, lp=D.p;
  if(D.empty){
    askSheet({headline:"Restore from backup?",
      body:restoreCounts(n,m,pn)+" land on this device. It holds nothing now.",
      danger:"Restore "+plural(n,"session"), safe:"Not now", back:"bk-restore",
      onDanger:()=>{ closeSheet(); restoreApply(); },
      onSafe:()=>{ S.sync.pulled=null; }});
  }else{
    /* The plan sentence says which way the plans go, because R1 and R3 are
       different outcomes and he is typing REPLACE on the strength of it. */
    const planLine=!lp?"":rp.plans
      ?" Your "+plural(lp,"plan")+" here "+(lp===1?"is":"are")+" replaced by "+plural(pn,"plan")+" from the backup."
      :" Your "+plural(lp,"plan")+" here "+(lp===1?"stays":"stay")+".";
    askSheet({headline:"Replace this device's log?",
      body:"This replaces "+plural(ln,"session")+" and "+plural(lm,"weight")+" on this device with "+n+" and "+m+" from the backup."+
           planLine+" What is on this device is exported first, and a copy is kept here.",
      typed:"REPLACE", danger:"Replace "+plural(ln,"session"), safe:"Keep this device's log", back:"bk-restore",
      onDanger:()=>{ closeSheet(); restoreApply(); },
      onSafe:()=>{ S.sync.pulled=null; }});
  }
}
async function restoreApply(){
  const rp=S.sync.pulled; S.sync.pulled=null;
  if(!rp||!rp.ok) return;
  const fail=(msg)=>{ S.sync.last={ok:false,phase:"restore",reason:"local",message:msg}; paintBackup(); announce(msg,true); };
  /* B-74. Read AGAIN, now: the sheet sat open while REPLACE was typed and
     another tab may have saved under it. The keeps, the export and the
     empty-or-kept decision are all made on these bytes, never on S - the
     sheet's one-tap path does not skip the keep if the disk has since
     filled. A store that cannot be read refuses the whole restore. */
  const D=await storesOnDisk();
  if(D.bad.length){ fail(diskRefusal(D)); return; }
  const st=PHAT.restoreSteps(rp,
    {empty:D.empty,stores:D.stores,log:D.log,bw:D.bw,plans:D.plans,blocked:S.blockWrites},
    {log:LOG,bw:BWK,plans:PLANS},Date.now());
  if(!st.ok){ fail(st.message); return; }
  if(!D.empty) await exportAll(D);
  /* The keeps, all of them, before any write. One failure and nothing is
     replaced - named by which store's copy did not land. */
  for(const k of st.keeps){
    const ok=await save(k.key,k.value);
    if(!ok){ fail("Could not keep a copy of this device's "+k.label+". Nothing changed."); return; }
  }
  /* The writes, log first. A failed log write stops everything with nothing
     changed; a failed later write is reported, never hidden (E-3's
     half-applied contract question stands - it is not made silent here). */
  const wrote={};
  for(let i=0;i<st.writes.length;i++){
    const w=st.writes[i];
    wrote[w.key]=await save(w.key,w.value);
    if(i===0&&!wrote[w.key]){ fail("Could not write the restored log. Nothing changed. "+(S.err||"")); return; }
  }
  const ok2=wrote[BWK]===true, ok3=st.plans?wrote[PLANS]===true:true;
  adoptLog(st.log); if(ok2) adoptBw(st.bw);
  /* WO-006 W1: the store just written is the store in memory, or the next
     SAVE PLAN would overwrite the restored plans with the pre-restore ones. */
  if(st.plans&&ok3) adoptPlans(st.plans);
  S.stores={log:"ok",bw:ok2?"ok":S.stores.bw,plans:(st.plans&&ok3)?"ok":S.stores.plans};
  /* The restored log IS the backup, so it is stamped as backed up, with the
     signature computed the way runBackup computes it: save() has already
     scheduled a push, and the signature match makes it a no-op rather than a
     round trip that re-sends what just came down. */
  if(ok2&&ok3){
    const sig=PHAT.backupSig(PHAT.backupPayload(logPayload(),bwPayload(),st.plans));
    S.prefs.backup={at:Date.now(),sig:sig,user:S.sync.user.id,n:rp.counts.sessions,m:rp.counts.bodyweight,x:0};
    await save(PREFS,prefsPayload());
  }
  const msg=ok2&&ok3
    ? "Restored "+restoreCounts(rp.counts.sessions,rp.counts.bodyweight,rp.counts.plans)+"."
    : "Restored "+plural(rp.counts.sessions,"session")+". Could not write "+(ok2?"the plans":"the weights")+" - try again.";
  S.sync.last={ok:ok2&&ok3,phase:"restore",message:msg,counts:rp.counts};
  S.sub="settings"; render(true);
  announce(msg,!(ok2&&ok3));
}

/* ---- the Settings section. Painted in place through #bk-body so a status
   change never re-renders the screen around it. `keep` preserves the two
   auth fields across a repaint of the signed-out state, so a failed sign-in
   does not also eat the email he typed. */
function vBackup(){
  return `<div class="setsec" id="bk"><span class="lbl secrule">Backup</span><div id="bk-body">${vBackupBody()}</div></div>`;
}
function bkStatusLine(){
  const L=S.sync.last, b=S.prefs.backup, me=S.sync.user?S.sync.user.id:null;
  if(L&&L.busy) return `<p class="tiny" id="bk-status">${L.busy==="pull"?"Reading the backup.":L.busy==="auth"?"Signing in.":"Backing up."}</p>`;
  const stamp=(b&&b.user===me&&typeof b.at==="number")
    ? "Last backup "+PHAT.agoText(b.at)+(b.x?", "+plural(b.x,"item")+" left out":"")+"."
    : "Never backed up.";
  if(L&&L.ok===false){
    return `<div class="refuse" role="alert" id="bk-status"><p><span aria-hidden="true">! </span>${esc(
      L.phase==="push"?"Backup failed: "+(L.message||"unknown")+" Your log is unchanged on this device."
      :L.message)}</p><p>${esc(stamp)}</p></div>`;
  }
  if(L&&L.ok===true&&L.phase==="push"){
    const P=L.problems||[];
    if(P.length){
      return `<div class="refuse" role="alert" id="bk-status"><p><span aria-hidden="true">! </span>Backed up ${
        L.counts.sessions} of ${L.counts.sessions+P.filter(p=>p.kind==="session").length} sessions. ${
        plural(P.length,"item")} could not be backed up:</p>${
        P.slice(0,5).map(p=>`<p>${esc(p.key?p.key+" - ":"")}${esc(p.msg)}</p>`).join("")}${
        P.length>5?`<p>and ${P.length-5} more.</p>`:""}</div>`;
    }
    return `<div class="advice" id="bk-status"><span class="kick">Backed up</span>
      <p>${plural(L.counts.sessions,"session")} and ${plural(L.counts.bodyweight,"weight")}, ${esc(PHAT.agoText(L.at))}.</p></div>`;
  }
  if(L&&L.ok===true&&L.phase==="restore"){
    return `<div class="advice" id="bk-status"><span class="kick">Restored</span><p>${esc(L.message)}</p></div>`;
  }
  return `<p class="tiny" id="bk-status">${esc(stamp)}</p>`;
}
function vBackupBody(){
  const M=S.sync.mod;
  if(M==="loading") return `<p class="tiny">Backup is loading.</p>`;
  if(M!=="ready"||!window.PHAT_SYNC){
    const why=(location.protocol!=="https:"&&location.protocol!=="http:")?"Backup does not run from a file. Open the installed app."
      :(navigator.onLine===false||M==="off")?"Backup needs a connection. None right now."
      :"Backup could not load. Close the app and open it again to retry.";
    return `<p class="tiny">${esc(why)} Your log is on this device and saves as normal.</p>`;
  }
  if(!S.sync.user){
    const L=S.sync.last, busy=!!(L&&L.busy);
    return `<p class="tiny">Keeps a copy of your log off this phone. Logging works the same signed in or out.</p>
      <label class="bklbl" for="bk-email">Email</label>
      <input class="bkin" id="bk-email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false">
      <label class="bklbl" for="bk-pass">Password</label>
      <input class="bkin" id="bk-pass" type="password" autocomplete="current-password">
      ${busy?`<p class="tiny" id="bk-status">Signing in.</p>`
        :(L&&L.ok===false)?`<div class="refuse" role="alert" id="bk-status"><p><span aria-hidden="true">! </span>${esc(L.message)}</p></div>`:""}
      <button class="ghostbtn" id="bk-signin"${busy?" disabled":""}>Sign in</button>
      <button class="ghostbtn" id="bk-signup"${busy?" disabled":""}>Create account</button>`;
  }
  const busy=!!(S.sync.last&&S.sync.last.busy)||!!S.sync.busy;
  return `<p class="tiny">Signed in as ${esc(S.sync.user.email||"")}. Backs up after every saved session and weight.</p>
    ${bkStatusLine()}
    <button class="ghostbtn" id="bk-push"${busy?" disabled":""}>Back up now</button>
    <button class="ghostbtn" id="bk-restore"${busy?" disabled":""}>Restore from backup</button>
    <button class="ghostbtn" id="bk-signout"${busy?" disabled":""}>Sign out</button>
    <p class="tiny">Restore replaces what is on this device with the backup. It asks first, and never touches an unfinished session.</p>`;
}
function paintBackup(){
  if(S.sub!=="settings") return;
  const box=document.getElementById("bk-body"); if(!box) return;
  /* ALWAYS carried across: the module emits a busy-flag change in the middle
     of a sign-in attempt, and a repaint that dropped the email he typed
     would make a wrong password cost him the address as well (B-19, one
     screen over). Focus is put back where it was. */
  const em=document.getElementById("bk-email"), pw=document.getElementById("bk-pass");
  const vals={e:em?em.value:"",p:pw?pw.value:"",f:document.activeElement===pw?"p":document.activeElement===em?"e":""};
  box.innerHTML=vBackupBody();
  {
    const em2=document.getElementById("bk-email"), pw2=document.getElementById("bk-pass");
    if(em2) em2.value=vals.e; if(pw2) pw2.value=vals.p;
    if(vals.f==="p"&&pw2) pw2.focus(); else if(vals.f==="e"&&em2) em2.focus();
  }
  reserveDock();
}

/* ============================================================ boot */
/* An unreadable store is not an empty store. If we treated it as empty the
   first save would overwrite whatever is really there, so keep a verbatim
   copy aside first; if even that fails, refuse to write to that key. */
async function preserveUnreadable(k,r){   // → the notice to show, if any
  const label=k===LOG?"log":k===PLANS?"plans":"bodyweight";
  const bk=k.replace("phat:v1:","phat:v1:recover:")+":"+Date.now();
  const kept=r.raw!=null&&await save(bk,{key:k,savedAt:Date.now(),raw:r.raw});
  console.warn("[phat] unreadable store",k,"reason:",r.reason,kept?("copy kept at "+bk):"copy FAILED");
  if(kept) return "Your saved "+label+" could not be read. A copy has been kept aside and new entries will save normally.";
  S.blockWrites[k]=true;
  return "Your saved "+label+" could not be read and could not be copied aside. Nothing will be written to it. Reload before logging.";
}
(async()=>{
  /* The Train tab must not paint before the draft check resolves — a tab that
     appears and is then covered by a sheet is a layout jump under a thumb that
     is already moving. Under 600 ms show nothing; past that, say so. */
  const slow=setTimeout(()=>{
    document.getElementById("view").innerHTML='<p class="loading">Loading.</p>';
  },600);
  /* B-40: the worst fact wins. One slot, several possible truths, so rank them
     by what each one STOPS him doing and let the highest hold it:
       2  a store that could not be read and could not be copied aside — every
          write to it is blocked, and "close the app and reopen it" cannot help
          when storage is blocked at the browser level;
       1  the draft could not be read — startDay() fails closed, so this one
          blocks the next thing he will try to do;
       0  a store could not be read but a copy was kept — nothing is stopped.
     Ties go to the first setter, which is why the log is read before
     bodyweight: the log is the training history. */
  let notice=null, rank=-1;
  const setNotice=(msg,r)=>{ if(msg&&r>rank){ notice=msg; rank=r; } };
  const rl=await readRaw(LOG), rb=await readRaw(BWK), rpl=await readRaw(PLANS);
  /* THE STATUS IS KEPT, NOT JUST THE VALUE. Onboarding gates on "absent" and
     must never gate on "the sessions array came back empty" — a store that
     failed to parse also yields an empty array, and showing a first-run
     screen over a log that is really there is how a real history gets treated
     as a fresh start (WO-001's readRaw distinction). */
  S.stores={log:rl.status, bw:rb.status, plans:rpl.status};
  if(rl.status==="error") setNotice(await preserveUnreadable(LOG,rl),S.blockWrites[LOG]?2:0);
  if(rb.status==="error") setNotice(await preserveUnreadable(BWK,rb),S.blockWrites[BWK]?2:0);
  /* WO-006. The plan store, the same three ways: absent is PHAT active and
     nothing written; ok is adopted below; error keeps a copy aside like the
     log does and, if even that fails, blocks every write to the key - so the
     editor's SAVE PLAN is refused with the store notice rather than writing
     over a document it could not read. */
  if(rpl.status==="error") setNotice(await preserveUnreadable(PLANS,rpl),S.blockWrites[PLANS]?2:0);
  const rawLog=rl.value, rawBw=rb.value, rawPlans=rpl.status==="ok"?rpl.value:undefined;
  /* Preferences. A missing store is the default prefs and is not an error:
     every install before tonight has no prefs key and must boot unchanged.
     A store that will not parse is treated as defaults too and is NOT given a
     notice of its own — losing a rest-timer preference costs nothing, and a
     third claimant on the notice slot would push a real one off it (B-40). */
  const rp=await readRaw(PREFS);
  if(rp.status==="ok"&&rp.value&&typeof rp.value==="object"){
    S.prefsMeta={};
    Object.keys(rp.value).forEach(k=>{
      if(k!=="restAuto"&&k!=="onboarded"&&k!=="proteinDate"&&k!=="backup") S.prefsMeta[k]=rp.value[k]; });
    /* E-3. The last successful backup, or null. Shape-checked: a stamp that
       is not an object with a numeric `at` is treated as "never backed up",
       which is the honest reading of a stamp this build cannot vouch for. */
    S.prefs.backup = (rp.value.backup&&typeof rp.value.backup==="object"&&typeof rp.value.backup.at==="number")
      ? rp.value.backup : null;
    S.prefs.restAuto = rp.value.restAuto===undefined ? true : !!rp.value.restAuto;
    S.prefs.onboarded = !!rp.value.onboarded;
    /* A stored tick from any day but today reads as off. It is kept, not
       cleared: clearing it would be a write on boot, and this key is never
       written except by a tap. */
    S.prefs.proteinDate = typeof rp.value.proteinDate==="string" ? rp.value.proteinDate : "";
  }else if(rp.status==="error"){
    console.warn("[phat] prefs unreadable:",rp.reason);
  }
  /* Non-destructive, idempotent, never throws. No date value is rewritten. */
  const m=PHAT.migrateStore(rawLog,rawBw,rawPlans);
  adoptLog(m.log); adoptBw(m.bw);
  adoptPlans(rawPlans===undefined?null:(m.plans&&typeof m.plans==="object"?m.plans:rawPlans));
  if(m.plansChanged) await save(PLANS,plansPayload());
  /* The working copies. A store that will not parse is treated as none and
     gets no notice: the stored plan is untouched either way, and a third
     claimant on the notice slot would push a real one off it (B-40). */
  const re=await readRaw(EDITS);
  if(re.status==="ok"&&re.value&&typeof re.value==="object"&&re.value.edits&&typeof re.value.edits==="object"){
    S.edits={};
    Object.keys(re.value.edits).forEach(k=>{
      const w=re.value.edits[k];
      if(w&&typeof w==="object"&&w.plan&&typeof w.plan==="object") S.edits[k]=w;
    });
  }else if(re.status==="error"){
    console.warn("[phat] plan working copies unreadable:",re.reason);
  }
  /* Only writes when the migration actually marked or added something. An
     empty store boots with zero writes; the version lands on the first real
     save. Sorting alone does not trigger a write — order is not data. */
  if(m.logChanged) await save(LOG,logPayload());
  if(m.bwChanged) await save(BWK,bwPayload());
  if(m.notes&&m.notes.length) console.info("[phat] migration:",m.notes);
  /* Read the draft here, before the first render and before any day can be
     tapped, so startDay() knows whether one exists. W5 turns "ok" into the
     restore offer; "error" already makes startDay() fail closed. */
  S.draftRead=await loadDraft();
  if(S.draftRead.status==="error"){
    setNotice("Could not read your saved session. Close the app and reopen it before starting a new day.",1);
    console.warn("[phat] draft unreadable:",S.draftRead.reason);
  }
  /* "ok" becomes the restore offer. "error" keeps State 1I's notice and
     startDay()'s fail-closed retry — the offer must not paper over it. */
  if(S.draftRead.status==="ok") S.offer=S.draftRead.draft;
  if(notice) S.err=notice;   // set last: a successful save() clears S.err
  /* ---- W9. FIRST RUN (spec §10.1 rule 1). Four conditions, and each one is
     a way the screen could otherwise lie:
       both stores read "absent"   not "the arrays are empty". A read that
         FAILED is not a first run, and the two must not look the same.
       no notice                   with storage blocked the STORE NOTICE WINS
         and onboarding does not render (B-40's ordering rule). Offering to
         "start with an empty log" on a device whose log could not be read is
         the app inviting him to walk past his own history.
       not already onboarded       the flag, so answering it once is enough.
       no draft on disk            an unfinished session is evidence of use
         whatever the log store says; restoring it outranks introducing the
         app. */
  if(S.stores.log==="absent" && S.stores.bw==="absent" &&
     !notice && !S.prefs.onboarded && !S.offer) S.sub="onboard";
  clearTimeout(slow);
  render();
  /* E-3. After the first paint, never before: the module is an upgrade to
     Settings, not a dependency of the app, and it must not compete with the
     shell for the one bar of signal. loadSync() is a no-op on file:// and
     when navigator.onLine is false. */
  loadSync();
})();
})();
</script>

<!-- ================================================== E-4: the registration
     DELIBERATELY THE LAST THING IN THIS FILE, in its own IIFE, after the app
     has already been handed to the renderer. A service worker that caches a
     half-finished shell persists on his phone, survives a reload, and cannot
     be cleared from here - so it is wired after everything else, and it is
     wired so that it cannot take the app down with it.

     Five constraints, each with a reason, all of them enforced by what is
     NOT in this block as much as by what is:

     1. file:// IS A NO-OP, AND IT IS GUARDED BEFORE register(), NOT CAUGHT
        AFTER IT. file:// stays the honest test path: opening index.html
        directly must work with the network off and print nothing to the
        console. A caught rejection still logs in some browsers, and an error
        he learns to ignore on his primary test path is an error he will
        ignore when it is real. Side benefit worth keeping: because no worker
        runs on file://, opening the file always shows the bytes on disk and
        can never show him a cached old build.
     2. AFTER `load`, NEVER BEFORE. register() starts sw.js's install, which
        fetches the whole shell. Competing with first paint makes the app
        slower to open on exactly the connection it exists for.
     3. NO location.reload(), ANYWHERE. The atomic-refresh ruling
        (decisions.md, 2026-09-10) stands: a stale shell costs him one launch,
        a reload under his thumb between sets costs him a set. There is no
        `controllerchange` listener and no `updatefound` listener in this file
        - not a disabled one, not a commented one. There is no code path to a
        reload because there is no listener to write one in.
     4. NO skipWaiting. Not called here, and never messaged to sw.js (it has a
        SKIP_WAITING handler; nothing in this app sends it, and nothing should
        start). A new worker waits for the old pages to close, so a fresh
        index.html can never activate underneath a page already running the
        old logic.js - this project's black-screen failure mode.
     5. A FAILURE TO REGISTER MAY NOT COST HIM THE APP. try/catch around the
        call and a rejection handler on the promise, covering private mode, a
        blocked origin, a disabled worker and a 404 on sw.js. With no worker
        at all this is still a complete offline logger against localStorage;
        the worker only decides whether the SHELL survives a cold start with
        the radio off. It is an upgrade, never a dependency.

     NOTHING HERE RENDERS, ANNOUNCES OR TOASTS. An update is not an event he
     has to be told about, and a UI that reacts to a background fetch is a UI
     that can re-render mid-edit (B-19). console.info only. -->
<script>
(function(){
  "use strict";
  /* Constraint 1. Protocol first, capability second. */
  var p = location.protocol;
  if (p !== "https:" && p !== "http:") return;
  if (!("serviceWorker" in navigator)) return;
  /* Constraint 2. */
  addEventListener("load", function(){
    /* Constraint 5. Relative "./sw.js" so the same file is correct at the
       domain root, on a Vercel preview URL and under a sub-path; the default
       scope is sw.js's own directory, which is what we want and what sw.js's
       abs() already assumes. */
    try{
      navigator.serviceWorker.register("./sw.js").then(function(reg){
        console.info("[phat] sw registered, scope", reg.scope);
      }, function(err){
        console.info("[phat] sw not registered:", err && err.message);
      });
    }catch(err){
      console.info("[phat] sw registration threw:", err && err.message);
    }
  });
})();
</script>
