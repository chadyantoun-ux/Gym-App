  /* ---- W7. One exercise per screen, so navigation is a control like any
     other and lives in the same delegated listener - no per-node handlers to
     leak across a re-render. */
  if(e.target.closest("#navprev")){ goEx(S.exIx-1); return; }
  if(e.target.closest("#navnext")){ goEx(S.exIx+1); return; }
  /* W8. FINISH SESSION does not save — it opens the Summary, which is the
     reviewed path to the single commit. `‹ BACK` returns to the exercise he
     came from. Neither writes anything (criterion 1). */
  if(e.target.closest("#tosum")){ goSum(); return; }
  if(e.target.closest("#sumback")){ leaveSum(); return; }
  if(e.target.closest("#addset")){ addSet(); return; }
  const rm=e.target.closest("#rmset");
  if(rm){ askRemoveSet(+rm.dataset.k); return; }
  if(e.target.closest("#undoset")){ undoRemove(); return; }
  if(e.target.closest("#backsave")){ backToSave(); return; }
  if(e.target.closest("#v1-add")){ await v1Answer(true); return; }
  if(e.target.closest("#v1-no")){ await v1Answer(false); return; }

  const st=e.target.closest("[data-act]");
  if(st){
    const inp=st.parentElement.querySelector("input");
    const f=st.dataset.f;
    /* First tap on a malformed value normalises it and stops. A field that
       jumps 7.5.0 → 10 on one tap has silently changed a number, which is the
       whole class of bug this batch exists to kill (W4 §2.8). */
    const norm=normaliseNum(inp.value,f);
    let out;
    if(norm!==null){
      out=norm;
      if(out!=="") announce((f==="w"?"Weight":"Reps")+" now "+out+".");
    } else {
      /* THE SEEDING RULE (spec 4.4) buys back the whole ergonomic win of
         prefill for ONE tap, without prefill's cost. */
      const seed=seedValue(inp,f,st.dataset.act==="+"?1:-1);
      if(seed!==null){ out=seed; announce("Weight now "+out+"."); }
      else out=stepValue(inp.value,f,st.dataset.act==="+"?1:-1);
    }
    inp.value=out;
    commitField(inp,out);
    /* Rule R1 rule 2: a REPS stepper tap is a committed rep count and starts
       the rest. A weight tap never does, and no keystroke ever does. */
    if(f==="r"&&out!==""){
      const card=inp.closest(".card"), row=inp.closest(".setrow");
      if(card&&row) restStart(card.dataset.ex,+row.dataset.i);
    }
    flushDraft();          // a stepper tap is a committed number: write it now
    return;
  }
  const bw=e.target.closest("[data-bwact]");
  if(bw){
    const inp=document.getElementById("bwin");
    const base=parseFloat(inp.value)||0;
    inp.value=String(Math.max(0,r1(base+(bw.dataset.bwact==="+"?.1:-.1)))); return;
  }
  if(e.target.id==="logbw"){
    const v=parseFloat(document.getElementById("bwin").value);
    if(!(v>30&&v<300)){ toast("Enter a weight between 30 and 300 kg."); return; }
    /* B-03's guarantee, and the reason it holds at 23:59 and again at 00:01
       in any zone: the key is PHAT.localDate(), built from local date parts,
       never toISOString().slice(0,10). Every row carrying today's date is
       filtered out before the new one is appended, so a second entry on one
       calendar date UPDATES and can never create a second row. */
    const dt=PHAT.localDate();
    S.bw=[...S.bw.filter(x=>x.date!==dt),{date:dt,kg:r1(v)}];
    /* On a failed write the number stays on screen and S.err says it failed —
       it must never both fail and look fine. */
    const ok=await save(BWK,bwPayload());
    render(); if(ok) announceWeight("Weight logged."); return;
  }
  /* ---- W11: the calorie-change acknowledgement (spec §3.5). Two deliberate
     taps to SET, because a stamp silences calorie advice for seven days; one
     tap to CLEAR, because clearing restores it. Both delegated from #view
     like everything else. */
  if(e.target.id==="calset"){ askCalChanged(); return; }
  if(e.target.id==="calclear"){ await setCalStamp(false); return; }
});

/* The advice block changes without a navigation, so it is announced through
   the persistent region (#bs-live, outside #view) after every write on this
   tab — one sentence, not two, because a second announce() overwrites the
   first before a screen reader reaches it. The receipt goes to the toast
   {quiet}, since this has already said it. */
function announceWeight(receipt){
  let line="";
  try{
    const a=PHAT.calorieAdvice(S.bw,PHAT.localDate(),S.logMeta&&S.logMeta.calChangedAt);
    if(a&&a.text) line=" "+a.text;
  }catch(err){}
  announce(receipt+line);
  toast(receipt,true);
}
/* Variant B, the existing modal: scrim, 300 ms arm, safe action LOWEST and in
   the slot the trigger occupied. `Not yet` is the cheapest tap. */
function askCalChanged(){
  const until=PHAT.dateAdd(PHAT.localDate(),PHAT.CAL_COOLDOWN_DAYS);
  askSheet({headline:"Changed your calories today?",
    /* NOT "No new calorie advice until {date}." - coach rejected that as
       false (addendum §14.3, [Certain]). Advice renders in full in bands 2,
       3 and 4 during a hold; what a hold suppresses is a new add-or-cut
       instruction and only that. The replacement makes no claim about what
       the app will render, so there is nothing left to be wrong about, and
       "Change nothing" is already the app's word for this instruction in
       every band sentence. The date formatting does not move. */
    body:"This starts a 7-day hold. Change nothing until "+fmt(until)+".",
    danger:"Yes, changed today", safe:"Not yet", back:"calset",
    onDanger:()=>{ closeSheet(); setCalStamp(true); }});
}
/* setCalChanged / clearCalChanged return a NEW state object and never mutate;
   they return null on a non-object, and the caller MUST NOT write null over
   the store. S.logMeta carries every key of the log store this build does not
   own, so stamping through it cannot drop one. */
async function setCalStamp(on){
  const next=on?PHAT.setCalChanged(S.logMeta,PHAT.localDate()):PHAT.clearCalChanged(S.logMeta);
  if(!next) return;
  S.logMeta=next;
  const ok=await save(LOG,logPayload());
  render();
  if(ok) announceWeight(on?"Recorded.":"Hold cleared.");
}

document.getElementById("view").addEventListener("input",e=>{
  /* WO-006. Editor name fields commit on a pause and on focusout, with no
     render; the add form's fields write to S.pe.form so a stepper tap's
     re-render cannot lose a typed name. */
  if(S.tab==="plan"&&S.pe){
    const t=e.target;
    if(t.id==="pe-name"||t.dataset.peday||t.dataset.peex){ scheduleNameCommit(t); return; }
    if(t.dataset.pf&&S.pe.form){
      S.pe.form[t.dataset.pf]=t.value; S.pe.form.err="";
      /* a typed reps change disarms the K2 warning; drop that one node rather
         than re-render under the keystroke */
      if((t.dataset.pf==="lo"||t.dataset.pf==="hi")&&S.pe.form.warn){ S.pe.form.warn=null; const el=document.querySelector(".peform .refuse"); if(el) el.remove(); }
      return;
    }
    return;
  }
  if(e.target.classList.contains("note")){
    const id=e.target.closest(".card").dataset.ex;
    S.draft.entries[id].note=e.target.value; scheduleDraftSave(); return;
  }
  /* inputType is what tells a keystroke from a paste. A keystroke that would
     make the value unreadable is rejected outright; a paste is kept exactly as
     pasted and blocks the save instead. Stripping a paste is what turns 7,5
     into 75 and 7.5.0 into 750 (W4 §2.1, WO-001 §W6). */
  if(e.target.dataset.f){ syncSet(e.target,e.inputType); scheduleDraftSave(); }
});
/* blur does not bubble; focusout does. Leaving a field commits it immediately,
   so the only thing a hard kill can cost is the keystroke still in the buffer.
   A commit is also the only moment advice may change: the verdict and Rule
   S1's pain flag are evaluated here and on a stepper tap, never per keystroke
   (UX spec §1.2 rule 5). */
document.getElementById("view").addEventListener("focusout",e=>{
  const t=e.target;
  if(S.tab==="plan"&&S.pe&&t&&(t.id==="pe-name"||(t.dataset&&(t.dataset.peday||t.dataset.peex)))){
    clearTimeout(editTimer); commitName(t); return;
  }
  const isNote=!!(t.classList&&t.classList.contains("note"));
  if(!isNote&&!(t.dataset&&t.dataset.f)) return;
  flushDraft();
  if(S.draft) paintAdvice(true);
  /* Rule R1 rule 2: a REPS field leaving focus with a non-empty value is a
     committed rep count and starts the rest. A weight field never does, and a
     keystroke never does. */
  if(!isNote&&t.dataset.f==="r"&&String(t.value||"").trim()!==""){
    const card=t.closest(".card"), row=t.closest(".setrow");
    if(card&&row) restStart(card.dataset.ex,+row.dataset.i);
  }
});

/* E-3. Enter in the password field is SIGN IN - the one keyboard commit on
   the Settings screen. Delegated like everything else; no per-node listener. */
document.getElementById("view").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  if(e.target.id==="bk-pass"||e.target.id==="bk-email"){ e.preventDefault(); authTap("in"); }
  /* WO-006: Enter in an editor name field is "done with this field" - it
     blurs, which commits. Enter in the add form's name is not ADD: ADD is
     refused while a required field is empty, and a keyboard commit into a
     refusal is a tap he did not make. */
  if(S.tab==="plan"&&S.pe&&(e.target.id==="pe-name"||e.target.dataset.peday||e.target.dataset.peex)){ e.preventDefault(); e.target.blur(); }
});

/* THE `change` LISTENER ON #view IS GONE with the full-volume checkbox — it
   was its only subscriber. It wrote the whole log store on a tick of a control
   no engine read (C-1, B-23). Nothing in the app now writes phat:v1:log from
   a settings-shaped action; preferences go to phat:v1:prefs and nowhere else.
   Do not re-add a blanket `change` handler: `input`, `focusout` and `click`
   are the three commit seams this app has, and a fourth is a fourth way for a
   number to move without a commit. */

/* Two more delegated roots, same pattern as #view and nav: one listener on a
   container that outlives every node inside it. No per-node listeners. */
/* The undo control lives outside #view, so it outlives every re-render - the
   same pattern as #dr-offer and #modal, and the reason neither leaks. */
document.getElementById("toast-act").addEventListener("click",()=>{ if(toastUndo.fn) toastUndo.fn(); else undoRemove(); });
document.getElementById("dr-offer").addEventListener("click",e=>{
  if(e.target.closest("#dr-resume")){ resumeDraft(false); return; }
  if(e.target.closest("#dr-discard")){
    const o=offerInfo(); if(o) askDiscard(o.n,"dr-discard");
  }
});
document.getElementById("modal").addEventListener("click",e=>{
  /* WO-007: a day row in the move sheet (9.9.3). */
  const dr=e.target.closest("[data-sheetday]");
  if(dr&&sheetState&&sheetState.move){ moveSheetTap(dr.dataset.sheetday); return; }
  const b=e.target.closest("[data-sheet]"); if(!b||!sheetState) return;
  const a=b.dataset.sheet;
  if(a==="cancel"||a==="safe"){
    const safe=sheetState.onSafe;
    closeSheet(); if(a==="safe"&&safe) safe();
    return;
  }
  /* The 300 ms guard, enforced twice: CSS stops a real finger from hitting the
     button at all, and this stops anything that reaches the handler by another
     route. It does not disable the button and does not change its appearance. */
  if(a==="danger"){
    if(Date.now()<sheetState.armAt) return;
    /* E-3 / WO-004 C-14: a sheet that carries `typed` does not fire until the
       word is typed exactly. Not a disabled button - a refusal that says what
       it wants, in the sheet, in the rule shape. */
    if(sheetState.typed){
      const inp=document.getElementById("dr-typed");
      if(!inp||inp.value.trim()!==sheetState.typed){ sheetErr("Type "+sheetState.typed+" to continue."); if(inp) inp.focus(); return; }
    }
    if(sheetState.onDanger) sheetState.onDanger();
  }
});
/* Escape cancels; Tab is trapped inside the dialog. */
document.addEventListener("keydown",e=>{
  if(!sheetState) return;
  if(e.key==="Escape"){ e.preventDefault(); closeSheet(); return; }
  if(e.key!=="Tab") return;
  const m=document.getElementById("modal");
  const f=Array.prototype.slice.call(m.querySelectorAll("button,input"));
  if(!f.length) return;
  const first=f[0], last=f[f.length-1], cur=document.activeElement;
  if(e.shiftKey&&(cur===first||!m.contains(cur))){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&(cur===last||!m.contains(cur))){ e.preventDefault(); first.focus(); }
});

/* ============================================================ input (W6)
   syncSet used to do inp.value.replace(/[^\d.]/g,""), which is exactly the
   silent-rewrite bug: it turned a pasted "7,5" into "75" — a 10x error, with
   no way for him to know. Nothing strips a value any more. A keystroke that
   would make the field unreadable is refused before it lands; anything else,
   paste included, is stored verbatim and answered at Save time. */
function commitField(inp,val){
  const card=inp.closest(".card"), row=inp.closest(".setrow");
  if(!card||!row) return;
  const id=card.dataset.ex, i=+row.dataset.i, f=inp.dataset.f;
  const st=S.draft&&S.draft.entries[id]&&S.draft.entries[id].sets[i];
  if(!st) return;
  st[f]=val;
  paintAdvice(true);
  reviewRow(id,i);
}
function syncSet(inp,inputType){
  const card=inp.closest(".card"), row=inp.closest(".setrow");
  if(!card||!row) return;
  const id=card.dataset.ex, i=+row.dataset.i, f=inp.dataset.f;
  const st=S.draft&&S.draft.entries[id]&&S.draft.entries[id].sets[i];
  if(!st) return;
  const t=String(inputType||"");
  /* Kept verbatim: a paste, a drop, an autocomplete replacement, and any
     deletion. A deletion has to pass through untouched or he cannot backspace
     his way out of a value the sanitiser would refuse to re-accept. */
  const verbatim = t==="insertFromPaste"||t==="insertFromDrop"||
                   t==="insertReplacementText"||t.indexOf("delete")===0;
  let val=inp.value;
  if(!verbatim){
    const kept=PHAT.sanitizeNumericInput(st[f],val,f);
    if(kept!==val){
      /* Rejected. Put the field back and leave the caret where he left it —
         at the point the refused character would have gone. */
      const pos=inp.selectionStart, delta=val.length-kept.length;
      inp.value=kept;
      if(typeof pos==="number"){
        const at=Math.max(0,Math.min(kept.length,pos-delta));
        try{ inp.setSelectionRange(at,at); }catch(err){}
      }
      val=kept;
    }
  }
  st[f]=val;
  reviewRow(id,i);
}

/* Stepper arithmetic, W4 §2.6 Route B. `−` at the floor EMPTIES the field
   rather than resting on a value that blocks the save: stepping down to zero
   is how he undoes an entry, and after W2 a resting 0 in the reps field is a
   refusal. Weight 2.5 → 0 → "" keeps the 0 kg rack chin reachable (B-21) and
   makes it reversible. `+` from empty is 2.5 kg / 1 rep, as today. */
function stepValue(cur,f,dir){
  const s=String(cur==null?"":cur).trim();
  const step=f==="w"?2.5:1, floor=f==="w"?0:1;
  if(s==="") return dir<0?"":String(step);
  const n=Number(s);
  if(!isFinite(n)) return s;                 // unreachable: normaliseNum ran first
  if(dir>0) return String(r1(n+step));
  if(n<=floor) return "";                    // at or under the floor: empty it
  return String(Math.max(floor,r1(n-step)));
}
/* → the visibly normalised value for a field the parsers cannot read, or null
   when there is nothing to normalise. Prefix truncation only, so the result is
   never larger than what he typed: "7.5.0" → "7.5", "5.5" reps → "5". */
function normaliseNum(v,f){
  const s=String(v==null?"":v).trim();
  if(s==="") return null;
  const p=f==="w"?PHAT.parseWeight(s):PHAT.parseReps(s);
  if(p.ok||p.reason!=="malformed") return null;   // in range or out of it, but readable
  const m=(f==="w")?s.match(/^\d*(?:\.\d*)?/):s.match(/^\d*/);
  let out=m?m[0]:"";
  if(out===".") out="";
  return out;
}
/* {assertive} — a write that stopped landing interrupts; a running count waits
   its turn. The attribute is set BEFORE the text so the politeness in force is
   the one the mutation is announced under. */
function announce(msg,assertive){
  const el=document.getElementById("bs-live");
  if(!el) return;
  el.setAttribute("aria-live",assertive?"assertive":"polite");
  el.textContent=msg;
}

/* ============================================================ blocked save (W4 §2)
   Everything below paints from S.problems — the list validateDraft() handed
   back — and NEVER calls render(). Fixing or clearing a row while a keyboard
   is open must not rebuild the view under his thumb (B-19). The only nodes
   touched are the marks on a set row and the contents of #bs-slot.

   The copy reads p.value and p.status straight off the problem list rather
   than looking the value back up in S.draft. That is what makes "7.5.0"
   nameable: by the time the message renders, the draft may already have been
   edited, and a token that disagrees with the row is worse than no token. */
function tokenFor(p){
  if(!p) return "";
  if(p.reason==="empty") return p.field==="r"?"no reps":"no weight";
  if(p.reason==="range"){
    if(p.field==="w") return "over 500";
    return (+p.value>100)?"over 100":"0 reps";
  }
  const v=String(p.value==null?"":p.value);
  return v.length>12?v.slice(0,12)+"…":v;     // {raw}, truncated per W4 §0.3
}
/* One row per offending SET, in the order he will walk them — top to bottom
   through the session, not grouped by error type. A set can be wrong in both
   fields; the row carries one token, the worst thing wrong with it, because
   `malformed` beats `incomplete`: {w:"7.5.0", r:""} reads 7.5.0, not "no
   reps". Telling him to add reps to a broken number sends him the wrong way. */
function badRows(){
  const d=sDays().find(x=>x.id===S.dayId);
  const order={}; if(d) d.ex.forEach((e,ix)=>{ order[e.id]=ix; });
  const map={}, out=[];
  S.problems.forEach(p=>{
    if(!p.exId||p.field==null||p.setIndex==null||p.setIndex<0) return;
    const k=p.exId+"|"+p.setIndex;
    if(!map[k]){
      const e=d&&d.ex.find(x=>x.id===p.exId);
      map[k]={exId:p.exId,i:p.setIndex,name:e?e.n:exAnywhere(p.exId).n,ps:[],
              ord:order[p.exId]==null?999:order[p.exId]};
      out.push(map[k]);
    }
    map[k].ps.push(p);
  });
  out.sort((a,b)=>a.ord-b.ord||a.i-b.i);
  out.forEach(r=>{
    r.primary=r.ps.find(p=>p.reason!=="empty")||r.ps[0];
    r.token=tokenFor(r.primary);
  });
  return out;
}
/* A tappable list, not prose: he does not read a sentence, he sees `7.5.0` and
   knows it was the paste, or `no reps` and knows it was the set he abandoned.
   The token is also the non-colour carrier of the error. */
function bsMsgHtml(rows){
  if(!rows.length) return "";
  const p=rows.length;
  const head=p===1?"Not saved. 1 set needs a fix.":"Not saved. "+p+" sets need a fix.";
  let h=`<div id="bs-msg" role="group" aria-labelledby="bs-head">
    <h2 id="bs-head" tabindex="-1"><span aria-hidden="true">! </span>${esc(head)}</h2>
    <p class="bsre">Everything you typed is still here.</p>
    <div class="bslist">`;
  rows.slice(0,5).forEach(r=>{
    const label=r.name+", set "+(r.i+1)+", "+r.token+". Go to set.";
    h+=`<button class="bsrow" data-goto="${esc(r.exId+"|"+r.i)}" aria-label="${esc(label)}">
      <span class="bsex">${esc(r.name)} · set ${r.i+1}</span>
      <span class="bstok">${esc(r.token)}</span>
      <span class="bschev" aria-hidden="true">&rsaquo;</span></button>`;
  });
  /* Five 48px rows, a headline and Save already fill the thumb zone at
     400×800. A sixth would push Save off screen — the worst possible outcome
     of an error message. The rest are still marked in the cards. */
  h+=`</div>${rows.length>5?`<p class="bsmore">and ${rows.length-5} more.</p>`:""}</div>`;
  return h;
}
function findRow(exId,i){
  const cards=document.querySelectorAll("#view .card");
  for(let c=0;c<cards.length;c++){
    if(cards[c].dataset.ex!==exId) continue;
    const rows=cards[c].querySelectorAll(".setrow");
    for(let k=0;k<rows.length;k++) if(+rows[k].dataset.i===i) return rows[k];
  }
  return null;
}
function paintProblems(){
  const slot=document.getElementById("bs-slot");
  const view=document.getElementById("view");
  if(!view) return;
  /* Strip every mark first, then re-apply. Cheaper to reason about than
     diffing, and it never touches an input's value or the focused node. */
  view.querySelectorAll(".setrow.bad").forEach(row=>{
    row.classList.remove("bad");
    const g=row.querySelector(".gtxt");
    if(g) g.textContent=g.dataset.ghost||"";   // last session's numbers come back
    row.querySelectorAll(".stepper").forEach(s=>s.classList.remove("binv"));
    row.querySelectorAll("input[data-f]").forEach(inp=>{
      inp.removeAttribute("aria-invalid"); inp.removeAttribute("aria-describedby");
    });
  });
  view.querySelectorAll(".badtok,.clearstrip").forEach(b=>b.remove());

  const rows=badRows();
  rows.forEach(r=>{
    const row=findRow(r.exId,r.i);
    if(!row) return;                       // card not on screen: message still names it
    row.classList.add("bad");
    const tid="bs-t-"+r.exId+"-"+r.i;
    /* The ghost is displaced for exactly as long as the row is broken: when a
       row is wrong, "what is wrong right now" beats "what you did last time".
       Real text in a span, never CSS content — a pseudo-element is uncopyable
       and unreliable to assistive tech. */
    const g=row.querySelector(".gtxt");
    if(g) g.textContent="";
    const tl=document.createElement("p");
    tl.className="badtok";
    tl.innerHTML=`<span aria-hidden="true">!</span> <span id="${esc(tid)}">${esc(r.token)}</span>`;
    row.parentNode.insertBefore(tl,row.nextSibling);
    /* Border the fields that are actually wrong, so he can see WHICH of the
       two without reading the token. */
    r.ps.forEach(p=>{
      const inp=row.querySelector('input[data-f="'+(p.field==="r"?"r":"w")+'"]');
      if(!inp) return;
      inp.setAttribute("aria-invalid","true");
      inp.setAttribute("aria-describedby",tid);
      if(inp.parentElement) inp.parentElement.classList.add("binv");
    });
    const strip=document.createElement("button");
    strip.className="ghostbtn clearstrip";
    strip.dataset.clear=r.exId+"|"+r.i;
    strip.setAttribute("aria-label","Clear "+r.name+" set "+(r.i+1)+".");
    strip.textContent="Clear this set";
    row.parentNode.insertBefore(strip,tl.nextSibling);   // row, token, clear
  });

  /* The fix bar rides the exercise screen for as long as the refusal stands.
     Only its TEXT changes; the bar itself is fixed height and never
     disappears while a refusal is outstanding (spec 2.3 rule 3). Written
     here, never through render(), so fixing a row with the keyboard up does
     not rebuild the view under his thumb. */
  const fx=document.getElementById("fixtxt");
  if(fx){ const t=fixText(); if(fx.textContent!==t) fx.textContent=t; }

  if(slot){
    /* The fallback is for a problem no row can own — a draft whose shape is
       wrong. There is nothing to point at, so it says only what is true. */
    slot.innerHTML = rows.length ? bsMsgHtml(rows)
      : (S.problems.length ? `<div id="bs-msg" role="group" aria-labelledby="bs-head">
          <h2 id="bs-head" tabindex="-1"><span aria-hidden="true">! </span>Not saved. Everything you typed is still here.</h2>
          </div>` : "");
  }
}
/* One tap from the message to the row: put the row about a third down the
   viewport — clear of the software keyboard, still inside thumb reach — then
   focus the offending field and select it, so one keystroke replaces 7.5.0
   whole. Marks stay put; they clear when the row is valid, not when it is
   visited. */
function gotoProblem(key){
  const r=badRows().find(x=>x.exId+"|"+x.i===key);
  if(!r) return;
  /* Spec 2.3 rule 1, and it is the problem one-exercise-per-screen creates:
     the offending row may be four screens away, and a refusal pointing at
     something unreachable is the worst state in the spec. So a problem row
     NAVIGATES first - it switches the session to that exercise's screen -
     and only then scrolls, focuses and selects. render(true), never
     scrollTo(0,0). */
  const C=sessionCtx();
  const ix=C.list.findIndex(x=>x.id===r.exId);
  /* `||S.sum` — the message now lives on the Summary, so the common case is
     that the row is on the screen he is NOT on even when the index already
     matches. Without this the tap does nothing at all. */
  if(ix>=0&&(ix!==S.exIx||S.sum)){ S.exIx=ix; S.sum=false; render(true); }
  const row=findRow(r.exId,r.i);
  if(!row) return;
  const f=(r.primary&&r.primary.field==="r")?"r":"w";
  const inp=row.querySelector('input[data-f="'+f+'"]');
  const y=window.pageYOffset+row.getBoundingClientRect().top-window.innerHeight/3;
  try{ window.scrollTo({top:Math.max(0,y),behavior:"smooth"}); }
  catch(e){ window.scrollTo(0,Math.max(0,y)); }
  if(!inp) return;
  try{ inp.focus({preventScroll:true}); }catch(e){ inp.focus(); }
  try{ inp.select(); }catch(e){}
}
/* Clearing empties both fields, so the set becomes blank and is skipped on
   save. No confirmation: it is one abandoned set and retyping undoes it. */
function clearSet(key){
  const parts=String(key).split("|"), exId=parts[0], i=+parts[1];
  const st=S.draft&&S.draft.entries[exId]&&S.draft.entries[exId].sets[i];
  if(!st) return;
  st.w=""; st.r="";
  const row=findRow(exId,i);
  if(row){
    row.querySelectorAll("input[data-f]").forEach(inp=>{ inp.value=""; });
    paintAdvice(true);
  }
  const before=problemSig();
  const a=document.activeElement;
  const hadFocus=!!(a&&a.dataset&&a.dataset.clear===key);   // the strip is about to be removed
  S.problems=S.problems.filter(p=>!(p.exId===exId&&p.setIndex===i));
  flushDraft();
  if(problemSig()===before) return;
  paintProblems(); announceLeft();
  /* Focus cannot be left on a node that no longer exists, or the next Tab
     restarts at the top of the page. Land on whatever replaced it. */
  if(hadFocus){
    /* `#backsave` is the middle link since W8: the message and `#finish` are
       on the Summary, and clearing a set happens on an exercise screen, where
       the fix bar is the thing that is certainly there. */
    const nx=document.getElementById("bs-head")||document.getElementById("backsave")
           ||document.getElementById("finish");
    if(nx){ try{ nx.focus({preventScroll:true}); }catch(e){ nx.focus(); } }
  }
}
/* ============================================================ W7 actions */
/* A navigation, so render() without keepScroll: the top of the new exercise's
   screen is where he wants to be. Every typed value is already in S.draft -
   the input handler writes each keystroke - so nothing uncommitted is lost. */
function goEx(ix){
  const C=sessionCtx();
  if(ix<0||ix>=C.list.length||(ix===S.exIx&&!S.sum)) return;
  S.exIx=ix; S.sum=false; flushDraft(); hideToast(); render();
}
/* W8 criterion 1: TO AND FROM THE SUMMARY, NOTHING IS WRITTEN. goEx() flushes
   because it is leaving a card he may have been typing into; these two are
   not, and must not be — flushDraft() stamps a new savedAt every time, so a
   flush here would make "byte-identical throughout" false by construction.
   An in-flight keystroke is already safe: focusout flushes before any click
   handler runs, which is the same guarantee the stepper taps rely on. */
function goSum(){ if(S.sum) return; S.sum=true; hideToast(); render(); }
function leaveSum(){ if(!S.sum) return; S.sum=false; hideToast(); render(); }
/* Rule X1: a row beyond ex.s is marked EXTRA, counts in volume, and does NOT
   change the target line. */
function addSet(){
  const C=sessionCtx(), e=C.list[S.exIx]; if(!e) return;
  const st=S.draft&&S.draft.entries[e.id]; if(!st) return;
  st.sets.push({w:"",r:""});
  flushDraft(); render(true);
  announce("Set "+st.sets.length+" added.");
}
/* C-12, ruled. The prototype pops the last row unconditionally, including one
   holding a completed 120 x 5, with no confirmation and no undo - the same
   failure class as B-02 and B-21. Here:
     - the control NAMES ITS TARGET, so he sees what he is about to lose;
     - it prefers the last BLANK row, so the common case (a row added by
       mistake) never touches a number;
     - a blank row goes immediately, with an undo;
     - a row holding ANY typed value in either field gets a confirmation that
       NAMES THE NUMBERS, safe button lowest and in the trigger's slot, a
       300 ms arm, Escape and scrim cancel - WO-001 State 1F's guards;
     - undo restores the row byte-identically, both raw strings;
     - and the control is not rendered at all when one row remains: an
       exercise is skipped by leaving it blank, not by removing its last row. */
function askRemoveSet(k){
  const C=sessionCtx(), e=C.list[S.exIx]; if(!e) return;
  const st=S.draft&&S.draft.entries[e.id]; if(!st||st.sets.length<=1) return;
  if(!(k>=0&&k<st.sets.length)) k=removeTarget(st.sets);
  const s=st.sets[k];
  if(blankSet(s)){ doRemoveSet(e.id,k); return; }
  const w=String(s.w==null?"":s.w).trim()||"—";
  const r=String(s.r==null?"":s.r).trim()||"—";
  askSheet({headline:"Remove set "+(k+1)+"?", body:"It holds "+w+" × "+r+".",
    danger:"Remove set "+(k+1), safe:"Keep it", back:"rmset",
    onDanger:()=>{ closeSheet(); doRemoveSet(e.id,k); }});
}
function doRemoveSet(exId,k){
  const st=S.draft&&S.draft.entries[exId];
  if(!st||st.sets.length<=1) return;
  const gone=st.sets.splice(k,1)[0]||{w:"",r:""};
  S.undo={exId:exId,i:k,w:String(gone.w==null?"":gone.w),r:String(gone.r==null?"":gone.r)};
  /* Marks on the rows BELOW the removed one shift up with them, or a standing
     refusal would point at the wrong physical row. */
  S.problems=S.problems.filter(pr=>!(pr.exId===exId&&pr.setIndex===k))
    .map(pr=>(pr.exId===exId&&pr.setIndex>k)?Object.assign({},pr,{setIndex:pr.setIndex-1}):pr);
  flushDraft(); render(true);
  toastUndo("Set "+(k+1)+" removed.");
}
function undoRemove(){
  const u=S.undo; if(!u) return;
  const st=S.draft&&S.draft.entries[u.exId]; if(!st) return;
  st.sets.splice(u.i,0,{w:u.w,r:u.r});
  S.undo=null; hideToast();
  flushDraft(); render(true);
  toast("Set "+(u.i+1)+" restored.");
}
/* Spec 2.3 rule 4: BACK TO SAVE returns to the screen Save lives on — since
   W8 that is the SUMMARY — scrolled to the refusal block, with NO scroll to
   top. The exercise index is left exactly where he was, so cancelling out of
   the summary puts him back on the row he was fixing. */
function backToSave(){
  S.sum=true; render(true); focusBlocked();
}
/* Rule V1's answer. Add it adds ONE accessory and stamps the day; Not yet
   stamps the 7-day cooldown and nothing else. IGNORING IT STAMPS NOTHING and
   it is re-offered next session (spec 4.11, train 0.1 #11). Both replace the
   block in place: the app does not scroll and does not navigate, which is
   what render(true) buys. */
async function v1Answer(add){
  const C=sessionCtx(), t=C.tier;
  if(!t||!t.offer) return;
  const name=t.offer.name, exId=t.offer.exId;
  const next=add?PHAT.acceptReintro(S.logMeta,S.dayId,C.today,t.dayCuts)
                :PHAT.declineReintro(S.logMeta,S.dayId,C.today);
  if(next){ S.logMeta=next; await save(LOG,logPayload()); }
  if(add){
    S.v1msg=name+" is back in. That is the only addition for 7 days.";
    S.v1added=exId;
    const ex=C.day&&C.day.ex.find(x=>x.id===exId);
    if(ex&&!S.draft.entries[exId]){
      S.draft.entries[exId]={sets:Array.from({length:ex.s},()=>({w:"",r:""})),note:""};
      flushDraft();
    }
  }else S.v1msg="Left out. Asked again next week.";
  render(true);
}
/* THE SEEDING RULE (spec 4.4). Rows start empty: a prefilled number he does
   not change is indistinguishable from one he chose, nine engines read that
   history confidently, and B-05 means he cannot correct it. Prefill also turns
   every SKIPPED exercise into a blocked save, because the prototype prefills
   the weight and leaves the reps empty - WO-001's incomplete classification
   exactly, with a no-reps token on a screen he never visited.

   So: the FIRST + on an EMPTY WEIGHT field adopts last session's weight for
   THAT SET INDEX, and the second + steps from it. The number is on screen
   because HE TAPPED FOR IT, so provenance is intact, and it reuses WO-001
   2.8's precedent - one tap, one state change. Reps are never seeded. Minus
   from empty stays empty, or minus would increase a value. And across a
   prescription change prescriptionEpoch reports seed:false, so there is
   nothing to adopt: the same fact as prefill:false, twice, because the view
   has two ways to put a number in the box and both are forbidden. */
function seedValue(inp,f,dir){
  if(f!=="w"||dir<0) return null;
  if(String(inp.value==null?"":inp.value).trim()!=="") return null;
  const card=inp.closest(".card"), row=inp.closest(".setrow");
  if(!card||!row) return null;
  const day=sDays().find(d=>d.id===S.dayId); if(!day) return null;
  const e=day.ex.find(x=>x.id===card.dataset.ex); if(!e) return null;
  const prev=PHAT.lastFor(S.sessions,e.id);
  let ep=null;
  try{ ep=PHAT.prescriptionEpoch({ex:e,prev:prev,plan:sp(),exId:e.id}); }
  catch(err){ return null; }
  if(!ep||ep.seed!==true) return null;
  const pv=prev&&prev.sets&&prev.sets[+row.dataset.i];
  if(!pv) return null;
  const pw=PHAT.parseWeight(pv.w);
  if(!pw.ok||!(pw.value>0)) return null;
  return String(r1(pw.value));
}
const problemSig=()=>S.problems.map(p=>[p.exId,p.setIndex,p.field,p.reason,p.value].join(":")).join(",");
/* Re-read one marked row after he changes it. Only rows that are already
   marked are re-read: marks appear on a blocked save and never mid-typing. */
function reviewRow(exId,i){
  if(!S.problems.length) return;
  if(!S.problems.some(p=>p.exId===exId&&p.setIndex===i)) return;
  const st=S.draft&&S.draft.entries[exId]&&S.draft.entries[exId].sets[i];
  if(!st) return;
  const before=problemSig();
  const d=PHAT.describeSet(st);
  const kept=S.problems.filter(p=>!(p.exId===exId&&p.setIndex===i));
  const add=(d.status==="blank"||d.status==="complete")?[]
    : d.problems.map(p=>({exId:exId,setIndex:i,field:p.field,reason:p.reason,
                          value:p.value,status:d.status}));
  S.problems=kept.concat(add);
  if(problemSig()===before) return;
  paintProblems(); announceLeft();
}
function announceLeft(){
  const n=badRows().length;
  announce(n?(n===1?"1 set left to fix.":n+" sets left to fix.")
            :"Nothing left to fix. Tap Save session.");
}
/* Move focus to the headline rather than firing an assertive live region: it
   announces the message once, and the next Tab lands on the first problem row,
   which is what makes the one-tap route work for keyboard and switch users.
   Focusing a heading does not raise the software keyboard. */
function focusBlocked(){
  const h=document.getElementById("bs-head");
  if(!h) return;
  try{ h.scrollIntoView({block:"center"}); }catch(e){ h.scrollIntoView(); }
  try{ h.focus({preventScroll:true}); }catch(e){ h.focus(); }
}

/* ============================================================ draft store */
/* B-39. A failed autosave has nowhere to paint: this path must never call
   render() (B-19), so S.err sat there unread until he tapped Save, and
   everything typed after the disk filled was one phone-death from gone.
   #bs-live and #toast both live OUTSIDE #view, so both carry the message
   without touching a single node inside the view — no re-render, no lost
   caret. This is NOT the autosave indicator W4 ruled out: nothing is said
   while writes land, only when they stop and when they resume.
   Keyed on the draft OBJECT so a failure state belongs to one session — a new
   or resumed draft announces again instead of inheriting an old silence. */
const DRAFT_STOPPED="Your session is not being saved. Tap Save to keep it.";
const DRAFT_RESUMED="Saving again.";
let draftFailFor=null;
function noteDraftWrite(ok,draft){
  if(!draft) return ok;
  if(!ok&&draftFailFor!==draft){
    draftFailFor=draft;
    announce(DRAFT_STOPPED,true); toast(DRAFT_STOPPED,true,4200);
  }else if(ok&&draftFailFor===draft){
    draftFailFor=null;         // released, so a discarded draft is not held
    announce(DRAFT_RESUMED); toast(DRAFT_RESUMED,true);
  }
  return ok;
}
/* phat:v1:draft, through save()/load() only — never localStorage directly and
   never both stores. Sets are kept as the RAW TYPED STRINGS, so a malformed
   "7.5.0" survives a reload and can be corrected instead of lost. */
async function saveDraft(draft,dayId){
  try{
    if(!draft) return false;
    const entries={};
    Object.keys(draft.entries||{}).forEach(k=>{
      const e=draft.entries[k]||{};
      entries[k]={
        sets:(e.sets||[]).map(s=>({w:s&&s.w!=null?String(s.w):"",r:s&&s.r!=null?String(s.r):""})),
        note:e.note==null?"":String(e.note)
      };
    });
    /* exIx rides the draft. Coming back on exercise 1 of 9 after a reload has
       lost his place, and finding it again means nine taps with chalky hands
       (W7 data criterion 1). */
    /* B-70 / D9: the draft names the plan it was started under, so a resume
       hydrates against THAT plan and never against whichever one is active. */
    return noteDraftWrite(await save(DRAFT,{schemaVersion:PHAT.SCHEMA_VERSION,
      dayId:dayId!=null?dayId:S.dayId, planId:sp().planId, date:draft.date, entries,
      exIx:(typeof S.exIx==="number"&&S.exIx>=0)?S.exIx:0, savedAt:Date.now()}),draft);
  }catch(e){
    S.err="Could not save your draft. Your entries are still on screen.";
    return noteDraftWrite(false,draft);   // never throws into the caller; the next write retries
  }
}
/* loadDraft() → {status:"none"|"ok"|"error", draft, reason}
   NOT a bare object-or-null. "The read failed" must be distinguishable from
   "there is no draft", otherwise a failed read shows no restore offer and the
   next startDay() overwrites a draft that was really there (W4 §1.1 State 1I).

   A thin wrapper on purpose (W6): every decision that can be made from the
   stored TEXT is made by PHAT.classifyDraftPayload, so the path that ships is
   byte-for-byte the path tests.html exercises. The only outcome left here is
   reason:"read" — the storage call itself threw — because that is the one
   thing a pure function cannot see.
   Deliberate delta from the old wrapper: a whitespace-only stored value now
   reads as "none" rather than "error"/"parse". Whitespace holds no data, and
   an "error" there would block startDay() for a draft that does not exist. */
async function loadDraft(){
  const r=await readRaw(DRAFT);
  if(r.status==="error"&&r.reason==="read") return {status:"error",draft:null,reason:"read"};
  return PHAT.classifyDraftPayload(r.raw);
}
/* Called on a successful finish() and on explicit Discard. On nothing else —
   a failed save must leave the draft on disk. */
async function clearDraft(){ return await del(DRAFT); }

/* ============================================================ autosave (W5)
   THE RULE: nothing on this path may call render(). The app re-renders a whole
   view with innerHTML, so a render between two keystrokes destroys the caret
   and the focused node (B-19). Autosave writes to storage and touches no DOM.

   Debounced 400 ms on input; immediate on stepper tap, blur, tab-hide and
   pagehide. Worst case on a hard kill is one in-flight keystroke, never a set. */
let draftTimer=null;
function cancelDraftSave(){ if(draftTimer){clearTimeout(draftTimer); draftTimer=null;} }
function flushDraft(){
  cancelDraftSave();
  if(!S.draft) return;
  saveDraft(S.draft,S.dayId);   // async, deliberately not awaited: no UI waits on it
}
function scheduleDraftSave(){
  if(!S.draft) return;
  cancelDraftSave();
  draftTimer=setTimeout(()=>{draftTimer=null; if(S.draft) saveDraft(S.draft,S.dayId);},400);
}
/* Hiding the tab is the last reliable moment before the OS may kill the page.
   pagehide is the belt to that braces; the bridge may not flush either, which
   is exactly why blur and stepper taps write immediately. */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){ flushDraft(); return; }
  /* Back from three minutes in a pocket: elapsed is recomputed from the wall
     clock, never from a tick count (Rule R1 rule 4, B-61). */
  paintRest();
});
window.addEventListener("pagehide",()=>flushDraft());

/* ============================================================ restore offer (W4 §1)
   {n} — filled sets: w OR r non-empty. Counts complete, incomplete and
   malformed; skips blank. Counts exercises Rule V1's tier HIDES, since they
   are still in the draft — a set he typed before the tier changed is a set,
   and a count that omits it understates what a discard would cost. One
   function, every caller, per W4 §0.3. */
function filledSets(d){
  let n=0;
  if(!d||typeof d!=="object") return 0;
  const es=d.entries||{};
  Object.keys(es).forEach(k=>{
    const ss=(es[k]&&es[k].sets)||[];
    ss.forEach(s=>{ if(!s) return;
      const w=s.w==null?"":String(s.w).trim(), r=s.r==null?"":String(s.r).trim();
      if(w!==""||r!=="") n++; });
  });
  return n;
}
const isDate=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v);
/* {date} — weekday + day + month while the draft is a week old or less, day +
   month after that. Anchored at local noon, like fmt(), so it is DST-safe. */
function fmtDay(ds,ageDays){
  const d=noon(ds);
  if(!d) return ds;
  const base=fmt(ds);                       /* PHAT.dayMon + year — never Intl */
  return (ageDays>=0&&ageDays<=6)?WDAY[d.getDay()]+", "+base:base;
}
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
/* {age} — W4 §0.4, exactly. Calendar day always beats elapsed minutes: a draft
   written at 23:50 and reopened at 00:10 says "saved yesterday", because the
   day is what decides which session those numbers belong to. */
function ageText(o){
  const a=o.ageDays;
  if(a===null||a===undefined||a<0) return "saved "+o.dateStr;
  if(a===1) return "saved yesterday";
  if(a>=2) return "saved "+a+" days ago";
  const ms=Date.now()-o.savedAt;
  if(!(o.savedAt>0)||ms<0) return "saved earlier today";
  const mins=Math.floor(ms/60000);
  if(mins<1) return "saved just now";
  if(mins<60) return "saved "+plural(mins,"minute")+" ago";
  const hrs=Math.floor(ms/3600000);
  if(hrs<24) return "saved "+plural(hrs,"hour")+" ago";
  return "saved earlier today";
}
/* Recomputed whenever the offer is painted, so {age} is right when he comes
   back from the Trend tab (W4 §1.1 State 1H). It never ticks on its own. */
function offerInfo(){
  const d=S.offer; if(!d) return null;
  const date=isDate(d.date)?d.date:PHAT.localDate();
  const ag=PHAT.draftAge(date,PHAT.localDate());
  const o={dayId:d.dayId, day:draftDay(d), date:date,
    ageDays:ag.ageDays, sameDay:ag.sameDay,
    savedAt:typeof d.savedAt==="number"?d.savedAt:0, n:filledSets(d)};
  o.dateStr=fmtDay(date,o.ageDays);
  o.age=ageText(o);
  return o;
}
/* Variant A. Present at first paint, so no aria-live — announcing a region
   that was never absent is noise. Focus order is Resume then Discard: safe
   first in DOM even though Discard is lowest on screen. */
function offerHtml(o){
  const known=!!o.day;
  let det;
  if(!known) det=plural(o.n,"set")+" logged. This app version cannot open it.";
  else if(!o.n) det="Nothing entered yet · "+o.age;
  else det=plural(o.n,"set")+" logged · "+o.age;
  return `<section class="sheet" aria-labelledby="dr-title">
    <p class="eyebrow">UNFINISHED SESSION</p>
    <h2 id="dr-title">${known?esc(o.day.name)+" · "+esc(o.dateStr):"Saved "+esc(o.dateStr)}</h2>
    <p class="det">${esc(det)}</p>
    ${(known&&!o.sameDay)?`<p class="rule"><span aria-hidden="true">! </span>It saves under ${esc(o.dateStr)}, not today.</p>`:""}
    <div class="btns">
      ${known?`<button class="primary" id="dr-resume">Resume</button>`:""}
      <button class="ghostbtn" id="dr-discard">Discard</button>
    </div></section>`;
}
function renderOffer(){
  const box=document.getElementById("dr-offer");
  const o=(S.tab==="train"&&!S.draft)?offerInfo():null;
  box.innerHTML=o?offerHtml(o):"";
  reserveDock();
}
/* Every fixed element contributes bottom padding to the scroll container, so
   ANY input can be scrolled fully clear of all of them (spec 0.6, B-36). The
   dock now holds the restore sheet, Rule R1's rest band and nav, so this is
   measured from the dock's real height and never from a magic offset. The
   toast rides just above it. Writes only when the height actually moved. */
function reserveDock(){
  const dock=document.getElementById("dock"), app=document.getElementById("app");
  if(!dock||!app) return;
  const h=dock.offsetHeight;
  if(reserveDock._h===h) return;
  reserveDock._h=h;
  app.style.paddingBottom=(h+27)+"px";
  const t=document.getElementById("toast");
  if(t) t.style.bottom=(h+12)+"px";
}

/* ---- Variant B: modal confirm sheet. Safe action lowest, in the slot the
   trigger occupied, so a stray second tap lands on it and not on the
   destructive one. Plus a 300 ms pointer-events guard on the destructive
   button — not disabled, no greyed-out state, it simply does not fire. ---- */
let sheetState=null;
function askSheet(cfg){
  sheetState=cfg;
  cfg.armAt=Date.now()+300;   // enforced in the handler as well as by CSS
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="scrim" data-sheet="cancel"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dr-confirm-title">
      <h2 id="dr-confirm-title" tabindex="-1">${esc(cfg.headline)}</h2>
      <p class="det">${esc(cfg.body)}</p>
      ${cfg.typed?`<label class="bklbl" for="dr-typed">Type ${esc(cfg.typed)} to continue</label>
      <input class="bkin" id="dr-typed" autocomplete="off" autocapitalize="characters" spellcheck="false">`:""}
      <div id="dr-sheet-err"></div>
      <div class="btns">${cfg.plain
        /* WO-006: a confirmation that destroys nothing (duplicate a plan).
           The action is the primary and LOWEST; the way out sits above it. */
        ? `<button class="ghostbtn" data-sheet="safe">${esc(cfg.safe)}</button>
           <button class="primary" data-sheet="danger" style="pointer-events:none">${esc(cfg.danger)}</button>`
        : `<button class="ghostbtn danger" data-sheet="danger" style="pointer-events:none">${esc(cfg.danger)}</button>
           <button class="primary" data-sheet="safe">${esc(cfg.safe)}</button>`}
      </div></section>`;
  const head=m.querySelector("#dr-confirm-title"); if(head) head.focus();
  const dz=m.querySelector('[data-sheet="danger"]');
  setTimeout(()=>{ if(dz&&dz.isConnected) dz.style.pointerEvents=""; },300);
}
function closeSheet(){
  const back=sheetState&&sheetState.back;
  sheetState=null;
  document.getElementById("modal").innerHTML="";
  if(back){ const el=document.getElementById(back); if(el) el.focus(); }
}
function sheetErr(msg){
  const el=document.getElementById("dr-sheet-err");
  if(el) el.innerHTML=`<p class="rule">${esc(msg)}</p>`;
}
/* {n} phrasing for the destructive button and its headline, W4 §1.1 State 1F. */
const discardLabel=n=>n===0?"Discard this session":"Discard "+plural(n,"logged set");
const discardHead=n=>n===0?"Discard this session?":"Discard "+plural(n,"logged set")+"?";

/* THE PLAN A STORED DRAFT BELONGS TO (D9 / B-70). The one its own planId
   names when the store still holds it; a draft with no planId predates
   WO-006 and was written under PHAT, which is what an absent planId MEANS
   (planIdOf). A planId the store no longer holds falls back to the active
   plan, then PHAT - the day is looked up across all of them, so a draft can
   only fail to resume when its day is in no plan on the device. */
function draftPlan(stored){
  const id=PHAT.planIdOf(stored);
  return storedPlan(id)||S.plan;
}
function draftDay(stored){
  if(!stored) return null;
  try{ return PHAT.resolveDay([draftPlan(stored)].concat(allPlans()),stored.dayId)||null; }
  catch(err){ return null; }
}
/* Resume puts the stored strings on screen exactly as typed, malformed ones
   included, and leaves the draft on disk untouched.

   HYDRATED FROM THE STORED ENTRIES, NOT FROM THE DAY'S EXERCISE LIST (WO-006
   D8, the latent bug the editor made reachable). The old shape walked
   d.ex and read each entry off the draft, so an entry whose exercise was no
   longer in the day - removed by the Plan Editor between the last write and
   the resume - vanished on resume, sets and note and all. Now every stored
   entry is kept verbatim, and the day's exercises the draft has never seen
   are added at the prescription. The stored draft is the authority on WHAT
   was typed; the plan is only the authority on what else to offer. */
function hydrateDraft(stored){
  const plan=draftPlan(stored);
  const d=PHAT.resolveDay([plan].concat(allPlans()),stored.dayId);
  if(!d) return null;
  const src=stored.entries||{};
  const entries={};
  const take=(id,se,e)=>{
    const ss=Array.isArray(se.sets)?se.sets:null;
    /* THE STORED ROW COUNT IS AUTHORITATIVE, BOTH WAYS. A row he ADDED is
       kept - never truncate, never drop a typed number. A row he REMOVED
       stays removed, or C-12's confirmation would be silently undone by a
       reload and the number would come back from the dead. An entry the
       stored draft has never seen falls back to the prescription. Floor of
       one row: an exercise is skipped by leaving it blank, not by having no
       row at all. */
    const len=ss?Math.max(1,ss.length):(e&&e.s>0?e.s:1);
    entries[id]={
      sets:Array.from({length:len},(_,i)=>({
        w:ss&&ss[i]&&ss[i].w!=null?String(ss[i].w):"",
        r:ss&&ss[i]&&ss[i].r!=null?String(ss[i].r):""})),
      note:se.note==null?"":String(se.note)};
  };
  Object.keys(src).forEach(id=>{ if(src[id]&&typeof src[id]==="object") take(id,src[id],d.ex.find(e=>e.id===id)); });
  d.ex.forEach(e=>{ if(!entries[e.id]) take(e.id,{},e); });
  const ix=(typeof stored.exIx==="number"&&isFinite(stored.exIx)&&stored.exIx>=0)
    ? Math.floor(stored.exIx) : 0;
  return {date:isDate(stored.date)?stored.date:PHAT.localDate(),entries,exIx:ix,plan:plan};
}
function resumeDraft(withToast){
  const stored=S.offer;
  const hy=stored&&hydrateDraft(stored);
  if(!hy) return false;                       // unknown dayId: Resume is not offered
  S.dayId=stored.dayId; S.err=null; S.problems=[];
  S.exIx=hy.exIx; delete hy.exIx;          /* the index is S's, not the draft's */
  S.sessPlan=hy.plan; delete hy.plan;      /* D9: the session runs on ITS plan */
  S.draft=hy;
  /* S.sum is not stored with the draft (W8 criterion 1), so a resume always
     lands on the exercise screen the index points at — never on a Summary
     built before the reload. */
  S.rest=null; S.undo=null; S.v1msg=""; S.v1added=null; S.sum=false;
  S.offer=null;
  closeSheet(); render();
  if(withToast) toast("Resumed your unfinished session.");
  return true;
}
/* The only two places allowed to delete the draft are here and finish(). */
async function doDiscard(then){
  cancelDraftSave();
  const ok=await clearDraft();
  if(!ok){ sheetErr("Could not discard. Nothing changed. Try again."); return false; }
  S.offer=null; S.draftRead={status:"none"};
  S.draft=null; S.dayId=null; S.err=null; S.problems=[]; S.sessPlan=null;
  S.exIx=0; S.rest=null; S.undo=null; S.v1msg=""; S.v1added=null; S.sum=false;
  closeSheet(); toast("Discarded.");
  if(then) then(); else render();
  return true;
}

/* ============================================================ actions */
/* State 1F. Context comes from the offer when the draft is still on the Train
   tab, and from what is on screen once he has resumed it — so the count in the
   confirmation is always the count he can see. */
function draftLabel(){
  if(S.offer){ const o=offerInfo(); return {day:o.day?o.day.name:null,date:o.dateStr}; }
  if(S.draft){
    const d=sDays().find(x=>x.id===S.dayId);
    const ag=PHAT.draftAge(S.draft.date,PHAT.localDate());
    return {day:d?d.name:null,date:fmtDay(S.draft.date,ag.ageDays)};
  }
  return {day:null,date:""};
}
function askDiscard(n,back,then){
  const c=draftLabel();
  const body=c.day
    ? c.day+", "+c.date+(n===0?". Nothing is logged in it yet.":". This cannot be undone.")
    : "Saved "+c.date+". This cannot be undone.";
  askSheet({headline:discardHead(n), body:body, danger:discardLabel(n), safe:"Keep it",
    back:back, onDanger:()=>doDiscard(then)});
}
/* State 1G Case 2 — he ignored the offer and tapped a different day. The safe
   button is "Open {day} instead", not "Cancel": after a mis-tap the useful
   place to land is the session he has work in, not the list he must re-read. */
function askConflict(newId){
  const nd=PROGRAM.find(x=>x.id===newId);
  const o=offerInfo();
  if(!o||!nd) return;
  /* Unknown dayId: there is no "{day} instead" to offer, so this falls back to
     the plain discard confirmation and starts the tapped day on confirm. */
  if(!o.day){ askDiscard(o.n,null,()=>startDay(newId)); return; }
  const body=o.n
    ? o.day.name+" from "+o.dateStr+" is unfinished — "+o.n+" logged sets. Starting a new day discards it."
    : o.day.name+" from "+o.dateStr+" is unfinished, with nothing logged in it. Starting a new day discards it.";
  askSheet({
    headline:"Start "+nd.name+"?", body:body,
    danger:"Discard "+plural(o.n,"set")+", start "+nd.name,
    safe:"Open "+o.day.name+" instead",
    onSafe:()=>resumeDraft(false),
    onDanger:()=>doDiscard(()=>startDay(newId))
  });
}
/* Fails closed. If the draft on disk could not be read, we do not know whether
   a session with real sets is sitting there, so we refuse to start a new day
   rather than overwrite it. Tapping again retries the read. */
async function startDay(id){
  if(S.draftRead.status==="error"){
    S.draftRead=await loadDraft();            // retry
    if(S.draftRead.status==="error"){
      S.err="Could not read your saved session. Close the app and reopen it before starting a new day.";
      render(); return;
    }
    S.err=null;
    if(S.draftRead.status==="ok"){ S.offer=S.draftRead.draft; render(); }
  }
  /* A readable draft is never silently overwritten. Tapping its own day is a
     Resume, not a conflict — he sees his numbers on the very next screen, so
     nothing is hidden and nothing is destroyed. Any other day asks first. */
  if(S.offer){
    if(S.offer.dayId===id&&draftDay(S.offer)&&draftPlan(S.offer)===S.plan){ resumeDraft(true); return; }
    askConflict(id); return;
  }
  const d=PROGRAM.find(x=>x.id===id);
  if(!d) return;
  S.dayId=id; S.err=null; S.problems=[];
  S.exIx=0; S.rest=null; S.undo=null; S.v1msg=""; S.v1added=null; S.sum=false;
  /* The session runs on the plan that was active when it STARTED, and the
     draft records that plan's id from its first write (D9). */
  S.sessPlan=S.plan;
  S.draft={date:PHAT.localDate(),entries:{}};
  d.ex.forEach(e=>{S.draft.entries[e.id]={sets:Array.from({length:e.s},()=>({w:"",r:""})),note:""};});
  render();
}
async function finish(){
  if(!S.draft) return;
  const v=PHAT.validateDraft(S.draft);
  if(!v.ok){
    /* Refuse. Nothing is written, S.draft is untouched, every typed value
       stays on screen exactly as typed (B-02, B-21). The render is needed
       here — a hidden card with a problem on it has to become reachable — but
       it keeps the scroll position and hands focus to the message, so he never
       loses his place (W4 §2.5, §2.9). */
    S.problems=v.problems;
    S.err=null;              // the two message shapes must never stack
    /* The refusal renders on the screen Save is on, which since W8 is the
       Summary. S.sum is already true — finish() is only reachable from there —
       but it is set explicitly so a future caller cannot refuse a save onto a
       screen with nowhere to render the refusal (B-54). */
    S.sum=true;
    render(true); focusBlocked(); return;
  }
  S.problems=[];
  /* NOTHING LOGGED means nothing to save — NOT "no completed sets". A
     notes-only entry is data: validateDraft deliberately keeps it, B-33 says
     it is never deleted, and spec 5.3 says the session saves with `0 sets` on
     the counters. The old `!v.setCount` gate threw the note away with a toast
     that said the app had nothing, which was untrue and unrecoverable. */
  if(!v.setCount&&!Object.keys(v.entries).length){ toast("Nothing logged yet."); return; }
  /* One builder, shared with the test harness, so the object that reaches
     save() is the object QA asserts on. It returns null rather than guessing:
     no dayId, no usable date, or a draft that does not validate. */
  /* planId AND plan. The plan document stamps each entry with the
     prescription it was logged under (schema 5, Rule PE1) - which is what
     makes prescriptionEpoch able to tell "he did 100x5 under 3x3-5" from "he
     did 100x5 under 3x8-12", and therefore what stops the session screen
     offering a ghost across a prescription change. Both arguments are
     optional and additive; without them every entry stamps no rx and the
     epoch check can never fire. */
  const sess=PHAT.buildSession(S.draft,S.dayId,S.draft.date,Date.now(),
    sp().planId,sp());
  if(!sess){
    /* Loud, and never save(LOG,null): a null session would overwrite the log
       with garbage, which is the failure this whole batch exists to prevent. */
    console.error("[phat] buildSession refused",{dayId:S.dayId,date:S.draft&&S.draft.date});
    S.err="Could not save. Your entries are still on screen — try again.";
    render(true); return;
  }
  /* Build the next log without mutating S.sessions: a failed save used to
     leave a phantom session in memory that a retry would duplicate. */
  /* Sorted on the way to disk: a draft started yesterday and saved today must
     land in date order, not at the end. sortSessions returns a new array and
     never touches S.sessions, so a failed save still leaves memory untouched. */
  const next=PHAT.sortSessions(S.sessions.concat([sess]));
  const ok=await save(LOG,Object.assign(logPayload(),{sessions:next}));
  /* Keep the scroll: the failure line renders where Save is, and throwing him
     to the top of a ten-exercise page to hide it would be its own bug. */
  if(!ok){ render(true); return; }   // draft still on disk, nothing committed
  S.sessions=next;
  cancelDraftSave();             // a queued autosave must not resurrect the draft
  await clearDraft();
  S.draft=null; S.dayId=null; S.err=null; S.sessPlan=null;
  S.exIx=0; S.rest=null; S.undo=null; S.v1msg=""; S.v1added=null; S.sum=false;
  S.offer=null; S.draftRead={status:"none"};
  render(); toast("Session saved.");
}
/* EXPORT HAS TWO VISIBLE OUTCOMES AND THEY DO NOT LOOK ALIKE (B-16, §10.4).
   Success prints what left the device, counted — a receipt with no numbers in
   it is indistinguishable from a receipt for nothing. Failure wears the
   refusal shape and says the device is unchanged, which is the fact he needs.
   WHAT THIS DOES AND DOES NOT CATCH, stated plainly: a throw anywhere on the
   path is caught and reported. The other half of B-16 — a WebView where a
   synthetic a.click() silently does nothing and throws nothing — CANNOT be
   detected from here and is still open. It belongs with the clipboard/share
   fallback in WO-002. Do not let the success line grow a claim this function
   cannot stand behind. */
/* ---- B-74. THE THREE STORES AS THEY ARE ON DISK. sessionOnDisk (D10)
   answers "is a session open" from the draft key because a second tab's
   draft is not in this tab's S. This answers "what would a restore replace,
   and what does an export carry" the same way, for the same reason: the
   recover copies, the pre-restore export and the count the REPLACE sheet
   printed were all built from logPayload()/bwPayload()/plansPayload() -
   MEMORY - so a session another tab saved after this one booted was replaced
   with no copy on any key, under a sheet that had counted it out.
   One readRaw per store, nothing adopted into S: the point is the keep and
   the sheet, not a reconcile. Per store, "ok" gives the parsed disk value;
   "absent" falls back to the memory payload (at worst the empty default, at
   best the only copy of a save that failed and said so); "error" is named in
   `bad`. A restore refuses on `bad` - a copy cannot be promised of what
   cannot be read - and an export says which store it had to take from
   memory. `empty` is restoreLocalEmpty's answer on THESE bytes.
   → { log, bw, plans, stores:{log,bw,plans}, bad:[label], n, m, p, empty } */
async function storesOnDisk(){
  const rl=await readRaw(LOG), rb=await readRaw(BWK), rpl=await readRaw(PLANS);
  const pick=(r,mem)=>r.status==="ok"?r.value:mem();
  const log=pick(rl,logPayload), bw=pick(rb,bwPayload), plans=pick(rpl,plansPayload);
  const bad=[[rl,"log"],[rb,"bodyweight"],[rpl,"plans"]].filter(x=>x[0].status==="error").map(x=>x[1]);
  const n=(log&&Array.isArray(log.sessions))?log.sessions.length:0;
  const m=(bw&&Array.isArray(bw.entries))?bw.entries.length:0;
  const p=(plans&&Array.isArray(plans.plans))?plans.plans.length:0;
  const stores={log:rl.status,bw:rb.status,plans:rpl.status};
  const empty=PHAT.restoreLocalEmpty({stores:stores,sessions:n,bw:m,plans:p,activePlanId:plans?plans.activePlanId:""});
  return {log:log,bw:bw,plans:plans,stores:stores,bad:bad,n:n,m:m,p:p,empty:empty};
}
const diskRefusal=D=>"Nothing restored. The saved "+D.bad.join(" and ")+" on this device could not be read, so no copy of it could be kept. Reload first.";

/* `disk` is a storesOnDisk() result when the caller already holds one (the
   restore reads once and hands the same bytes to the keeps and the export);
   otherwise the read happens here, so the Settings button exports what is
   ON DISK and not what this tab last loaded. */
async function exportAll(disk){
  let n=S.sessions.length, m=S.bw.length;
  let url=null;
  try{
    const D=disk||await storesOnDisk();
    n=D.n; m=D.m;
    const log=(D.log&&typeof D.log==="object"&&!Array.isArray(D.log))?D.log:{};
    const payload=Object.assign({},log,{schemaVersion:PHAT.SCHEMA_VERSION,dateBasis:"local",
      exportedAt:PHAT.localDate(),sessions:Array.isArray(log.sessions)?log.sessions:[],
      bodyweight:(D.bw&&Array.isArray(D.bw.entries))?D.bw.entries:[],includeCut:!!log.includeCut,
      /* WO-006: an edited plan is his data too. Additive key; the log and
         bodyweight halves are byte-for-byte what they were. */
      plans:D.plans});
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    if(typeof a.download!=="string") throw new Error("no download attribute");
    url=URL.createObjectURL(blob);
    a.href=url; a.download="phat-log-"+PHAT.localDate()+".json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    S.exp={ok:true,n:n,m:m,bad:D.bad};
    announce("Exported "+n+" session"+(n===1?"":"s")+" and "+m+" weight"+(m===1?"":"s")+"."+
      (D.bad.length?" The saved "+D.bad.join(" and ")+" on this device could not be read; the copy in memory was used.":""));
  }catch(err){
    if(url){ try{ URL.revokeObjectURL(url); }catch(e2){} }
    console.warn("[phat] export failed",err);
    S.exp={ok:false,n:n,m:m};
    announce("Could not export. Nothing changed on this device.",true);
  }
  /* Rendering here is safe and B-19 does not apply: Settings holds no
     uncommitted input. There is no text field on this screen to lose. */
  if(S.sub==="settings") render(true);
}

/* ---- W13a. The rest-timer mode. Writes its OWN store and nothing else:
   phat:v1:log, phat:v1:bw and phat:v1:draft are byte-identical across this. */
async function setRestAuto(on){
  if(!!S.prefs.restAuto===!!on){ render(); return; }
  S.prefs.restAuto=!!on;
  /* On MANUAL a running rest is stopped as well as hidden: leaving a live
     timestamp behind would restart a countdown the moment he switched back. */
  if(!on) S.rest=null;
  const ok=await save(PREFS,prefsPayload());
  render();
  /* A failed preference write is said out loud, because the setting on screen
     now disagrees with the one on disk and the next boot will disagree with
     both. Nothing about the log changed either way. */
  announce(ok?("Rest timer "+(on?"auto-start.":"manual."))
             :"Could not save that setting. It applies until you reload.");
}

/* ---- W12. The Diet segment. IT WRITES NOTHING - not the log, not prefs, not
   a cookie. It only changes which set of targets is on screen, and the ENGINE
   decides what may be said about today: switching to TRAINING DAY on a Sunday
   shows 3,200/170/300/145 under the label `Training day`, never
   `Today — high-carb training day`. The re-render is announced because the
   numbers change without a navigation and the button he tapped is replaced. */
function setDietView(view){
  S.dietView=(view==="training"||view==="rest")?view:null;
  render();
  let said="";
  try{
    const v=PHAT.dietTargets(PHAT.localDate(),S.plan,S.dietView);
    if(v&&v.label) said=v.label+". "+(v.text&&v.text.strip?v.text.strip:"");
  }catch(err){ said=""; }
  if(said) announce(said);
}
/* ---- W12. The protein habit tick. IT WRITES phat:v1:prefs AND NOTHING ELSE:
   phat:v1:log, phat:v1:bw and phat:v1:draft are byte-identical across it -
   the same guarantee setRestAuto holds, and here it is a coach ruling as well
   as a data one. NO RULE MAY EVER READ THIS VALUE (addendum 8.6): it is
   self-reported, unverifiable and one tap, and if it fed Rule W1 the app
   would be adjusting his food off a checkbox. Storing the DATE rather than a
   boolean is what keeps it out of the class of things that look like logged
   data: it expires by itself and it is never summed, averaged or charted. */
async function toggleProtein(){
  const on=!proteinHit();
  S.prefs.proteinDate=on?PHAT.localDate():"";
  const ok=await save(PREFS,prefsPayload());
  render();
  /* A failed write is said out loud, for the same reason the rest-timer
     preference says it: what is on screen now disagrees with the disk. */
  const P=(PHAT.DIET_COPY&&PHAT.DIET_COPY.protein)||{};
  announce(ok?((on?P.on||"Protein hit today":P.off||"Protein not yet hit")+".")
             :"Could not save that. It applies until you reload.");
}

/* ---- W9. Onboarding's one commit. It writes ONE key and clears NOTHING.
   Rule 5 of §10.1: a failed flag write does not block — Home renders anyway
   and onboarding reappears next boot, which is a repeated question rather
   than a locked door. The bodyweight field is optional; empty writes nothing.
   The two writes are independent: a bodyweight that fails to save does not
   cost him the flag, and vice versa. */
async function finishOnboarding(){
  const inp=document.getElementById("bwin");
  const raw=inp?String(inp.value||"").trim():"";
  const v=raw===""?null:parseFloat(raw);
  let said="";
  if(v!==null&&v>30&&v<300){
    const dt=PHAT.localDate();
    S.bw=[...S.bw.filter(x=>x.date!==dt),{date:dt,kg:r1(v)}];
    said=(await save(BWK,bwPayload()))?" Weight logged.":" Could not save that weight.";
  }else if(raw!==""){
    /* A number he typed that cannot be a bodyweight is refused rather than
       rounded into range or silently dropped. He stays on this screen. */
    toast("Enter a weight between 30 and 300 kg."); return;
  }
  S.prefs.onboarded=true;
  await save(PREFS,prefsPayload());
  S.sub=""; render();
  announce("Ready."+said);
}

/* ---- W9. The deload answer (Rule D1). Every one of these is a PURE setter
   in logic.js returning a NEW state object; the only key any of them writes
   is `deload`. Sessions, notes and bodyweight come out byte-identical — W19's
   data-loss criterion. A null return is a refusal to guess and is never
   written over the store. */
async function answerDeload(what){
  const today=PHAT.localDate();
  let next=null;
  try{
    next = what==="start" ? PHAT.startDeload(S.logMeta,today,deloadTrigger())
         : what==="no"    ? PHAT.declineDeload(S.logMeta,today,S.sessions)
         :                  PHAT.endDeload(S.logMeta,today);
  }catch(err){ next=null; }
  if(!next){ toast("Could not record that. Nothing changed."); return; }
  S.logMeta=next;
  const ok=await save(LOG,logPayload());
  render();
  if(!ok) return;                       /* save() has already set S.err */
  /* `Noted. Asked again after the next session.` is D1_DECLINED, logic.js's
     own string, and it is the honest one: declining does not silence the
     check, it defers it until there is new evidence. */
  announce(what==="start"?"Deload week started."
          :what==="no"?"Noted. Asked again after the next session."
          :"Deload ended.");
}
/* Which trigger fired, recorded with the deload so the week can be attributed
   later. Recomputed rather than stashed on S: a value cached at paint time is
   a value that can be stale by the tap. */
function deloadTrigger(){
  try{
    const kl=keyLiftRows(), today=PHAT.localDate();
    let sr=null;
    try{ sr=PHAT.stallReport(S.sessions,today,kl,S.logMeta); }catch(err){}
    const d=PHAT.deloadCheck({sessions:S.sessions, todayStr:today, stallReport:sr,
      keyLifts:kl, state:S.logMeta, plan:S.plan});
    return d&&d.trigger?d.trigger:null;
  }catch(err){ return null; }
}

/* ============================================================ E-3: backup
   The app side of sync.js. Everything network-shaped lives in the module;
   everything that touches S or a store lives here, and the two meet at
   exactly three calls: push(payload), pull(), and the auth trio.

   THE ORDER OF EVENTS ON A SAVE, because it is the whole point:
     1. save() writes the store and returns true.
     2. The caller renders and toasts "Session saved." from that return.
     3. A timer set inside save() fires ~2 s later and, if signed in and the
        module is ready, builds the payload and pushes it.
   Nothing in step 3 is awaited by steps 1 or 2. A push that fails changes
   nothing on disk and is reported in Settings as a failed BACKUP, in the
   refusal shape, never as a failed save and never with a green tick (B-16).

   THE MODULE IS INJECTED, NOT DECLARED. A static <script type="module"> in
   the markup would start its CDN fetch at parse time and, with the radio off,
   print a failed-resource error on every gym launch - an error he would learn
   to ignore on the path where an error matters. loadSync() creates the tag
   after the first render, only on http(s) (module scripts do not run from
   file://, and file:// stays the honest test path), and only when
   navigator.onLine is not false. The element's `error` event covers the
   module and every import inside it, so a CDN that does not answer is a
   clean "failed" state and not a hang. Nothing here reloads the page. */

/* Adopt a migrated log / bodyweight store into S. Shared by boot and by
   restore, so the two cannot disagree about what "loaded" means. Sorting
   reorders references - it copies nothing, drops nothing, edits nothing;
   lastFor and every week gate scan the array in order (audit D-9). */
function adoptLog(log){
  if(!log||typeof log!=="object") return;
  S.logMeta={}; Object.keys(log).forEach(k=>{ if(k!=="sessions"&&k!=="includeCut") S.logMeta[k]=log[k]; });
  S.sessions=PHAT.sortSessions(Array.isArray(log.sessions)?log.sessions:[]);
  S.includeCut=!!log.includeCut;
}
function adoptBw(bw){
  if(!bw||typeof bw!=="object") return;
  S.bwMeta={}; Object.keys(bw).forEach(k=>{ if(k!=="entries") S.bwMeta[k]=bw[k]; });
  S.bw=Array.isArray(bw.entries)?bw.entries:[];
}

const syncOn=()=>S.sync.mod==="ready"&&!!window.PHAT_SYNC;
const signedIn=()=>syncOn()&&!!S.sync.user;

/* Load the module. Idempotent: a second call while loading or ready is a
   no-op. A load that was never ATTEMPTED ("off": the radio was off at boot)
   is attempted when the `online` event fires or Settings opens. A load that
   FAILED is not retried in this page: the browser's module map remembers a
   failed fetch for the life of the document, so a second tag with the same
   URL fails instantly without touching the network, and the CDN import
   inside sync.js is the same URL every time. Honest copy instead: reopen
   the app. A 20 s timer turns a hung fetch into that same state, so
   "loading" cannot be the last word on a connection that never answers. */
function loadSync(){
  if(S.sync.mod!=="off") return;
  if(location.protocol!=="https:"&&location.protocol!=="http:") return;   // file:// - never
  if(navigator.onLine===false) return;                                   // no fetch, no noise
  S.sync.mod="loading"; paintBackup();
  setTimeout(()=>{ if(S.sync.mod==="loading"){ S.sync.mod="failed"; paintBackup(); } },20000);
  const s=document.createElement("script");
  s.type="module"; s.src="./sync.js"; s.async=true;
  s.addEventListener("load",async()=>{
    const Y=window.PHAT_SYNC;
    if(!Y){ S.sync.mod="failed"; paintBackup(); return; }
    Y.subscribe(onSync);
    let snap=null;
    try{ snap=await Y.ready(); }catch(err){ snap=null; }
    S.sync.mod="ready";
    S.sync.user=snap&&snap.user?snap.user:null;
    paintBackup();
    /* Once, on open, if signed in and online: the push that catches a save
       whose push failed last time. backupSoon() compares signatures, so a log
       that already matches the last successful backup sends nothing. */
    if(S.sync.user) backupSoon("open");
  });
  s.addEventListener("error",()=>{
    S.sync.mod="failed"; s.remove();
    console.info("[phat] backup module not loaded (offline, or the CDN did not answer). Logging is unaffected.");
    paintBackup();
  });
  document.head.appendChild(s);
}
/* The module's subscriber. Auth changes repaint; a busy flag flip repaints
   only the backup section. NEVER render(): a re-render mid-edit is B-19, and
   this can fire while he is typing a set. */
function onSync(snap){
  const was=S.sync.user?S.sync.user.id:null;
  S.sync.user=snap&&snap.user?snap.user:null;
  S.sync.busy=snap?snap.busy:null;
  if((S.sync.user?S.sync.user.id:null)!==was) S.sync.last=null;
  paintBackup();
}
window.addEventListener("online",()=>{
  if(S.sync.mod==="off") loadSync();
  else if(signedIn()) backupSoon("online");
});

/* ---- the debounce. One timer; every trigger resets it; the payload is built
   when it FIRES, from S as it is then, so five saves in two seconds are one
   push of the final state. A push already running sets `again` and runs once
   more after, so a save during a push is never lost. */
let bkTimer=0, bkAgain=false, bkRunning=false;
function backupSoon(reason){
  if(!signedIn()) return;
  clearTimeout(bkTimer);
  bkTimer=setTimeout(()=>{ runBackup(false,reason); },2000);
}
async function runBackup(manual,reason){
  const Y=window.PHAT_SYNC;
  if(!signedIn()) return;
  if(bkRunning){ bkAgain=true; return; }
  bkRunning=true;
  try{
    const plans=await load(PLANS);
    const p=PHAT.backupPayload(logPayload(),bwPayload(),plans);
    /* C-14: a store marked demo:true sends NOTHING - not even the state row,
       which would blank the real user_state on the server. Named, never
       silent; the last-good stamp is left alone. */
    if(p.blocked){
      S.sync.last={ok:false,phase:"push",at:0,reason:"blocked",message:p.problems[0]?p.problems[0].msg+".":"Blocked.",
        counts:p.counts,problems:p.problems,notes:p.notes,manual:!!manual};
      if(manual) announce("Backup refused: "+S.sync.last.message+" Your log is unchanged on this device.");
      paintBackup(); return;
    }
    const sig=PHAT.backupSig(p);
    const b=S.prefs.backup;
    /* Nothing changed since the last backup that landed: send nothing. A
       manual tap always sends - "BACK UP NOW" means now. */
    if(!manual&&b&&b.sig===sig&&b.user===S.sync.user.id){ return; }
    S.sync.last={busy:"push"}; paintBackup();
    const r=await Y.push(p);
    if(r.ok){
      S.prefs.backup={at:r.at,sig:sig,user:S.sync.user.id,n:p.counts.sessions,m:p.counts.bodyweight,x:p.counts.refused};
      /* The stamp's own write. Not a backed-up key, so it cannot re-trigger. */
      await save(PREFS,prefsPayload());
    }
    S.sync.last={ok:!!r.ok,phase:"push",at:r.at||0,reason:r.reason||"",message:r.message||"",
      counts:p.counts,problems:p.problems,notes:p.notes,manual:!!manual};
    if(r.ok&&!p.problems.length) announce("Backed up "+plural(p.counts.sessions,"session")+" and "+plural(p.counts.bodyweight,"weight")+".");
    else if(r.ok) announce("Backed up with "+plural(p.problems.length,"problem")+". See Settings.");
    else announce("Backup failed: "+(r.message||"unknown")+" Your log is unchanged on this device.");
    paintBackup();
  }catch(err){
    console.warn("[phat] backup threw",err);
    S.sync.last={ok:false,phase:"push",reason:"error",message:String(err&&err.message||err)};
    paintBackup();
  }finally{
    bkRunning=false;
    if(bkAgain){ bkAgain=false; backupSoon("again"); }
  }
}

/* ---- auth, from the Settings form. The two fields are read at the tap and
   never stored anywhere by this file. */
async function authTap(kind){
  const Y=window.PHAT_SYNC; if(!syncOn()) return;
  const em=document.getElementById("bk-email"), pw=document.getElementById("bk-pass");
  const email=em?String(em.value||"").trim():"", pass=pw?String(pw.value||""):"";
  if(!email||!pass){ S.sync.last={ok:false,phase:"auth",message:"Email and password, both."}; paintBackup(); return; }
  S.sync.last={busy:"auth"}; paintBackup();
  const r=kind==="up"?await Y.signUp(email,pass):await Y.signIn(email,pass);
  if(r.ok){
    S.sync.user=r.user; S.sync.last=null; paintBackup();
    announce("Signed in.");
    backupSoon("signin");
  }else{
    S.sync.last={ok:false,phase:"auth",message:r.message||"Could not sign in."}; paintBackup();
    announce(r.message||"Could not sign in.",true);
  }
}
async function signOutTap(){
  const Y=window.PHAT_SYNC; if(!signedIn()) return;
  const r=await Y.signOut();
  if(r.ok){ S.sync.user=null; S.sync.last=null; announce("Signed out. Your log is still on this device."); }
  else S.sync.last={ok:false,phase:"auth",message:"Could not sign out. "+(r.message||"")};
  paintBackup();
}

/* ---- RESTORE. The dangerous path, and the rules (work order E-3, extended
   to the plan store by WO-006 W2):
     - read first, validate WHOLE (PHAT.restorePayload refuses on one bad
       document - a session, a weight, or since W2 a plan that fails
       validatePlan - and names it), and only then ask, with the real counts.
     - refused before any pull while a session is unfinished, or while a plan
       working copy is on disk (R2). PHAT.restoreRefusal decides; the copy is
       its, and it is the same shape for both.
     - onto an EMPTY device: one confirmation, then replace.
     - onto a NON-EMPTY device: a TYPED confirmation (WO-004 C-14), the local
       log is exported first, and a verbatim copy of every store the restore
       will replace is kept on this device under phat:v1:recover:* - log,
       bodyweight, and the plan store when the backup carries one (R1) - the
       same keep-aside the boot path uses for an unreadable store. If any copy
       cannot be written, nothing is replaced.
     - a backup with no plan store leaves phat:v1:plans untouched (R3).
     - every write goes through save(), so the window.storage / localStorage
       split is respected and blocked writes are refused (CLAUDE.md §7).
   THE ORDER OF WRITES IS DATA: PHAT.restoreSteps returns the keeps and the
   writes as two lists and this function executes them in that order and
   nothing else, so the seam order is asserted in tests.html (R5) and not
   only measured in a browser.
   "Empty" is judged on what was READ, not on the arrays: a store that failed
   to read is not empty, it is unknown, and unknown gets the typed path. A
   stored plan, or a non-PHAT active plan, is not empty either.
   B-74: READ means read FROM DISK, NOW - storesOnDisk(), once before the
   sheet and once again before the keeps - never S. S is what this document
   loaded at boot; the disk is what every document has saved since. The
