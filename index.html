<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PHAT Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>  /* == TOKENS ===============================================================
     Direction 2a - graphite & signal amber, from docs/design/PHAT App.dc.html.
     EVERY colour literal in this file is in this block. Nothing below may name
     a hex.

     Ratios are WCAG 2.x with translucent foregrounds composited over their own
     ground before measuring, and they are quoted PER GROUND, because the same
     alpha passes on --bg and fails on --surface. That is exactly how the
     prototype's .lbl at .50 (4.6:1 on --bg, 4.3:1 on --surface) passed an
     audit that only measured it against --bg (spec wo-004-screens 0.5).      */
  :root{
    --bg:#1c1b1a;                                /* relative luminance 0.0111 */
    --surface:#2a2827;                           /* relative luminance 0.0216 */
    --hi:#353231;      /* stepper key face. Its edge is the --line border, not
                          this fill, which is 1.35:1 and carries no meaning.  */
    --bone-rgb:240,238,234;
    --bone:rgb(var(--bone-rgb));                 /* 14.8:1 bg . 12.7:1 surface */
    /* The alpha steps, named. TEXT MAY NOT GO BELOW --t55 ON EITHER GROUND. */
    --t70:rgba(var(--bone-rgb),.70);             /*  7.8:1 bg .  7.0:1 surface */
    --t55:rgba(var(--bone-rgb),.55);             /*  5.3:1 bg .  4.9:1 surface */
    --t45:rgba(var(--bone-rgb),.45);             /*  4.0:1 bg .  3.8:1 surface */
    --t40:rgba(var(--bone-rgb),.40);             /*  3.5:1 bg .  3.3:1 surface */
    --dim:var(--t70);        /* secondary text  */
    --faint:var(--t55);      /* tertiary text - the floor, not below it       */
    --line:var(--t45);       /* control boundaries: 3.8:1, over the 3:1 floor */
    --rule:var(--t40);       /* section and row rules: 3.3:1                  */
    --amber:#f5b32b;         /*  9.3:1 bg . 7.9:1 surface . --bg on amber 9.3 */
    --green:#7CC05E;         /*  7.8:1 bg . 6.7:1 surface  (was 5.3 / 4.5)    */
    --red:#E3705C;           /*  5.5:1 bg . 4.7:1 surface  (was 2.9 / 2.5)    */
    --red-hi:var(--red);     /* W4 minted --red-hi because --red was 2.9:1 on
                                --surface. The 2a red clears 4.5:1 on both, so
                                the two names are one colour now; the alias
                                stays so no refusal code has to be touched.   */
    --scrim:rgba(28,27,26,.82);
    /* Archivo is the design's face. The DS pulls it from Google Fonts with an
       @import; that import does not ship - this app opens from file:// with
       the network off, so the family is NAMED and falls back to the platform
       grotesque. The device renders Archivo if it has it, the system face if
       it does not, and nothing waits on a request either way.                */
    --sans:"Archivo","Archivo Expanded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"DejaVu Sans Mono",Menlo,monospace;
    --r:0;             /* the DS radius scale is 0px at every step            */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
    --tap:44px;        /* the floor. WIDTH as well as height - B-43 exists
                          because only the height was ever checked.           */
    --key:48px;        /* stepper key height: 44 is the floor, 48 is the size */
    /* -- THE COLUMN. ONE NUMBER, AND EVERY FIXED THING READS IT -----------
       The app is a centred column and does not stretch. Logging is a phone
       activity; desktop is where he REVIEWS. #dock used to be fixed with
       left:0/right:0, so at 1920px the RESUME button was 1870px wide, the
       five tabs were 384px each with 350px of gap, and the restore sheet
       covered four of the five day rows - while #view sat centred at 520.
       The chrome and the content column disagreed at every width above 520.
       #view, #dock, #toast and the modal's SHEET all read --col, so they
       cannot drift apart again. The modal SCRIM is deliberately NOT in that
       list: it still covers the whole viewport, because a modal that dims
       part of the screen is worse than one that dims all of it.
       WHY 520 AND NOT THE DESIGN'S 393: 393 would put gutters either side of
       a 400px phone, and every W6 measurement - the 44px floor, 200% text,
       no horizontal scroll - was taken in a 520 column. The phone does not
       regress to buy a desktop treatment.                                  */
    --col:520px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg); margin:0; font-family:var(--sans)}
  /* Focus has to be visible: the old sheet set input{outline:none} and put
     nothing back, which left a keyboard user with no feedback at all. */
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  /* overflow-wrap inherits, so this is the whole app's answer to the one way
     a fluid layout still scrolls sideways: a single word longer than the
     column. MEASURED — at 200% text "Bodyweight" as a 76px h1 is 432px of
     min-content in a 353px column, and that alone put 63px of horizontal
     scroll on the Weight tab. break-word, not anywhere: it breaks only when
     the word cannot fit, and it leaves flex min-content sizing alone. */
  #app{background:var(--bg); font-family:var(--sans); color:var(--bone);
    min-height:100vh; position:relative; padding-bottom:78px; overflow-wrap:break-word;
    max-width:var(--col); margin:0 auto}
  #view{max-width:var(--col); margin:0 auto}
  /* The column's edges, so a wide screen reads as a column standing on the
     app's own ground rather than as a broken full-width page. No bezel and no
     fake phone: two hairlines at --rule (3.3:1) down the full height.
     box-shadow, not border: it paints OUTSIDE the box, so it costs zero
     layout width, cannot disturb the 44px set-row arithmetic, adds no
     horizontal overflow, and falls off-screen by itself on a viewport
     narrower than the column - no media query, nothing about the phone
     changes.                                                              */
  #app,#dock{box-shadow:1px 0 0 var(--rule), -1px 0 0 var(--rule)}
  h1{font-size:2.375rem; font-weight:800; letter-spacing:-.025em; line-height:1.02; margin:0}
  h2{font-size:1.0625rem; font-weight:800; margin:0 0 var(--s2)}
  h3{font-size:1.5625rem; font-weight:800; letter-spacing:-.02em; margin:0; line-height:1.12}
  p{margin:0}
  button{font-family:var(--sans); border:none; background:transparent; cursor:pointer; color:inherit}
  input{font-family:var(--sans); color:inherit}
  .pad{padding:0 var(--s4)}
  .sub{color:var(--dim); font-size:.875rem; margin-top:5px; line-height:1.45}
  .tiny{color:var(--faint); font-size:.75rem; line-height:1.5}

  /* -- the design's flush-left label pair. .kick sits on --bg, .lbl inside a
     surface card - and on --surface the alpha floor is .55, not .50.       */
  .kick,.lbl{font-size:.6875rem; font-weight:800; letter-spacing:.12em;
    text-transform:uppercase; color:var(--faint); display:block}
  .hd{display:flex; justify-content:space-between; align-items:center; gap:var(--s3);
    padding:var(--s3) var(--s4); border-bottom:2px solid var(--rule)}
  .secrule{padding-bottom:var(--s2); border-bottom:2px solid var(--rule); margin-bottom:var(--s3)}

  .daybtn{width:100%; display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:15px var(--s4); margin-bottom:var(--s2); text-align:left; min-height:56px}
  .daybtn.stale{border-color:var(--red); border-left-width:3px}
  .daybtn .nm{color:var(--bone); font-size:1rem; font-weight:800}
  .daybtn .ago{font-size:.78125rem; margin-top:3px; color:var(--dim)}
  .daybtn.stale .ago{color:var(--red)}
  .chev{color:var(--amber); font-size:1.375rem}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:var(--s3)}
  .cardhead{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); padding:15px var(--s4) var(--s1)}
  /* MEASURED at 200% text: the target ("3 x 6-10") ran 6px past the viewport
     because a flex item's min-width defaults to min-content and the exercise
     name would not yield. session 0.1 #9 says the TARGET never wraps,
     truncates or shrinks - so the name is the one that gives way. */
  .cardhead h3{min-width:0; overflow-wrap:anywhere}
  .target{color:var(--amber); font-weight:800; font-size:.8125rem; white-space:nowrap; flex:none}
  .hint{color:var(--dim); font-size:.78125rem; padding:0 var(--s4) 2px}
  .sets{padding:var(--s2) var(--s4) 14px}

  /* -- THE SET ROW AND ITS REFLOW (spec 0.6) --------------------------------
     Arithmetic at 400px: a stepper that holds two 44px keys and a 3-character
     input is 136px minimum, so the row is index 14 + gap 8 + 136 + gap 8 +
     136 = 302px. That fits at 400px, and it does NOT fit at 200% text.
     So the row is flex-wrap with a min-width on each group expressed in rem:
     when the pair cannot both hold their keys on one line, reps drops to a
     full-width line UNDER weight and both keep their 44px keys. Nothing
     shrinks. The row grows downward, which is allowed - everything below a
     set row is a control, not an input (session 0.1 #1).
     The unit captions are load-bearing once the pair is stacked: two equal
     steppers one above the other are otherwise indistinguishable.          */
  .setrow{display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2); margin-bottom:9px}
  .idx{color:var(--faint); font-weight:800; font-size:.8125rem; width:14px; flex:none; align-self:center}
  .grp{flex:1 1 8.5rem; min-width:8.5rem; display:flex; flex-direction:column; gap:3px}
  .unit{font-size:.625rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
  /* B-37: the ghost has its OWN full-width row under the steppers, so the
     zero-width squeeze that made it invisible at 400px is structurally
     impossible. It shares the row with Rule X1's EXTRA badge, right-aligned,
     and the badge changes no height - so a row becoming EXTRA moves nothing. */
  .ghost{color:var(--faint); font-size:.78125rem; flex:1 1 100%;
    min-height:1.15rem; padding-left:22px; display:flex; align-items:baseline;
    justify-content:space-between; gap:var(--s2)}
  .gtxt{min-width:0}
  .xtra{color:var(--bone); font-size:.6875rem; font-weight:800; letter-spacing:.1em; flex:none}

  /* ---- WO-001 W6: a set row marked by a blocked save (W4 2.4) ----
     Nothing here depends on hue: the rule is a rule, the "!" is an "!", the
     token is words, and the marked stepper's border is thicker. Greyscale the
     screen and every one of them still reads. The extra border is cancelled
     by a -1px margin so the row's geometry does not move - a stepper that
     rewraps when you report an error is a worse bug than the error.        */
  .setrow.bad{border-left:3px solid var(--red-hi); padding-left:var(--s2); margin-left:-11px}
  .badtok{color:var(--bone); font-size:.78125rem; line-height:1.4; margin:-4px 0 7px; padding-left:22px}
  .stepper.binv{border-color:var(--red-hi); border-width:3px; margin:-1px}
  .clearstrip{min-height:var(--tap); margin:-1px 0 11px; font-size:.84375rem}

  .stepper{display:flex; border:2px solid var(--line); border-radius:var(--r); overflow:hidden}
  .stepper button{background:var(--hi); color:var(--bone); font-size:1.125rem; font-weight:800;
    line-height:1; min-height:var(--key); min-width:var(--tap); flex:none; padding:0}
  .stepper button:active{background:var(--amber); color:var(--bg)}
  .stepper input{background:var(--bg); color:var(--bone); font-weight:800; font-size:1.0625rem;
    letter-spacing:-.01em; border:none; text-align:center; padding:0;
    flex:1 1 auto; min-width:48px; width:100%; min-height:var(--key)}
  .stepper input::placeholder{color:var(--faint)}

  .note{width:100%; background:var(--bg); color:var(--bone); border:2px solid var(--line);
    border-radius:var(--r); padding:var(--s3); font-size:.8125rem; margin-top:var(--s1); min-height:var(--key)}
  .note::placeholder{color:var(--faint)}

  .showfig{color:var(--amber); font-size:.75rem; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; padding:0 var(--s4); display:flex; align-items:center;
    text-align:left; width:100%; min-height:var(--tap)}
  /* -- THE FIGURE SITS BESIDE THE CUE, AND THE FRAME FOLLOWS THE SUBJECT ---
     Was: one 200x150 landscape viewBox for every pattern, rendered
     width:100% as a full-width banner. A standing human is about 1:3, so a
     figure that filled a 150-tall frame could only ever be ~50 of 200 wide -
     measured, the average pattern used 26% of the width and 63% of the
     height, and 'curl' was a 6% hairline floating in emptiness. The frame
     was the wrong shape for the subject, and no amount of redrawing fixes
     that. Now every pattern carries its OWN viewBox, fitted to its own
     content: upright patterns get an upright frame, prone ones a wide frame,
     and the drawing fills 84-90% of both axes in all fifteen.
     Sized off WIDTH, never height: with a fixed height a wide pattern would
     be letterboxed inside a box it does not fit, which is the same defect in
     a new place. In em units so it grows with 200% text (11.8 #6). --fw and --ar
     come from the viewBox, computed in diagram(). */
  .fig{display:none; padding:0 var(--s4) var(--s3); font-size:.875rem}
  .fig.on{display:flex; gap:var(--s3); align-items:center; flex-wrap:wrap}
  svg.mv{display:block; flex:none; width:min(var(--fw),100%); aspect-ratio:var(--ar); height:auto}
  .figcue{flex:1 1 13em; color:var(--dim); font-size:.78125rem; line-height:1.45; margin:0}
  .figcue b{color:var(--bone); font-weight:800}
  /* -- W7: ADVICE vs REFUSAL (spec 2.1) -------------------------------------
     2a has ONE accent, so the difference cannot be a second colour. It is
     carried by FORM, four ways at once, and all four survive greyscale:
       advice   3px rule on the LEFT EDGE only . no glyph . kicker names the
                block (WAITING / VERDICT / SPEED WORK / DELOAD WEEK) . text
       refusal  2px border on ALL FOUR sides . a literal "!" (aria-hidden) .
                a headline that refuses . tappable rows
     Status is never carried by colour: the sentence carries it, and the
     up/down glyph beside the kicker is redundant and aria-hidden (B-13). */
  .advice,.refuse{background:var(--bg); border-radius:var(--r); padding:9px var(--s3);
    margin-bottom:var(--s3)}
  .advice{border-left:3px solid var(--dim)}
  .refuse{border:2px solid var(--red-hi)}
  .advice p,.refuse p{font-size:.8125rem; line-height:1.45; color:var(--dim)}
  .refuse p{color:var(--bone)}
  .advice p+p,.refuse p+p{margin-top:6px}
  .advice .kick{margin-bottom:4px}
  .advice .kick .dir{margin-left:5px}
  /* THE VERDICT SLOT. Reserved height, from first paint, so the card cannot
     grow under his thumb when the verdict replaces the reminder (0.1 #2).
     7.75rem is MEASURED, not chosen: every verdict PHAT.verdict can return
     for all 42 slots, at every rep outcome, deloaded and not, was rendered
     into this box at a 400px viewport and the tallest was 124px - `Top of
     range on all 3 sets at zero load. Add 2.5 kg next session.` with Rule
     I2's second line under it. The reminder is 90px, so 34px of the slot is
     deliberately empty on most cards. That is the price of the card not
     moving, and it is paid below the last input, where it costs a scroll and
     never a mis-tap. rem, so 200% text scales the reservation too. */
  .vslot{min-height:7.75rem}

  /* -- PROGRESS PIPS (spec 0.5, B-59) ---------------------------------------
     The prototype painted three states in one form at three alphas, the
     lowest 1.7:1. Raising it to a passing 4.0:1 would make an upcoming pip
     look like a completed one and erase the only thing the strip is for. So
     the meaning moved: the accessible carrier is the TEXT `Exercise 3 of 7`,
     the strip is aria-hidden redundant graphics, and every painted pip
     distinguishes by FORM as well as value - filled bar (done), amber and
     double height (current), outline only (upcoming). Nothing meaningful is
     under 3:1 and "not done yet" still reads as empty. Greyscale-safe.     */
  .pips{display:flex; gap:3px; align-items:flex-end; padding:var(--s2) var(--s4) 0}
  .pip{flex:1; height:4px}
  .pip.done{background:var(--t45)}
  .pip.now{background:var(--amber); height:8px}
  .pip.next{background:none; border:1px solid var(--t45); height:4px}

  /* ==== W7: THE SESSION SCREEN ============================================
     ORDER IS NORMATIVE (spec 4.1): header, pips, fix bar, reintroduction
     offer, name + target, prescription, movement & cue, SET ROWS, add/remove,
     NOTE (the last input), then the bottom stack, then prev/next, then
     DISCARD SESSION, then the rest band in the dock. Nothing that appears or
     resizes sits above an input, which is the rule that makes this safe. */
  .sesshead{padding:20px var(--s4) 0}
  .sesshead .kick{color:var(--faint)}
  /* The fix bar (spec 2.3 rule 3). Rides the exercise screen he was sent to
     for as long as a refusal stands. FIXED height, never disappears while the
     refusal stands - only its text changes - and it renders at FIRST PAINT of
     that screen, so it is a navigation and not an appearance. */
  .fixbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:var(--s2); margin:var(--s3) var(--s4) 0; padding:0 0 0 var(--s3);
    border:2px solid var(--red-hi); border-radius:var(--r); min-height:var(--key)}
  .fixbar p{color:var(--bone); font-size:.8125rem; font-weight:800; line-height:1.3}
  .fixbar button{color:var(--amber); font-size:.6875rem; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; min-height:var(--key); min-width:6.5rem; padding:0 var(--s3); flex:none}
  /* Rule V1's reintroduction offer. First exercise screen only, answerable
     without scrolling from where it appears, "Not yet" lowest and therefore
     the cheapest tap. Inline, never an overlay, never a focus trap. */
  .offer{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    margin:var(--s3) var(--s4) 0; padding:14px var(--s4)}
  .offer p{color:var(--bone); font-size:.875rem; line-height:1.45}
  .offer .btns{margin-top:var(--s3)}
  .offer .btns button{width:100%}
  .offer .btns button+button{margin-top:var(--s2)}
  .exname{padding:var(--s4) var(--s4) 0}
  /* session 0.1 #9: the TARGET never wraps, truncates or shrinks. The name is
     what gives way, so it gets min-width:0 and the target gets flex:none. */
  .exname .row{align-items:baseline}
  .exname h3{min-width:0; overflow-wrap:anywhere}
  .rx{color:var(--dim); font-size:.8125rem; line-height:1.45; padding:6px var(--s4) 0}
  /* MEASURED at 200% text: two 8rem controls side by side are 552px inside a
     368px column and put 137px of horizontal scroll on the session screen.
     They wrap instead - nothing shrinks, the row grows downward, and
     downward is allowed because everything below these is a control. */
  .ctlrow{display:flex; flex-wrap:wrap; gap:var(--s2); padding:0 var(--s4) var(--s3)}
  .ctlrow button{flex:1 1 8rem; min-height:var(--key); min-width:8rem;
    border:2px solid var(--line); border-radius:var(--r); color:var(--bone);
    font-size:.75rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:0 var(--s2)}
  /* Removing the last remaining row is not offered (spec 4.5 rule 6). The
     SPACER keeps the row's height and width identical either way, so the note
     field below it never moves - an input may not be shifted by a control
     appearing or disappearing above it (0.1 #1). */
  .ctlrow .spacer{flex:1 1 8rem; min-width:8rem; min-height:var(--key)}
  .notewrap{padding:0 var(--s4) var(--s3)}
  .stack{padding:0 var(--s4)}
  .navrow{display:flex; flex-wrap:wrap; gap:var(--s2); padding:0 var(--s4)}
  .navrow button{min-height:52px; border:2px solid var(--line); border-radius:var(--r);
    color:var(--bone); font-size:.75rem; font-weight:800; letter-spacing:.05em;
    text-transform:uppercase; padding:0 var(--s3)}
  .navrow .prev{flex:none; min-width:56px}
  /* Exercise 1 has nothing behind it. The control still occupies its slot, so
     NEXT does not move between screen 1 and screen 2 and his thumb has one
     target, but it must not READ as tappable. */
  .navrow button[disabled]{color:var(--faint); border-color:var(--rule); cursor:default}
  .navrow .next{flex:1 1 auto; min-width:0; background:var(--amber); color:var(--bg);
    border-color:var(--amber); overflow-wrap:anywhere}
  /* -- THE REST BAND (Rule R1, spec 4.10) ----------------------------------
     It lives inside #dock, so the space it occupies is reserved by the same
     measured padding-bottom that keeps an input clear of the nav (B-36). It is
     PERMANENT from the moment the session opens, so it never appears and never
     covers the row he just committed. It absorbs taps and does nothing.
     Its text is written through ONE cached text node and render() is never
     called from the tick (B-61, B-19). */
  #rest{background:var(--surface); border-top:1px solid var(--line);
    padding:var(--s2) var(--s4); min-height:3.4rem; display:flex; align-items:center}
  #rest p{color:var(--bone); font-size:.8125rem; font-weight:800; line-height:1.35}
  .primary{width:100%; background:var(--amber); color:var(--bg); border-radius:var(--r);
    padding:var(--s4); font-size:.9375rem; font-weight:800; letter-spacing:.04em;
    text-transform:uppercase; min-height:56px}
  .ghostbtn{width:100%; background:transparent; color:var(--bone); border:2px solid var(--line);
    border-radius:var(--r); padding:var(--s3); font-size:.8125rem; font-weight:800;
    letter-spacing:.05em; min-height:var(--key)}
  .link{color:var(--bone); font-size:.8125rem; font-weight:800}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:var(--s4)}
  .row{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3)}
  .big{font-size:1.5rem; font-weight:800; letter-spacing:-.02em; color:var(--bone)}
  .warn{background:var(--surface); border-left:3px solid var(--red); border-radius:var(--r); padding:14px var(--s4)}

  .sess{display:flex; align-items:center; justify-content:space-between; gap:var(--s3);
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:var(--s3) var(--s4); margin-bottom:var(--s2)}

  /* -- THE DOCK -------------------------------------------------------------
     #dock is the bottom-anchored stack so the offer sheet sits above nav with
     no magic offset to keep in sync. fixed, not absolute: absolute pinned it
     to the bottom of the DOCUMENT and the Train tab is taller than a phone,
     so the sheet booted below the fold. #app's padding-bottom is set from
     this element's MEASURED height, so no input can hide under it (B-36).
     Five tabs at a 400px viewport are 80px each - over the 78px the control
     inventory asks for (spec 0.4 row 1) - and 52px tall, over the 44 floor. */
  /* left:0 + right:0 + auto margins is exactly the centring #view gets from
     margin:0 auto, resolved against the same width, so the two rects match to
     the pixel at every viewport width. Measured at 1920/1440/1024/768/400/320. */
  #dock{position:fixed; bottom:0; left:0; right:0; margin:0 auto;
    max-width:var(--col); z-index:40}
  nav{display:flex; background:var(--bg); border-top:2px solid var(--bone);
    padding-bottom:max(10px, env(safe-area-inset-bottom))}
  nav button{flex:1 1 0; min-width:0; min-height:52px; padding:var(--s3) 2px;
    font-size:.6875rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:var(--faint); overflow-wrap:anywhere; hyphens:auto}
  /* Selection is never colour alone: amber label + a 3px inset bar + 800 and
     aria-current="page". Greyscale it and the bar still says which. */
  nav button.on{color:var(--amber); box-shadow:inset 0 3px 0 var(--amber)}

  /* ---- W5: draft-restore sheets (W4 0.5-0.7) ----
     Variant A (offer) is non-modal and lives in #dock. Variant B (confirm) is
     modal and lives in #modal. Both share .sheet. */
  .sheet{background:var(--surface); border-top:2px solid var(--bone);
    border-radius:var(--r); padding:18px var(--s4) var(--s4)}
  .sheet .eyebrow{color:var(--bone); font-size:.6875rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase}
  .sheet h2{color:var(--bone); font-size:1.0625rem; font-weight:800; line-height:1.3; margin:6px 0 0}
  .sheet h2:focus{outline:none}
  .sheet .det{color:var(--dim); font-size:.875rem; font-weight:400; line-height:1.45; margin-top:6px}
  .sheet .rule{color:var(--bone); font-size:.8125rem; line-height:1.45; margin-top:var(--s3);
    border-left:3px solid var(--red-hi); padding-left:var(--s2)}
  .sheet .btns{margin-top:var(--s4)}
  .sheet .btns>button{display:block; width:100%}
  .sheet .btns>button+button{margin-top:var(--s3)}
  .sheet .primary{min-height:52px}
  .sheet .ghostbtn{min-height:var(--key)}
  /* Destructive: never colour alone - the label always names the count too. */
  .danger{border-color:var(--red-hi); color:var(--red-hi)}
  /* The scrim is the one fixed thing that is NOT column-width: it covers the
     viewport. Its contents are, and align to the column exactly. */
  #modal{position:fixed; left:0; right:0; top:0; bottom:0; z-index:60;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center}
  #modal:empty{display:none}
  #modal .scrim{position:absolute; left:0; right:0; top:0; bottom:0; background:var(--scrim)}
  #modal .sheet{position:relative; width:100%; max-width:var(--col)}
  .loading{color:var(--dim); font-size:.875rem; text-align:center; padding:44px var(--s4)}
  .warn.hi{border-left-color:var(--red-hi)}
  /* DISCARD SESSION is destructive and no longer lives in the header. A top
     corner may hold a control that is neither destructive nor frequent, and
     this is destructive and one tap from a whole session (0.4, 4.12,
     B-34 / C-13). It is now the last element in the session scroll. */
  #discard{min-height:var(--key); width:100%; padding:var(--s3);
    border:2px solid var(--line); color:var(--bone); border-radius:var(--r);
    font-size:.8125rem; font-weight:800; letter-spacing:.05em}

  /* fixed for the same reason as #dock: "Discarded." must be on screen.
     NOT a live region - #bs-live is the only one. See announce(). */
  #toast{position:fixed; bottom:92px; left:0; right:0; margin:0 auto; max-width:var(--col);
    z-index:70; display:flex; justify-content:center; align-items:stretch; gap:2px;
    padding:0 var(--s4); pointer-events:none; opacity:0; transition:opacity .18s}
  #toast.on{opacity:1}
  #toast .msg{background:var(--amber); color:var(--bg); padding:9px 17px; border-radius:var(--r);
    font-size:.8125rem; font-weight:800; display:flex; align-items:center; min-height:var(--key)}
  /* The undo control (spec 0.4 row 23, 2.4). It is the only part of the toast
     that takes a tap, and it does NOT expire on a timer: he is out of breath
     and reading something else, so it lives until he answers it, until another
     destructive action replaces it, or until the session ends. */
  #toast button{pointer-events:auto; background:var(--bg); color:var(--bone);
    border:2px solid var(--amber); border-radius:var(--r); min-width:88px; min-height:var(--key);
    font-size:.75rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:0 var(--s3)}
  #toast button[hidden]{display:none}

  /* ---- WO-001 W6: the blocked-save message (W4 2.2-2.3) ----
     Sits on --bg directly above Save session, where his thumb already is. */
  #bs-msg{border-left:3px solid var(--red-hi); padding-left:var(--s3); margin-bottom:14px}
  #bs-msg h2{color:var(--bone); font-size:.9375rem; font-weight:800; line-height:1.35; margin:0}
  #bs-msg h2:focus{outline:none}
  .bsre{color:var(--dim); font-size:.8125rem; line-height:1.45; margin-top:var(--s1)}
  .bslist{margin-top:10px; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
  .bsrow{display:flex; align-items:center; gap:10px; width:100%; min-height:var(--key);
    padding:9px var(--s3); background:var(--surface); text-align:left}
  .bsrow+.bsrow{border-top:1px solid var(--line)}
  .bsrow:active{background:var(--hi)}
  .bsex{color:var(--bone); font-size:.84375rem; line-height:1.3; flex:1}
  .bstok{color:var(--bone); font-size:.78125rem; font-weight:800; white-space:nowrap}
  .bschev{color:var(--amber); font-size:1.25rem; line-height:1}
  .bsmore{color:var(--dim); font-size:.8125rem; margin-top:var(--s2)}
  /* Announcements that must not be seen: the running count, the stepper
     normalisations, the verdict on commit, and a blocked draft write. */
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

  .legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:10px}
  .legend span{display:flex; align-items:center; gap:7px; color:var(--dim); font-size:.8125rem}
  .swatch{width:13px; height:3px; border-radius:var(--r)}
  label.check{display:flex; gap:var(--s3); align-items:flex-start; cursor:pointer; min-height:var(--tap)}
  /* 44x44, not 24x24. The wrapping label is already a 334x62 target, but a
     checkbox is independently focusable and tappable, so it carries the floor
     itself rather than borrowing its parent's (B-43). A native box at 44px
     paints as a bare white square on this ground, so it is drawn from the
     tokens instead: empty outline vs amber fill AND a tick — two signals, so
     it survives greyscale. */
  label.check input{-webkit-appearance:none; appearance:none; margin:0; flex:none;
    width:var(--tap); height:var(--tap); background:var(--bg); cursor:pointer;
    border:2px solid var(--line); border-radius:var(--r); display:grid; place-content:center}
  label.check input:checked{background:var(--amber); border-color:var(--amber)}
  label.check input:checked::after{content:""; width:17px; height:9px; display:block;
    border:3px solid var(--bg); border-top:0; border-right:0; transform:rotate(-45deg) translateY(-3px)}
  /* A screen W7 onward has not built yet. It says so; it does not pretend. */
  .todo{padding:var(--s6) var(--s4)}
  .todo p{color:var(--dim); font-size:.875rem; line-height:1.55; margin-top:var(--s3); max-width:32em}
  .mb12{margin-bottom:var(--s3)} .mt12{margin-top:var(--s3)}
  .mt16{margin-top:var(--s4)} .mt24{margin-top:var(--s6)}
</style>
</head>
<body>

<div id="app">
  <div id="view"></div>
  <!-- The visible toast is decoration over the live region below: it carries
       no aria-live of its own, because two regions over one sentence are read
       twice. toast() routes its text through announce() instead. -->
  <!-- aria-hidden is on the MESSAGE, not on the container: the visible text is
       decoration over #bs-live, which has already said it, but the undo
       control is a real control and a focusable button inside an aria-hidden
       subtree is a control a screen-reader user can reach and cannot hear. -->
  <div id="toast"><span class="msg" aria-hidden="true"></span><button id="toast-act" hidden></button></div>
  <!-- WO-004 W6: THE ONE LIVE REGION. Blocked-save running count, stepper
       normalisations, the verdict on commit, a blocked draft write. Created
       once at boot and outside #view, so no re-render can destroy it — a live
       region that is recreated is a live region that is never announced. -->
  <p id="bs-live" role="status" aria-live="polite" class="sr-only"></p>
  <div id="dock">
    <!-- Draft-restore offer sheet (non-modal). Above nav, never covering it. -->
    <div id="dr-offer"></div>
    <!-- W7: Rule R1's rest band. Sticky above the tab dock by being IN the
         dock, so reserveDock() reserves its height along with nav's and no
         input can hide under it. Present from the moment a session opens, at
         constant size, so it never appears over the row he just committed. -->
    <div id="rest-box"></div>
    <!-- Five tabs. 400px / 5 = 80px each, over the 78px the control inventory
         asks for, and 52px tall. aria-current, not colour, says which. -->
    <nav aria-label="Screens">
      <button data-tab="train" class="on" aria-current="page">Train</button>
      <button data-tab="trend">Trend</button>
      <button data-tab="weight">Weight</button>
      <button data-tab="diet">Diet</button>
      <button data-tab="plan">Plan</button>
    </nav>
  </div>
  <!-- Modal confirmations. Empty = display:none, so it never eats a tap. -->
  <div id="modal"></div>
</div>

<!-- Pure logic: dates, validation, migration. Classic script, no module, so it
     works from file://. index.html cannot run without it. -->
<script src="logic.js"></script>
<script>
(function(){
"use strict";
/* logic.js missing (a partial deploy) used to mean a black screen. Say so. */
if(!window.PHAT){
  document.getElementById("view").innerHTML =
    '<div style="padding:26px 16px;color:var(--bone);font-family:var(--sans)">'+
    '<h1 style="font-size:1.25rem;margin:0 0 8px">logic.js did not load</h1>'+
    '<p style="color:var(--dim);font-size:.875rem;line-height:1.5">The app will not run without it, '+
    'and nothing has been read or written. Your saved log is untouched. Reload, or re-upload both '+
    'index.html and logic.js.</p></div>';
  return;
}
/* ============================================================ program */
const PROGRAM = [
 {id:"d1",name:"Upper power",ex:[

 {id:"d4",name:"Lower hypertrophy",ex:[

 {id:"d5",name:"Chest & arms",ex:[

  {id:"d5b",implement:"db",n:"Incline DB press",s:3,lo:8,hi:12,k:"hyp"},
  {id:"d5c",implement:"machine",n:"Machine chest press",s:3,lo:12,hi:15,k:"hyp"},
  {id:"d5d",implement:"cable",n:"Incline cable fly",s:2,lo:15,hi:20,k:"hyp",cut:1},
  {id:"d5e",implement:"bb",n:"Cambered bar preacher curl",s:3,lo:8,hi:12,k:"hyp"},
  {id:"d5f",implement:"db",n:"DB concentration curl",s:2,lo:12,hi:15,k:"hyp"},
  {id:"d5g",implement:"bb",n:"Spider curl",s:2,lo:15,hi:20,k:"hyp",cut:1},
  {id:"d5h",implement:"bb",n:"Close-grip bench",s:3,lo:8,hi:12,k:"hyp"},
  {id:"d5i",implement:"bb",n:"Skull crusher",s:3,lo:12,hi:15,k:"hyp"},
  {id:"d5j",implement:"cable",n:"Rope pressdown",s:2,lo:15,hi:20,k:"hyp",cut:1}]}
];
const KEY_LIFTS=[{id:"d1a",n:"Row",c:"var(--amber)"},{id:"d1d",n:"Bench",c:"var(--green)"},
                 {id:"d2a",n:"Squat",c:"var(--bone)"},{id:"d2d",n:"Deadlift",c:"var(--red)"}];

/* ============================================================ storage */
/* One seam. window.storage and localStorage are two separate stores — the
   adapter picks one at boot and NOTHING may write around it (CLAUDE.md §7). */
const LOG="phat:v1:log", BWK="phat:v1:bw", DRAFT="phat:v1:draft";
const hasNative = typeof window.storage!=="undefined" && window.storage && window.storage.get;
/* readRaw distinguishes the three outcomes load() used to collapse into null:
   absent (nothing stored), ok (parsed), error (the read threw, or the stored
   text is not JSON). "Absent" and "unreadable" must never look the same —
   that is how a real draft gets silently overwritten. */
async function readRaw(k){
  let raw=null;
  try{
    if(hasNative){ const r=await window.storage.get(k); raw=(r&&r.value!=null)?r.value:null; }
    else raw=localStorage.getItem(k);
  }catch(e){ return {status:"error",value:null,reason:"read",raw:null}; }
  if(raw==null||raw==="") return {status:"absent",value:null,raw:null};
  try{
    const v=JSON.parse(raw);
    if(v===null) return {status:"absent",value:null,raw:raw};
    return {status:"ok",value:v,raw:raw};
  }catch(e){ return {status:"error",value:null,reason:"parse",raw:raw}; }
}
async function load(k){ const r=await readRaw(k); return r.status==="ok"?r.value:null; }
async function save(k,obj){
  if(S.blockWrites[k]){
    S.err="Not saved. The stored copy of this data could not be read and must not be overwritten. Export, then reload.";
    return false;
  }
  try{
    if(hasNative) await window.storage.set(k,JSON.stringify(obj));
    else localStorage.setItem(k,JSON.stringify(obj));
    S.err=null; return true;
  }catch(e){ S.err="Could not save. Your entries are still on screen — try again."; return false; }
}
async function del(k){
  try{
    if(hasNative){
      const rm=window.storage.remove||window.storage.delete||window.storage.del;
      if(typeof rm==="function") await rm.call(window.storage,k);
      else await window.storage.set(k,"null");   // no delete on the bridge: blank it
    }
    else localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}

/* ============================================================ state */
/* logMeta/bwMeta carry every key of the stored objects we don't own (schema
   version, utcDatedBefore, anything a future build adds) so a write never
   drops a key it didn't understand. */
/* S.offer is the draft as it sits ON DISK, offered back on the Train tab. It is
   never the same object as S.draft: S.draft is what is on screen. */
/* W7 adds: exIx (which exercise screen is on, PERSISTED in the draft - a
   reload that comes back on exercise 1 of 9 has lost his place), rest (Rule
   R1's one absolute timestamp, never persisted, never in the save path), undo
   (C-12's removed row, live for the whole session), and v1msg / v1added (Rule
   V1's answer, in place, for this session). */
const S={tab:"train",sessions:[],includeCut:false,bw:[],draft:null,dayId:null,err:null,
         problems:[],logMeta:{},bwMeta:{},blockWrites:{},draftRead:{status:"none"},offer:null,
         exIx:0,rest:null,undo:null,v1msg:"",v1added:null};
const logPayload=()=>Object.assign({},S.logMeta,
  {schemaVersion:PHAT.SCHEMA_VERSION,sessions:S.sessions,includeCut:S.includeCut});
const bwPayload=()=>Object.assign({},S.bwMeta,
  {schemaVersion:PHAT.SCHEMA_VERSION,entries:S.bw});

/* ============================================================ utils */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ---- ONE MONTH-NAME SOURCE (B-44, and the rest of B-35) -------------------
   There is exactly one table of month names in this product and it is
   PHAT.dayMon's, in logic.js. Intl is not used here at all — not with a
   pinned locale, not with formatToParts. en-GB short September is "Sept" on
   current ICU, the coach-signed copy says "Sep", and a string a test pins and
   a coach approved may not change when a browser ships new locale data.
   Everything with a date in it goes through fmt() or fmtDay(), both below,
   both built on PHAT.dayMon. If you find yourself typing "Intl" in this file,
   that is the bug.

   WEEKDAYS are the same problem one table down, so they get the same
   treatment: a fixed array, indexed by a Date built at local noon.
   B-14: the year is appended once the date is not in the current calendar
   year, so "7 Sep" cannot mean two different sessions twelve months apart. */
const WDAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const noon=ds=>{const t=new Date(String(ds)+"T12:00:00"); return isNaN(t.getTime())?null:t;};
const fmt=d=>{
  const s=PHAT.dayMon(d);
  if(!s) return String(d);
  const y=String(d).slice(0,4);
  return y===String(new Date().getFullYear())?s:s+" "+y;   /* B-14 */
};
const ago=d=>Math.round((Date.now()-new Date(d+"T12:00:00"))/86400000);
const r1=x=>Math.round(x*10)/10;
/* Thousands separator, fixed. Number#toLocaleString is the same class of bug
   as Intl month names: on a de-DE phone it renders 1.234 kg for one thousand
   two hundred and thirty-four. One app, one shape for a number. */
const sep=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,",");
/* The toast is the VISIBLE half only. There is one live region in this app
   (#bs-live) and the toast node is permanently aria-hidden, so a sentence is
   never read twice by two regions over one piece of content (spec §2.6).
   {quiet} — the caller has already announced this sentence itself (B-39), so
   do not announce it again. {ms} — a failure stays on screen longer than a
   receipt. */
function toast(m,quiet,ms){const t=document.getElementById("toast");
  t.querySelector(".msg").textContent=m;
  const act=document.getElementById("toast-act");
  if(act){ act.hidden=true; act.textContent=""; }
  if(!quiet) announce(m);
  t.classList.add("on");clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove("on"),ms||2100);}
/* An undo (spec 2.4, defined once): a control in the toast, >= 88 x 48, live
   for the WHOLE SESSION and not a 5-second timer - he is out of breath and
   reading something else. It restores the removed object byte-for-byte. A
   second destructive action replaces the pending undo and the toast says which
   one it now undoes. */
function toastUndo(m){
  const t=document.getElementById("toast"), act=document.getElementById("toast-act");
  t.querySelector(".msg").textContent=m;
  announce(m);
  if(act){ act.hidden=false; act.textContent="Undo"; act.setAttribute("aria-label",m+" Undo."); }
  t.classList.add("on"); clearTimeout(toast._t);
  /* The toast is the IMMEDIATE reach. The undo itself does not expire with
     it: while S.undo stands, the exercise's bottom stack carries a persistent
     Undo control (vSession), so "live for the whole session" is honoured by a
     control that is always reachable rather than by a bar that floats over
     every screen for the rest of the workout.
     The button is REMOVED, not just faded: #toast hides by opacity, and an
     opacity-0 button is still focusable and still takes a tap. */
  toast._t=setTimeout(()=>{ t.classList.remove("on"); if(act) act.hidden=true; },6000);
}
function hideToast(){
  const t=document.getElementById("toast"), act=document.getElementById("toast-act");
  clearTimeout(toast._t); t.classList.remove("on");
  if(act){ act.hidden=true; act.textContent=""; }
}
function lastDay(id){for(let i=S.sessions.length-1;i>=0;i--)if(S.sessions[i].dayId===id)return S.sessions[i].date;return null;}
function weeksIn(){return S.sessions.length?Math.floor(ago(S.sessions[0].date)/7)+1:0;}


/* ============================================================ movement diagrams */
/* B-64 CLOSED. A slot keeps its pattern only while the GROUND REFERENCE
   matches - 11.2(1) makes that the one thing that renders a pattern legible.
   Four slots lost their figure rather than keep a wrong one, per 11.8: "a
   missing figure is a smaller loss than a wrong one". All four keep their
   cue, and 4.13 then renders the cue alone with no empty box.
     d3c  seated cable row  was 'hpull', a hinged torso holding a barbell.
          REMAPPED to 'srow', a new pattern: seat, foot plate, upright torso.
     d4c  leg press         was 'squat', a standing figure with a bar on its
          back. NO FIGURE. A leg press has no fixed ground reference to draw:
          the platform itself is what moves, so the apparatus cannot be
          scenery. Drawn and rejected on the contact sheet - it did not read.

/* Stroke weights are in frame units, and every frame is 112 units tall
   rendered at ~84 CSS px, so 4.4 units is ~3.3 px and 3 units ~2.3 px - over
   11.4's 2.5 px floor for the solid pose. Ghost and solid differ by VALUE and
   by WEIGHT, never by hue, so the pair survives greyscale (11.4, 11.8 #1). */
function limb(p,col,sw,r){
  let g="";
  if(p.h) g+=`<circle cx="${p.h[0]}" cy="${p.h[1]}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"/>`;
  for(const k of ["sp","ar","ar2","lg","lg2"]) if(p[k])
    g+=`<polyline points="${p[k].map(a=>a.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(p.bar) g+=`<line x1="${p.bar[0]-p.bar[2]}" y1="${p.bar[1]}" x2="${p.bar[0]+p.bar[2]}" y2="${p.bar[1]}" stroke="${col}" stroke-width="${sw+1.4}" stroke-linecap="round"/>`;
  if(p.db) for(const d of p.db)
    g+=`<line x1="${d[0]-3.5}" y1="${d[1]}" x2="${d[0]+3.5}" y2="${d[1]}" stroke="${col}" stroke-width="${sw+3.6}" stroke-linecap="round"/>`;
  return g;
}

/* B-15: `ah_${pattern}` repeated the moment two diagrams of the same pattern
   were open at once — two elements with one id, and an arrowhead that points
   at whichever the browser resolved first. The counter makes every marker id
   unique per rendered instance, which is what SVG requires. */
let figSeq=0;
function diagram(id){
  const pat=PAT[id], P=POSES[pat];
  if(!P) return "";
  const mk="ah_"+pat+"_"+(++figSeq), W=P.vb[0], H=P.vb[1];
  /* The ground reference is scenery and may sit at the non-text floor (11.4).
     One rule or one simple form per pattern - the floor line, the bench slab,
     the block. Bench legs down to a floor were tried and removed: they cost
     half the frame's height and told the reader nothing. */
  const G=P.g.map(g=> g[0]==="floor"
      ? `<line x1="0" y1="${g[1]}" x2="${W}" y2="${g[1]}" stroke="var(--rule)" stroke-width="3.2"/>`
    : g[0]==="rect"
      ? `<rect x="${g[1]}" y="${g[2]}" width="${g[3]}" height="${g[4]}" fill="var(--rule)"/>`
      : `<line x1="${g[1]}" y1="${g[2]}" x2="${g[3]}" y2="${g[4]}" stroke="var(--rule)" stroke-width="4.2" stroke-linecap="round"/>`).join("");
  const A=P.ar, d=A.c
    ? `M${A.f[0]},${A.f[1]} Q${A.c[0]},${A.c[1]} ${A.t[0]},${A.t[1]}`
    : `M${A.f[0]},${A.f[1]} L${A.t[0]},${A.t[1]}`;
  /* aria-hidden: the cue sentence beside it is the accessible description,
     and a stick figure announced as a pile of polylines is noise. The cue is
     appended by figBody(), from the plan - never from this table. */
  return `<svg class="mv" viewBox="0 0 ${W} ${H}" aria-hidden="true"
    style="--fw:${Math.min(6*W/H,13).toFixed(2)}em;--ar:${(W/H).toFixed(3)}"
    xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="${mk}" markerWidth="4.2" markerHeight="4.2" refX="3.2" refY="2.1" orient="auto">
      <path d="M0,0 L4.2,2.1 L0,4.2 z" fill="var(--amber)"/></marker></defs>
    ${G}${limb(P.a,"var(--t45)",3,P.r)}${limb(P.b,"var(--bone)",4.4,P.r)}
    <path d="${d}" fill="none" stroke="var(--amber)" stroke-width="3.6" stroke-linecap="round"
      marker-end="url(#${mk})"/></svg>`;
}
/* Rule Q1's cue, from the PLAN DOCUMENT - 42 per-exercise strings signed off
   by strength-coach, not the 15 per-pattern ones the prototype carried. No
   rule reads a cue: it is a function of the exercise and of nothing else -
   never the week, the load or the verdict. A MISSING CUE IS A LEGAL STATE
   (normalise drops an empty string, so a blank cue is absent), and a
   user-created exercise may legitimately have none. */
function cueFor(id){
  try{
    const x=PHAT.exById(PHAT.PHAT_PLAN,id);
    return (x&&typeof x.cue==="string"&&x.cue.trim()!=="")?x.cue.trim():"";
  }catch(err){ return ""; }
}
const hasFig=id=>!!(PAT[id]&&POSES[PAT[id]]);
/* Spec 4.13. Figure and cue -> both. Cue but no figure -> the cue alone, with
   no empty box. Neither -> the disclosure control is not rendered at all (see
   vSession). No placeholder, no FIG 3 box, no "supply the illustrations"
   note: an empty frame in the gym is worse than no frame. */
function figBody(id){
  const c=cueFor(id);
  return (hasFig(id)?diagram(id):"")+(c?`<p class="figcue"><b>Cue.</b> ${esc(c)}</p>`:"");
}

/* ============================================================ chart */
function linechart(rows,series,h){
  const W=500,H=h||230,P={t:12,r:12,b:24,l:38};
  const vals=[]; rows.forEach(r=>series.forEach(s=>{if(r[s.n]>0)vals.push(r[s.n])}));
  if(vals.length<2) return "";
  let mn=Math.min(...vals),mx=Math.max(...vals); const pad=(mx-mn)*.15||2; mn-=pad; mx+=pad;
  const X=i=>P.l+(rows.length<2?0:i*(W-P.l-P.r)/(rows.length-1));
  const Y=v=>P.t+(1-(v-mn)/(mx-mn))*(H-P.t-P.b);
  let g="";
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);
    g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`+
       `<text x="${P.l-6}" y="${y+4}" fill="var(--dim)" font-size="11" text-anchor="end">${Math.round(v)}</text>`;}
  series.forEach(s=>{
    const pts=rows.map((r,i)=>r[s.n]>0?[X(i),Y(r[s.n])]:null).filter(Boolean);
    if(pts.length<2) return;
    g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"
        points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${s.c}"/>`);
  });
  const step=Math.max(1,Math.ceil(rows.length/5));
  rows.forEach((r,i)=>{if(i%step===0||i===rows.length-1)
    g+=`<text x="${X(i)}" y="${H-6}" fill="var(--dim)" font-size="11" text-anchor="middle">${esc(r.date)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">${g}</svg>`;
}

/* ============================================================ views */
function vTrain(){
  const w=weeksIn();
  let h=`<div class="pad" style="padding-top:26px;padding-bottom:16px">
    <h1>${S.sessions.length?"Week "+w:"Start here"}</h1>
    <p class="sub">${S.sessions.length
      ? S.sessions.length+" session"+(S.sessions.length===1?"":"s")+" logged. Pick today's day."
      : "Pick a day and log your first session. Every number you enter makes the next one easier."}</p></div>
    <div class="pad">`;
  PROGRAM.forEach(d=>{
    const l=lastDay(d.id), a=l?ago(l):null, stale=a!==null&&a>=8;
    h+=`<button class="daybtn${stale?" stale":""}" data-day="${d.id}">
      <span><span class="nm">${esc(d.name)}</span>
      <span class="ago" style="display:block">${l?(a===0?"Done today":a+" days ago"):"Never logged"}</span></span>
      <span class="chev">&rsaquo;</span></button>`;
  });
  h+=`</div><div class="pad mt24">
    <div class="panel"><label class="check">
      <input type="checkbox" id="cut" ${S.includeCut?"checked":""}>
      <span><span style="font-size:.90625rem;font-weight:600">Full volume</span>
      <span style="color:var(--dim);font-size:.8125rem;display:block;margin-top:3px;line-height:1.45">
      Adds the extra accessory work back in. Leave this off for the first four weeks.</span></span>
    </label></div>
    <button class="ghostbtn mt12" id="export">Export everything as JSON</button>
    <p class="tiny mt12">Your log is saved on this device. Export once a month so nothing costs you the history.</p>
    </div>`;
  /* Storage-level failure notice, State 1I included: bottom of the Train tab,
     above the nav, --bone text with a --red-hi rule (--red fails on --surface). */
  if(S.err) h+=`<div class="pad mt12"><div class="warn hi" role="alert">
    <p style="color:var(--bone);font-size:.8125rem;line-height:1.5">${esc(S.err)}</p></div></div>`;
  return h;
}

/* ============================================================ W7: session
   ONE EXERCISE PER SCREEN. Everything the screen needs, computed once per
   paint. Fails OPEN (spec §0.7): if Rule V1 throws, the whole day renders,
   because a partial day is worse than a full one and a card that is not on
   screen is a set he cannot log. */
function sessionCtx(){
  const day=PROGRAM.find(x=>x.id===S.dayId);
  const today=PHAT.localDate();
  const all=day?day.ex.map(e=>e.id):[];
  let tier=null;
  try{
    tier=PHAT.volumeTier({dayId:S.dayId, program:PROGRAM, sessions:S.sessions,
      state:S.logMeta, todayStr:today, draft:S.draft, plan:PHAT.PHAT_PLAN});
  }catch(err){ tier=null; }
  let ids=(tier&&Array.isArray(tier.exerciseIds)&&tier.exerciseIds.length)
    ? tier.exerciseIds.slice() : all.slice();
  /* The Full-volume checkbox is B-23 / C-1 and WO-004 W13 DELETES it. Until
     then it is still on the Train tab, and an inert control is its own lie, so
     while it is ticked it still forces the whole day. Nothing else reads it,
     and Rule V1 owns the default. */
  if(S.includeCut) ids=all.slice();
  /* Spec §2.3 rule 6: a row a refusal points at must be reachable even when
     the tier hides it. A refusal pointing at an unreachable row is the worst
     state in the spec. */
  S.problems.forEach(pr=>{ if(pr.exId&&ids.indexOf(pr.exId)<0) ids.push(pr.exId); });
  const list=day?day.ex.filter(e=>ids.indexOf(e.id)>=0):[];
  let dl={active:false,day:null};
  try{ dl=PHAT.deloadStatus(S.logMeta,today); }catch(err){}
  return {day:day, today:today, tier:tier, list:list, deload:dl};
}
/* SP1's source lift's CURRENT name, so B-28's rename reaches the fallback copy
   without touching logic.js (WO-003 Decision 5). */
function speedSrcName(exId){
  const src=PHAT.SPEED_SRC&&PHAT.SPEED_SRC[exId];
  if(!src) return null;
  let nm=null;
  PROGRAM.forEach(d=>d.ex.forEach(x=>{ if(x.id===src) nm=x.n; }));
  return nm;
}
/* C-12 rule 2: `- REMOVE` targets the last BLANK row by preference, not the
   last row. The common case - a row added by mistake - never touches data. */
const blankSet=s=>String((s&&s.w)==null?"":s.w).trim()===""&&String((s&&s.r)==null?"":s.r).trim()==="";
function removeTarget(sets){
  for(let k=sets.length-1;k>=0;k--) if(blankSet(sets[k])) return k;
  return sets.length-1;
}

/* The ghost hint for one row. GHOST, NOT PREFILL (spec §4.4, ruled): the row
   starts empty and last session's numbers sit under it, so a number he did not
   choose can never reach the log. ACROSS A PRESCRIPTION CHANGE the per-row
   hint is DELETED, not captioned - prescriptionEpoch reports prefill:false and
   seed:false, and the provenance line renders in its place. */
function ghostText(e,prev,k,changed){
  if(changed) return "";
  const pv=prev&&prev.sets&&prev.sets[k];
  if(!pv) return "No prior set.";
  const pw=PHAT.parseWeight(pv.w), pr=PHAT.parseReps(pv.r);
  if(!pw.ok||!pr.ok) return "No prior set.";
  /* Rule Z2: a rack chin reads `Last bodyweight x 10`. No rule and no view in
     this app produces the string `0 kg`. */
  const w=pw.value>0?String(r1(pw.value)):PHAT.loadWord(0,e.implement);
  return "Last "+w+" × "+pr.value;
}

function vSession(){
  const C=sessionCtx(), list=C.list, n=list.length;
  if(!n) return `<div class="todo"><h1>Nothing to log</h1>
    <p>This day has no exercises in it. Your draft is untouched.</p></div>`;
  if(!(S.exIx>=0)) S.exIx=0;
  if(S.exIx>n-1) S.exIx=n-1;
  const i=S.exIx, e=list[i];
  const st=S.draft.entries[e.id]||{sets:[{w:"",r:""}],note:""};
  if(!st.sets.length) st.sets.push({w:"",r:""});
  /* The prescription that governs. deloadEx is idempotent and returns `ex`
     itself when no deload is active, so this is the same object on a normal
     week. A deload reduces the PRESCRIPTION, never the log. */
  const rx=PHAT.deloadEx(e,C.deload.active===true);
  const prev=PHAT.lastFor(S.sessions,e.id);
  let ep=null;
  try{ ep=PHAT.prescriptionEpoch({ex:e,prev:prev,plan:PHAT.PHAT_PLAN,exId:e.id}); }catch(err){ ep=null; }
  const changed=!!(ep&&ep.changed);
  let xs={flags:[],count:0,line:"",idle:false};
  try{ const r=PHAT.extraSets(st.sets,rx); if(r) xs=r; }catch(err){}
  let sl=null;
  if(e.k==="speed"){
    try{ sl=PHAT.speedLoad(S.sessions,e.id,C.today,speedSrcName(e.id),PHAT.PHAT_PLAN); }
    catch(err){ sl=null; }
  }
  const ag=PHAT.draftAge(S.draft.date,C.today);

  /* ---- header + pips. No destructive control: the header is information,
     not a control (§4.2, §4.12, B-34 / C-13). The pip strip is aria-hidden
     redundant graphics; pipStrip() carries `Exercise {i} of {n}` as the
     accessible carrier (B-59, §0.5). */
  let h=`<div class="sesshead"><p class="kick">${esc(C.day.name)} &middot; ${i+1} of ${n}</p>`;
  if(!ag.sameDay) h+=`<p class="sub">It saves under ${esc(fmtDay(S.draft.date,ag.ageDays))}, not today.</p>`;
  h+=`</div>${pipStrip(i,n)}`;

  /* ---- the fix bar (§2.3 rule 3). It renders at FIRST PAINT of the screen he
     was sent to, so it is a navigation and not an appearance; it is fixed
     height and never disappears while a refusal stands. The full message lives
     once, at the save point, on the last screen. */
  const showMsg=(i===n-1);
  if(S.problems.length&&!showMsg)
    h+=`<div class="fixbar"><p id="fixtxt">${esc(fixText())}</p>
      <button id="backsave">Back to save</button></div>`;

  /* ---- Rule V1's reintroduction offer. First exercise screen only: the
     decision is about this session and the moment to make it is before he has
     lifted anything (§4.11). */
  if(i===0) h+=vOffer(C);

  /* ---- name, target, prescription. §0.1 #9: the target never wraps, never
     truncates, never shrinks - the NAME is what gives way. ` . per DB` is
     required for implement:"db" and the prototype omits it (B-22). */
  const unit=(e.implement==="db")?" · per DB":"";
  const tgt=(rx.lo===rx.hi?rx.s+" × "+rx.lo:rx.s+" × "+rx.lo+"–"+rx.hi)+unit;
  h+=`<div class="exname"><div class="row"><h3>${esc(e.n)}</h3>
    <span class="target">${esc(tgt)}</span></div></div>`;
  /* Speed cards print SP1's computed load, never the prototype's static
     "65-70% of your power-day top set" (B-12). Everything else prints the
     provenance line, and ONLY across a prescription change - on an unchanged
     prescription the per-row ghosts already say it, once per row. */
  const rxline=(e.k==="speed")?(sl?sl.text:""):(changed?ep.line:"");
  if(rxline) h+=`<p class="rx">${esc(rxline)}</p>`;
  if(C.tier&&Array.isArray(C.tier.kept)&&C.tier.kept.indexOf(e.id)>=0)
    h+=`<p class="rx">Not in today's volume. It has numbers in it.</p>`;
  if(S.v1added===e.id) h+=`<p class="rx">Back in from this session.</p>`;

  /* ---- movement & cue. Neither figure nor cue -> the disclosure is NOT
     rendered at all. An empty frame in the gym is worse than no frame. */
  if(hasFig(e.id)||cueFor(e.id))
    h+=`<button class="showfig" data-fig="${esc(e.id)}" aria-expanded="false"
      aria-controls="fig-${esc(e.id)}">&rsaquo; movement &amp; cue</button>
      <div class="fig" id="fig-${esc(e.id)}" data-figbox="${esc(e.id)}"></div>`;

  /* ---- THE INPUTS. Built BEFORE and OUTSIDE every try block above, so no
     advice rule can prevent a set row painting (§0.7). */
  h+=`<div class="card" id="excard" data-ex="${esc(e.id)}"><div class="sets">`;
  for(let k=0;k<st.sets.length;k++){
    const g=ghostText(e,prev,k,changed);
    const at=` ${esc(e.n)} set ${k+1}`;
    h+=`<div class="setrow" data-i="${k}">
      <span class="idx" aria-hidden="true">${k+1}</span>
      <span class="grp"><span class="unit" aria-hidden="true">kg</span>
        <span class="stepper"><button data-act="-" data-f="w" aria-label="Weight down 2.5,${at}">&minus;</button>
        <input class="w" data-f="w" inputmode="decimal" placeholder="0"
          aria-label="Weight in kg,${at}" value="${esc(st.sets[k].w)}">
        <button data-act="+" data-f="w" aria-label="Weight up 2.5,${at}">+</button></span></span>
      <span class="grp"><span class="unit" aria-hidden="true">reps</span>
        <span class="stepper"><button data-act="-" data-f="r" aria-label="Reps down 1,${at}">&minus;</button>
        <input class="r" data-f="r" inputmode="numeric" placeholder="&ndash;"
          aria-label="Reps,${at}" value="${esc(st.sets[k].r)}">
        <button data-act="+" data-f="r" aria-label="Reps up 1,${at}">+</button></span></span>
      <span class="ghost"><span class="gtxt" data-ghost="${esc(g)}">${esc(g)}</span>
        <span class="xtra" data-xtra="${k}">${xs.flags[k]?"EXTRA":""}</span></span></div>`;
  }
  h+=`</div>`;

  /* ---- add / remove. CONTROLS, not inputs, so they sit BELOW every set input
     and ABOVE the note field: they change the number of rows above them, which
     is exactly why they must not sit above one (§4.1). The remove control
     NAMES ITS TARGET so he can see what he is about to lose before he taps
     (C-12 rule 1). */
  const tk=removeTarget(st.sets);
  h+=`<div class="ctlrow"><button id="addset">+ Add set ${st.sets.length+1}</button>`;
  h+=(st.sets.length>1)
    ? `<button id="rmset" data-k="${tk}">&minus; Remove set ${tk+1}</button>`
    : `<span class="spacer" aria-hidden="true"></span>`;
  h+=`</div>`;

  /* ---- THE NOTE FIELD - C-15, restored. Rule S1's ONLY input, and the LAST
     input on the card: the whole bottom-stack safety rule is defined relative
     to it. It grows downward on focus, which is allowed because everything
     below it is a control. */
  h+=`<div class="notewrap"><label class="lbl" for="exnote" style="margin-bottom:5px">Note</label>
    <input class="note" id="exnote" placeholder="Note &mdash; RIR, form, pain, anything"
      aria-label="Note for ${esc(e.n)} &mdash; RIR, form, pain, anything"
      value="${esc(st.note)}"></div></div>`;

  /* ---- THE BOTTOM STACK. Every slot here is BELOW the last input, so nothing
     in it can move an input by appearing or resizing (§0.1 #1). Order is
     normative: extras -> deload -> pain -> speed flag -> verdict. Filled by
     paintAdvice() on commit; the verdict slot is never empty and never
     collapses. */
  h+=`<div class="stack">
    <div id="slot-extra"></div>
    <div id="slot-deload"></div>
    <div id="slot-pain"></div>
    <div id="slot-speed"></div>
    <div id="slot-verdict"></div>`;
  /* C-12 rule 5. The toast is the immediate reach and it fades; the undo does
     not. While one stands it is a control in the bottom stack of the exercise
     it belongs to - below every input, reachable for the whole session, and
     never a bar floating over the next four screens. */
  if(S.undo&&S.undo.exId===e.id)
    h+=`<button class="ghostbtn mb12" id="undoset">Undo &mdash; put set ${S.undo.i+1} back</button>`;
  if(S.err) h+=`<div class="warn hi mb12" role="alert">
    <p style="color:var(--bone);font-size:.8125rem;line-height:1.5">${esc(S.err)}</p></div>`;
  if(showMsg) h+=`<div id="bs-slot"></div>`;

  /* ---- prev / next, then DISCARD SESSION as the last element in the scroll. */
  h+=`</div><div class="navrow">
    <button class="prev" id="navprev"${i===0?" disabled aria-disabled=\"true\"":""}
      aria-label="Previous exercise">&larr;</button>`;
  h+=(i===n-1)
    ? `<button class="next" id="finish">Save session</button>`
    : `<button class="next" id="navnext">Next &mdash; ${esc(list[i+1].n)}</button>`;
  h+=`</div><div class="pad mt24"><button id="discard">DISCARD SESSION</button></div>`;
  return h;
}

/* Rule V1's offer block. `Not yet` is the LOWEST and therefore the cheapest
   tap; ignoring it is not declining it - scrolling past or saving with it
   unanswered stamps nothing and re-offers next session (§4.11). */
function vOffer(C){
  if(S.v1msg) return `<div class="offer" id="v1"><p>${esc(S.v1msg)}</p></div>`;
  const t=C.tier;
  if(!t) return "";
  if(t.blocked==="pain"&&t.blockedLine)
    return `<div class="offer" id="v1"><p>${esc(t.blockedLine)}</p></div>`;
  if(!t.offer||!t.offerLine) return "";
  return `<div class="offer" id="v1"><p>${esc(t.offerLine)}</p>
    <div class="btns"><button class="ghostbtn" id="v1-add">Add it</button>
    <button class="ghostbtn" id="v1-no">Not yet</button></div></div>`;
}
const fixText=()=>{const n=badRows().length;
  return n?(n===1?"1 set left to fix.":n+" sets left to fix."):"Nothing left to fix.";};

function vTrend(){
  const rows=S.sessions.map(s=>{const r={date:fmt(s.date)};
    KEY_LIFTS.forEach(l=>{const e=s.entries[l.id]; if(e) r[l.n]=PHAT.topSet(e.sets);}); return r;})
    .filter(r=>KEY_LIFTS.some(l=>r[l.n]));
  let stalled=[];
  if(weeksIn()>=6) KEY_LIFTS.forEach(l=>{
    const hits=S.sessions.filter(s=>s.entries[l.id]).map(s=>PHAT.topSet(s.entries[l.id].sets));
    if(hits.length>=3&&Math.max(...hits)<=hits[0]) stalled.push(l.n);});

  let h=`<div class="pad" style="padding-top:26px;padding-bottom:16px">
    <h1>Top sets</h1><p class="sub">The heaviest set on the four lifts that decide whether this is working.</p></div>`;
  if(stalled.length) h+=`<div class="pad mb12"><div class="warn">
    <p style="color:var(--red);font-size:.875rem;font-weight:600">Week ${weeksIn()} and no progress on ${esc(stalled.join(", "))}.</p>
    <p style="color:var(--dim);font-size:.8125rem;margin-top:5px;line-height:1.5">This is the check we agreed on.
    The split isn't the problem and neither is the diet. Either the sets aren't close enough to failure,
    or you aren't eating enough. Fix one, not both, and give it three weeks.</p></div></div>`;

  const svg=linechart(rows,KEY_LIFTS,230);
  if(!svg) h+=`<div class="pad"><div class="panel" style="text-align:center;padding:34px 16px">
      <p style="color:var(--dim);font-size:.875rem">Log two power sessions and the line appears here.</p></div></div>`;
  else{
    h+=`<div style="padding:0 8px">${svg}</div><div class="pad legend">`;
    KEY_LIFTS.forEach(l=>h+=`<span><span class="swatch" style="background:${l.c}"></span>${l.n}</span>`);
    h+=`</div>`;
  }
  h+=`<div class="pad mt24"><h2>Recent sessions</h2>`;
  const rec=S.sessions.slice().reverse().slice(0,12);
  if(!rec.length) h+=`<p class="tiny">Nothing yet.</p>`;
  rec.forEach(s=>{const d=PROGRAM.find(x=>x.id===s.dayId);
    const n=Object.keys(s.entries).length;
    const v=Object.values(s.entries).reduce((a,e)=>a+PHAT.vol(e.sets),0);
    h+=`<div class="sess"><div><div style="font-size:.90625rem">${esc(d?d.name:"Session")}</div>
      <div style="color:var(--faint);font-size:.78125rem;margin-top:2px">${fmt(s.date)} · ${plural(n,"exercise")}</div></div>
      <div style="color:var(--dim);font-family:var(--mono);font-size:.8125rem">${sep(v)} kg</div></div>`;});
  h+=`</div>`;
  return h;
}

function vWeight(){
  const b=S.bw.slice().sort((x,y)=>x.date.localeCompare(y.date));
  const mine=b.find(e=>e.date===PHAT.localDate());
  let stats=null;
  if(b.length>=2){
    const avg=a=>a.reduce((s,x)=>s+x.kg,0)/a.length;
    const l7=b.slice(-7),p7=b.slice(-14,-7);
    stats={cur:avg(l7),delta:p7.length?avg(l7)-avg(p7):null};
  }
  let advice="Two weeks of daily entries and this turns into a calorie decision instead of a guess.";
  let ok=false;
  if(stats&&stats.delta!==null){
    const d=stats.delta;
    if(d>=.2&&d<=.35){advice="On target. Change nothing.";ok=true;}
    else if(d<.2) advice="Gaining too slowly. Add 200 kcal to your training days.";
    else advice="Gaining too fast — that surplus is going to fat. Cut 200 kcal from training days.";
  }
  let h=`<div class="pad" style="padding-top:26px;padding-bottom:16px">
    <h1>Bodyweight</h1><p class="sub">Same time, same conditions, every morning.
    The daily number is noise. The weekly average is the signal.</p></div>
    <div class="pad"><div class="panel">
      <label class="lbl" for="bwin" style="margin-bottom:6px">Today's weight kg</label>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="grp"><span class="stepper"><button data-bwact="-" aria-label="Bodyweight down 0.1 kg">&minus;</button>
        <input class="bw" id="bwin" inputmode="decimal" placeholder="0" value="${mine?mine.kg:""}">
        <button data-bwact="+" aria-label="Bodyweight up 0.1 kg">+</button></span></span>
      <button class="primary" id="logbw" style="flex:1 1 8.25rem;width:auto">${mine?"Update today":"Log today"}</button>
    </div>${S.err?`<p style="color:var(--red);font-size:.8125rem;margin-top:10px">${esc(S.err)}</p>`:""}</div></div>`;

  if(stats){
    h+=`<div class="pad mt12"><div class="panel">
      <div class="row"><span style="color:var(--dim);font-size:.84375rem">7-day average</span>
        <span class="big">${r1(stats.cur)} kg</span></div>`;
    if(stats.delta!==null)
      h+=`<div class="row" style="margin-top:8px"><span style="color:var(--dim);font-size:.84375rem">Change vs last week</span>
        <span style="font-family:var(--mono);font-size:1.125rem;color:${ok?"var(--green)":"var(--red)"}">
        ${stats.delta>0?"+":""}${r1(stats.delta)} kg</span></div>`;
    h+=`<p style="color:var(--dim);font-size:.8125rem;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);line-height:1.5">${advice}</p>
      <p class="tiny" style="margin-top:7px">Target: 0.2–0.3 kg per week.</p></div></div>`;
  }
  const rows=b.slice(-30).map(e=>({date:fmt(e.date),kg:e.kg}));
  const svg=linechart(rows,[{n:"kg",c:"var(--amber)"}],190);
  if(svg) h+=`<div style="padding:14px 8px 0">${svg}</div>`;
  return h;
}

/* ---- Screens the shell routes to that no milestone has built yet ---------
   W6 is the frame, not the rooms. A tab that leads nowhere is worse than a
   tab that says it leads nowhere, and prototype copy pasted in as filler is
   worse than both — it reads as a promise. So the placeholder names itself,
   says it is empty on purpose, and states the one fact that matters in a
   gym: nothing here can touch the log. Copy is NEW and flagged for
   `ux-designer` review. */
function vTodo(kick,name,line){
  return `<div class="hd"><span class="kick">${esc(kick)}</span>
    <span class="kick">Not built</span></div>
    <div class="todo"><h1>${esc(name)}</h1>
    <p>${esc(line)}</p>
    <p>Nothing on this screen reads or writes your log.</p></div>`;
}
const vDiet=()=>vTodo("Diet","Not built yet",
  "The calorie and protein targets land here. Until then the numbers you need are in the handoff brief, not in this app.");
const vPlan=()=>vTodo("Plan","Not built yet",
  "The plan list and the editor land here. The programme you are logging against is unchanged and is still the one on the Train tab.");

/* ---- The progress strip, built once here so no screen can re-invent it ----
   B-59, spec §0.5. Three states, three FORMS, and the meaning is carried by
   the text this returns beside them — not by opacity, which is what made the
   old strip 1.7:1 and unfixable by an alpha bump. The strip itself is
   redundant graphics and says so. W7 is the first caller. */
function pipStrip(i,n){
  if(!(n>0)) return "";
  let g="";
  for(let k=0;k<n;k++) g+=`<span class="pip ${k<i?"done":k===i?"now":"next"}"></span>`;
  return `<p class="sr-only">Exercise ${i+1} of ${n}</p>
    <div class="pips" aria-hidden="true">${g}</div>`;
}

/* ============================================================ render */
/* keepScroll: the blocked-save path must not throw him to the top of a
   ten-exercise page — he tapped Save at the bottom and the answer is there
   (W4 §2.5). Every other caller passes nothing and scrolls as before. */
function render(keepScroll){
  const v=document.getElementById("view");
  v.innerHTML = S.tab==="train"  ? (S.draft?vSession():vTrain())
              : S.tab==="trend"  ? vTrend()
              : S.tab==="weight" ? vWeight()
              : S.tab==="diet"   ? vDiet()
              : S.tab==="plan"   ? vPlan()
              : vTrain();
  document.querySelectorAll("nav button").forEach(b=>{
    const on=b.dataset.tab===S.tab;
    b.classList.toggle("on",on);
    /* The amber and the bar are two of three signals; this is the third, and
       the only one a screen reader gets. */
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  if(S.draft){ paintAdvice(false); paintProblems(); }
  renderRest();
  renderOffer();
  if(!keepScroll) window.scrollTo(0,0);
}
/* THE ONLY CALLER OF THE ADVICE ENGINES. Every sentence on this screen comes
   out of logic.js. Nothing is assembled here: the design supplies the slot,
   never the sentence (C-4). The prototype's verdict() is gone entirely.

   IT RUNS ON COMMIT ONLY - a stepper tap, a field or the note leaving focus, a
   cleared set, and first paint. NEVER on `input`. Typing `12` into a reps
   field passes through `1`, and `1` on a 3-5 exercise used to print `Below the
   range. Drop to 95 kg.` mid-number; typing `painting` passes through `pain`
   and would trip Rule S1 on a word that is not the keyword (spec 1.2 rule 5,
   2.2 rule 3).

   SIX INDEPENDENT CATCHES (spec 0.7). A rule that throws costs its own slot
   and nothing else: the set rows are already painted, the note is untouched,
   the draft write path does not run in here, and Save still works. */
function paintAdvice(speak){
  const card=document.getElementById("excard");
  if(!card||!S.draft) return;
  const id=card.dataset.ex;
  const day=PROGRAM.find(d=>d.id===S.dayId); if(!day) return;
  const e=day.ex.find(x=>x.id===id); if(!e) return;
  const st=S.draft.entries[id]; if(!st) return;
  const today=PHAT.localDate();
  let dl={active:false};
  try{ dl=PHAT.deloadStatus(S.logMeta,today); }catch(err){}
  const rx=PHAT.deloadEx(e,dl.active===true);
  /* Writes only when the slot's contents actually change, and returns whether
     it did, so nothing is announced that he has already read. */
  const put=(slot,html)=>{
    const el=document.getElementById(slot);
    if(!el||el.innerHTML===html) return false;
    el.innerHTML=html; return true;
  };

  /* 0. C-12 rule 1: THE CONTROL NAMES ITS TARGET, so he can see what he is
     about to lose before he taps - which means the name has to follow the
     target. The target moves the moment he types into the last blank row, and
     a label saying SET 3 over a control that would take SET 2 is worse than
     no label at all. Text only: the control's box is min-width 8rem and does
     not resize, so nothing below it moves. */
  const rmb=document.getElementById("rmset");
  if(rmb&&st.sets.length>1){
    const tk=removeTarget(st.sets);
    const lbl="− Remove set "+(tk+1);
    if(rmb.dataset.k!==String(tk)){ rmb.dataset.k=String(tk); rmb.textContent=lbl; }
  }

  /* 1. Rule X1 - the EXTRA badges and the line. THE BADGE KEYS OFF THE
     COMPLETED-SET ORDINAL AND THE COPY NAMES THE ROW NUMBER. They are two
     different rules pointing at the same physical row, and logic.js carries a
     DO NOT "FIX" EITHER ONE TO MATCH THE OTHER comment at both sites. Read it
     before touching either. The badge lives on the ghost row, on the same
     line, so a row becoming EXTRA changes no height and moves no input. */
  let xs={flags:[],count:0,line:""};
  try{ const r=PHAT.extraSets(st.sets,rx); if(r) xs=r; }catch(err){}
  card.querySelectorAll("[data-xtra]").forEach(sp=>{
    const t=xs.flags[+sp.dataset.xtra]?"EXTRA":"";
    if(sp.textContent!==t) sp.textContent=t;
  });
  put("slot-extra",xs.line?`<div class="advice"><p>${esc(xs.line)}</p></div>`:"");

  /* 2. A deload reduces the PRESCRIPTION, never the log. A value typed into a
     row above it still renders and still saves, and the app says which it is
     rather than hiding the row. */
  let dlline="";
  if(dl.active&&e.k!=="speed"){
    for(let k=rx.s;k<st.sets.length;k++) if(!blankSet(st.sets[k])){
      dlline="Deload week. This set is above the prescription."; break; }
  }
  put("slot-deload",dlline?`<div class="advice"><p>${esc(dlline)}</p></div>`:"");

  /* 3. Rule S1's pain notice. No dismiss, no shortening, no severity word, no
     substitute, no stretch. It may use the refusal treatment, because there
     the app really is declining to do something (spec 2.1 exception). */
  const pain=painHtml(id,st.note,today);
  if(put("slot-pain",pain)&&speak&&pain) announce(stripTags(pain));

  /* 4. Rule SP1's too-heavy flag. ADVICE, styled as advice: it never alters,
     blocks, marks or clears the logged weight - the field still reads 110, the
     draft on disk still holds 110, Save writes 110 - and the input gets NO
     aria-invalid and no aria-describedby pointing at it, because it is a valid
     value and telling a screen reader otherwise is a lie with consequences. */
  let flag="";
  try{
    if(e.k==="speed"){
      const sl=PHAT.speedLoad(S.sessions,id,today,speedSrcName(id),PHAT.PHAT_PLAN);
      if(sl&&sl.source&&sl.target>0){
        let worst=null;
        st.sets.forEach(s=>{
          if(!PHAT.speedTooHeavy(s.w,sl.source.w)) return;
          const v=PHAT.parseWeight(s.w);
          if(v.ok&&(worst===null||v.value>worst)) worst=v.value;
        });
        if(worst!==null) flag=PHAT.speedFlagText(worst,sl.target);
      }
    }
  }catch(err){ flag=""; }
  put("slot-speed",flag?`<div class="advice"><p>${esc(flag)}</p></div>`:"");

  /* 5. THE VERDICT SLOT. Occupied from first paint, for every ex.k, never
     removed and never collapsed: it holds the reminder when the rule returns
     null and the verdict when it does not, and .vslot reserves the height so
     the card cannot grow under his thumb when one replaces the other.

     THE GATE IS `completedSets >= ex.s` AGAINST THE PRESCRIPTION, always, and
     it lives inside PHAT.verdict where nothing in this file can loosen it. The
     design's `min(ex.s, sets.length)` fires a verdict on ONE completed set
     when two are removed - B-24 reopened through a new door (C-11 / B-50).
     Removing sets does not buy a verdict.

     READ `.absent`, NEVER TRUTHINESS. verdict() returns null (nothing to say),
     an ABSENT-shaped object (no verdict, and here is why), or a real verdict.
     The ABSENT object is TRUTHY and carries empty t/x/x2, so `if (v)` paints
     an empty advice block and `if (v.x)` collapses the slot. It renders as the
     REFUSAL it is - never as advice with an arrow and a rule name (0.1 #6). */
  let v=null;
  try{
    v=PHAT.verdict({ex:e, sets:st.sets, prev:PHAT.lastFor(S.sessions,id),
      note:st.note, deload:dl.active===true});
  }catch(err){ v=null; }
  let html="", say="";
  if(v&&v.absent===true){
    const lines=(v.absentLines&&v.absentLines.length?v.absentLines:[v.absentLine]).filter(Boolean);
    html=`<div class="refuse vslot">`+
      lines.map((l,ix)=>`<p>${ix?"":'<span aria-hidden="true">! </span>'}${esc(l)}</p>`).join("")+
      `</div>`;
    say=lines.join(" ");
  }else if(v){
    /* `t` is a direction token, not a word. It drives a redundant glyph beside
       the kicker, aria-hidden, and it is never the sole carrier - the sentence
       carries the status (B-13, 4.7 rule 6). */
    const dir=v.t==="up"?"&uarr;":v.t==="down"?"&darr;":"";
    /* x2 is Rule I2's second LINE and is never appended to x's sentence. */
    html=`<div class="advice vslot"><p class="kick">${dl.active?"Deload week":"Verdict"}`+
      (dir?`<span class="dir" aria-hidden="true">${dir}</span>`:"")+`</p>`+
      `<p>${esc(v.x)}</p>`+(v.x2?`<p>${esc(v.x2)}</p>`:"")+`</div>`;
    say=v.x+(v.x2?" "+v.x2:"");
  }else if(e.k==="speed"){
    /* There is ONE source for what to say on a speed card and it is
       speedLoad(): `text` for the load, `instruction` for how to move it. Both
       ungated, both permanent. verdict() returns null here by design. */
    let ins="";
    try{ const sl=PHAT.speedLoad(S.sessions,id,today,speedSrcName(id),PHAT.PHAT_PLAN);
         ins=sl?sl.instruction:""; }catch(err){ ins=""; }
    html=`<div class="advice vslot"><p class="kick">Speed work</p><p>${esc(ins)}</p></div>`;
  }else{
    /* Silence looks DELIBERATE and the slot says so in words. One constant
       line, identical on every card, that never changes while he fills the
       sets - so it is not something he re-reads. No countdown: a number that
       ticks down is a number he reads (0.1 #3, 4.7). */
    html=`<div class="advice vslot"><p class="kick">Waiting</p>`+
      `<p>Nothing to say until all ${rx.s} sets are in.</p></div>`;
  }
  /* B-13 asked for aria-live on the verdict; spec 2.6 allows exactly ONE live
     region. Both are satisfied by routing the sentence through #bs-live. Only
     the commit paths pass {speak}. */
  if(put("slot-verdict",html)&&speak&&say) announce(say);
}
const stripTags=h=>String(h).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();

/* Rule S1's notice - the pain notice, position 1 in the bottom stack, below
   the note field that triggers it and above the verdict it explains.

   TWO SOURCES, ONE ELEMENT: the current draft note on commit, and
