     sentence. No panel, no zeroes, no placeholder chart. It earns its place
     because it says what to do. */
  else if(adv&&adv.state==="empty"){
    h+=`<p class="sub pad mt16">Same time, same conditions, every morning.
      The daily number is noise. The weekly average is the signal.</p>`;
  }

  /* ---- entry. 0.1 kg steps (CLAUDE.md §3.5). Logging twice on one local
     calendar date UPDATES one row and never creates two — that guarantee is
     in the handler, which keys off PHAT.localDate() and never a UTC slice
     (B-03). `value` is re-rendered from the store, so it is escaped like any
     other interpolated string even though it should be a number. */
  h+=`<div class="pad mt16">
    <label class="lbl" for="bwin">Today's weight</label>
    <div class="bwentry">
      <span class="stepper"><button data-bwact="-" aria-label="Bodyweight down 0.1 kg">&minus;</button>
        <input id="bwin" inputmode="decimal" placeholder="0" value="${mine?esc(mine.kg):""}">
        <button data-bwact="+" aria-label="Bodyweight up 0.1 kg">+</button></span>
      <button class="primary" id="logbw">${mine?"Update today":"Log today"}</button>
    </div>`;
  if(mine) h+=`<p class="tiny mt12">Logged as today's entry. Weigh daily &mdash; the trend is what the app reads.</p>`;
  /* Refusal, not advice: the four-sided enclosure, so a failed write can
     never be mistaken for a sentence about his diet (spec §2.1, §2.5). The
     number stays on screen. It must never both fail and look fine. */
  if(S.err) h+=`<div class="refuse mt12" role="alert"><p>${esc(S.err)}</p></div>`;
  h+=`</div>`;

  /* ---- the last 7, newest first. Raw entries, not window B: this is the
     receipt for what he typed, so a row the engine ignores is still shown
     rather than silently dropped. */
  if(n){
    h+=`<div class="pad mt24"><span class="lbl secrule">Last 7 entries</span>`;
    b.slice(-7).reverse().forEach(e=>{
      /* fmt() hands back the raw string when PHAT.dayMon cannot parse it, so
         a malformed stored date reaches innerHTML verbatim unless it is
         escaped here. Nothing interpolated skips esc(), including a date. */
      h+=`<div class="bwrow"><span class="d">${e.date===today?"Today":esc(fmt(e.date))}</span>
        <span class="k">${r1(+e.kg||0).toFixed(1)} kg</span></div>`;});
    h+=`</div>`;
  }
  return h;
}

/* ============================================================== W12: diet
   B-29, closed.

   EVERY FIGURE AND EVERY SENTENCE HERE IS PHAT.dietTargets' OUTPUT, PRINTED
   VERBATIM. Nothing on this screen is assembled, re-rounded, pluralised or
   retyped: the eight numbers carry their own `text` strings so no code path
   can reformat a coach-approved figure, and all nineteen sentences are
   asserted in tests.html to be substrings of the coach's signed-off document.
   If you find yourself typing `3,200` or a macro sentence in this function,
   that is the bug. The only strings this file owns are the four cell labels
   and the two segment labels, which the spec assigns to the frontend
   (spec 8, control-inventory rows 31-32).

   THE DEFECT IT MUST NOT REINTRODUCE (addendum 8.6 item 5, [Certain]). The
   design prototype hardcoded `dietDay:"train"` and the label
   `Today — high-carb training day`, so on a Wednesday or a Sunday - PHAT's
   two rest days - it told him 3,200 kcal and 300 g of carbs against a
   programme that says 2,500 and 60. A 700 kcal and 240 g error under the word
   "Today", on the two days the low-carb floor exists to protect. So THE DAY
   TYPE IS NEVER ASSUMED HERE: this function passes the real LOCAL date
   (PHAT.localDate(), never toISOString - CLAUDE.md 3.4) and the active plan,
   and the engine derives the day from the plan's own `wd` fields.

   S.dietView IS A VIEW, NOT A FACT. Tapping a segment changes the numbers
   shown and NEVER the claim about today: on a Sunday, view "training" comes
   back with label `Training day` and claimsToday:false, so the sentence
   `Today — high-carb training day` is unreachable on a Sunday. The engine
   owns that; this function only prints `v.label`.

   NOTHING ON THIS TAB WRITES TO STORAGE ON RENDER. The one control that
   writes - the protein tick - writes phat:v1:prefs and nothing else. */
function vDiet(){
  const D=PHAT.DIET_COPY;
  /* FAIL SILENT, NEVER FAIL CONFIDENT (spec 8, states). dietTargets is pure
     and defensive, but a throw here must cost the screen, not the numbers:
     there is no fallback set of macros in this file to fall back TO, and
     inventing one is the single thing this screen exists to stop. */
  let v=null;
  try{ v=PHAT.dietTargets(PHAT.localDate(),S.plan,S.dietView); }catch(err){ v=null; }
  let h=`<div class="hd"><span class="kick">${esc(D&&D.kicker?D.kicker:"Diet")}</span>
    <span class="kick">${esc(D&&D.kickerSub?D.kickerSub:"")}</span></div>`;
  /* The guard covers the copy table as well as the figures: a logic.js that
     answers dietTargets but has no DIET_COPY.protein is a partial deploy, and
     a partial deploy must refuse this screen rather than throw inside it. */
  if(!v||!v.text||!D||!D.protein) return h+`<div class="pad mt24"><div class="refuse" role="alert">
    <p><span aria-hidden="true">! </span>Targets could not be read. Nothing on this screen
    reads or writes your log.</p></div></div>`;

  /* ---- the segment. aria-pressed is the accessible carrier, the drawn
     outline/fill mark is the non-colour one, amber is the third. The mark is
     DRAWN and not a U+2713 - that glyph is outside the inlined Archivo
     unicode-range and would fall back per-glyph, the defect B-67 closed. */
  h+=`<div class="pad mt16"><div class="seg" role="group" aria-label="Day type">
      <button data-diet="training" aria-pressed="${v.dayType==="training"?"true":"false"}">
        <span class="mk" aria-hidden="true"></span>TRAINING DAY</button>
      <button data-diet="rest" aria-pressed="${v.dayType==="rest"?"true":"false"}">
        <span class="mk" aria-hidden="true"></span>REST DAY</button>
    </div>
    <p class="dayline">${esc(v.label)}</p>`;

  /* ---- the four cells. PER-CELL CATCH (spec 8, states): a cell whose string
     is missing prints an em dash. It never prints the other day's number and
     it never prints a computed one. */
  const cell=(lab,s)=>`<div class="cell"><span class="lbl">${lab}</span>
    <span class="v">${typeof s==="string"&&s?esc(s):"&mdash;"}</span></div>`;
  h+=`<div class="macro">${cell("Calories",v.text.kcal)}${cell("Protein",v.text.protein)}
    ${cell("Carbohydrate",v.text.carb)}${cell("Fat",v.text.fat)}</div>`;

  /* The medical caveat's PLACEMENT is the coach's, and the engine carries the
     ruling so this function does not have to remember it: below the grid on
     the REST DAY segment, and in the calibration block on both. It is not
     optional - the rest-day segment prescribes 175 g of fat. */
  if(v.medicalUnderGrid&&v.medical)
    h+=`<div class="advice mt12"><p>${esc(v.medical)}</p></div>`;
  /* The surplus line is emitted ONLY for a 5-training/2-rest week, because
     its three numbers are arithmetic over that split. Any other plan gets ""
     and this slot does not render - an empty enclosure would read as a
     withheld sentence. */
  if(v.weekly) h+=`<p class="tiny mt12">${esc(v.weekly)}</p>`;

  /* ---- THE PROTEIN TICK. A HABIT TICK, NOT DATA, AND NO ENGINE READS IT
     (addendum 8.6, ruled). It is stored per DATE under phat:v1:prefs, so
     "hit today" expires with the day instead of greeting him as a fact
     tomorrow morning, and phat:v1:log / phat:v1:bw / phat:v1:draft are
     byte-identical across a toggle. dietTargets has no parameter it could be
     smuggled through; keep it that way. */
  const hit=proteinHit();
  h+=`<button id="protein" aria-pressed="${hit?"true":"false"}">
      <span class="mk" aria-hidden="true"></span>
      <span><span class="t">${esc(hit?D.protein.on:D.protein.off)}</span>
      <span class="s">${esc(D.protein.sub)}</span></span></button>`;
  h+=`</div>`;

  /* ---- CALIBRATION FIRST, AND THE ORDER IS A MEASUREMENT, NOT A PREFERENCE.
     The coach approved these eight numbers on ONE condition (addendum 8.6):
     "the caveat renders on the same screen as the macro grid, without
     scrolling, at 400 px. If the tab grows past one screen, the caveat moves
     directly under the grid." The caveat is calibration's first line. With
     the spec's block order (timing, then calibration) its heading measured
     767px down a 400x850 viewport on a REST day - under the tab dock, off the
     screen. So calibration moves up to sit under the grid, as the coach's own
     conditional instructs, and the tick stays above it because it is the only
     control on the tab. Deviation from spec 8's block order, flagged for
     ux-designer. Re-measure before moving anything above it.
     THE BLOCK POINTS AT RULE W1, IT DOES NOT RESTATE IT: the design's version
     described a procedure ("flat means add 200 kcal") the app does not run,
     while the Weight tab runs another. Two screens, two rules, is the shape
     of B-06. Its third line is the medical caveat, which the engine has
     already appended - the coach's "in the calibration block on both". */
  const sec=(head,lines)=>`<div class="dietsec"><span class="lbl secrule">${esc(head)}</span>`+
    lines.filter(Boolean).map(l=>`<p>${esc(l)}</p>`).join("")+`</div>`;
  if(v.calibration) h+=sec(v.calibration.heading,v.calibration.lines||[]);
  if(v.timing) h+=sec(v.timing.heading,[v.timing.text]);
  if(v.nonNegotiables) h+=sec(v.nonNegotiables.heading,v.nonNegotiables.lines||[]);
  return h+`<div class="mt24"></div>`;
}
/* The tick is ON only for TODAY's local date. A stored date that is not
   today reads as off and is never rewritten on render. */
function proteinHit(){ return S.prefs.proteinDate===PHAT.localDate(); }

/* ============================================================ W14/W15: plans
   WO-006 W1. Two screens: the list (vPlanList) and one plan's screen
   (vPlanEdit), which is the read-only view for PHAT and the editor for
   everything else. Spec: docs/specs/wo-004-screens.md §9.

   THE ONE RULE EVERYTHING HERE OBEYS: the editor never touches a stored
   plan. Every tap applies a PURE editor from logic.js to the WORKING COPY in
   S.edits[planId] and persists that copy under its own key (EDITS). The
   stored plan changes in exactly one place, savePlan(), by one save(PLANS)
   call, from the working copy, after validatePlan says yes. A reload, a
   kill or a walk to another tab mid-edit comes back to the working copy with
   the stored plan in its last saved state (D3).

   IDs never move. renameExercise writes `n`; moveDay reorders an array;
   copyPlan keeps every id on purpose; a new exercise's id is minted opaque
   by addExercise and is never derived from what he typed (C-5, C-6). A
   logged set is keyed by that id, so nothing on these screens can reach one.

   COPY. The design's honest note and the read-only sentence ship verbatim
   (B6). Everything else is house voice and flagged for ux-designer in the
   report. No `reason` from logic.js is ever rendered (B5). */

/* Small drawn glyphs, aria-hidden, so no arrow or cross has to come from a
   font: U+2191/U+2193/U+2715 are outside the inlined Archivo subset and a
   per-glyph fallback is exactly the defect B-67 closed. */
const GL={
  up:'<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12V3M3 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down:'<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v9M3 7l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};
const KIND_LBL={power:"Power",hyp:"Hypertrophy",speed:"Speed"};
const IMPL_LBL={bb:"Barbell",db:"Dumbbell",machine:"Machine",cable:"Cable",bodyweight:"Bodyweight"};
const HONEST_NOTE="Editing the plan is the easiest thing in this app to do instead of training. PHAT is already a good plan. The number that moves is sessions logged.";
const COPY_NOTE="The copy keeps this plan's history. Both plans read and write the same exercise history.";
const READONLY_NOTE="PHAT is read-only. Duplicate it to make changes.";
const SESSION_OPEN="Finish or discard the session in progress first.";
/* D7. One sentence for the three writers of phat:v1:plans - SAVE PLAN, USE
   THIS PLAN, DUPLICATE. A demo store must not be the base of anything that
   persists (C-14), and one writer refusing while two do not is a seam. */
const DEMO_STORE="Sample data is loaded. Leave it before saving a plan.";
/* WO-007. The coach's three warn-once sentences for the move sheet (W1 q1,
   q3, q4), transcribed verbatim; the {…} slots are the only edits made.
   PHAT.moveWarning decides WHICH one, with its own priority - nothing here
   re-derives it. K2's shape: first tap shows it, the same day again moves. */
const MOVE_WARN={
  Q1:d=>d+" would hold power and hypertrophy work together. Each exercise keeps its own rule and rest. Put the power sets first. The six-week check will treat this plan as yours, not PHAT.",
  Q3:(sp,src)=>sp+" would sit on the same day as "+src+", the lift it takes 65–70% from. PHAT puts speed work 2–3 days after the heavy lift. On the same day it is extra sets, not speed work. Keep them apart, or delete the speed work.",
  Q4:(d,e)=>d+" already holds "+e.n+" at "+tgtText(e)+". This puts the same movement there twice. Keep one unless you mean both."
};
/* The Plans screen's placement line (coach W1 q8, Rule PV1), rendered ONLY
   when phatProvenanceReport says the prescription stands and the placement
   does not - never on a 5x5 edit, where placement is null. */
const PLACEMENT_LINES=["This plan has moved PHAT's lifts across days.",
  "Each exercise keeps its own rule and rest. The six-week check treats this as your plan, not PHAT."];
/* The Type line inside a row's range detail (coach W1 q2): the rule and the
   rest follow the exercise, and the sentence says so on any day. */
const KIND_LINE={
  power:"Rests 2–3 min and progresses by load on any day.",
  hyp:"Rests 1–2 min and progresses by reps first on any day.",
  speed:"Rests 60–90 s at 65–70% of its source triple on any day."
};
/* A MIXED day, in the coach's sense (q1): power beside hypertrophy or speed
   work. PHAT's own hypertrophy days hold speed work by design and are not
   mixed. On a mixed day the heading no longer governs, so each row wears
   its kind as a word. */
function mixedDay(d){
  const ex=(d&&d.ex)||[];
  return ex.some(e=>e&&e.k==="power")&&ex.some(e=>e&&(e.k==="hyp"||e.k==="speed"));
}
const ORD=n=>n+(n%100>=11&&n%100<=13?"th":n%10===1?"st":n%10===2?"nd":n%10===3?"rd":"th");

/* Is a session in progress? On screen, offered on the Train tab, or on disk
   but unreadable - all three block a plan commit and a plan switch (D10):
   a session reads its prescription from the plan, and the plan may not move
   under a half-logged set. The same condition E-3's restore refuses on. */
const sessionOpen=()=>!!(S.draft||S.offer||S.draftRead.status==="error");
/* D10 ON DISK. sessionOpen() is a memory check guarding a disk fact: a second
   tab, or one that booted before the draft was written, holds no S.draft and
   no S.offer while phat:v1:draft holds typed sets - and SAVE PLAN there could
   delete an exercise the first tab has sets on. So the writers that commit a
   plan change read the draft key before writing. One read. Memory OR disk:
   memory covers the 400 ms the autosave debounce keeps a keystroke off disk;
   disk covers every other document of the app. "none" is the only answer
   that lets the write through - an unreadable draft is a session that may
   exist, the same fail-closed reading startDay() gives it. */
async function sessionOnDisk(){
  if(sessionOpen()) return true;
  const r=await loadDraft();
  return r.status!=="none";
}

const exCount=p=>(p&&Array.isArray(p.days)?p.days:[]).reduce((a,d)=>a+((d&&d.ex)||[]).length,0);
const setCount=d=>((d&&d.ex)||[]).reduce((a,e)=>a+(typeof e.s==="number"?e.s:0),0);
const tgtText=e=>(e.lo===e.hi?e.s+" × "+e.lo:e.s+" × "+e.lo+"–"+e.hi);
/* The plan the editor shows for an id: the working copy when there is one,
   the stored document otherwise, PHAT for "phat". */
function editPlan(id){
  const w=S.edits[id];
  return (w&&w.plan)?w.plan:storedPlan(id);
}
function planOk(p){ try{ return PHAT.validatePlan(p).ok===true; }catch(err){ return false; } }

/* ---- the ABSENT block (coach 8.4, WO-006 B4). The four plan-specific
   rules answer ABSENT as a property of the PLAN, on day zero, with an empty
   log - so each is asked with no sessions and its absentLines printed
   verbatim, once, here and nowhere else. A rule that is PRESENT contributes
   nothing. Per-block catch: a throw costs one rule's line, not the screen. */
function absentLines(plan){
  const out=[], today=PHAT.localDate(), days=plan&&Array.isArray(plan.days)?plan.days:[];
  const push=lines=>{ if(Array.isArray(lines)&&lines.length&&!out.some(l=>l[0]===lines[0])) out.push(lines); };
  try{
    let speedAbsent=false;
    days.forEach(d=>(d.ex||[]).forEach(e=>{
      if(e.k!=="speed"||speedAbsent) return;
      const sl=PHAT.speedLoad([],e.id,today,null,plan);
      if(sl&&sl.absent===true){ speedAbsent=true; push(sl.absentLines); }
    }));
  }catch(err){}
  try{
    if(days.length){
      const vt=PHAT.volumeTier({dayId:days[0].id,program:days,sessions:[],state:{},todayStr:today,draft:null,plan:plan});
      if(vt&&vt.absent===true) push(vt.absentLines);
    }
  }catch(err){}
  try{
    const kl=PHAT.planKeyLifts(plan)||[];
    const st=PHAT.stallAdvice({plan:plan,sessions:[],todayStr:today,state:{},keyLifts:kl});
    if(st&&st.absent===true) push(st.absentLines);
  }catch(err){}
  try{
    const dl=PHAT.deloadCheck({sessions:[],todayStr:today,stallReport:null,keyLifts:PHAT.planKeyLifts(plan)||[],state:{},plan:plan});
    if(dl&&dl.absent===true) push(dl.absentLines);
  }catch(err){}
  return out;
}

/* ---- the list --------------------------------------------------------- */
function planRow(o){
  const badges=[];
  if(o.active) badges.push("Active");
  if(o.unsaved) badges.push("Unsaved changes");
  if(o.broken) badges.push("Cannot open");
  const inner=`<span class="ptxt"><span class="pn">${esc(o.name)}</span><span class="pm">${o.meta}</span></span>
    ${badges.length?`<span class="badge${o.broken?" bad":""}">${esc(badges.join(" · "))}</span>`:""}`;
  /* A broken plan's row is not a control: it does not open, it is not
     repaired, it is not dropped (spec 0.7). */
  if(o.broken) return `<div class="planrow broken" role="note">${inner}</div>`;
  return `<button class="planrow${o.active?" on":""}" data-plan="${esc(o.id)}">${inner}</button>`;
}
function vPlanList(){
  const act=S.plans.activePlanId;
  const stored=S.plans.plans.filter(p=>p&&typeof p==="object");
  const n=1+stored.length+Object.keys(S.edits).filter(k=>!storedPlan(k)).length;
  let h=`<div class="hd"><span class="kick">Plans</span><span class="kick">${esc(plural(n,"plan"))}</span></div>`;
  if(S.err) h+=`<div class="pad mt12"><div class="warn hi" role="alert">
    <p style="color:var(--bone);font-size:.8125rem;line-height:1.5">${esc(S.err)}</p></div></div>`;
  h+=`<div class="pad mt16">`;
  /* PHAT first: the template that is always there, read-only, never stored. */
  /* When the active plan cannot be opened the app RUNS PHAT (activePlanOf),
     so PHAT wears the badge and a line says why. */
  if(S.planBroken) h+=`<p class="sub" style="margin-bottom:var(--s3)">The active plan cannot be opened. PHAT runs until it is fixed or another plan is chosen.</p>`;
  h+=planRow({id:PHAT.PHAT_PLAN_ID, name:PHAT.PHAT_PLAN.name, active:act===PHAT.PHAT_PLAN_ID||S.planBroken,
    meta:"Layne Norton, unedited &middot; read-only template"});
  /* WO-007 (9.9.7, B-85): the way in is a copy of PHAT, directly under the
     PHAT row because it is an action ON PHAT. Primary while he has no plan
     of his own; the same row as a ghost once he does. The list-level
     refusal (demo store, blocked store) sits above it, in the alert slot. */
  if(S.plErr) h+=`<div class="warn hi mb12" role="alert">
    <p style="color:var(--bone);font-size:.8125rem;line-height:1.5">${esc(S.plErr)}</p></div>`;
  h+=`<button class="planrow dup${stored.length?"":" prim"}" id="plan-dup-phat" aria-labelledby="plan-dup-phat-t" aria-describedby="plan-dup-phat-s">
    <span class="ptxt"><span class="pn" id="plan-dup-phat-t">Duplicate PHAT and rearrange it</span>
    <span class="pm" id="plan-dup-phat-s">Same exercises, same history. Move them between days, rename the days.</span></span></button>`;
  stored.forEach(p=>{
    const id=String(p.planId||"");
    const ok=planOk(p);
    const nS=PHAT.sessionsUnderPlan(S.sessions,id);
    h+=planRow({id:id, name:typeof p.name==="string"&&p.name.trim()?p.name:id, active:act===id&&ok,
      unsaved:!!S.edits[id], broken:!ok,
      meta:esc(plural(Array.isArray(p.days)?p.days.length:0,"day")+" · "+plural(exCount(p),"exercise")+" · "+plural(nS,"session")+" logged")});
  });
  /* Built from empty and never saved: it exists only as a working copy. */
  Object.keys(S.edits).forEach(k=>{
    if(storedPlan(k)) return;
    const p=S.edits[k].plan;
    h+=planRow({id:k, name:p&&p.name?p.name:"New plan", unsaved:true,
      meta:esc(plural(Array.isArray(p.days)?p.days.length:0,"day")+" · "+plural(exCount(p),"exercise")+" · not saved yet")});
  });
  /* Demoted, not removed (WO-007 §2): below every plan he owns, dashed, the
     `+` gone - the label is the verb. */
  h+=`<button class="planrow build" id="plan-new" aria-labelledby="plan-new-t" aria-describedby="plan-new-s">
    <span class="ptxt"><span class="pn" id="plan-new-t">Build from empty</span>
    <span class="pm" id="plan-new-s">Name the days, add the lifts, set the ranges</span></span></button></div>`;
  /* What the ACTIVE plan does not declare - coach 8.4, once, here only.
     WO-007 (Rule PV1): the placement line joins it, once, in the same shape,
     iff the prescription stands and the placement does not. */
  const ab=absentLines(S.plan);
  let pv=null; try{ pv=PHAT.phatProvenanceReport(S.plan); }catch(err){ pv=null; }
  if(pv&&pv.prescription===true&&pv.placement===false) ab.push(PLACEMENT_LINES);
  if(ab.length){
    h+=`<div class="pad mt16"><span class="lbl secrule">What ${esc(S.plan.name)} does not declare</span>`;
    ab.forEach(lines=>{ h+=`<div class="advice">${lines.map(t=>`<p>${esc(t)}</p>`).join("")}</div>`; });
    h+=`</div>`;
  }
  h+=`<div class="pad mt24" style="padding-bottom:var(--s6)"><span class="lbl secrule">One honest note</span>
    <p class="sub">${esc(HONEST_NOTE)}</p></div>`;
  return h;
}

/* ---- one plan's screen ------------------------------------------------ */
function vPlanEdit(){
  const id=S.pe.planId, plan=editPlan(id);
  if(!plan){ S.planView=""; S.pe=null; return vPlanList(); }
  const stored=storedPlan(id), unsaved=!!S.edits[id], ro=plan.readOnly===true;
  const active=S.plans.activePlanId===id;
  const days=Array.isArray(plan.days)?plan.days:[];
  let h=`<div class="hd"><button class="topbtn back" id="pe-back"><span aria-hidden="true">&lsaquo;</span> Plans</button>
    <span class="kick">${unsaved?"Unsaved changes":(ro?"Read-only":(stored?"Saved":""))}</span></div>`;
  if(S.err) h+=`<div class="pad mt12"><div class="warn hi" role="alert">
    <p style="color:var(--bone);font-size:.8125rem;line-height:1.5">${esc(S.err)}</p></div></div>`;

  /* Name and provenance. The name is a field on an editable plan and a
     heading on the read-only one. */
  h+=`<div class="pad" style="padding-top:14px">`;
  if(ro) h+=`<h3>${esc(plan.name)}</h3>`;
  else h+=`<label class="lbl" for="pe-name">Plan name</label>
    <input class="pename" id="pe-name" value="${esc(plan.name)}" autocomplete="off" spellcheck="false">`;
  h+=`<p class="pemeta">${esc(plan.from||"")}${plan.from?" &middot; ":""}${days.length} day${days.length===1?"":"s"} &middot; ${exCount(plan)} exercise${exCount(plan)===1?"":"s"}</p>`;
  /* The switch. Only a SAVED plan can be made active; a copy built from
     empty gets the control after its first save. Never a side effect of an
     edit (spec 9.8). */
  if(active) h+=`<p class="tiny mt12">Active plan. Sessions log against it.</p>`;
  else if(stored) h+=`<button class="ghostbtn mt12" id="pe-use">Use this plan</button>`;
  /* The refusal, for either screen: a switch or a save refused says so
     here, in the refusal shape, and names nothing but the fact. */
  if(S.pe.refuse&&(S.pe.refuseTop||ro)) h+=`<div class="refuse mt12" role="alert"><p><span aria-hidden="true">! </span>${esc(S.pe.refuse)}</p></div>`;
  h+=`</div>`;

  if(ro){
    /* §9.3: the shipped plan opens read-only. Controls ABSENT, not disabled. */
    h+=`<div class="pad mt16"><p class="sub">${esc(READONLY_NOTE)}</p>
      <button class="ghostbtn mt12" id="pe-dup">Duplicate this plan</button></div>`;
    h+=`<div class="pad mt16">`;
    days.forEach(d=>{
      h+=`<div class="peday"><div class="pedayrow"><span class="pedayname"><span class="nm">${esc(d.name)}</span>
        <span class="meta">${(d.ex||[]).length} ex &middot; ${setCount(d)} sets</span></span></div>`;
      (d.ex||[]).forEach(e=>{ h+=`<div class="rorow"><span class="ron">${esc(e.n)}</span>
        <span class="rot">${esc(tgtText(e))}${e.cut===1?`<span class="cut">Cut</span>`:""}</span></div>`; });
      h+=`</div>`;
    });
    return h+`</div><div class="pebottom"></div>`;
  }

  /* ---- the days ---- */
  h+=`<div class="pad mt16">`;
  if(!days.length) h+=`<p class="sub">No days yet.</p>`;
  days.forEach((d,di)=>{
    const open=!!S.pe.open[d.id];
    h+=`<div class="peday" data-day="${esc(d.id)}"><div class="pedayrow">
      <button class="pebtn" data-pemove="up" data-day="${esc(d.id)}" aria-label="Move ${esc(d.name)} up"${di===0?" disabled":""}>${GL.up}</button>
      <button class="pebtn" data-pemove="down" data-day="${esc(d.id)}" aria-label="Move ${esc(d.name)} down"${di===days.length-1?" disabled":""}>${GL.down}</button>
      <button class="pedayname" data-petoggle="${esc(d.id)}" aria-expanded="${open?"true":"false"}">
        <span class="nm">${esc(d.name)}</span>
        <span class="meta">${(d.ex||[]).length} ex &middot; ${setCount(d)} sets</span></button></div>`;
    if(open){
      h+=`<div class="pebody">
        <label class="bklbl" for="pe-dn-${esc(d.id)}">Day name</label>
        <input class="pein" id="pe-dn-${esc(d.id)}" data-peday="${esc(d.id)}" value="${esc(d.name)}" autocomplete="off" spellcheck="false">`;
      const ex=d.ex||[], mixed=mixedDay(d);
      if(!ex.length) h+=`<p class="sub mt12">No exercises yet.</p>`;
      ex.forEach((e,ei)=>{
        const rng=S.pe.range===e.id;
        h+=`<div class="peex" data-ex="${esc(e.id)}">
          <label class="sr-only" for="pe-xn-${esc(e.id)}">Exercise name</label>
          <div class="penrow"><input class="pein" id="pe-xn-${esc(e.id)}" data-peex="${esc(e.id)}" value="${esc(e.n)}" autocomplete="off" spellcheck="false">${
            mixed?`<span class="kind">${esc(KIND_LBL[e.k]||e.k)}</span>`:""}${e.cut===1?`<span class="cut">Cut</span>`:""}</div>
          <div class="pectl">
            <button class="pebtn" data-pexmove="up" data-ex="${esc(e.id)}" aria-label="Move ${esc(e.n)} up"${ei===0?" disabled":""}>${GL.up}</button>
            <button class="pebtn" data-pexmove="down" data-ex="${esc(e.id)}" aria-label="Move ${esc(e.n)} down"${ei===ex.length-1?" disabled":""}>${GL.down}</button>
            <button class="pebtn" data-pesets="-" data-ex="${esc(e.id)}" aria-label="${esc(e.n)}: one set fewer">&minus;</button>
            <button class="petgt" data-perange="${esc(e.id)}" aria-expanded="${rng?"true":"false"}" aria-label="${esc(e.n)}: ${esc(tgtText(e))}. Change the rep range.">${esc(tgtText(e))}</button>
            <button class="pebtn" data-pesets="+" data-ex="${esc(e.id)}" aria-label="${esc(e.n)}: one set more">+</button>
            <button class="pebtn pex" data-pedel="${esc(e.id)}" aria-label="Delete ${esc(e.n)} from this plan">${GL.x}</button>
          </div>`;
        /* WO-007 (9.9.2): its own line, under the arrows, diagonally opposite
           the cross. ABSENT with one day - nothing to move to. */
        if(days.length>1) h+=`<div class="pemv"><button class="pemove" id="pe-mv-${esc(e.id)}" data-pemvto="${esc(e.id)}" aria-label="Move ${esc(e.n)} to another day">Move to another day</button></div>`;
        if(rng) h+=`<div class="perange">
            <div class="grp"><span class="unit">Reps from</span><span class="stepper">
              <button data-perep="lo" data-dir="-" data-ex="${esc(e.id)}" aria-label="${esc(e.n)}: reps from, down">&minus;</button>
              <span class="pev">${e.lo}</span>
              <button data-perep="lo" data-dir="+" data-ex="${esc(e.id)}" aria-label="${esc(e.n)}: reps from, up">+</button></span></div>
            <div class="grp"><span class="unit">Reps to</span><span class="stepper">
              <button data-perep="hi" data-dir="-" data-ex="${esc(e.id)}" aria-label="${esc(e.n)}: reps to, down">&minus;</button>
              <span class="pev">${e.hi}</span>
              <button data-perep="hi" data-dir="+" data-ex="${esc(e.id)}" aria-label="${esc(e.n)}: reps to, up">+</button></span></div>
            <p class="tiny" style="flex:1 1 100%">${esc(KIND_LBL[e.k]||e.k)} &middot; ${esc(IMPL_LBL[e.implement]||e.implement)}.${KIND_LINE[e.k]?" "+esc(KIND_LINE[e.k]):""} Changing the target starts a new prescription for this exercise.</p>
          </div>`;
        h+=`</div>`;
      });
      if(S.pe.form&&S.pe.form.dayId===d.id) h+=vExForm(plan,S.pe.form);
      else{
        h+=`<button class="ghostbtn mt12" data-peadd="${esc(d.id)}">+ Add exercise</button>`;
        /* WO-007 (9.9.5, B-84): ONLY on a day holding nothing, and not on
           the last day (removeDay refuses both; a control that always
           refuses is worse than none). Absent, not disabled. */
        if(!ex.length&&days.length>1) h+=`<button class="ghostbtn mt12" data-pedelday="${esc(d.id)}">Delete this day</button>`;
      }
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  h+=`<button class="ghostbtn mt12" id="pe-addday">+ Add day</button>`;
  h+=`</div>`;

  /* ---- the bottom: undo, refusal, SAVE, DISCARD last. Never a corner. ---- */
  h+=`<div class="pebottom">`;
  h+=`<p class="tiny">Editing the plan never rewrites logged history.</p>`;
  /* One undo slot, latest action wins (9.9.3): the label says which. */
  if(S.pe.undo&&S.pe.undo.planId===id)
    h+=`<button class="ghostbtn" id="pe-undo">${S.pe.undo.kind==="move"
      ?`Undo: move ${esc(S.pe.undo.exName)} back to ${esc(S.pe.undo.fromName)}`
      :`Undo: put ${esc(S.pe.undo.ex.n)} back`}</button>`;
  if(S.pe.refuse&&!S.pe.refuseTop) h+=`<div class="refuse mt12" role="alert"><p><span aria-hidden="true">! </span>${esc(S.pe.refuse)}</p></div>`;
  h+=`<button class="primary mt12" id="pe-save"${unsaved?"":" disabled"}>Save plan</button>`;
  if(unsaved) h+=`<button class="ghostbtn" id="pe-discard">Discard changes</button>`;
  if(stored) h+=`<button class="ghostbtn" id="pe-dup">Duplicate this plan</button>`;
  return h+`</div>`;
}
/* The add-exercise form (§9.5). A FORM, not a pre-filled row: k and
   implement have no default, and ADD is refused naming the first empty
   field. Values live in S.pe.form so a stepper tap's re-render cannot lose
   a typed name.
   Rule K2 (strength-coach, WO-006 step 3): the line under Type states the
   consequence of the option he picked, not the name of a rule he does not
   know. Keyed to f.k; "none" is the prompt before a choice. */
const KIND_HELP={
  none:"Type sets how the app progresses this exercise and how long the timer gives you.",
  power:"Power: rest 2–3 min. Add 2.5 kg once every set reaches the top of the range at the same weight.",
  hyp:"Hypertrophy: rest 1–2 min. Add reps inside the range first; add weight once every set is above the top of it.",
  speed:"Speed: rest 60–90 s. 3–5 reps at 65–70% of a heavy triple, moved fast. No verdict, and no computed weight on an added exercise."
};
function vExForm(plan,f){
  const seg=(name,list,cur,attr,lbl)=>`<span class="lbl">${lbl}</span><div class="seg" role="group" aria-label="${lbl}">${
    list.map(k=>`<button data-${attr}="${esc(k)}" aria-pressed="${cur===k?"true":"false"}"><span class="mk" aria-hidden="true"></span>${esc(name[k])}</button>`).join("")}</div>`;
  const step=(key,lbl)=>`<div class="grp"><span class="unit">${lbl}</span><span class="stepper">
    <button data-pfstep="${key}" data-dir="-" aria-label="${lbl} down">&minus;</button>
    <input id="pf-${key}" data-pf="${key}" inputmode="numeric" value="${esc(f[key])}" aria-label="${lbl}">
    <button data-pfstep="${key}" data-dir="+" aria-label="${lbl} up">+</button></span></div>`;
  let lifts=[]; try{ lifts=PHAT.planLifts(plan)||[]; }catch(err){ lifts=[]; }
  return `<div class="peform" role="group" aria-labelledby="pf-h">
    <span class="lbl" id="pf-h">New exercise</span>
    <label class="bklbl" for="pf-n">Name</label>
    <input class="bkin" id="pf-n" data-pf="n" value="${esc(f.n)}" autocomplete="off" spellcheck="false">
    <div class="perange" style="margin-top:var(--s3)">${step("s","Sets")}${step("lo","Reps from")}${step("hi","Reps to")}</div>
    ${seg(KIND_LBL,PHAT.PLAN_KINDS,f.k,"pfk","Type")}
    <p class="tiny" id="pf-kind-help">${esc(KIND_HELP[f.k]||KIND_HELP.none)}</p>
    ${seg(IMPL_LBL,PHAT.PLAN_IMPLEMENTS,f.implement,"pfi","Implement")}
    <p class="tiny">Implement sets how a zero load is named and whether you get a fallback when 2.5 kg is not available.</p>
    <label class="bklbl" for="pf-lift">Same movement as</label>
    <select class="bkin" id="pf-lift" data-pf="lift">
      <option value=""${f.lift?"":" selected"}>A new movement</option>
      ${lifts.map(l=>`<option value="${esc(l.lift)}"${f.lift===l.lift?" selected":""}>${esc(l.name)}</option>`).join("")}
    </select>
    <label class="bklbl" for="pf-cue">Cue (optional, one line)</label>
    <input class="bkin" id="pf-cue" data-pf="cue" value="${esc(f.cue)}" autocomplete="off">
    ${f.err?`<div class="refuse mt12" role="alert"><p><span aria-hidden="true">! </span>${esc(f.err)}</p></div>`
      :f.warn?`<div class="refuse mt12" role="alert"><p><span aria-hidden="true">! </span>${esc(f.warn.msg)}</p></div>`:""}
    <button class="primary mt12" data-pfadd="${esc(f.dayId)}">Add exercise</button>
    <button class="ghostbtn" id="pf-cancel">Cancel</button>
  </div>`;
}
function vPlan(){
  return (S.planView==="edit"&&S.pe)?vPlanEdit():vPlanList();
}

/* ---- editor actions --------------------------------------------------- */
/* Persist the working copies. Its own key, never backed up (D11). A failed
   write is announced through the live region and shown on the next paint;
   the in-memory copy is still the truth and the next edit retries. */
async function saveEdits(){
  const ok=await save(EDITS,editsPayload());
  if(!ok) announce("Could not save the edit in progress. It is still on screen.",true);
  return ok;
}
/* One refusal slot per plan screen. It renders beside the control that was
   refused - the top for a switch or a duplicate, above SAVE for a save or an
   edit - and is announced once through the live region. */
function refuse(msg,top){ S.pe.refuse=msg; S.pe.refuseTop=!!top; announce(msg,true); render(true); }
function openPlan(id){
  const p=editPlan(id);
  if(!p) return;
  S.planView="edit"; S.pe={planId:id,open:{},form:null,undo:null,refuse:null,refuseTop:false,range:null};
  S.err=null; S.plErr=null; render();
}
/* Apply a pure editor's RESULT to the working copy. `r` is {ok, plan,
   problems}; on ok the copy is replaced whole, persisted, and the screen
   repainted. On refusal the copy is untouched and `msg` is shown - a
   developer `reason` never reaches the screen. */
function applyEdit(r,msg){
  if(!r||!r.ok){ refuse(msg||"That edit was refused. Nothing changed.",false); return false; }
  const id=S.pe.planId;
  S.edits[id]={plan:r.plan,savedAt:Date.now()};
  S.pe.refuse=null;
  saveEdits();
  render(true);
  return true;
}
/* A working copy for a plan that has none yet: the STORED document, cloned.
   The first edit creates it, which is what turns the row's badge on. */
function workOf(){
  const id=S.pe.planId;
  if(S.edits[id]) return S.edits[id].plan;
  const st=storedPlan(id);
  return st?PHAT.clonePlan(st):null;
}
/* The name fields commit on focusout and on a 600 ms pause, with NO render:
   a render mid-typing kills the caret (B-19). Empty is refused by putting
   the old value back and saying so. */
let editTimer=null;
function commitName(inp){
  if(!inp||!S.pe) return;
  const w=workOf(); if(!w) return;
  const val=String(inp.value||"").trim();
  let r=null, old="";
  if(inp.id==="pe-name"){ old=w.name; r=PHAT.renamePlan(w,val); }
  else if(inp.dataset.peday){ const d=w.days.find(x=>x.id===inp.dataset.peday); old=d?d.name:""; r=PHAT.renameDay(w,inp.dataset.peday,val); }
  else if(inp.dataset.peex){ const e=PHAT.exById(w,inp.dataset.peex); old=e?e.n:""; r=PHAT.renameExercise(w,inp.dataset.peex,val); }
  else return;
  if(val===old) return;
  if(!r.ok){
    if(val===""){ inp.value=old; announce("A name cannot be empty. Kept "+old+".",true); toast("A name cannot be empty. Kept "+old+".",true); }
    return;
  }
  S.edits[S.pe.planId]={plan:r.plan,savedAt:Date.now()};
  saveEdits();
  /* Targeted updates only: the header badge and the day row's own label. */
  const kick=document.querySelector(".hd .kick"); if(kick) kick.textContent="Unsaved changes";
  if(inp.dataset.peday){
    const row=document.querySelector(`[data-petoggle="${CSS.escape(inp.dataset.peday)}"] .nm`);
    if(row) row.textContent=val;
  }
  const sv=document.getElementById("pe-save"); if(sv) sv.disabled=false;
  if(!document.getElementById("pe-discard")){
    const bottom=document.querySelector(".pebottom");
    if(bottom&&sv){ const b=document.createElement("button"); b.className="ghostbtn"; b.id="pe-discard"; b.textContent="Discard changes"; sv.insertAdjacentElement("afterend",b); }
  }
}
function scheduleNameCommit(inp){

function stepInt(cur,dir,lo,hi){
  const n=parseInt(cur,10);
  const v=(isNaN(n)?0:n)+(dir==="+"?1:-1);
  return Math.max(lo,Math.min(hi,v));
}
function blankForm(dayId){ return {dayId:dayId,n:"",s:"",lo:"",hi:"",k:"",implement:"",lift:"",cue:"",err:"",warn:null}; }
/* Rule K2 warn-once: the two type/reps mismatches that hurt in the harmful
   direction (heavy sets under short rest). Returns the message or "". Power
   never warns. */
function kindWarn(k,lo,hi){
  const range=lo===hi?String(lo):lo+"–"+hi;
  if(k==="speed"&&hi>5) return "Speed work is 3–5 reps moved fast. At "+range+" reps this is hypertrophy work. Change the reps or the type, or tap Add exercise again to keep it.";
  if(k==="hyp"&&hi<=5) return "Hypertrophy work rests 1–2 min. At "+range+" reps that is too short for heavy sets. Choose Power, or tap Add exercise again to keep it.";
  return "";
}
/* ADD, refused naming the first empty field (§9.5). Nothing is created until
   every required field is answered; addExercise re-validates regardless.
   Once every field is valid, a K2 mismatch warns once and arms f.warn on the
   exact k/lo/hi it warned about; the same tap again adds it. Any change to
   k, lo or hi disarms it (the event handlers clear f.warn). */
function addFromForm(){
  const f=S.pe.form; if(!f) return;
  const w=workOf(); if(!w) return;
  const s=parseInt(f.s,10), lo=parseInt(f.lo,10), hi=parseInt(f.hi,10);
  let err="";
  if(!String(f.n).trim()) err="Not added. Name it first.";
  else if(!(s>=1&&s<=20)) err="Not added. Sets must be 1 to 20.";
  else if(!(lo>=1&&lo<=100)||!(hi>=1&&hi<=100)) err="Not added. Reps must be 1 to 100.";
  else if(lo>hi) err="Not added. Reps from must not be above reps to.";
  else if(!f.k) err="Not added. Choose a type.";
  else if(!f.implement) err="Not added. Choose an implement.";
  if(err){ f.err=err; render(true); const el=document.querySelector(".peform .refuse"); if(el) el.scrollIntoView({block:"nearest"}); return; }
  const wmsg=kindWarn(f.k,lo,hi);
  const armed=f.warn&&f.warn.k===f.k&&f.warn.lo===lo&&f.warn.hi===hi;
  if(wmsg&&!armed){ f.warn={k:f.k,lo:lo,hi:hi,msg:wmsg}; render(true); const el=document.querySelector(".peform .refuse"); if(el) el.scrollIntoView({block:"nearest"}); return; }
  const spec={n:String(f.n).trim(),s:s,lo:lo,hi:hi,k:f.k,implement:f.implement};
  if(f.lift) spec.lift=f.lift;
  if(String(f.cue).trim()) spec.cue=String(f.cue).trim();
  const r=PHAT.addExercise(w,f.dayId,spec);
  if(!r.ok){ f.err="Not added. Check the fields."; render(true); return; }
  S.pe.form=null;
  applyEdit(r);
  toast(spec.n+" added.",false);
}
function askDeleteEx(exId){

    :"Nothing has been logged against it.")+(notice?" "+notice:"");

/* ---- WO-007: the cross-day move (spec 9.9.3) --------------------------
   The sheet lists every OTHER day of the WORKING COPY with its count, in
   plan order; the current day is named in the body and not offered. A tap
   on a day row asks PHAT.moveWarning first: a warning renders in the sheet
   in K2's shape and arms that row; the same row again moves; any other row
   clears it. Nothing here writes until moveExerciseToDay says ok, and then
   it goes through applyEdit -> saveEdits(), never save(PLANS). */
function askMoveEx(exId){
  const w=workOf(); if(!w) return;
  const e=PHAT.exById(w,exId); if(!e) return;
  const fromId=PHAT.dayIdOfEx(w,exId);
  const from=w.days.find(d=>d.id===fromId); if(!from) return;
  const others=w.days.filter(d=>d&&d.id!==fromId);
  if(!others.length) return;
  /* Two days with one name are told apart by position (9.9.10 item 4). */
  const dup=nm=>w.days.filter(d=>d&&String(d.name)===String(nm)).length>1;
  const label=d=>dup(d.name)?d.name+" · "+ORD(w.days.indexOf(d)+1):d.name;
  const rows=others.map(d=>{
    const n=(d.ex||[]).length, ct=plural(n,"exercise");
    return `<button class="mvrow" data-sheetday="${esc(d.id)}" aria-pressed="false" aria-label="${esc(label(d))}, ${esc(ct)}">
      <span class="nm">${esc(label(d))}</span><span class="ct">${esc(ct)}</span></button>`;
  }).join("");
  sheetState={move:exId, armed:null, back:"pe-mv-"+exId, armAt:0};
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="scrim" data-sheet="cancel"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dr-confirm-title">
      <h2 id="dr-confirm-title" tabindex="-1">Move ${esc(e.n)}</h2>
      <p class="det">Now on ${esc(from.name)}. Lands last on the day you pick.</p>
      <div class="mvlist">${rows}</div>
      <div id="dr-sheet-err"></div>
      <div class="btns"><button class="ghostbtn mvno" data-sheet="safe">Not now</button></div>
    </section>`;
  const head=m.querySelector("#dr-confirm-title"); if(head) head.focus();
}
/* The coach's sentence for a warning, with the names filled in. Empty when
   there is nothing to say - and empty means MOVE. */
function moveWarnText(w,exId,toDayId){
  let mw=null; try{ mw=PHAT.moveWarning(w,exId,toDayId); }catch(err){ mw=null; }
  const which=mw&&mw.which?String(mw.which).toUpperCase():"";
  if(!which) return "";
  const e=PHAT.exById(w,exId), dst=w.days.find(d=>d.id===toDayId);
  if(!e||!dst) return "";
  const ex=dst.ex||[];
  if(which==="Q1") return MOVE_WARN.Q1(dst.name);
  if(which==="Q3"){
    let ss={}; try{ ss=PHAT.planSpeedSource?PHAT.planSpeedSource(w)||{}:(w.speedSource||{}); }catch(err){ ss=w.speedSource||{}; }
    /* Either the slot is the speed work and its source is on the day, or
       the slot is the source and the day holds its speed work. */
    let sp=null, src=null;
    if(ss[exId]&&ex.some(x=>x.id===ss[exId])){ sp=e; src=ex.find(x=>x.id===ss[exId]); }
    else{ const s=ex.find(x=>ss[x.id]===exId); if(s){ sp=s; src=e; } }
    if(!sp||!src) return "";
    return MOVE_WARN.Q3(sp.n,src.n);
  }
  if(which==="Q4"){
    const same=ex.find(x=>x&&x.lift&&x.lift===e.lift);
    if(!same) return "";
    return MOVE_WARN.Q4(dst.name,same);
  }
  return "";
}
function moveSheetTap(toDayId){
  const st=sheetState; if(!st||!st.move) return;
  const w=workOf(); if(!w) return;
  const exId=st.move;
  const rows=Array.prototype.slice.call(document.querySelectorAll("#modal .mvrow"));
  if(st.armed!==toDayId){
    const msg=moveWarnText(w,exId,toDayId);
    if(msg){
      const dst=w.days.find(d=>d.id===toDayId);
      st.armed=toDayId;
      rows.forEach(b=>b.setAttribute("aria-pressed",b.dataset.sheetday===toDayId?"true":"false"));
      const el=document.getElementById("dr-sheet-err");
      if(el) el.innerHTML=`<div class="rule"><p>${esc(msg)}</p><p>Tap ${esc(dst?dst.name:"that day")} again to move it.</p></div>`;
      return;
    }
  }
  moveEx(exId,toDayId);
}
function moveEx(exId,toDayId){
  const w=workOf(); if(!w) return;
  const e=PHAT.exById(w,exId);
  const fromId=PHAT.dayIdOfEx(w,exId);
  const from=w.days.find(d=>d.id===fromId), dst=w.days.find(d=>d.id===toDayId);

  if(!r.ok){ sheetErr("Could not move that exercise."); return; }

     back to it; focus is placed by hand after the paint. */

  if(S.pe.range===exId) S.pe.range=null;
  S.pe.undo={kind:"move",planId:S.pe.planId,exId:exId,from:r.from,exName:e.n,fromName:from.name,toName:dst.name};
  applyEdit(r);
  toastUndo(e.n+" moved to "+dst.name+".",undoMoveEx);
  focusAfterMove(fromId,r.from.index);
}
/* Focus after a move (9.9.3): the row now at that index in the origin day,

/* UNDO. `from` goes back as the 4th argument - that restores the index AND

function undoMoveEx(){

/* ---- WO-007: deleting an emptied day (9.9.5, B-84). One sheet, no undo:

/* USE THIS PLAN. Refused, in the same order and words as SAVE PLAN: a
   session in progress (D10, read from disk), a store this build could not
   read, a demo store (D7 - a demo store is the base of nothing that
   persists, C-14). */
async function usePlan(id){
  if(await sessionOnDisk()){ refuse(SESSION_OPEN,true); return; }
  if(S.blockWrites[PLANS]){ refuse(S.err||"Not saved. The plan store could not be read.",true); return; }
  if(S.plansMeta.demo===true){ refuse(DEMO_STORE,true); return; }
  const r=PHAT.planStoreSetActive(S.plans,id);
  if(!r.ok){ refuse("That plan is not saved yet. Save it first.",true); return; }
  const prev=S.plans;
  S.plans={plans:r.store.plans,activePlanId:r.store.activePlanId};
  const ok=await save(PLANS,plansPayload());
  if(!ok){ S.plans=prev; refuse(S.err||"Could not switch. Nothing changed.",true); return; }
  adoptPlans(plansPayload());
  S.pe.refuse=null; render(true);
  toast(S.plan.name+" is the active plan.");
}
/* SAVE PLAN: ONE save(PLANS) call, from the working copy, after validation
   (D3). Refused, in words and in order: a session in progress (D10), a
   store this build could not read, a demo store (D7), a document that does
   not validate. On success the working copy is cleared AFTER the store
   write returned true (D11). */
async function savePlan(){
  const id=S.pe.planId, w=S.edits[id]&&S.edits[id].plan;
  if(!w) return;
  if(await sessionOnDisk()){ refuse(SESSION_OPEN,false); return; }
  if(S.blockWrites[PLANS]){ refuse(S.err||"Not saved. The plan store could not be read.",false); return; }
  if(S.plansMeta.demo===true){ refuse(DEMO_STORE,false); return; }
  let v; try{ v=PHAT.validatePlan(w); }catch(err){ v={ok:false,problems:[]}; }
  if(!v.ok){ refuse(validateCopy(v.problems),false); return; }
  const before=storedPlan(id);
  const r=PHAT.planStoreUpsert(S.plans,w);
  if(!r.ok){ refuse("Not saved. This plan cannot be stored.",false); return; }
  const prev=S.plans;
  S.plans={plans:r.store.plans,activePlanId:r.store.activePlanId};
  const ok=await save(PLANS,plansPayload());
  if(!ok){ S.plans=prev; refuse(S.err||"Could not save. Your edits are still here — try again.",false); return; }
  adoptPlans(plansPayload());
  /* WO-007 Rule RI1: a day's reintro counter means the accessories it
     ACTUALLY reintroduced, and a move can change the order under it.
     Reconciled here, stored plan (before) against the working copy (after),
     and written through the log-meta path ONLY when a counter moved - the
     log store is not rewritten for a plan edit that changed no count. */
  try{
    const next=PHAT.reconcileReintro(S.logMeta,before,w);
    if(next&&JSON.stringify(next.reintro||{})!==JSON.stringify(S.logMeta.reintro||{})){
      S.logMeta=next; await save(LOG,logPayload());
    }
  }catch(err){}
  delete S.edits[id];
  await saveEdits();
  S.pe.undo=null; S.pe.refuse=null; S.pe.form=null;
  render(true);
  toast("Plan saved.");
}
/* validatePlan's problems, in words that name the field and never the
   reason token. Reached only through a working copy the inline editors did
   not write (a hand-edited store, an older build). */
function validateCopy(problems){
  const p=(problems||[])[0];
  if(!p) return "Not saved. This plan does not validate.";
  if(p.scope==="plan"&&p.field==="name") return "Not saved. The plan has no name.";
  if(p.scope==="day"&&p.field==="name") return "Not saved. A day has no name.";
  if(p.scope==="ex"&&p.field==="n") return "Not saved. An exercise has no name.";
  if(p.scope==="ex"&&(p.field==="k"||p.field==="implement")) return "Not saved. An exercise has no type or implement.";
  if(p.scope==="ex") return "Not saved. An exercise has a target outside 1 to 20 sets and 1 to 100 reps.";
  return "Not saved. This plan does not validate.";
}
function askDiscardEdits(){
  const id=S.pe.planId, p=editPlan(id); if(!p||!S.edits[id]) return;
  askSheet({headline:"Discard your changes to "+p.name+"?", body:"The saved plan does not change.",
    danger:"Discard changes", safe:"Keep editing",
    onDanger:async()=>{
      closeSheet();
      delete S.edits[id];
      await saveEdits();
      S.pe.undo=null; S.pe.refuse=null; S.pe.form=null; S.pe.range=null;
      if(!storedPlan(id)){ S.planView=""; S.pe=null; }
      render(); toast("Changes discarded.");
    }});
}
/* Duplicate. Said BEFORE the copy exists (W14), in the spec's words. Not
   destructive, so the action is the primary and lowest; `Not now` above. */
function askDuplicate(id,back){
  const src=storedPlan(id); if(!src) return;
  /* WO-007: reached from the Plans LIST too (9.9.7 slot 2), where there is
     no S.pe - the refusal then lands in the list's alert slot. */
  const say=msg=>{ if(S.pe) refuse(msg,true); else { S.plErr=msg; announce(msg,true); render(true); } };
  askSheet({headline:"Duplicate "+src.name+"?", body:COPY_NOTE, plain:true,
    danger:"Duplicate", safe:"Not now", back:back||null,
    onDanger:async()=>{
      closeSheet();
      if(S.blockWrites[PLANS]){ say(S.err||"Not saved. The plan store could not be read."); return; }
      /* D7: the copy would be written INTO the demo store, and a demo store is
         the base of nothing that persists (C-14). Same sentence as SAVE PLAN. */
      if(S.plansMeta.demo===true){ say(DEMO_STORE); return; }
      const r=PHAT.copyPlan(src,null,PHAT.localDate());
      if(!r.ok){ say("Could not copy it. Nothing changed."); return; }
      const up=PHAT.planStoreUpsert(S.plans,r.plan);
      if(!up.ok){ say("Could not copy it. Nothing changed."); return; }
      const prev=S.plans;
      S.plans={plans:up.store.plans,activePlanId:up.store.activePlanId};
      const ok=await save(PLANS,plansPayload());
      if(!ok){ S.plans=prev; say(S.err||"Could not save the copy. Nothing changed."); return; }
      adoptPlans(plansPayload());
      S.plErr=null;
      openPlan(r.plan.planId);
      toast("Copied. This is "+r.plan.name+".");
    }});
}
async function buildFromEmpty(){
  const r=PHAT.newPlan("New plan",PHAT.localDate());

/* The delegated click handler for both plan screens. Returns true when it
   handled the tap, so the main #view listener can stop. */
async function planClick(e){
  const t=e.target;
  const row=t.closest("[data-plan]");
  if(row){ openPlan(row.dataset.plan); return true; }
  if(t.closest("#plan-new")){ await buildFromEmpty(); return true; }
  if(t.closest("#plan-dup-phat")){ askDuplicate(PHAT.PHAT_PLAN_ID,"plan-dup-phat"); return true; }
  if(!S.pe) return false;
  if(t.closest("#pe-back")){ commitName(document.activeElement); S.planView=""; S.pe=null; render(); return true; }
  if(t.closest("#pe-use")){ await usePlan(S.pe.planId); return true; }
  if(t.closest("#pe-dup")){ askDuplicate(S.pe.planId); return true; }
  if(t.closest("#pe-save")){ await savePlan(); return true; }
  if(t.closest("#pe-discard")){ askDiscardEdits(); return true; }
  if(t.closest("#pe-undo")){ undoLast(); return true; }
  const tg=t.closest("[data-petoggle]");
  if(tg){ const id=tg.dataset.petoggle; S.pe.open[id]=!S.pe.open[id]; if(!S.pe.open[id]&&S.pe.form&&S.pe.form.dayId===id) S.pe.form=null; render(true); return true; }
  /* From here on the editor OWNS the tap: a stray one (the day-name field,
     "No exercises yet.", padding) must never fall through to the Train
     handler, whose [data-day] lookup matches .peday and would start a
     session on the active plan out of the editor. Found under WO-007 W4. */
  const w=workOf(); if(!w) return true;
  const mvto=t.closest("[data-pemvto]");
  if(mvto){ askMoveEx(mvto.dataset.pemvto); return true; }
  const dd=t.closest("[data-pedelday]");
  if(dd){ askDeleteDay(dd.dataset.pedelday); return true; }
  const mv=t.closest("[data-pemove]");
  if(mv&&!mv.disabled){
    const i=w.days.findIndex(d=>d.id===mv.dataset.day);
    const j=mv.dataset.pemove==="up"?i-1:i+1;
    if(i>=0&&j>=0&&j<w.days.length) applyEdit(PHAT.moveDay(w,i,j),"Could not move that day.");
    return true;
  }
  const xm=t.closest("[data-pexmove]");
  if(xm&&!xm.disabled){
    const did=PHAT.dayIdOfEx(w,xm.dataset.ex), d=w.days.find(x=>x.id===did);
    const i=d?d.ex.findIndex(x=>x.id===xm.dataset.ex):-1;
    const j=xm.dataset.pexmove==="up"?i-1:i+1;
    if(d&&i>=0&&j>=0&&j<d.ex.length) applyEdit(PHAT.moveExercise(w,did,i,j),"Could not move that exercise.");
    return true;
  }
  const ss=t.closest("[data-pesets]");
  if(ss){
    const ex=PHAT.exById(w,ss.dataset.ex); if(!ex) return true;
    const n=stepInt(ex.s,ss.dataset.pesets,1,20);
    if(n!==ex.s){ if(applyEdit(PHAT.setExerciseTarget(w,ex.id,{s:n}),"Sets must be 1 to 20.")) announce(ex.n+": "+n+" sets."); }
    return true;
  }
  const rp=t.closest("[data-perep]");
  if(rp){
    const ex=PHAT.exById(w,rp.dataset.ex); if(!ex) return true;
    const f=rp.dataset.perep, n=stepInt(ex[f],rp.dataset.dir,1,100);
    const spec={}; spec[f]=n;
    if(n!==ex[f]){ if(applyEdit(PHAT.setExerciseTarget(w,ex.id,spec),"Reps from must not be above reps to.")) announce(ex.n+": "+tgtText(PHAT.exById(workOf(),ex.id))+"."); }
    return true;
  }
  const rg=t.closest("[data-perange]");
  if(rg){ S.pe.range=S.pe.range===rg.dataset.perange?null:rg.dataset.perange; render(true); return true; }
  const del=t.closest("[data-pedel]");
  if(del){ askDeleteEx(del.dataset.pedel); return true; }
  const ad=t.closest("[data-peadd]");
  if(ad){ S.pe.form=blankForm(ad.dataset.peadd); S.pe.range=null; render(true); const n=document.getElementById("pf-n"); if(n) n.focus(); return true; }
  if(t.closest("#pe-addday")){
    const nm="Day "+(w.days.length+1);
    const r=PHAT.addDay(w,nm);
    if(r.ok){ S.pe.open[r.dayId]=true; applyEdit(r); const inp=document.getElementById("pe-dn-"+r.dayId); if(inp){ inp.focus(); inp.select(); } }
    else applyEdit(r,"Could not add a day.");
    return true;
  }
  /* the add form */
  const f=S.pe.form;
  if(f){
    const st=t.closest("[data-pfstep]");
    if(st){ const k=st.dataset.pfstep; f[k]=String(stepInt(f[k],st.dataset.dir,1,k==="s"?20:100)); f.err=""; if(k!=="s") f.warn=null; render(true); return true; }
    const pk=t.closest("[data-pfk]"); if(pk){ f.k=pk.dataset.pfk; f.err=""; f.warn=null; render(true); return true; }
    const pi=t.closest("[data-pfi]"); if(pi){ f.implement=pi.dataset.pfi; f.err=""; render(true); return true; }
    if(t.closest("[data-pfadd]")){ addFromForm(); return true; }
    if(t.closest("#pf-cancel")){ S.pe.form=null; render(true); return true; }
  }
  return true;
}

/* ---- The progress strip, built once here so no screen can re-invent it ----
   B-59, spec §0.5. Three states, three FORMS, and the meaning is carried by
   the text this returns beside them — not by opacity, which is what made the
   old strip 1.7:1 and unfixable by an alpha bump. The strip itself is
   redundant graphics and says so. W7 is the first caller. */
function pipStrip(i,n){
  if(!(n>0)) return "";
  let g="";
  for(let k=0;k<n;k++) g+=`<span class="pip ${k<i?"done":k===i?"now":"next"}"></span>`;
  return `<p class="sr-only">Exercise ${i+1} of ${n}</p>
    <div class="pips" aria-hidden="true">${g}</div>`;
}

/* ============================================================ render */
/* keepScroll: the blocked-save path must not throw him to the top of a
   ten-exercise page — he tapped Save at the bottom and the answer is there
   (W4 §2.5). Every other caller passes nothing and scrolls as before. */
function render(keepScroll){
  const v=document.getElementById("view");
  /* An open draft still wins the Train tab over Home, Settings and onboarding:
     the session he is in the middle of is never something he has to navigate
     back to. Settings is reached from Home, and Home is what a saved or
     discarded session returns to. */
  /* W8: the Summary is a state OF the open session, not a tab and not a
     sub-view of Train — it exists only while there is a draft, and a draft is
     what already wins the Train tab. S.sum is cleared by every path that ends
     a session (finish, discard, startDay, resumeDraft). */
  v.innerHTML = S.tab==="train"  ? (S.draft?(S.sum?vSummary():vSession()):vTrain())
              : S.tab==="trend"  ? vTrend()
              : S.tab==="weight" ? vWeight()
              : S.tab==="diet"   ? vDiet()
              : S.tab==="plan"   ? vPlan()
              : vTrain();
  document.querySelectorAll("nav button").forEach(b=>{
    const on=b.dataset.tab===S.tab;
    b.classList.toggle("on",on);
    /* The amber and the bar are two of three signals; this is the third, and
       the only one a screen reader gets. */
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  if(S.draft){ paintAdvice(false); paintProblems(); }
  renderRest();
  renderOffer();
  if(!keepScroll) window.scrollTo(0,0);
}
/* ONE RENDERING OF ONE VERDICT OBJECT, and both screens that print a verdict
   go through it — the session card (W7) and the summary row (W8). Two
   renderings of the same engine output is how the same sentence ends up with
   an arrow on one screen and not on the other, or how an ABSENT explanation
   gets dressed as advice on the screen nobody re-read.

   READ `.absent`, NEVER TRUTHINESS. verdict() returns null (nothing to say),
   an ABSENT-shaped object (no verdict, and here is why), or a real verdict.
   The ABSENT object is TRUTHY and carries empty t/x/x2, so `if (v)` paints an
   empty advice block and `if (v.x)` collapses the slot. It renders as the
   REFUSAL it is — never as advice with an arrow and a rule name (spec 0.1 #6).

   → {html, say} for either object shape, or NULL when there is no verdict
   object at all. The caller decides what silence looks like on its own
   screen, because the two screens answer it differently: the session card
   holds a reserved-height reminder, the summary prints SKIPPED or nothing.
   `extra` is the caller's enclosure class — `vslot` reserves the card's
   height so it cannot grow under a thumb; the summary passes nothing. */
function verdictHtml(v,dlActive,extra){
  const x=extra?" "+extra:"";
  if(v&&v.absent===true){
    const lines=(v.absentLines&&v.absentLines.length?v.absentLines:[v.absentLine]).filter(Boolean);
    return {html:`<div class="refuse${x}">`+
      lines.map((l,ix)=>`<p>${ix?"":'<span aria-hidden="true">! </span>'}${esc(l)}</p>`).join("")+
      `</div>`, say:lines.join(" ")};
  }
  if(!v) return null;
  /* `t` is a direction token, not a word. It drives a redundant glyph beside
     the kicker, aria-hidden, and it is never the sole carrier - the sentence
     carries the status (B-13, 4.7 rule 6). */
  const dir=v.t==="up"?"&uarr;":v.t==="down"?"&darr;":"";
  /* x2 is Rule I2's second LINE and is never appended to x's sentence. */
  return {html:`<div class="advice${x}"><p class="kick">${dlActive?"Deload week":"Verdict"}`+
    (dir?`<span class="dir" aria-hidden="true">${dir}</span>`:"")+`</p>`+
    `<p>${esc(v.x)}</p>`+(v.x2?`<p>${esc(v.x2)}</p>`:"")+`</div>`,
    say:v.x+(v.x2?" "+v.x2:"")};
}

/* THE ONLY CALLER OF THE ADVICE ENGINES. Every sentence on this screen comes
   out of logic.js. Nothing is assembled here: the design supplies the slot,
   never the sentence (C-4). The prototype's verdict() is gone entirely.

   IT RUNS ON COMMIT ONLY - a stepper tap, a field or the note leaving focus, a
   cleared set, and first paint. NEVER on `input`. Typing `12` into a reps
   field passes through `1`, and `1` on a 3-5 exercise used to print `Below the
   range. Drop to 95 kg.` mid-number; typing `painting` passes through `pain`
   and would trip Rule S1 on a word that is not the keyword (spec 1.2 rule 5,
   2.2 rule 3).

   SIX INDEPENDENT CATCHES (spec 0.7). A rule that throws costs its own slot
   and nothing else: the set rows are already painted, the note is untouched,
   the draft write path does not run in here, and Save still works. */
function paintAdvice(speak){
  const card=document.getElementById("excard");
  if(!card||!S.draft) return;
  const id=card.dataset.ex;
  const day=sDays().find(d=>d.id===S.dayId); if(!day) return;
  const e=day.ex.find(x=>x.id===id); if(!e) return;
  const st=S.draft.entries[id]; if(!st) return;
  const today=PHAT.localDate();
  let dl={active:false};
  try{ dl=PHAT.deloadStatus(S.logMeta,today); }catch(err){}
  const rx=PHAT.deloadEx(e,dl.active===true);
  /* Writes only when the slot's contents actually change, and returns whether
     it did, so nothing is announced that he has already read. */
  const put=(slot,html)=>{
    const el=document.getElementById(slot);
    if(!el||el.innerHTML===html) return false;
    el.innerHTML=html; return true;
  };

  /* 0. C-12 rule 1: THE CONTROL NAMES ITS TARGET, so he can see what he is
     about to lose before he taps - which means the name has to follow the
     target. The target moves the moment he types into the last blank row, and
     a label saying SET 3 over a control that would take SET 2 is worse than
     no label at all. Text only: the control's box is min-width 8rem and does
     not resize, so nothing below it moves. */
  const rmb=document.getElementById("rmset");
  if(rmb&&st.sets.length>1){
    const tk=removeTarget(st.sets);
    const lbl="− Remove set "+(tk+1);
    if(rmb.dataset.k!==String(tk)){ rmb.dataset.k=String(tk); rmb.textContent=lbl; }
  }

  /* 1. Rule X1 - the EXTRA badges and the line. THE BADGE KEYS OFF THE
     COMPLETED-SET ORDINAL AND THE COPY NAMES THE ROW NUMBER. They are two
     different rules pointing at the same physical row, and logic.js carries a
     DO NOT "FIX" EITHER ONE TO MATCH THE OTHER comment at both sites. Read it
     before touching either. The badge lives on the ghost row, on the same
     line, so a row becoming EXTRA changes no height and moves no input. */
  let xs={flags:[],count:0,line:""};
  try{ const r=PHAT.extraSets(st.sets,rx); if(r) xs=r; }catch(err){}
  card.querySelectorAll("[data-xtra]").forEach(sp=>{
    const t=xs.flags[+sp.dataset.xtra]?"EXTRA":"";
    if(sp.textContent!==t) sp.textContent=t;
  });
  put("slot-extra",xs.line?`<div class="advice"><p>${esc(xs.line)}</p></div>`:"");

  /* 2. A deload reduces the PRESCRIPTION, never the log. A value typed into a
     row above it still renders and still saves, and the app says which it is
     rather than hiding the row. */
  let dlline="";
  if(dl.active&&e.k!=="speed"){
    for(let k=rx.s;k<st.sets.length;k++) if(!blankSet(st.sets[k])){
      dlline="Deload week. This set is above the prescription."; break; }
  }
  put("slot-deload",dlline?`<div class="advice"><p>${esc(dlline)}</p></div>`:"");

  /* 3. Rule S1's pain notice. No dismiss, no shortening, no severity word, no
     substitute, no stretch. It may use the refusal treatment, because there
     the app really is declining to do something (spec 2.1 exception). */
  const pain=painHtml(id,st.note,today);
  if(put("slot-pain",pain)&&speak&&pain) announce(stripTags(pain));

  /* 4. Rule SP1's too-heavy flag. ADVICE, styled as advice: it never alters,
     blocks, marks or clears the logged weight - the field still reads 110, the
     draft on disk still holds 110, Save writes 110 - and the input gets NO
     aria-invalid and no aria-describedby pointing at it, because it is a valid
     value and telling a screen reader otherwise is a lie with consequences. */
  let flag="";
  try{
    if(e.k==="speed"){
      const sl=PHAT.speedLoad(S.sessions,id,today,speedSrcName(id),sp());
      if(sl&&sl.source&&sl.target>0){
        let worst=null;
        st.sets.forEach(s=>{
          if(!PHAT.speedTooHeavy(s.w,sl.source.w)) return;
          const v=PHAT.parseWeight(s.w);
          if(v.ok&&(worst===null||v.value>worst)) worst=v.value;
        });
        if(worst!==null) flag=PHAT.speedFlagText(worst,sl.target);
      }
    }
  }catch(err){ flag=""; }
  put("slot-speed",flag?`<div class="advice"><p>${esc(flag)}</p></div>`:"");

  /* 5. THE VERDICT SLOT. Occupied from first paint, for every ex.k, never
     removed and never collapsed: it holds the reminder when the rule returns
     null and the verdict when it does not, and .vslot reserves the height so
     the card cannot grow under his thumb when one replaces the other.

     THE GATE IS `completedSets >= ex.s` AGAINST THE PRESCRIPTION, always, and
     it lives inside PHAT.verdict where nothing in this file can loosen it. The
     design's `min(ex.s, sets.length)` fires a verdict on ONE completed set
     when two are removed - B-24 reopened through a new door (C-11 / B-50).
     Removing sets does not buy a verdict.

     READ `.absent`, NEVER TRUTHINESS. verdict() returns null (nothing to say),
     an ABSENT-shaped object (no verdict, and here is why), or a real verdict.
     The ABSENT object is TRUTHY and carries empty t/x/x2, so `if (v)` paints
     an empty advice block and `if (v.x)` collapses the slot. It renders as the
     REFUSAL it is - never as advice with an arrow and a rule name (0.1 #6). */
  let v=null;
  try{
    v=PHAT.verdict({ex:e, sets:st.sets, prev:PHAT.lastFor(S.sessions,id),
      note:st.note, deload:dl.active===true});
  }catch(err){ v=null; }
  let html="", say="";
  const vh=verdictHtml(v,dl.active===true,"vslot");
  if(vh){ html=vh.html; say=vh.say; }
  else if(e.k==="speed"){
    /* There is ONE source for what to say on a speed card and it is
       speedLoad(): `text` for the load, `instruction` for how to move it. Both
       ungated, both permanent. verdict() returns null here by design. */
    let ins="";
    try{ const sl=PHAT.speedLoad(S.sessions,id,today,speedSrcName(id),sp());
         ins=sl?sl.instruction:""; }catch(err){ ins=""; }
    html=`<div class="advice vslot"><p class="kick">Speed work</p><p>${esc(ins)}</p></div>`;
  }else{
    /* Silence looks DELIBERATE and the slot says so in words. One constant
       line, identical on every card, that never changes while he fills the
       sets - so it is not something he re-reads. No countdown: a number that
       ticks down is a number he reads (0.1 #3, 4.7). */
    html=`<div class="advice vslot"><p class="kick">Waiting</p>`+
      `<p>Nothing to say until all ${rx.s} sets are in.</p></div>`;
  }
  /* B-13 asked for aria-live on the verdict; spec 2.6 allows exactly ONE live
     region. Both are satisfied by routing the sentence through #bs-live. Only
     the commit paths pass {speak}. */
  if(put("slot-verdict",html)&&speak&&say) announce(say);
}
const stripTags=h=>String(h).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();

/* Rule S1's notice - the pain notice, position 1 in the bottom stack, below
   the note field that triggers it and above the verdict it explains.

   TWO SOURCES, ONE ELEMENT: the current draft note on commit, and
   PHAT.painState over the history. The two S1 paragraphs are NOT exported from
   logic.js as a constant, so the current-note case gets them from painState
   itself by handing it today's entry - which is exactly what it is. The copy
   stays verbatim from the engine and no sentence lands in this file.
   `S1_LINES` is worth exporting; flagged for backend. */
function painHtml(exId,note,today){
  let cur=false;
  try{ cur=PHAT.painFlag(note); }catch(err){ cur=false; }
  let hist=null;
  try{ hist=PHAT.painState(S.sessions,exId,today); }catch(err){ hist=null; }
  let lines=[], prov="";
  if(cur){
    let now=null;
    try{ now=PHAT.painState([{date:today,entries:{[exId]:{sets:[],note:String(note==null?"":note)}}}],
      exId,today); }catch(err){ now=null; }
    /* Fails TOWARDS showing: if painState throws and the current note matches,
       the history's copy stands in rather than the slot going quiet. */
    lines=(now&&now.active)?now.lines:((hist&&hist.active)?hist.lines:[]);
  }else if(hist&&hist.active){
    lines=hist.lines;
    prov=hist.provenanceLine||"";       /* only when the source is history */
  }
  if(!lines.length) return "";
  return `<div class="refuse">`+
    lines.map((l,ix)=>`<p>${ix?"":'<span aria-hidden="true">! </span>'}${esc(l)}</p>`).join("")+
    (prov?`<p>${esc(prov)}</p>`:"")+`</div>`;
}

/* ============================================================ Rule R1 timer
   THE ABSOLUTE TIMESTAMP, AND THE ONE textContent CHANNEL.

   B-61: the design's timer calls setState every second, which in this app is
   innerHTML on the whole view once a second while a thumb is in a weight
   field - the caret dies every second (B-19). And it decrements a counter, so
   backgrounding the phone loses the count.

   Neither survives here. S.rest.at is ONE absolute millisecond timestamp;
   elapsed is recomputed from the wall clock on every tick and on
   visibilitychange, so three minutes in a pocket comes back as three minutes.
   The tick writes ONE cached TEXT NODE's nodeValue - a characterData
   mutation, not a childList one, inside #dock and outside #view - and calls
   render() from nowhere. Nothing here is persisted and nothing here is in the
   save path: it is a comfort feature and it may not cost a caret or a set. */
let restTick=null, restNode=null;
function restTextNode(){
  const p=document.getElementById("rest-txt");
  if(!p) return null;
  if(restNode&&restNode.parentNode===p) return restNode;
  if(!p.firstChild) p.appendChild(document.createTextNode(""));
  restNode=p.firstChild;
  return restNode;
}
function restLoop(on){
  if(on&&!restTick) restTick=setInterval(paintRest,1000);
  if(!on&&restTick){ clearInterval(restTick); restTick=null; }
}
/* Three transitions, announced once each per rest, through the persistent
   region: entering "Ready.", entering the past-the-window state, and the stop.
   The band itself is not a live region (spec 4.10 a11y). */
const REST_SAY={2:1,3:1,4:1,5:1};
function paintRest(){
  const node=restTextNode(); if(!node) return;
  const day=sDays().find(x=>x.id===S.dayId);
  let ex=null;
  if(day){
    const card=document.getElementById("excard");
    const id=S.rest?S.rest.exId:(card?card.dataset.ex:null);
    ex=day.ex.find(x=>x.id===id)||null;
  }
  let r;
  /* Rule R1 renders its idle state rather than NaN:aN for every bad input
     there is, so a throw here can only cost the band. */
  try{ r=PHAT.restText(ex,S.rest?(Date.now()-S.rest.at)/1000:null); }
  catch(err){ r={text:"",state:0,stopped:false}; }
  if(node.nodeValue!==r.text) node.nodeValue=r.text;
  if(S.rest&&REST_SAY[r.state]&&!S.rest.said[r.state]){ S.rest.said[r.state]=1; announce(r.text); }
  reserveDock();
}
/* Rule R1 rule 2: starts on a REPS commit - a reps stepper tap, or focusout of
   a reps field holding a non-empty value. Never a weight field, never a
   keystroke: typing the `1` of `12` does not start it.
   Rule 3: a commit on the row that is already running it does not restart it.
   Rule 1: one timer for the whole app; a commit on another exercise restarts
   it with that exercise's thresholds. */
function restStart(exId,k){
  /* W13a. The gate is here, at the single entry point, rather than at each of
     the two call sites — so there is one place that decides and no route that
     can miss it. Both call sites are already COMMIT-only (a reps stepper tap,
     or focusout of a reps field): neither is reachable from `input`, so the
     setting changes whether a committed rep count starts a countdown and
     never changes what counts as a commit. Typing the 1 of 12 starts nothing
     in either mode. */
  if(!S.prefs.restAuto) return;
  const key=exId+"|"+k;
  if(S.rest&&S.rest.key===key) return;
  S.rest={key:key,exId:exId,at:Date.now(),said:{}};
  paintRest();
}
/* The band lives in #dock, so its height is reserved by the same measured
   padding-bottom that keeps an input clear of nav (B-36). It is created when a
   session opens and removed when it closes, and it survives every re-render
   because #dock is outside #view - which is also why the cached text node
   survives. */
function renderRest(){
  const box=document.getElementById("rest-box"); if(!box) return;
  /* THREE CONDITIONS, and the last two are fixes.
     S.draft        the band is a session thing.
     S.tab==="train"  FIXED HERE: the band used to render off the draft alone,
       so with a session open it printed `Rest timer starts when you log a
       set.` under the Trend, Weight, Diet and Plan tabs — session-specific
       copy on four screens that have no sets on them. Found during the B-66
       run.
     prefs.restAuto   on MANUAL nothing can start a countdown, so a permanent
       idle band would be dead chrome making a promise the setting has just
       switched off.
     S.rest IS NOT CLEARED WHEN THE BAND GOES AWAY unless the draft itself
     went. Rule R1 rule 4 keeps one absolute timestamp, so crossing to the
     Weight tab to log bodyweight and coming back reads the true elapsed —
     clearing it here would silently reset a running rest. */
  const want=!!S.draft && S.tab==="train" && !!S.prefs.restAuto;
  const have=!!document.getElementById("rest");
  if(want&&!have){ box.innerHTML=`<div id="rest"><p id="rest-txt"></p></div>`; restNode=null; }
  if(!want&&have){ box.innerHTML=""; restNode=null; }
  if(!S.draft) S.rest=null;
  restLoop(want);
  if(want) paintRest();
}

/* ============================================================ events */
document.querySelector("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]"); if(!b)return;
  /* Tapping Train is the second way out of Settings, and the one his thumb
     can already reach — the header's `‹ BACK` is a top corner and a top
     corner is the hardest place on the screen. Onboarding is NOT dismissed
     this way: it is a state of the app, not a page, and it ends by being
     answered. The export receipt is dropped on the way out; it is a receipt
     for a tap, not a fact about the log. */
  if(b.dataset.tab==="train"&&S.sub==="settings"){ S.sub=""; S.exp=null; }
  /* WO-006: the tab is the second way back to the list from one plan's
     screen, and the working copy is already on disk, so nothing is asked. */
  if(b.dataset.tab==="plan"&&S.tab==="plan"&&S.planView==="edit"){ commitName(document.activeElement); S.planView=""; S.pe=null; }
  S.tab=b.dataset.tab; render();
});

document.getElementById("view").addEventListener("click",async e=>{
  /* WO-006. The Plans list and the Plan Editor, delegated like everything
     else. Handled first because their controls are the only ones on that
     tab, and the handler returns false for anything it does not own. */
  if(S.tab==="plan"){ if(await planClick(e)) return; }
  /* W9. START SESSION and every day row take the SAME route, so the draft
     guarantee is stated once: startDay() never overwrites a readable draft —
     its own day resumes, any other day asks first, and an unreadable one
     fails closed. `#start-next` carries data-day, so it matches here. */
  const day=e.target.closest("[data-day]");
  if(day){ await startDay(day.dataset.day); return; }

  /* Explicit discard. Never one tap: it opens the same confirmation as the
     offer sheet, with the same count, taken from what is on screen right now. */
  if(e.target.id==="discard"){ askDiscard(filledSets(S.draft),"discard"); return; }
  if(e.target.id==="finish"){ await finish(); return; }
  if(e.target.id==="export"){ exportAll(); return; }

  /* ---- W9 / W13a. Navigation, the deload answer, onboarding and the rest
     mode. All delegated from #view like everything else — no per-node
     listeners to leak across a re-render. */
  if(e.target.closest("#settings-open")){
    S.sub="settings"; S.exp=null; render();
    /* E-3. A load never attempted (offline at boot) is attempted when he
       comes looking for it. A FAILED one is not - see loadSync. */
    if(S.sync.mod==="off") loadSync();
    return;
  }
  /* E-3. The backup controls. Each exists only in the state that can honour
     it (vBackupBody), and each handler re-checks that state. */
  if(e.target.closest("#bk-signin")){ await authTap("in"); return; }
  if(e.target.closest("#bk-signup")){ await authTap("up"); return; }
  if(e.target.closest("#bk-signout")){ await signOutTap(); return; }
  if(e.target.closest("#bk-push")){ clearTimeout(bkTimer); await runBackup(true,"manual"); return; }
  if(e.target.closest("#bk-restore")){ await restoreStart(); return; }
  if(e.target.closest("#settings-back")){ S.sub=""; S.exp=null; render(); return; }
  if(e.target.closest("#rest-auto")){ await setRestAuto(true); return; }
  if(e.target.closest("#rest-manual")){ await setRestAuto(false); return; }
  if(e.target.closest("#ob-start")){ await finishOnboarding(); return; }
  /* ---- W12. The Diet segment is a VIEW and writes nothing at all; the
     protein tick writes one key. Both delegated from #view like everything
     else. B-19 does not apply on this screen: it holds no text field, so
     there is no uncommitted value a re-render could discard. */
  const dv=e.target.closest("[data-diet]");
  if(dv){ setDietView(dv.dataset.diet); return; }
  if(e.target.closest("#protein")){ await toggleProtein(); return; }
  if(e.target.closest("#dl-start")){ await answerDeload("start"); return; }
  if(e.target.closest("#dl-no")){ await answerDeload("no"); return; }
  if(e.target.closest("#dl-end")){ await answerDeload("end"); return; }

  const fb=e.target.closest("[data-fig]");
  if(fb){
    const box=document.querySelector(`[data-figbox="${fb.dataset.fig}"]`);
    const open=box.classList.toggle("on");
    if(open&&!box.innerHTML) box.innerHTML=figBody(fb.dataset.fig);
    /* aria-expanded drives the chevron rotation in CSS, so the glyph itself
       never changes and nothing here can reintroduce an out-of-subset one. */
    fb.setAttribute("aria-expanded",open?"true":"false");
    return;
  }

  /* W6: the one-tap route from the message to the row, and the way out of a
     row he does not want. Both live in the same delegated listener as
     everything else — no per-node handlers to leak across a re-render. */
  const go=e.target.closest("[data-goto]");
  if(go){ gotoProblem(go.dataset.goto); return; }
  const cl=e.target.closest("[data-clear]");
  if(cl){ clearSet(cl.dataset.clear); return; }
