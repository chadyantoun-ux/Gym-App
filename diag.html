<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phat diag</title>
<style>
  body{margin:0;padding:16px;background:#1c1b1a;color:#f0eeea;font:14px/1.5 -apple-system,system-ui,sans-serif}
  h1{font-size:16px;margin:0 0 12px;letter-spacing:.04em;text-transform:uppercase;color:#f5b32b}
  pre{white-space:pre-wrap;word-break:break-all;background:#2a2827;padding:12px;border-left:3px solid #f5b32b;font:13px/1.45 ui-monospace,Menlo,monospace}
  p{color:#bdb9b3}
</style></head><body>
<h1>Phat diag — read only</h1>
<p>This page reads storage and writes nothing. Screenshot it and send it.</p>
<pre id="out">reading…</pre>
<script>
/* WO-011 W1. Read-only. Not in the service worker shell list.
   WO-012b: PRINTS PROGRESSIVELY. On his phone this page sat at "reading…"
   for two reasons: bbd0dcd left a raw newline inside a string literal (a
   SyntaxError, so nothing ran), and every await sat in one try - a hung
   caches.keys() / getRegistration() / fetch held every line before it.
   Now: #out is repainted after EVERY section, each await is raced against a
   4 s timeout and wrapped on its own, so a hang prints "(timed out)" and the
   rest still shows. */
(function(){
  var L=[], out=document.getElementById("out");
  function line(s){ L.push(s); }
  function show(){ out.textContent = L.join("\n"); }
  function size(v){ return v==null?0:String(v).length; }
  function within(p,ms){
    return new Promise(function(res){
      var done=false, t=setTimeout(function(){ if(!done){ done=true; res({timeout:true}); } },ms);
      Promise.resolve(p).then(function(v){ if(!done){ done=true; clearTimeout(t); res({value:v}); } },
                              function(e){ if(!done){ done=true; clearTimeout(t); res({error:e}); } });
    });
  }
  /* One section: label, a function returning a promise, a function that
     prints its value. Its own try, its own 4 s, its own repaint. */
  function section(label,run,print){
    var p; try{ p=run(); }catch(e){ line(label+": ERROR "+(e&&e.message||e)); show(); return Promise.resolve(); }
    return within(p,4000).then(function(r){
      try{
        if(r.timeout) line(label+": (timed out)");
        else if(r.error) line(label+": ERROR "+(r.error&&r.error.message||r.error));
        else print(r.value);
      }catch(e){ line(label+": ERROR "+(e&&e.message||e)); }
      show();
    });
  }
  function text(path){ return fetch(path,{cache:"no-store"}).then(function(r){ return r.text(); }); }

  /* 1. the environment - synchronous, prints at once */
  try{
    line("origin   " + location.origin);
    line("ua       " + navigator.userAgent.replace(/^Mozilla\/5\.0 /,""));
    line("standalone " + (window.navigator.standalone===true ? "yes (home-screen app)" : "no (browser tab)"));
    line("online   " + navigator.onLine);
    line("");
  }catch(e){ line("env: ERROR " + (e&&e.message||e)); }
  show();

  /* 2. localStorage keys - synchronous, prints at once */
  try{
    var keys=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(/^phat/.test(k)) keys.push(k); }
    keys.sort();
    line("localStorage keys (" + keys.length + "):");
    keys.forEach(function(k){
      var v=localStorage.getItem(k); var note="";
      try{
        var j=JSON.parse(v);
        if(k==="phat:v1:log"){
          note = "  schema=" + j.schemaVersion + " sessions=" + (Array.isArray(j.sessions)?j.sessions.length:"?") + " profile=" + JSON.stringify(j.profile);
          if(Array.isArray(j.sessions)) j.sessions.forEach(function(s){ note += "\n      · " + s.id + " " + s.date + " " + s.dayId + " entries=" + (s.entries?Object.keys(s.entries).length:"?"); });
        } else if(k==="phat:v1:bw"){
          note = "  schema=" + j.schemaVersion + " entries=" + (Array.isArray(j.entries)?j.entries.length:"?");
        } else if(k==="phat:v1:draft"){
          note = "  day=" + j.dayId + " date=" + j.date + " entries=" + (j.entries?Object.keys(j.entries).length:"?") + " savedAt=" + (j.savedAt?new Date(j.savedAt).toISOString():"-");
        } else if(k==="phat:v1:prefs"){
          note = "  onboarded=" + j.onboarded + " backup=" + JSON.stringify(j.backup)
               + "\n      gym=" + JSON.stringify(j.gym)
               + "\n      merge=" + JSON.stringify(j.merge);
        } else if(/^phat:v1:recover:/.test(k)){
          var inner=null; try{ inner = j.value && typeof j.value==="object" ? j.value : (typeof j.raw==="string" ? JSON.parse(j.raw) : null); }catch(e){}
          note = "  reason=" + j.reason + " savedAt=" + (j.savedAt?new Date(j.savedAt).toISOString():"-") + (inner&&inner.sessions ? " sessions=" + inner.sessions.length : "") + (j.raw?" raw=" + String(j.raw).slice(0,80):"");
        } else if(k==="phat:auth"){
          note = "  user=" + (j.user&&j.user.email) + " expires=" + (j.expires_at?new Date(j.expires_at*1000).toISOString():"-");
        }
      }catch(e){ note = "  UNPARSEABLE: " + String(v).slice(0,120); }
      line("  " + k + "  (" + size(v) + " bytes)" + note);
    });
    line("");
  }catch(e){ line("localStorage: ERROR " + (e&&e.message||e)); line(""); }
  show();

  /* 3..7 the awaited sections, one after another, each printed as it lands */
  var chain=Promise.resolve();
  chain=chain.then(function(){
    if(!window.caches){ line("caches: (no Cache API)"); show(); return; }
    var names=[];
    return section("caches",function(){ return caches.keys(); },function(ns){
      names=ns; line("caches: " + (ns.join(", ")||"none"));
    }).then(function(){
      var q=Promise.resolve();
      names.forEach(function(n){
        q=q.then(function(){ return section("  "+n,function(){ return caches.open(n).then(function(c){ return c.keys(); }); },function(reqs){ line("  " + n + " entries=" + reqs.length); }); });
      });
      return q;
    });
  });
  chain=chain.then(function(){
    if(!navigator.serviceWorker){ line("sw: (no serviceWorker)"); show(); return; }
    return section("sw",function(){ return navigator.serviceWorker.getRegistration(); },function(reg){
      line("sw: " + (reg ? (reg.active?"active":"registered, not active") + " scope=" + reg.scope : "none"));
    });
  });
  chain=chain.then(function(){ line(""); show(); });
  chain=chain.then(function(){
    return section("served index.html ",function(){ return text("index.html"); },function(idx){
      line("served index.html : chip=" + (idx.indexOf("Weight in lb")>=0) + " iLiftIn=" + (idx.indexOf("I lift in")>=0) + " mergeOnOpen=" + (idx.indexOf("mergeOnOpen")>=0) + " ovRecord=" + (idx.indexOf("migrateOverrides")>=0));
    });
  });
  chain=chain.then(function(){
    return section("served logic.js   ",function(){ return text("logic.js"); },function(lg){
      line("served logic.js   : SCHEMA=" + ((lg.match(/SCHEMA_VERSION\s*=\s*(\d+)/)||[])[1]||"?") + " cardModeFor=" + (lg.indexOf("cardModeFor")>=0) + " LOAD_EQ=" + (lg.indexOf("LOAD_EQ")>=0) + " mergeStores=" + (lg.indexOf("mergeStores")>=0));
    });
  });
  chain=chain.then(function(){
    return section("served sw.js      ",function(){ return text("sw.js"); },function(swt){
      line("served sw.js      : VERSION=" + ((swt.match(/VERSION\s*=\s*['"]([^'"]+)/)||[])[1]||"?"));
    });
  });
  chain=chain.then(function(){ line("now " + new Date().toISOString()); show(); });
  chain.catch(function(e){ line("ERROR " + (e&&e.message||e)); show(); });
})();
</script>
</body></html>
